# Netlify 只負責靜態託管，不執行任何 build。
# 頁面由 GitHub Actions 產生並 commit 進 output/，Netlify 偵測到 push 就部署。
#
# 這樣做的理由：
#   1. FRED API key 只存在 GitHub secrets，不必交給 Netlify
#   2. 不需要在 Netlify 裝 Python 依賴，也不會有 build 逾時風險
#   3. 每次產出都留在 git 歷史裡 → 自動累積成 vintage 檔案庫

[build]
  publish = "output"
  command = ""

# 全站不被搜尋引擎收錄（頁面本身也帶 noindex meta，這裡是第二道）。
#
# 只掛在「頁面」上，不掛在 /brand/（LOGO、連結縮圖、圖示）：Threads／FB 的
# 爬蟲抓連結縮圖時，圖片本身回 noindex 可能被當成不能用而不顯示縮圖。
# Netlify 的規則無法「排除」某個路徑，所以逐一列出頁面路徑；新增分頁時
# 記得加進來（漏加只是少一道保險，頁面的 noindex meta 仍然有效）。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/labor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/inflation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/fomc/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/rates/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/scenario/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/latest.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# HTML 不快取，資料一更新就看得到最新版。
#
# 這裡要用 /* 不能用 /*.html：Netlify 是拿**請求路徑**去比對的，
# 而分頁的網址是 /labor/ 這種目錄形式，不是 /labor/index.html——
# 寫成 /*.html 的話除了根目錄以外一條都不會命中，整條規則等於沒設。
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 盤中報價中繼（首頁焦點條每 60 秒問一次 /api/quotes）。
# 函式本身用 Netlify CDN 的 durable 快取 60 秒，不論多少人同時開著首頁，
# 每分鐘最多實際執行一次。沒有任何相依套件，不需要 package.json。
# 函式路徑在 quotes.mjs 的 `export const config = { path: "/api/quotes" }`。
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
