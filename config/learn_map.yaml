# 各分頁區塊最下方「完整教學」一行要連到哪幾張偷懶名詞卡（config/learn.yaml 的 key）。
#
# 為什麼集中在這裡
# ----------------
# 先前只有長端頁逐區手寫 learn_links(...)，其他頁只有「這在看什麼？」裡的單一連結，
# 而且收合著、讀者不一定看得到。集中成一張表之後：
#   · site.page 收合區塊時自動把這一行接在每一區最下方，各頁不用再手寫；
#   · 新增名詞卡、新增區塊時只改這一個檔案；
#   · tests/test_ask.py 檢查每個 key 都有名詞卡與偷懶頁條目，連結不會斷。
# 順序＝顯示順序：先放這一區的主題，再放判讀時會用到的相關概念。
# 首頁版面不是卡區（沒有收合），由 pages/home.py 直接讀 "/" 這一組。

