# ============================================================================
# 聯準會文本模組設定（P3）
#
# 點陣圖（SEP）沒有機器可讀的來源，需要手動輸入——一季一次、四個數字，
# 成本很低，但它是「客觀訊號分數」的兩大支柱之一。
#
# 來源：https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#       每季會議後的 "Projections Materials"
# ============================================================================

meta:
  chair: "Kevin Warsh"
  chair_since: "2026-05"
  note: >
    主席更迭會造成溝通風格的結構性斷點。Warsh 上任後刻意縮短聲明、
    移除前瞻指引，所以「措辭分數」在 2026-05 之後的可比性下降，
    系統會自動偵測並示警。

# ---------------------------------------------------------------------------
# 點陣圖：每次 SEP 發布後手動更新
#
#   total        提交預測的官員人數（注意：不等於投票人數）
#   hike         預期年底利率高於目前水準的人數
#   cut          預期低於目前水準的人數（若官方摘要未拆分則留空 null）
#   hold_or_cut  當來源只講「其餘為不變或更低」時填這裡
#
# 三個常被混淆的數字，不要弄錯：
#   投票成員   12 人（7 位理事 + 紐約聯準銀行總裁 + 4 位輪值總裁）
#   全體參與者 19 人（7 位理事 + 12 位地區聯準銀行總裁）
#   提交預測者 視當次而定，可能因理事出缺或主席不提交而少於 19
# ---------------------------------------------------------------------------
dots:
  - date: "2026-06-17"
    total: 18                 # 主席 Warsh 依其個人立場未提交預測，故為 18 而非 19
    hike: 9
    cut: null                 # 官方摘要只說「其餘 9 位預期不變或更低」，未拆分
    hold_or_cut: 9
    median_yearend: null
    core_pce_yearend: 3.3
    headline_pce_yearend: 3.6
    unemployment_yearend: 4.3
    verified: true
    source: "2026 年 6 月 SEP（18 位提交，9 位預期至少升息一次）"

  # ⚠️ 以下兩期為佔位資料，尚未對照官方 SEP，請於使用前更新或刪除
  - date: "2026-03-18"
    total: 19
    hike: null
    cut: null
    hold_or_cut: null
    median_yearend: null
    core_pce_yearend: null
    unemployment_yearend: null
    verified: false
    source: "尚未填入（佔位）"
  - date: "2025-12-10"
    total: 19
    hike: null
    cut: null
    hold_or_cut: null
    median_yearend: null
    core_pce_yearend: null
    unemployment_yearend: null
    verified: false
    source: "尚未填入（佔位）"

# ---------------------------------------------------------------------------
# 目前的政策利率區間（用於畫面顯示，會議後更新）
# ---------------------------------------------------------------------------
policy_rate:
  lower: 3.50
  upper: 3.75
  since: "2026-03-18"

# ---------------------------------------------------------------------------
# 抓取設定
# ---------------------------------------------------------------------------
fetch:
  years_back: 4
  with_presser: true          # 記者會逐字稿為 PDF，會後數日才發布
  presser_recent_n: 4         # 只抓最近幾場，避免一次拉太多 PDF
