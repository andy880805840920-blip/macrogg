# ============================================================================
# 聯準會文本模組設定（P3）
#
# 這個模組不需要手動維護資料——聲明、投票紀錄、記者會逐字稿都從
# federalreserve.gov 自動抓取，客觀訊號分數的三個成分
# （政策行動、反對票、聲明自述的風險方向）也都由聲明本文推導。
#
# 點陣圖已移除：Warsh 任內縮減預測公布，這個輸入不再穩定存在，
# 留著會讓分數的可比性時有時無。
# ============================================================================

meta:
  chair: "Kevin Warsh"
  chair_since: "2026-05"
  note: >
    主席更迭會造成溝通風格的結構性斷點。Warsh 上任後刻意縮短聲明、
    移除前瞻指引，所以「措辭分數」在 2026-05 之後的可比性下降，
    系統會自動偵測並示警。

# ---------------------------------------------------------------------------
# 目前的政策利率區間（用於畫面顯示，會議後更新）
# ---------------------------------------------------------------------------
policy_rate:
  lower: 3.50
  upper: 3.75
  since: "2026-03-18"

# ---------------------------------------------------------------------------
# 抓取設定
# ---------------------------------------------------------------------------
fetch:
  # 起點。設 start 就以它為準；沒設才退回 years_back。
  #
  # 為什麼從 2025 起：行事曆頁其實列到 2021 年，但措辭分數跨主席不可比，
  # 硬把 2022 年的點放進趨勢圖只是雜訊。2025 起共 13 次會議，
  # 剛好涵蓋一次主席交接（Powell → Warsh，2026-05），趨勢看得出形狀。
  # 客觀訊號分數（政策行動＋反對票）是事實，跨主席可比，要拉長改這裡即可。
  start: "2025-01-01"
  years_back: 4
  with_presser: true          # 記者會逐字稿為 PDF，會後數日才發布
  presser_recent_n: 4         # 只抓最近幾場，避免一次拉太多 PDF
