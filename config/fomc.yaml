# ============================================================================
# 聯準會頁設定（2026-10 改版）
#
# 這一頁不需要手動維護資料——聲明、投票、記者會逐字稿、經濟預測摘要
# （SEP）與點陣圖、會議紀要、委員名單、理事演講與行程，全部從
# federalreserve.gov 自動抓取；地方總裁的近期發言取自新聞標題。
#
# 頁面不再有任何合成分數（客觀訊號分數、措辭分數、記者會分數都已移除：
# 權重沒有外部依據，詞頻在 Warsh 的短聲明與含記者提問的逐字稿上沒有意義）。
# ============================================================================

meta:
  chair: "Kevin Warsh"
  chair_since: "2026-05"

# ---------------------------------------------------------------------------
# 政策利率區間的**最後一道後備**
# 依序：FRED（DFEDTARL／DFEDTARU）→ 最新聲明本文寫的新區間 → 這裡。
# 前兩者正常時這裡不會被用到；有用到時頁面會標示來源。
# ---------------------------------------------------------------------------
policy_rate:
  lower: 3.75
  upper: 4.00
  since: "2026-09-17"

# ---------------------------------------------------------------------------
# 官員的補充說明（委員卡上的一行字；只寫查得到的事實）
# 鍵是英文姓氏，與官網名單比對。
# ---------------------------------------------------------------------------
official_notes:
  Warsh: "2026 年 5 月接任主席；上任後聲明大幅縮短、取消前瞻指引"
  Powell: "前任主席（2018–2026），卸任主席後仍留任理事"
  Williams: "紐約聯儲總裁是 FOMC 的常任副主席，市場通常把他的發言當成委員會共識的風向"

# ---------------------------------------------------------------------------
# 抓取設定
# ---------------------------------------------------------------------------
fetch:
  # 起點。設 start 就以它為準；沒設才退回 years_back。
  # 2025 起共十幾次會議，涵蓋一次主席交接（Powell → Warsh，2026-05），
  # 「歷次決議」表與近 12 個月的反對票紀錄都夠用。
  start: "2025-01-01"
  years_back: 4
  with_presser: true          # 記者會逐字稿為 PDF，會後數日才發布
  presser_recent_n: 4         # 只抓最近幾場，避免一次拉太多 PDF
  official_news: true         # 投票委員的近期新聞標題（Google News）
