# ============================================================================
# 長端利率與債務供給模組設定（P5）
#
# 主軸：現有三個模組解釋「政策利率往哪走」，這一頁解釋「長端為什麼在這裡」。
#       長端由債券供給與期限溢酬決定，聯準會控制不了。
# ============================================================================

meta:
  release_name: "Rates & Debt Supply"
  note: >
    政府與企業競爭同一池的存續期間需求。把兩者放在同一頁，
    才看得出長端殖利率的供給面壓力來自哪裡。

# ---------------------------------------------------------------------------
# 一、名目殖利率
# ---------------------------------------------------------------------------
yields:
  - id: DGS2
    label: 2 年期
    enabled: true
  - id: DGS5
    label: 5 年期
    enabled: true
  - id: DGS10
    label: 10 年期
    enabled: true
  - id: DGS30
    label: 30 年期
    enabled: true
  # 政策利率區間的上下緣。放在這一組是因為長端模組本來就會抓這一批日頻序列，
  # 而 FOMC 頁需要它來算「市場定價 vs 聯準會」。
  # 先前這兩個數字是人工填在 config/fomc.yaml，忘記更新一次降息（25 個基點）
  # 就會讓判定平移 0.25 個百分點——足以把「偏降息」翻成「偏向再緊縮」，
  # 而且畫面上完全看不出來。改成自動抓，config 那份只當抓不到時的後備。
  - id: DFEDTARU
    label: 政策利率上緣
    enabled: true
  - id: DFEDTARL
    label: 政策利率下緣
    enabled: true
  - id: DGS3MO
    label: 3 個月期
    enabled: true

# ---------------------------------------------------------------------------
# 二、實質利率與通膨損益兩平
#     名目 = 實質 + 通膨補償（+ 期限溢酬）
#     這個拆解才看得出殖利率上升是預期通膨、預期成長，還是風險補償
# ---------------------------------------------------------------------------
real_and_breakeven:
  - id: DFII5
    label: 5 年期實質利率
    enabled: false      # 沒有任何地方讀它；曲線拆解用的是 10 年期實質利率
  - id: DFII10
    label: 10 年期實質利率
    enabled: true
  - id: DFII30
    label: 30 年期實質利率
    enabled: false      # 同上
  - id: T5YIE
    label: 5 年通膨損益兩平
    enabled: false      # 通膨模組已經處理通膨預期，這裡不重複抓
  - id: T10YIE
    label: 10 年通膨損益兩平
    enabled: true
  - id: T5YIFR
    label: 5年後5年期通膨預期
    enabled: false

# ---------------------------------------------------------------------------
# 三、期限溢酬
#     投資人持有長債要求的額外補償。它上升代表「不是預期問題，
#     是大家不想抱長債」——這正是供給壓力的直接證據。
# ---------------------------------------------------------------------------
term_premium:
  - id: THREEFYTP10
    label: 10 年期期限溢酬 (Kim-Wright)
    enabled: true

# ---------------------------------------------------------------------------
# 三之二、匯率
#
# 只有一個用途：科技巨頭的海外發債是用當地幣計價的（Alphabet 發過 €90 億
# 與 C$85 億、Amazon 發過 C$140 億、還有 ¥5,765 億），畫面上要在原幣金額
# 旁邊補一個「約合多少美元」。
#
# ⚠️ 這幾條序列的方向不一致，而且弄反不會報錯，只會讓數字錯上百倍：
#     DEXUSEU 是「一歐元換多少美元」（直接乘）
#     DEXJPUS 是「一美元換多少日圓」（要倒過來）
#   方向定義在 src/analysis/fx.py 的 _DIRECT／_INVERSE，不在這裡——
#   這裡只負責把序列抓下來。
# ---------------------------------------------------------------------------
fx:
  - id: DEXUSEU
    label: 歐元兌美元
    enabled: true
  - id: DEXCAUS
    label: 美元兌加幣
    enabled: true
  - id: DEXJPUS
    label: 美元兌日圓
    enabled: true
  - id: DEXUSUK
    label: 英鎊兌美元
    enabled: true
  - id: DEXSZUS
    label: 美元兌瑞郎
    enabled: false      # 目前這五家沒有瑞郎計價的發債，需要時再打開
  - id: DEXUSAL
    label: 澳幣兌美元
    enabled: false      # 同上

# ---------------------------------------------------------------------------
# 四、信用市場
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 長端拆解、曲線、房貸、全球長端（2026-10 改版）
#   THREEFY10 + THREEFYTP10：Kim-Wright 模型的 10 年擬合殖利率與期限溢酬
#   EXPINF10YR：克里夫蘭聯儲 10 年預期通膨（模型值，已扣風險溢酬，月頻）
#   預期實質路徑 ＝ 擬合殖利率 − 期限溢酬 − 預期通膨
# ---------------------------------------------------------------------------
longend:
  # WTI 油價：殖利率曲線「誰在推」裡當通膨預期的旁證（2026-10）
  - id: DCOILWTICO
    label: WTI 原油
    enabled: true
  - id: THREEFY10
    label: 10 年擬合殖利率（Kim-Wright）
    frequency: daily
  - id: EXPINF10YR
    label: 10 年預期通膨（克里夫蘭聯儲）
    frequency: monthly
  - id: DGS1
    label: 1 年期公債殖利率
    frequency: daily
  - id: DGS3
    label: 3 年期公債殖利率
    frequency: daily
  - id: DGS7
    label: 7 年期公債殖利率
    frequency: daily
  - id: DGS20
    label: 20 年期公債殖利率
    frequency: daily
  - id: MORTGAGE30US
    label: 30 年固定房貸利率（Freddie Mac）
    frequency: weekly
  - id: IRLTLT01USM156N
    label: 美國 10 年期（月均，OECD）
    frequency: monthly
  - id: IRLTLT01DEM156N
    label: 德國 10 年期（月均，OECD）
    frequency: monthly
  - id: IRLTLT01JPM156N
    label: 日本 10 年期（月均，OECD）
    frequency: monthly
  - id: IRLTLT01GBM156N
    label: 英國 10 年期（月均，OECD）
    frequency: monthly

credit:
  - id: BAMLC0A0CM
    label: 投資級利差 (OAS)
    enabled: true
  - id: BAMLH0A0HYM2
    label: 高收益利差 (OAS)
    enabled: true
  - id: BAMLC0A4CBBB
    label: BBB 級利差
    enabled: true

# ---------------------------------------------------------------------------
# 五、政府債務
# ---------------------------------------------------------------------------
debt:
  - id: GFDEBTN
    label: 聯邦公債總額
    unit: millions
    frequency: quarterly
    enabled: true
  - id: GFDEGDQ188S
    label: 債務佔 GDP 比重
    unit: percent
    frequency: quarterly
    enabled: true
  # 公眾持有債務（不含社安信託基金等政府內部持有）：市場實際要吸收的部分，債務動態用這個口徑
  - id: FYGFGDQ188S
    label: 公眾持有債務佔 GDP
    unit: percent
    frequency: quarterly
    enabled: true
  - id: FYGFDPUN
    label: 公眾持有債務
    unit: millions
    frequency: quarterly
    enabled: true
  - id: A091RC1Q027SBEA
    label: 聯邦利息支出
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: FGRECPT
    label: 聯邦稅收
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: FGEXPND
    label: 聯邦支出
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: GDP
    label: 名目 GDP
    unit: billions_saar
    frequency: quarterly
    enabled: true
  # 實質 GDP：r 減 g 的 g。先前這個 g 是寫死的 1.8%，
  # 造成 r−g 與 i−g 在同樣的說明文字下給出相反的結論。
  - id: GDPC1
    label: 實質 GDP
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: MTSDS133FMS
    label: 月度財政赤字
    unit: millions
    frequency: monthly
    enabled: true
    # 09 政府財政：近 12 個月現金赤字（債務動態的基本赤字、三條路的赤字）
  # 聯準會持有的公債（週頻，百萬美元）。縮表是第三個供給來源：
  # 到期不續作的部分，等於改由私人市場吸收，效果跟財政部多發債一樣。
  - id: TREAST
    label: 聯準會持有公債
    unit: millions
    frequency: weekly
    enabled: true

# ---------------------------------------------------------------------------
# 六、Hyperscaler 資本支出與發債
#
# ⚠️ 這一段沒有免費 API，需手動維護，一季更新一次。
#    來源：各公司 10-Q／10-K 的現金流量表，以及公司債發行公告。
#
#    capex        該季資本支出（十億美元，Purchases of property and equipment）
#    ocf          該季營運現金流（十億美元）
#    revenue      該季營收（十億美元）
#    debt_issued  該季發行的公司債金額（十億美元，若無則填 0）
#
#    關鍵比率是 capex ÷ ocf：超過 100% 代表自由現金流轉負，
#    資本支出必須靠舉債或動用現金支應——那就是它們變成投資級市場
#    大型供給方的時點。
# ---------------------------------------------------------------------------
hyperscalers:
  # 資料改為自 SEC EDGAR XBRL 自動擷取（10-Q／10-K 的原始申報標記），
  # 不再手動維護。每家的 cik 是 SEC 的公司代號，不會變動。
  #
  # auto: false 可強制改用下方的手動值（例如 SEC 改版時暫時停用）。
  # 抓取失敗的公司會自動退回自己的手動值，並讓頁面標示「未驗證」。
  auto: true
  # 除了季報之外，另外抓「近期發債申報」（424B2／424B5／FWP／8-K 項目 2.03）。
  # 季報是季末後約 45 天才申報，一筆新發債最久要等 135 天才會進到數字裡；
  # 發債本身則是定價當天就要申報，這一段補的就是那個時效缺口。
  # 這些事件**不計入供給壓力分數**——分數維持由經審核的 XBRL 數字決定，
  # 否則歷史可比性會斷掉，而且同一筆發債下一季會被重複計算一次。
  track_offerings: true
  # 試著從說明書封面解析發行金額。每筆多一個請求，解析不到就只列事件。
  parse_offering_amount: true

  # 加收財報新聞稿（8-K 項目 2.02）的申報日期，補實績的時效缺口。
  # 10-Q 是季末後約 40 天才申報，新聞稿約 3 週——快兩週左右。
  # 只取「這一季的財報什麼時候公布的」與原文連結，**不解析裡面的數字**：
  # 新聞稿是非結構化文字，硬解會拿到不知道是哪個口徑的數字，
  # 而 XBRL 兩週後就會給出經審核、標記明確的版本。
  track_earnings: true

  as_of: "2026Q2"
  source: "SEC EDGAR XBRL（各公司 10-Q 現金流量表原始申報標記）＋ EDGAR 申報清單（近期發債）"
  verified: false          # 由程式依實際抓取結果覆寫
  companies:
    - name: Microsoft
      ticker: MSFT
      cik: 789019
      capex: 27.4          # 以下為 SEC 抓取失敗時的後備值（十億美元）
      capex_yoy: 41.0
      ocf: 41.2
      revenue: 79.8
      debt_issued: 0.0
    - name: Alphabet
      ticker: GOOGL
      cik: 1652044
      capex: 26.1
      capex_yoy: 52.0
      ocf: 38.9
      revenue: 98.4
      debt_issued: 12.5
    - name: Amazon
      ticker: AMZN
      cik: 1018724
      capex: 32.8
      capex_yoy: 34.0
      ocf: 34.1
      revenue: 174.2
      debt_issued: 15.0
    - name: Meta
      ticker: META
      cik: 1326801
      capex: 22.6
      capex_yoy: 68.0
      ocf: 26.4
      revenue: 51.3
      debt_issued: 30.0
    - name: Oracle
      ticker: ORCL
      cik: 1341439
      capex: 14.9
      capex_yoy: 82.0
      ocf: 8.7
      revenue: 16.1
      debt_issued: 18.0

# ---------------------------------------------------------------------------
# 前瞻資本支出指引 — 一季一次（法說會結束就知道）
#
# 為什麼要手動：這幾個數字**不在任何申報欄位裡**。指引是在法說會與新聞稿裡
# 用自然語言講的（「approximately」「in the range of」「slightly above」），
# 每家寫法不同、每季還會改。硬解析的失敗方式是安靜地少一家或抓到錯的口徑，
# 而這一區的整個論點就靠這幾個數字。
#
# 為什麼值得手動：XBRL 只有**已經花掉的**上一季，而這一頁的論點是
# 「AI 資本支出把科技巨頭從淨買方變成淨賣方、推高長端供給」——
# 那個故事的主角是**接下來要花多少**。四個數字、一年更新四次、
# 每次兩分鐘，換到的是這一區從「回顧」變成「前瞻」。
#
# 怎麼填：法說會當天各大財經媒體都會報，或看 8-K 的 EX-99.1 新聞稿。
# 區間就填 low/high，單一數字就兩邊填一樣。單位十億美元。
# 沒填或填 enabled: false 時整區不顯示，不會壞。
# ---------------------------------------------------------------------------
capex_guidance:
  enabled: true
  year: 2026
  as_of: "2026-07-30"        # 最後一次更新的日期（畫面上會標）；2026Q2 法說會（7/22–7/30）
  source: "各公司法說會與財報新聞稿"
  companies:
    - name: Microsoft
      low: 175.0
      high: 175.0
      # 7/29 法說會：資料中心耐用年限 15→25 年、部分租賃改列營業租賃，帳面上的 CY2026 資本支出約 1,750 億；
      # 公司表示排除此會計影響，原計畫（約 1,900 億，含零組件漲價）不變
      note: 會計變更後約 1,750 億；排除會計影響與原計畫 1,900 億相同
    - name: Alphabet
      low: 195.0
      high: 205.0
      note: 7/22 由 1,800–1,900 億上調
    - name: Amazon
      low: 220.0
      high: 220.0
      note: 7/30 由約 2,000 億上調，主因記憶體等零組件漲價
    - name: Meta
      low: 130.0
      high: 145.0
      note: 7/29 新聞稿（8-K 附件 99.1）：由 1,250–1,450 億收窄
    - name: Oracle
      low: 0.0
      high: 0.0
      note: 未提供年度指引

# ---------------------------------------------------------------------------
# 七、投資級市場規模（用來算 hyperscaler 發債佔比）
#     來源：SIFMA 或 Bloomberg 的季度投資級公司債發行統計
# ---------------------------------------------------------------------------
ig_market:
  quarterly_issuance: 420.0   # 十億美元，該季投資級公司債總發行
  as_of: "2026Q2"
  verified: false

# ---------------------------------------------------------------------------
# 八、紅綠燈門檻
# ---------------------------------------------------------------------------
regime_lights:
  # 期限溢酬：NY Fed ACM 10 年（2026-10 v4 起取代 Kim-Wright）。燈號看上升速度（rates.tp_speed）；
  #   水準 0.20%／0.60%（ACM 2015 年以來約第 75／90 百分位）只用於首頁、情境頁的「偏低／中性／偏高」
  - key: term_premium
    label: 期限溢酬（NY Fed ACM）
    explain:
      what: "投資人長期持有公債、而不是一路滾動短債，所要求的額外補償（NY Fed ACM 模型估計）。"
      why: "真正推升殖利率、讓市場動盪的是期限溢酬「急升」：過去財政赤字擔憂、公債供給超預期時，它都是在幾週到幾個月內快速上行。所以這顆燈看上升速度——水準偏高但穩定，不算警訊。"
      levels: ["近 1 月 < +25bp，且近 3 月 < +45bp", "近 1 月 ≥ +25bp，或近 3 月 ≥ +45bp（約第 90 百分位）", "近 1 月 ≥ +40bp，或近 3 月 ≥ +65bp 且仍在加速"]
      basis: "五次財政／供給事件中，ACM 最快的單月升幅 +45～+97bp、三個月 +67～+134bp；1990 年以來單月 +40bp、三個月 +65bp 約第 95 百分位。2013 年 Taper Tantrum 不是財政事件，不列入。"
    desc: 投資人因需長期持有債券而要求的額外補償。狀態看上升速度：近 1 月 ≥ +40bp，或近 3 月 ≥ +65bp 且仍在加速＝警戒
      （過去財政赤字擔憂、公債供給超預期時的速度）；近 1 月 ≥ +25bp 或近 3 月 ≥ +45bp＝留意
    # 狀態由 build.py 依上升速度給（rates.tp_speed）；green_below／red_above 只用於首頁與情境頁的水準高低
    direction: custom
    green_below: 0.20
    red_above: 0.60
  # 門檻依 1988 年以來 6 次升息循環（1988–89、1994–95、1999–2000、2004–06、2015–18、2022–23）：
  #   循環結束時 10−2 全部 ≤ +0.33%（−0.16、+0.33、−0.46、+0.01、+0.12、−0.90），5 次在循環中或結束後一年內倒掛；
  #   升息起點的典型水準約 +1.2%。降息循環起點落在 −0.1%～+0.5%，之後重新變陡。
  #   另：近 24 個月曾倒掛、目前已轉正 → 至少「留意」（build.py 另判）
  - key: curve_10_2
    label: 10 年減 2 年
    explain:
      what: "10 年期減 2 年期公債殖利率。2 年期反映未來兩年的 Fed 政策預期；10 年期另含長期成長、通膨與期限溢酬。"
      why: "衡量政策相對長期前景的鬆緊。升息時短端漲得多，曲線走平甚至倒掛；降息開始後短端快速下滑，曲線重新變陡。歷史上衰退多在「倒掛後重新變陡」時開始，而不是倒掛當下。"
      levels: ["> +0.35%", "0～+0.35%（升息尾聲／降息起點），或近 24 個月曾倒掛、剛轉正", "< 0（倒掛）"]
      basis: "1988 年以來 6 次升息循環：結束時 10−2 都在 +0.35% 以下（中位約 −0.1%），其中 5 次在循環中或結束後一年內倒掛；升息起點的典型水準約 +1.2%。"
    desc: 10 年期減 2 年期公債殖利率。2 年期貼近市場對未來兩年 Fed 政策利率的預期，10 年期另含長期成長、
      通膨與期限溢酬，所以這個利差衡量政策相對長期經濟前景的鬆緊。升息循環中短端跟著政策利率上升、長端漲得少，
      曲線走平（熊平）甚至倒掛；降息開始後短端快速下滑，曲線重新變陡（牛陡）——歷史上衰退多發生在「倒掛後重新變陡」
      的階段，而不是倒掛當下。門檻依 1988 年以來 6 次升息循環：結束時 10−2 都在 +0.35% 以下（中位約 −0.1%），
      其中 5 次在循環中或結束後一年內倒掛；升息起點的典型水準約 +1.2%。所以高於 +0.35% 正常、0～+0.35%
      是「升息尾聲／降息起點」的區間（留意）、倒掛為警戒；近 24 個月曾倒掛、剛轉正也列留意
    direction: lower_is_worse
    green_above: 0.35
    red_below: 0.00
  - key: curve_30_10
    label: 30 年減 10 年
    explain:
      what: "30 年期減 10 年期公債殖利率，長端最遠一段的斜率。"
      why: "走陡通常代表投資人對超長天期要求更多補償，背後多半是公債供給壓力或財政疑慮。"
      levels: ["< 0.60%", "0.60～0.90%", "> 0.90%"]
      basis: ""
    desc: 長端斜率。走陡通常反映供給壓力或財政疑慮
    direction: higher_is_worse
    green_below: 0.60
    red_above: 0.90
  - key: real_10y
    label: 實質利率（10 年 TIPS）
    explain:
      what: "10 年期 TIPS 殖利率——扣掉通膨預期之後的真實資金成本。"
      why: "跟「中性實質利率」比：中性＝既不刺激也不壓抑經濟的利率，用 Fed 點陣圖的長期政策利率減 2% 通膨目標估算。高出越多，資金成本越壓抑投資與需求。"
      levels: ["≤ 中性 +0.5pp", "中性 +0.5～+1.0pp", "> 中性 +1.0pp"]
      basis: "歷次升息循環結束時，10Y TIPS 高於中性 +0.2～+1.0pp；只有 2023/10 高點超過 +1pp（+2.0pp）。2003 年以來平均 1.01%。"
    desc: 10 年期 TIPS 殖利率，對照中性實質利率（點陣圖長期利率 − 2%）。高出 +0.5pp 內正常、+0.5～+1.0pp 留意
      （歷次升息循環結束時的緊度）、超過 +1.0pp 警戒
    # 狀態由 build.py／run.py 依「TIPS − 中性」給（rates.real_rate_status）；中性優先用當期 SEP
    direction: custom
    neutral_fallback: 1.20
  # 期貨市場定價 vs 點陣圖（狀態由 run.py 依 |差距| 判定：< 12.5bp 正常、12.5～50bp 留意、> 50bp 警戒）
  - key: dots_gap
    label: 期貨定價與點陣圖差距
    explain:
      what: "期貨隱含的年底政策利率，減 Fed 點陣圖中位數（同一個年底）。"
      why: "期貨的動作比點陣圖大＝Lead the Curve（市場走在 Fed 前面）；比點陣圖小或方向相反＝Behind the Curve（市場不買單點陣圖）。差距越大，之後一方被迫修正的幅度越大。"
      levels: ["|差距| < 12.5bp（半碼內）", "12.5～50bp", "> 50bp（兩碼以上）"]
      basis: "歷次顯著分歧的量級：2015 年底約 50bp、2022 年初約 75bp 以上、2023 年底約 75bp。"
    desc: 期貨隱含的年底政策利率減點陣圖中位數（同一個年底）。期貨的動作比點陣圖大＝市場 Lead the Curve（走在 Fed 前面），
      比點陣圖小或方向相反＝Behind the Curve（不買單點陣圖）。差距越大，之後一方被迫修正的幅度越大。
      門檻：|差距| < 12.5bp 正常、12.5～50bp 留意、> 50bp 警戒——跟 2015 年底（約 50bp）、2022 年初（約 75bp 以上）、
      2023 年底（約 75bp）幾次顯著分歧的量級相當
    direction: custom
  - key: breakeven_10y
    label: 損益兩平通膨率（10 年）
    explain:
      what: "10 年期名目殖利率減 TIPS 殖利率——市場的長期通膨預期（含通膨風險溢酬）。"
      why: "長期通膨有沒有錨定在 2% 附近，也反映市場對 Fed 獨立性的信心；持續走高代表錨定鬆動。"
      levels: ["< 2.40%", "2.40～2.70%", "> 2.70%"]
      basis: "BEI 以 CPI 計算，長期比 PCE 高約 0.3～0.5pp，所以 2.4% 以下大致符合 Fed 的 2% PCE 目標。"
    desc: 通膨預期（長期）＝10Y 名目 − TIPS，含預期平均通膨與通膨風險溢酬。長期通膨的錨定，
      也是市場對 Fed 獨立性的信心；持續走高代表錨定鬆動
    direction: higher_is_worse
    green_below: 2.40
    red_above: 2.70
  - key: interest_to_revenue
    label: 利息佔稅收比重
    explain:
      what: "聯邦淨利息支出佔稅收的比例——每收 100 元稅，有多少拿去付利息。"
      why: "利息會排擠其他支出，也是評等機構判斷財政可持續性的核心指標。"
      levels: ["< 14%", "14～20%", "> 20%"]
      basis: "超過 20% 通常被視為警戒線。"
    desc: 每收 100 元稅有多少拿去付利息。超過 20% 通常被視為警戒
    direction: higher_is_worse
    green_below: 14.0
    red_above: 20.0
  # r − g（2026-10 改版）：r＝10 年期殖利率當月月均、g＝名目 GDP 年增（同 MacroMicro 的口徑）。
  # 門檻依 1962 年以來季資料（10Y 季均 − 名目 GDP 年增）：中位數 −0.73pp、第 75 百分位 +0.95pp；
  # 1980 年代（98% 的季度 > 0）與 1990 年代（78%）是債務比快速上升的時期，1960 與 2010 年代幾乎都 < 0。
  - key: r_minus_g
    label: 前瞻缺口 r 減 g
    explain:
      what: "10 年期公債殖利率（當月月均，新發債的融資成本）減名目 GDP 年增。"
      why: "債務率變化 ≈ 基本赤字率 ＋ (r − g) × 債務率。r 低於 g 時，經濟成長能逐步消化既有債務；r 高於 g 時，就算收支平衡，債務比也會自我累積。"
      levels: ["< 0", "0～+1pp", "> +1pp"]
      basis: "1962 年以來季資料：< 0 如 1960、2010 年代；0～+1pp 約第 50～75 百分位；> +1pp 是 1980～90 年代債務比快速上升時的水準。"
    desc: 10 年期公債殖利率（當月月均，新發債的融資成本）減名目 GDP 年增。債務率變化 ≈ 基本赤字率 ＋
      (r − g) × 債務率：r 低於 g 時，經濟成長就能逐步消化既有債務；r 高於 g 時，即使收支平衡債務比也會自我累積。
      門檻依 1962 年以來的季資料：< 0 正常（成長跑贏利率，如 1960、2010 年代）、0～+1pp 留意（約第 50～75 百分位）、
      > +1pp 警戒（1980～90 年代債務比快速上升時的水準）
    direction: higher_is_worse
    green_below: 0.0
    red_above: 1.0
  - key: ig_spread
    label: 投資級利差
    explain:
      what: "投資級公司債相對公債的利差（OAS）。"
      why: "企業借錢要多付的風險補償；走闊代表企業融資成本上升、信用條件收緊。"
      levels: ["< 1.00%", "1.00～1.40%", "> 1.40%"]
      basis: ""
    desc: 投資級公司債相對公債的風險補償。走闊代表企業融資成本上升
    direction: higher_is_worse
    green_below: 1.00
    red_above: 1.40

