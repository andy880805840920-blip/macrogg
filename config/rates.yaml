# ============================================================================
# 長端利率與債務供給模組設定（P5）
#
# 主軸：現有三個模組解釋「政策利率往哪走」，這一頁解釋「長端為什麼在這裡」。
#       長端由債券供給與期限溢酬決定，聯準會控制不了。
# ============================================================================

meta:
  release_name: "Rates & Debt Supply"
  note: >
    政府與企業競爭同一池的存續期間需求。把兩者放在同一頁，
    才看得出長端殖利率的供給面壓力來自哪裡。

# ---------------------------------------------------------------------------
# 一、名目殖利率
# ---------------------------------------------------------------------------
yields:
  - id: DGS2
    label: 2 年期
    enabled: true
  - id: DGS5
    label: 5 年期
    enabled: true
  - id: DGS10
    label: 10 年期
    enabled: true
  - id: DGS30
    label: 30 年期
    enabled: true
  # 政策利率區間的上下緣。放在這一組是因為長端模組本來就會抓這一批日頻序列，
  # 而 FOMC 頁需要它來算「市場定價 vs 聯準會」。
  # 先前這兩個數字是人工填在 config/fomc.yaml，忘記更新一次降息（25 個基點）
  # 就會讓判定平移 0.25 個百分點——足以把「偏降息」翻成「偏向再緊縮」，
  # 而且畫面上完全看不出來。改成自動抓，config 那份只當抓不到時的後備。
  - id: DFEDTARU
    label: 政策利率上緣
    enabled: true
  - id: DFEDTARL
    label: 政策利率下緣
    enabled: true
  - id: DGS3MO
    label: 3 個月期
    enabled: true

# ---------------------------------------------------------------------------
# 二、實質利率與通膨損益兩平
#     名目 = 實質 + 通膨補償（+ 期限溢酬）
#     這個拆解才看得出殖利率上升是預期通膨、預期成長，還是風險補償
# ---------------------------------------------------------------------------
real_and_breakeven:
  - id: DFII5
    label: 5 年期實質利率
    enabled: false      # 沒有任何地方讀它；曲線拆解用的是 10 年期實質利率
  - id: DFII10
    label: 10 年期實質利率
    enabled: true
  - id: DFII30
    label: 30 年期實質利率
    enabled: false      # 同上
  - id: T5YIE
    label: 5 年通膨損益兩平
    enabled: false      # 通膨模組已經處理通膨預期，這裡不重複抓
  - id: T10YIE
    label: 10 年通膨損益兩平
    enabled: true
  - id: T5YIFR
    label: 5年後5年期通膨預期
    enabled: true

# ---------------------------------------------------------------------------
# 三、期限溢酬
#     投資人持有長債要求的額外補償。它上升代表「不是預期問題，
#     是大家不想抱長債」——這正是供給壓力的直接證據。
# ---------------------------------------------------------------------------
term_premium:
  - id: THREEFYTP10
    label: 10 年期期限溢酬 (Kim-Wright)
    enabled: true

# ---------------------------------------------------------------------------
# 四、信用市場
# ---------------------------------------------------------------------------
credit:
  - id: BAMLC0A0CM
    label: 投資級利差 (OAS)
    enabled: true
  - id: BAMLH0A0HYM2
    label: 高收益利差 (OAS)
    enabled: true
  - id: BAMLC0A4CBBB
    label: BBB 級利差
    enabled: true

# ---------------------------------------------------------------------------
# 五、政府債務
# ---------------------------------------------------------------------------
debt:
  - id: GFDEBTN
    label: 聯邦公債總額
    unit: millions
    frequency: quarterly
    enabled: true
  - id: GFDEGDQ188S
    label: 債務佔 GDP 比重
    unit: percent
    frequency: quarterly
    enabled: true
  - id: A091RC1Q027SBEA
    label: 聯邦利息支出
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: FGRECPT
    label: 聯邦稅收
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: FGEXPND
    label: 聯邦支出
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: GDP
    label: 名目 GDP
    unit: billions_saar
    frequency: quarterly
    enabled: true
  # 實質 GDP：r 減 g 的 g。先前這個 g 是寫死的 1.8%，
  # 造成 r−g 與 i−g 在同樣的說明文字下給出相反的結論。
  - id: GDPC1
    label: 實質 GDP
    unit: billions_saar
    frequency: quarterly
    enabled: true
  - id: MTSDS133FMS
    label: 月度財政赤字
    unit: millions
    frequency: monthly
    enabled: true
    note: 尚未接上分析（待辦：月度赤字的季節性與年度赤字的對照）
  # 聯準會持有的公債（週頻，百萬美元）。縮表是第三個供給來源：
  # 到期不續作的部分，等於改由私人市場吸收，效果跟財政部多發債一樣。
  - id: TREAST
    label: 聯準會持有公債
    unit: millions
    frequency: weekly
    enabled: true

# ---------------------------------------------------------------------------
# 六、Hyperscaler 資本支出與發債
#
# ⚠️ 這一段沒有免費 API，需手動維護，一季更新一次。
#    來源：各公司 10-Q／10-K 的現金流量表，以及公司債發行公告。
#
#    capex        該季資本支出（十億美元，Purchases of property and equipment）
#    ocf          該季營運現金流（十億美元）
#    revenue      該季營收（十億美元）
#    debt_issued  該季發行的公司債金額（十億美元，若無則填 0）
#
#    關鍵比率是 capex ÷ ocf：超過 100% 代表自由現金流轉負，
#    資本支出必須靠舉債或動用現金支應——那就是它們變成投資級市場
#    大型供給方的時點。
# ---------------------------------------------------------------------------
hyperscalers:
  # 資料改為自 SEC EDGAR XBRL 自動擷取（10-Q／10-K 的原始申報標記），
  # 不再手動維護。每家的 cik 是 SEC 的公司代號，不會變動。
  #
  # auto: false 可強制改用下方的手動值（例如 SEC 改版時暫時停用）。
  # 抓取失敗的公司會自動退回自己的手動值，並讓頁面標示「未驗證」。
  auto: true
  # 除了季報之外，另外抓「近期發債申報」（424B2／424B5／FWP／8-K 項目 2.03）。
  # 季報是季末後約 45 天才申報，一筆新發債最久要等 135 天才會進到數字裡；
  # 發債本身則是定價當天就要申報，這一段補的就是那個時效缺口。
  # 這些事件**不計入供給壓力分數**——分數維持由經審核的 XBRL 數字決定，
  # 否則歷史可比性會斷掉，而且同一筆發債下一季會被重複計算一次。
  track_offerings: true
  # 試著從說明書封面解析發行金額。每筆多一個請求，解析不到就只列事件。
  parse_offering_amount: true

  # 加收財報新聞稿（8-K 項目 2.02）的申報日期，補實績的時效缺口。
  # 10-Q 是季末後約 40 天才申報，新聞稿約 3 週——快兩週左右。
  # 只取「這一季的財報什麼時候公布的」與原文連結，**不解析裡面的數字**：
  # 新聞稿是非結構化文字，硬解會拿到不知道是哪個口徑的數字，
  # 而 XBRL 兩週後就會給出經審核、標記明確的版本。
  track_earnings: true

  as_of: "2026Q2"
  source: "SEC EDGAR XBRL（各公司 10-Q 現金流量表原始申報標記）＋ EDGAR 申報清單（近期發債）"
  verified: false          # 由程式依實際抓取結果覆寫
  companies:
    - name: Microsoft
      ticker: MSFT
      cik: 789019
      capex: 27.4          # 以下為 SEC 抓取失敗時的後備值（十億美元）
      capex_yoy: 41.0
      ocf: 41.2
      revenue: 79.8
      debt_issued: 0.0
    - name: Alphabet
      ticker: GOOGL
      cik: 1652044
      capex: 26.1
      capex_yoy: 52.0
      ocf: 38.9
      revenue: 98.4
      debt_issued: 12.5
    - name: Amazon
      ticker: AMZN
      cik: 1018724
      capex: 32.8
      capex_yoy: 34.0
      ocf: 34.1
      revenue: 174.2
      debt_issued: 15.0
    - name: Meta
      ticker: META
      cik: 1326801
      capex: 22.6
      capex_yoy: 68.0
      ocf: 26.4
      revenue: 51.3
      debt_issued: 30.0
    - name: Oracle
      ticker: ORCL
      cik: 1341439
      capex: 14.9
      capex_yoy: 82.0
      ocf: 8.7
      revenue: 16.1
      debt_issued: 18.0

# ---------------------------------------------------------------------------
# 前瞻資本支出指引 — 一季一次（法說會結束就知道）
#
# 為什麼要手動：這幾個數字**不在任何申報欄位裡**。指引是在法說會與新聞稿裡
# 用自然語言講的（「approximately」「in the range of」「slightly above」），
# 每家寫法不同、每季還會改。硬解析的失敗方式是安靜地少一家或抓到錯的口徑，
# 而這一區的整個論點就靠這幾個數字。
#
# 為什麼值得手動：XBRL 只有**已經花掉的**上一季，而這一頁的論點是
# 「AI 資本支出把科技巨頭從淨買方變成淨賣方、推高長端供給」——
# 那個故事的主角是**接下來要花多少**。四個數字、一年更新四次、
# 每次兩分鐘，換到的是這一區從「回顧」變成「前瞻」。
#
# 怎麼填：法說會當天各大財經媒體都會報，或看 8-K 的 EX-99.1 新聞稿。
# 區間就填 low/high，單一數字就兩邊填一樣。單位十億美元。
# 沒填或填 enabled: false 時整區不顯示，不會壞。
# ---------------------------------------------------------------------------
capex_guidance:
  enabled: true
  year: 2026
  as_of: "2026-04-29"        # 最後一次更新的日期（畫面上會標）
  source: "各公司法說會與財報新聞稿"
  companies:
    - name: Microsoft
      low: 190.0
      high: 190.0
      note: 含約 250 億美元的零組件漲價
    - name: Alphabet
      low: 175.0
      high: 185.0
    - name: Amazon
      low: 200.0
      high: 200.0
    - name: Meta
      low: 125.0
      high: 145.0
    - name: Oracle
      low: 0.0
      high: 0.0
      note: 未提供年度指引

# ---------------------------------------------------------------------------
# 七、投資級市場規模（用來算 hyperscaler 發債佔比）
#     來源：SIFMA 或 Bloomberg 的季度投資級公司債發行統計
# ---------------------------------------------------------------------------
ig_market:
  quarterly_issuance: 420.0   # 十億美元，該季投資級公司債總發行
  as_of: "2026Q2"
  verified: false

# ---------------------------------------------------------------------------
# 八、紅綠燈門檻
# ---------------------------------------------------------------------------
regime_lights:
  - key: term_premium
    label: 期限溢酬
    desc: 投資人持有長債要求的額外補償。上升代表市場不想抱長債
    direction: higher_is_worse
    green_below: 0.40
    red_above: 0.90
  - key: curve_10_2
    label: 10 年減 2 年
    desc: 曲線斜率。負值（倒掛）歷史上是衰退的領先訊號
    direction: lower_is_worse
    green_above: 0.50
    red_below: 0.00
  - key: curve_30_10
    label: 30 年減 10 年
    desc: 長端斜率。走陡通常反映供給壓力或財政疑慮
    direction: higher_is_worse
    green_below: 0.60
    red_above: 0.90
  - key: real_10y
    label: 10 年期實質利率
    desc: 剔除通膨補償後的真實資金成本。高於潛在成長率會壓抑投資
    direction: higher_is_worse
    green_below: 1.80
    red_above: 2.40
  - key: breakeven_10y
    label: 10 年通膨損益兩平
    desc: 市場對未來十年平均通膨的定價
    direction: higher_is_worse
    green_below: 2.40
    red_above: 2.70
  - key: interest_to_revenue
    label: 利息佔稅收比重
    desc: 每收 100 元稅有多少拿去付利息。超過 20% 通常被視為警戒
    direction: higher_is_worse
    green_below: 14.0
    red_above: 20.0
  - key: r_minus_g
    label: 前瞻缺口 r 減 g
    desc: 市場現在的實質利率減實質 GDP 成長。看的是「舊債換成今天的利率之後」
      會不會自我累積；表格裡的當前缺口用的是已發行債務的平均利率，兩者不同
    direction: higher_is_worse
    green_below: -0.5
    red_above: 0.5
  - key: ig_spread
    label: 投資級利差
    desc: 投資級公司債相對公債的風險補償。走闊代表企業融資成本上升
    direction: higher_is_worse
    green_below: 1.00
    red_above: 1.40
