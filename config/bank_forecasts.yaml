# ============================================================================
# 總覽「04 各家預測」的投行預估（手動填寫）
#
# 市場共識、Cleveland Fed 即時預測、實際值、★、誰最準都是自動的；
# 只有五家投行的預估要在這裡填。沒填的格子會顯示「無資料」。
#
# 怎麼填（在 GitHub 網頁上直接編輯這個檔案即可）：
#   1. 找到這一期的區塊：就業報告寫在 employment、CPI 寫在 cpi、PCE 寫在 pce
#   2. 資料月份用引號，例如 9 月 CPI（10 月公布）寫 "2026-09"
#   3. 每家一行，只填有看到的數字；單位跟網站畫面一樣：
#        nfp       非農新增，千人（+12 萬 → 120；-2 萬 → -20）
#        u3        失業率，%（4.3）
#        ahe_mom   平均時薪月增，%（0.3）
#        cpi_mom   CPI 月增，%（0.3）
#        core_mom  核心月增，%（CPI 或 PCE 都用這個名字）
#        cpi_yoy   CPI 年增，%（3.1）
#        core_yoy  核心年增，%
#        pce_mom   PCE 月增，%
#        pce_yoy   PCE 年增，%
#   4. 可以加 src: 網址，畫面上點那一格會顯示出處
#   5. 機構只認這五個縮寫：BofA、Citi、JPM、MS、GS
#
# 防呆：任何數字跟市場共識差太多（非農 15 萬、其他 0.3 個百分點）會被判定
# 打錯、不顯示，並寫進 Actions 的執行紀錄（搜尋「投行預估」）。
#
# 公布後再補填也可以，但「誰最準」照理應該只比公布前的預估——請盡量在公布前填。
# ============================================================================

employment:
  # "2026-10":
  #   GS:   {nfp: 90, u3: 4.3, ahe_mom: 0.3, src: https://example.com/gs-nfp-preview}
  #   JPM:  {nfp: 75, u3: 4.4}
  #   BofA: {nfp: 100}

cpi:
  # "2026-09":
  #   GS:  {cpi_mom: 0.5, core_mom: 0.2, cpi_yoy: 3.6, core_yoy: 2.4}
  #   MS:  {core_mom: 0.2}
  #   Citi: {cpi_mom: 0.4, core_mom: 0.3}

pce:
  # "2026-09":
  #   GS: {core_mom: 0.2, core_yoy: 3.0}
