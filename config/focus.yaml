# 挑兩則顯示。
#   chips     屬於這個主題的指標（指標代號見首頁「選擇」）
#   keywords  從新聞來源池挑這個主題的新聞。**詞組比對**：英文整組出現才算
#             （不分大小寫、整字比對，複數要另外列，例如 chip／chips）；
#             中文詞組裡空白分開的每個詞都要出現
#   exclude   有寫就**取代**上面的 exclude_keywords（台指期要放行「台股」）
#   search    額外的 Google News 搜尋（只有標題＋摘要），lang: en／zh
# 規則：前兩個指標同主題 → 往下找不同主題；主題當天沒新聞 → 往下一個
# 指標遞補，都沒有就用主軸那次一起寫的一般補充。
