  - 美元
  - 美國財政部
  - 財政赤字
  - 川普
  - 關稅
  - 日本央行
  - 日圓
  - AI
  - NVIDIA
  - 半導體
  - AI資本支出
  - 油價
  - 伊朗
  - 中東戰爭
  - 俄烏戰爭
  - 黃金
  - 聯準會
  - Kevin Warsh
  - 發債
  - BOJ
  - 輝達
# 不用額外的泛稱債市／殖利率等次級詞放寬主軸範圍。
keywords_secondary: []

# 後設偵測：AI 輸出含任一詞組＝在評論材料而不是寫新聞（實際發生過：
# 整篇「材料相關內容極為有限…無法按要求綜合改寫」上了線）。
# 命中→帶原因重試一次，再命中→退列標題模式。只收詞組不收單詞，
# 免得誤殺真新聞（「伊朗無法出口」的「無法」是正常句）。
meta_markers:
  - 提供的材料
  - 材料中
  - 材料主要
  - 材料缺乏
  - 根據材料
  - 僅能提取
  - 相關內容極為有限
  - 相關資訊有限
  - 關鍵字
  - 按要求
  - 綜合改寫
  - 無法按
  - 不足以
  - 標題快訊
  - 內文細節
  - 可供轉述
  - 以下是
  - 以下為
  - 根據您
  - 綜上所述
  - 需要注意的是
  - 總結來說

# 排除關鍵字：標題命中任一個就整條剔除。
# 擋的是正向關鍵字擋不掉的內容——**真的含關鍵字、但不是總經新聞**。
# 實例：「專家談美債布局：長天期沒賺，不如押0050或高股息」含「美債」，
# 但那是台股 ETF 理財文。看到新的雜訊詞直接往這裡加，不用改程式。
exclude_keywords:
  - "0050"
  - 高股息
  - ETF
  - 存股
  - 定期定額
  - 台股
  - 金控

# Yahoo 自家的 RSS（直達文章頁，AI 讀「內文」摘關鍵字相關重點）。
# 逐一嘗試、失敗跳過；全部失敗才退回下方的 Google News 標題模式。
# Yahoo 改版換網址時改這裡就好，不用動程式。
feeds:
  # ── 總經主力：真的在報美國總經、而且內文抓得到 ──
  # 先前只靠 Yahoo，實測內容早就不是總經新聞（台股兩條滿版台股個股、
  # 英文那條滿版加密貨幣與個股），篩選再好也挑不出東西。
  # 每條 feed 每次執行都會在 log 記「取得 N 則、入選 M 則」，哪條沒用
  # 一看就知道；抓不到的只記警告然後跳過，不影響其他來源。
  # CNBC：Economy、Finance 兩個版
  - https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
  - https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
  # 聯準會官方：貨幣政策新聞稿與演講。主題本來就專屬，all: true 表示
  # 不用關鍵字過濾（演講標題常是「Speech by Governor X」，一個關鍵字都不含）。
  - url: https://www.federalreserve.gov/feeds/press_monetary.xml
    all: true
  - url: https://www.federalreserve.gov/feeds/speeches.xml
    all: true
  # Yahoo Finance 的十年期殖利率個別新聞：主題專屬、內文可讀
  - url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5ETNX&region=US&lang=en-US
    all: true
  # ── 原有來源 ──
  - https://tw.news.yahoo.com/rss/finance
  - https://tw.stock.yahoo.com/rss?category=news
  - https://finance.yahoo.com/news/rssindex
  # 標題級來源：RSS 公開、內文有付費牆——貢獻標題與連結進標題池，
  # 內文抓不到會被長度檢查自動跳過，不影響其他來源。
  # ⚠️ 這裡有設定就會蓋掉程式內建的預設清單，所以 FT／WSJ 要列在這裡
  #（曾因只列三條 Yahoo 而讓 FT／WSJ 靜默失效）。
  - https://www.ft.com/rss/home
  - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  # 路透與彭博沒有公開 RSS（路透 2020 年關閉、彭博從未開放），
  # 改走 Google News 的搜尋型 feed 限定來源＋主題。預期是**標題級**
  # 貢獻（彭博硬付費牆、路透偶爾放行）；兩家的通訊社稿全文本來就經
  # Yahoo 轉載進來，這兩條補的是原始出處的標題視角與來源多樣性。
  - https://news.google.com/rss/search?q=site:reuters.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20CPI%20OR%20PCE%20OR%20payrolls%20OR%20GDP%20OR%20dollar%20OR%20Trump%20OR%20tariffs%20OR%20BOJ%20OR%20yen%20OR%20AI%20OR%20Nvidia%20OR%20semiconductor%20OR%20oil%20OR%20Iran%20OR%20Ukraine%20OR%20gold%20OR%20Warsh%20OR%20bonds)%20when:2d&hl=en-US&gl=US&ceid=US:en
  - https://news.google.com/rss/search?q=site:bloomberg.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20CPI%20OR%20PCE%20OR%20payrolls%20OR%20GDP%20OR%20dollar%20OR%20Trump%20OR%20tariffs%20OR%20BOJ%20OR%20yen%20OR%20AI%20OR%20Nvidia%20OR%20semiconductor%20OR%20oil%20OR%20Iran%20OR%20Ukraine%20OR%20gold%20OR%20Warsh%20OR%20bonds)%20when:2d&hl=en-US&gl=US&ceid=US:en

  # 公開正文與出版社摘要：全主題共同來源，所有報導仍限制過去24小時。
  - https://news.ltn.com.tw/rss/business.xml
  - https://news.ltn.com.tw/rss/world.xml
  - https://www.theguardian.com/business/rss
  - https://www.theguardian.com/us-news/us-politics/rss
  - https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
  - https://www.fxstreet.com/rss/news

