  # v2.2（2026-10-27）：重大事件常不帶 Fed／yields 字樣，沒列就連候選都進不來。
  # 多字詞整段比對（不會拆成 street、debt 單字）；次級詞最多加 1 分，
  # 真的發生時靠市場訊號（S&P ±1.5%、10Y ±6bp）的 +3 推上來。
  - Wall Street
  - stocks
  - S&P 500
  - 美股
  - recession
  - 衰退
  - government shutdown
