# ============================================================================
# 首頁「今日市場焦點」窄條的設定
#
# 關鍵字餵給 Google News RSS（免費、無金鑰），標題再交給 Gemini 挑重點
# 寫一段焦點（防護欄見 src/analysis/focus_today.py 的說明）。
# 改完 commit 就生效。關鍵字可以隨時加減——每個關鍵字一次 RSS 請求。
# ============================================================================

enabled: true

# FedWatch 機率第一層：WIRP 同款**逐會議**算法（期貨自算）。
# 目標會議的決策日填這裡；需要的合約（會議月＋往回到第一個無會議月）
# 由程式自動推（例：12/09 會議 → ZQZ26 ＋ ZQX26），不用手填合約代號。
# 會議結束後把這裡改成下一場要盯的會議。
fedwatch_meeting: 2026-12-09

# 該年度的 FOMC 決策日（兩天會議的第二天）。每年一月照官方行事曆
# 更新一次：https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
# 算法靠它分辨「哪個月沒有會議」（錨月）與日曆日加權的 N/M/D。
fomc_dates:
  - 2026-01-28
  - 2026-03-18
  - 2026-04-29
  - 2026-06-17
  - 2026-07-29
  - 2026-09-16
  - 2026-10-28
  - 2026-12-09

# 報價鏈健康檢查用的「當月合約」由程式按月份自動推，逐月自動滾；
# 要固定時才設 fedwatch_health_contract（例：ZQQ26.CBT）。

# FedWatch 機率第二層：亞特蘭大聯準銀行 Market Probability Tracker（官方）。
# 資料端點格式尚未實跑驗證：atlanta_json_path 沒填時每次執行只做偵察
# （把回應形狀印進 log）然後退下一層，不猜數字。對照 log 把取值路徑
# 填進來後才啟用（例：["probabilities", "hike25"]）。
# atlanta_mpt_url: https://www.atlantafed.org/cenfis/market-probability-tracker
# atlanta_json_path: []

# 焦點段的中文字數目標（cjk_len 只數中文字）。這個數字**原樣寫進提示詞**
# ——「總長不超過 300 字」。
#
# 長度永遠不會讓焦點段退回列標題。實際行為（程式端的 HARD_MULT＝1.5）：
#   ≤ 300      合格
#   300–450    直接採用、不重試（為了幾十個字重新生成，換來的通常是
#              另一篇差不多長的稿子，白花一次 API 呼叫）
#   > 450      帶著字數重寫一次；仍然超過就裁切到 450 之內（以整段
#              為單位、句子不切斷）後採用
max_chars: 300

# 主級關鍵字：命中一次計 2 分（挑選排序用）。政策與利率核心。
keywords:
  - 川普 聯準會
  - Fed 利率
  - Kevin Warsh
  - 美國財政部
  - 貝森特
  - 美債 殖利率
  - 債券市場
  - 美伊
  - 降息
  - 升息
  - 殖利率曲線
  - 公債標售
  # 英文組（FT／WSJ／Google News 的 feed 是英文標題；比對不分大小寫）
  - Fed rate
  - Treasury yields
  - Bessent
  - FOMC
  - Powell Warsh
  - bond market
  - rate cut
  - rate hike
  - yield curve
  - Treasury auction

# 次級關鍵字：命中一次計 1 分——債市生態系與 AI 資本週期，
# 只在主線新聞不足時自然上位，不搶聯準會頭條的位置。
keywords_secondary:
  - 信用利差
  - 公司債
  - 回購市場
  - 債務上限
  - 信評調降
  - 日債
  - 晶片戰爭
  - 晶片關稅
  - AI 資本支出
  - AI 發債
  - credit spreads
  - corporate bond
  - repo market
  - debt ceiling
  - downgrade
  - JGB
  - chip war
  - chip tariffs
  - AI capex
  - AI bond

# 後設偵測：AI 輸出含任一詞組＝在評論材料而不是寫新聞（實際發生過：
# 整篇「材料相關內容極為有限…無法按要求綜合改寫」上了線）。
# 命中→帶原因重試一次，再命中→退列標題模式。只收詞組不收單詞，
# 免得誤殺真新聞（「伊朗無法出口」的「無法」是正常句）。
meta_markers:
  - 提供的材料
  - 材料中
  - 材料主要
  - 材料缺乏
  - 根據材料
  - 僅能提取
  - 相關內容極為有限
  - 相關資訊有限
  - 關鍵字
  - 按要求
  - 綜合改寫
  - 無法按
  - 不足以
  - 標題快訊
  - 內文細節
  - 可供轉述
  - 以下是
  - 以下為
  - 根據您
  - 綜上所述
  - 需要注意的是
  - 總結來說

# 排除關鍵字：標題命中任一個就整條剔除。
# 擋的是正向關鍵字擋不掉的內容——**真的含關鍵字、但不是總經新聞**。
# 實例：「專家談美債布局：長天期沒賺，不如押0050或高股息」含「美債」，
# 但那是台股 ETF 理財文。看到新的雜訊詞直接往這裡加，不用改程式。
exclude_keywords:
  - "0050"
  - 高股息
  - ETF
  - 存股
  - 定期定額
  - 台股
  - 金控

# Yahoo 自家的 RSS（直達文章頁，AI 讀「內文」摘關鍵字相關重點）。
# 逐一嘗試、失敗跳過；全部失敗才退回下方的 Google News 標題模式。
# Yahoo 改版換網址時改這裡就好，不用動程式。
feeds:
  - https://tw.news.yahoo.com/rss/finance
  - https://tw.stock.yahoo.com/rss?category=news
  - https://finance.yahoo.com/news/rssindex
  # 標題級來源：RSS 公開、內文有付費牆——貢獻標題與連結進標題池，
  # 內文抓不到會被長度檢查自動跳過，不影響其他來源。
  # ⚠️ 這裡有設定就會蓋掉程式內建的預設清單，所以 FT／WSJ 要列在這裡
  #（曾因只列三條 Yahoo 而讓 FT／WSJ 靜默失效）。
  - https://www.ft.com/rss/home
  - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  # 路透與彭博沒有公開 RSS（路透 2020 年關閉、彭博從未開放），
  # 改走 Google News 的搜尋型 feed 限定來源＋主題。預期是**標題級**
  # 貢獻（彭博硬付費牆、路透偶爾放行）；兩家的通訊社稿全文本來就經
  # Yahoo 轉載進來，這兩條補的是原始出處的標題視角與來源多樣性。
  - https://news.google.com/rss/search?q=site:reuters.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20Powell%20OR%20yield%20OR%20auction%20OR%20bond)%20when:2d&hl=en-US&gl=US&ceid=US:en
  - https://news.google.com/rss/search?q=site:bloomberg.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20Powell%20OR%20yield%20OR%20auction%20OR%20bond)%20when:2d&hl=en-US&gl=US&ceid=US:en

# 來源白名單：**只在退回 Google News 標題模式時**生效（Yahoo feed 本身
# 就只有 Yahoo）。「yahoo」涵蓋 Yahoo Finance、Yahoo奇摩財經／股市／新聞。
# 全部沒命中時退回不過濾，寧可來源雜一點也不讓整段消失。
sources:
  - yahoo
  - reuters
  - bloomberg
  - wsj
  - wall street journal
  - financial times
  - ft
