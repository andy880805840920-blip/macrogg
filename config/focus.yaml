# ============================================================================
# 首頁「今日市場焦點」窄條的設定
#
# 關鍵字餵給 Google News RSS（免費、無金鑰），標題再交給 Gemini 挑重點
# 寫一段焦點（防護欄見 src/analysis/focus_today.py 的說明）。
# 改完 commit 就生效。關鍵字可以隨時加減——每個關鍵字一次 RSS 請求。
# ============================================================================

enabled: true

# FedWatch 機率第一層：WIRP 同款**逐會議**算法（期貨自算）。
# 目標會議的決策日填這裡；需要的合約（會議月＋往回到第一個無會議月）
# 由程式自動推（例：12/09 會議 → ZQZ26 ＋ ZQX26），不用手填合約代號。
# 會議結束後把這裡改成下一場要盯的會議。
fedwatch_meeting: 2026-12-09

# 該年度的 FOMC 決策日（兩天會議的第二天）。每年一月照官方行事曆
# 更新一次：https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
# 算法靠它分辨「哪個月沒有會議」（錨月）與日曆日加權的 N/M/D。
fomc_dates:
  - 2026-01-28
  - 2026-03-18
  - 2026-04-29
  - 2026-06-17
  - 2026-07-29
  - 2026-09-16
  - 2026-10-28
  - 2026-12-09
  # 2027 年（官網行事曆 2026-09-16 更新已公布）
  - 2027-01-27
  - 2027-03-17
  - 2027-04-28
  - 2027-06-09
  - 2027-07-28
  - 2027-09-15
  - 2027-10-27
  - 2027-12-08

# 報價鏈健康檢查用的「當月合約」由程式按月份自動推，逐月自動滾；
# 要固定時才設 fedwatch_health_contract（例：ZQQ26.CBT）。

# FedWatch 機率第二層：亞特蘭大聯準銀行 Market Probability Tracker（官方）。
# 資料端點格式尚未實跑驗證：atlanta_json_path 沒填時每次執行只做偵察
# （把回應形狀印進 log）然後退下一層，不猜數字。對照 log 把取值路徑
# 填進來後才啟用（例：["probabilities", "hike25"]）。
# atlanta_mpt_url: https://www.atlantafed.org/cenfis/market-probability-tracker
# atlanta_json_path: []

# 焦點段的版式：N 則重點、每則 item_chars 個中文字以內（使用者指定
# 3 則、每則 100 字）。數字原樣寫進提示詞。
#
# 長度永遠不會讓焦點段退回列標題。每則的硬底線＝item_chars × 1.5
#（150 字）：底線內直接採用；超過就帶原因重寫一次，仍超過就把那一則
# 裁到底線之內（句子不切斷）後採用。
items: 3            # 舊版式（N 則等長）的設定，版式 A 啟用後只留給後備
item_chars: 100
# 版式 A（2026-10-05 定案）：主軸＋補充。
#   主軸 main_min–main_chars 字、可分 2–3 段：把今天最重要、彼此相關的三則報導
#   （優先彭博、路透）綜合論述講完整——發生什麼、為什麼、對利率或聯準會代表什麼。
#   補充 supp_items 則、每則 supp_chars 字內：主軸以外的事件，不能只列標題
#   （短於 supp_min 字就當作在列標題，帶原因重寫一次）。
# 超出區間（主軸 >275 或 <180、補充 >100 或 <36）才重寫一次；仍不合格就裁切
# 或照樣採用——長度永遠不會讓焦點段退回列標題。
main_chars: 250
main_min: 200
supp_items: 2
supp_chars: 80
supp_min: 40

# 空話清單：一次輸出命中兩個以上就帶原因重寫一次（第二次照樣採用——
# 這是文風問題，不是正確性問題）。看到新的套話直接往這裡加。
vague_markers:
  - 成為市場焦點
  - 備受關注
  - 引發市場關注
  - 引發關注
  - 多重挑戰
  - 值得關注
  - 市場密切關注
  - 持續升溫
  - 不容忽視
  - 牽動市場

# 主級關鍵字：命中一次計 2 分（挑選排序用）。政策與利率核心。
keywords:
  - 川普 聯準會
  - Fed 利率
  - Kevin Warsh
  - 美國財政部
  - 貝森特
  - 美債 殖利率
  - 債券市場
  - 美伊
  - 降息
  - 升息
  - 殖利率曲線
  - 公債標售
  # 英文組（FT／WSJ／Google News 的 feed 是英文標題；比對不分大小寫）
  - Fed rate
  - Treasury yields
  - Bessent
  - FOMC
  - Powell Warsh
  - bond market
  - rate cut
  - rate hike
  - yield curve
  - Treasury auction

# 次級關鍵字：命中一次計 1 分——債市生態系與 AI 資本週期，
# 只在主線新聞不足時自然上位，不搶聯準會頭條的位置。
keywords_secondary:
  - 信用利差
  - 公司債
  - 回購市場
  - 債務上限
  - 信評調降
  - 日債
  - 晶片戰爭
  - 晶片關稅
  - AI 資本支出
  - AI 發債
  - credit spreads
  - corporate bond
  - repo market
  - debt ceiling
  - downgrade
  - JGB
  - chip war
  - chip tariffs
  - AI capex
  - AI bond

# 後設偵測：AI 輸出含任一詞組＝在評論材料而不是寫新聞（實際發生過：
# 整篇「材料相關內容極為有限…無法按要求綜合改寫」上了線）。
# 命中→帶原因重試一次，再命中→退列標題模式。只收詞組不收單詞，
# 免得誤殺真新聞（「伊朗無法出口」的「無法」是正常句）。
meta_markers:
  - 提供的材料
  - 材料中
  - 材料主要
  - 材料缺乏
  - 根據材料
  - 僅能提取
  - 相關內容極為有限
  - 相關資訊有限
  - 關鍵字
  - 按要求
  - 綜合改寫
  - 無法按
  - 不足以
  - 標題快訊
  - 內文細節
  - 可供轉述
  - 以下是
  - 以下為
  - 根據您
  - 綜上所述
  - 需要注意的是
  - 總結來說

# 排除關鍵字：標題命中任一個就整條剔除。
# 擋的是正向關鍵字擋不掉的內容——**真的含關鍵字、但不是總經新聞**。
# 實例：「專家談美債布局：長天期沒賺，不如押0050或高股息」含「美債」，
# 但那是台股 ETF 理財文。看到新的雜訊詞直接往這裡加，不用改程式。
exclude_keywords:
  - "0050"
  - 高股息
  - ETF
  - 存股
  - 定期定額
  - 台股
  - 金控

# Yahoo 自家的 RSS（直達文章頁，AI 讀「內文」摘關鍵字相關重點）。
# 逐一嘗試、失敗跳過；全部失敗才退回下方的 Google News 標題模式。
# Yahoo 改版換網址時改這裡就好，不用動程式。
feeds:
  # ── 總經主力：真的在報美國總經、而且內文抓得到 ──
  # 先前只靠 Yahoo，實測內容早就不是總經新聞（台股兩條滿版台股個股、
  # 英文那條滿版加密貨幣與個股），篩選再好也挑不出東西。
  # 每條 feed 每次執行都會在 log 記「取得 N 則、入選 M 則」，哪條沒用
  # 一看就知道；抓不到的只記警告然後跳過，不影響其他來源。
  # CNBC：Economy、Finance 兩個版
  - https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
  - https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664
  # 聯準會官方：貨幣政策新聞稿與演講。主題本來就專屬，all: true 表示
  # 不用關鍵字過濾（演講標題常是「Speech by Governor X」，一個關鍵字都不含）。
  - url: https://www.federalreserve.gov/feeds/press_monetary.xml
    all: true
  - url: https://www.federalreserve.gov/feeds/speeches.xml
    all: true
  # Yahoo Finance 的十年期殖利率個別新聞：主題專屬、內文可讀
  - url: https://feeds.finance.yahoo.com/rss/2.0/headline?s=%5ETNX&region=US&lang=en-US
    all: true
  # ── 原有來源 ──
  - https://tw.news.yahoo.com/rss/finance
  - https://tw.stock.yahoo.com/rss?category=news
  - https://finance.yahoo.com/news/rssindex
  # 標題級來源：RSS 公開、內文有付費牆——貢獻標題與連結進標題池，
  # 內文抓不到會被長度檢查自動跳過，不影響其他來源。
  # ⚠️ 這裡有設定就會蓋掉程式內建的預設清單，所以 FT／WSJ 要列在這裡
  #（曾因只列三條 Yahoo 而讓 FT／WSJ 靜默失效）。
  - https://www.ft.com/rss/home
  - https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  # 路透與彭博沒有公開 RSS（路透 2020 年關閉、彭博從未開放），
  # 改走 Google News 的搜尋型 feed 限定來源＋主題。預期是**標題級**
  # 貢獻（彭博硬付費牆、路透偶爾放行）；兩家的通訊社稿全文本來就經
  # Yahoo 轉載進來，這兩條補的是原始出處的標題視角與來源多樣性。
  - https://news.google.com/rss/search?q=site:reuters.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20Powell%20OR%20yield%20OR%20auction%20OR%20bond)%20when:2d&hl=en-US&gl=US&ceid=US:en
  - https://news.google.com/rss/search?q=site:bloomberg.com%20(Fed%20OR%20FOMC%20OR%20Treasury%20OR%20inflation%20OR%20Powell%20OR%20yield%20OR%20auction%20OR%20bond)%20when:2d&hl=en-US&gl=US&ceid=US:en

# 來源白名單：**只在退回 Google News 標題模式時**生效（Yahoo feed 本身
# 就只有 Yahoo）。「yahoo」涵蓋 Yahoo Finance、Yahoo奇摩財經／股市／新聞。
# 全部沒命中時退回不過濾，寧可來源雜一點也不讓整段消失。
sources:
  - yahoo
  - reuters
  - bloomberg
  - wsj
  - wall street journal
  - financial times
  - ft

# ============================================================================
# 主題補充（2026-10）：主軸下方的兩則補充，依讀者在「選擇」裡排的前兩個
# 指標換成對應主題的新聞。每次更新把所有主題都寫好，瀏覽器再依讀者的選擇
# 挑兩則顯示。
#   chips     屬於這個主題的指標（指標代號見首頁「選擇」）
#   keywords  從新聞來源池挑這個主題的新聞。**詞組比對**：英文整組出現才算
#             （不分大小寫、整字比對，複數要另外列，例如 chip／chips）；
#             中文詞組裡空白分開的每個詞都要出現
#   exclude   有寫就**取代**上面的 exclude_keywords（台指期要放行「台股」）
#   search    額外的 Google News 搜尋（只有標題＋摘要），lang: en／zh
# 規則：前兩個指標同主題 → 往下找不同主題；主題當天沒新聞 → 往下一個
# 指標遞補，都沒有就用主軸那次一起寫的一般補充。
# ============================================================================
topics:
  - id: fed
    label: 聯準會
    chips: [fedwatch, fw_dec, fw_cum, dgs3mo, dgs2]
    keywords: [Fed, Federal Reserve, FOMC, Powell, Warsh, 聯準會, 降息, 升息, rate cut, rate cuts, rate hike]
    search:
      - {q: "Federal Reserve officials", lang: en}
      - {q: "Fed (site:reuters.com OR site:bloomberg.com)", lang: en}
  - id: long
    label: 長天期美債
    chips: [dgs5, dgs10, dgs30, move]
    # 只收美債：yield／殖利率這種泛稱會把印度債、歐債、台股的「股息殖利率」都拉進來
    keywords: [Treasury, Treasuries, 10-year, 30-year, 美債, 美國公債, 美債殖利率, 公債標售]
    search:
      - {q: "Treasury yields (site:reuters.com OR site:bloomberg.com)", lang: en}
      - {q: "Treasury auction", lang: en}
  - id: funding
    label: 資金市場
    chips: [sofr, sofr_iorb, onrrp, srf]
    keywords: [repo market, SOFR, bank reserves, reverse repo, standing repo, money market, 回購市場, 準備金]
    search:
      - {q: "\"repo market\" OR SOFR OR \"bank reserves\" Fed", lang: en}
  - id: oil
    label: 油價
    chips: [wti, brent]
    keywords: [oil, crude, OPEC, Brent, WTI, 油價, 原油]
    search:
      - {q: "oil prices (site:reuters.com OR site:bloomberg.com)", lang: en}
  - id: equity
    label: 美股
    chips: [dji, vix]
    # AI 消息同時推動美股、台股與半導體（2026-10，使用者：AI 要對應台指期與美股）
    keywords: [Dow, S&P 500, Nasdaq, Wall Street, stocks, VIX, 美股, 道瓊, 標普, AI, artificial intelligence, Nvidia, OpenAI, AI capex, data center, data centers, hyperscaler, 人工智慧, 輝達, 資料中心, AI 伺服器]
    # 標題還必須有美股／指數類的詞（AI 新聞要真的在講美股才算；2026-10 使用者：美股新聞篩錯）
    require: [Dow, S&P 500, S&P, Nasdaq, Wall Street, US stocks, U.S. stocks, stocks, stock market, equities, VIX, 美股, 道瓊, 標普, 那斯達克, 華爾街, 美國股市]
    # 在全站排除詞之外追加：其他國家股市、原油庫存（oil stocks）、世界銀行區域報告
    exclude_add: [台股, 日股, 陸股, 港股, 歐股, 韓股, A股, 日經, 恆生, Nikkei, Hang Seng, FTSE, DAX, European stocks, Asian stocks, China stocks, Japan stocks, oil stocks, crude stocks, G7 stocks, stockpile, World Bank, 世界銀行]
    search:
      - {q: "Wall Street stocks (site:reuters.com OR site:bloomberg.com)", lang: en}
  - id: semi
    label: AI 與半導體
    chips: [sox]
    keywords: [chip, chips, chipmaker, chipmakers, semiconductor, semiconductors, Nvidia, TSMC, AI capex, 半導體, 晶片, 輝達, 台積電, AI, artificial intelligence, OpenAI, data center, data centers, hyperscaler, 人工智慧, 資料中心, AI 伺服器]
    # 台積電、輝達的中文新聞常是個股理財文——擋掉，其餘沿用全站排除詞
    exclude: [ETF, 存股, 高股息, 股息, 定期定額, "0050", 台股, 金控, 必漲, 卡位, 黑馬, 飆股, 千金股]
    search:
      - {q: "chip stocks OR semiconductor (site:reuters.com OR site:bloomberg.com)", lang: en}
  - id: twf
    label: 台指期
    chips: [txf]
    keywords: [台指期, 台股, 加權指數, 外資, 夜盤, 人工智慧, 輝達, 台積電, AI 伺服器, AI 概念股]
    exclude: [ETF, 存股, 高股息, 定期定額, "0050", 必漲, 卡位, 黑馬, 飆股, 千金股]
    search:
      - {q: "台指期", lang: zh}
      - {q: "台股 外資", lang: zh}
  - id: election
    label: 期中選舉
    chips: [pm_house, pm_senate]
    keywords: [midterm, midterms, Senate race, House majority, Senate control, House control, 期中選舉, 參議院, 眾議院]
    search:
      - {q: "midterm elections (site:reuters.com OR site:bloomberg.com)", lang: en}
      - {q: "美國期中選舉", lang: zh}

# ============================================================================
# 美國期中選舉預測（Polymarket，首頁卡片＋眾院／參院兩顆指標）
# 公開資料、不用金鑰。選舉日後卡片改成「選舉結果」，hide_after 之後自動隱藏。
# 事件代號（slug）就是 Polymarket 網址 /event/ 後面那一段。
# ============================================================================
election:
  enabled: true
  election_date: 2026-11-03
  hide_after: 2026-11-17
  house: which-party-will-win-the-house-in-2026
  senate: which-party-will-win-the-senate-in-2026
  balance: balance-of-power-2026-midterms
  tag: midterms
  n_races: 4                 # 參院選戰列幾州（自動挑勝負最接近的）
  min_volume: 100000         # 眾院／參院／權力組合的交易量下限（美元）
  race_min_volume: 300000    # 個別州選戰的交易量下限（美元）
  stale_days: 3              # 抓不到時沿用上次結果的最長天數
  # ---- 各州地圖（選舉卡片下方，可收合）----
  map: true
  # 這次沒改選的席次（參院 65 席、州長 14 州）——選前狀態，選後就不用改
  senate_not_up: {D: 34, R: 31}     # 民主黨含 2 位與民主黨同黨團的獨立參議員
  senate_majority: 51
  senate_tiebreak: R                # 50:50 由副總統（共和黨）投票
  senate_control: R                 # 改選前由誰掌控
  governor_not_up: {D: 6, R: 8}     # D：DE KY NJ NC VA WA；R：IN LA MS MO MT ND UT WV
  governor_before: {R: 27, D: 23}
  # Polymarket 沒掛 midterms 標籤的事件（州 → 事件代號）
  extra_events:
    governor:
      California: california-governor-election-2026
  # 盤口上沒標黨派的候選人（D／R／I）。log 出現「領先者沒標黨派」就在這裡補
  party_overrides:
    Mary Peltola: D
    Dan Sullivan: R
    Jonathan Kreiss-Tomkins: D
    Tom Begich: D
    Bernadette Wilson: R
    David Bronson: R
    Xavier Becerra: D
    Steve Hilton: R
  # 席次分布盤（顯示市場價格最高的那一格）
  senate_seats_event: republican-senate-seats-after-the-2026-midterm-elections-927
  house_seats_event: republican-house-seats-after-the-2026-midterm-elections
  governor_seats_event: how-many-republican-governors-after-the-2026-midterm-elections
