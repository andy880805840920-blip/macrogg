# ============================================================================
# 首頁「今日市場焦點」窄條的設定
#
# 關鍵字餵給 Google News RSS（免費、無金鑰），標題再交給 Gemini 挑重點
# 寫一段焦點（防護欄見 src/analysis/focus_today.py 的說明）。
# 改完 commit 就生效。關鍵字可以隨時加減——每個關鍵字一次 RSS 請求。
# ============================================================================

enabled: true

# 焦點段的中文字數上限（AI 的輸出超過會被擋下、退回列標題）
max_chars: 120

keywords:
  - 川普 聯準會
  - Fed 利率
  - Kevin Warsh
  - 美國財政部
  - 貝森特
  - 美債 殖利率
  - 債券市場
  - 美伊

# 來源白名單：只留 source 名稱含這些字串的標題（不分大小寫）。
# 「yahoo」同時涵蓋 Yahoo Finance、Yahoo奇摩財經／股市／新聞。
# 全部沒命中時會退回不過濾（log 會記一行），寧可來源雜一點也不讓整段消失。
# 想恢復全部來源就把這一段刪掉或留空。
sources:
  - yahoo
