# ============================================================================
# 首頁「今日市場焦點」窄條的設定
#
# 關鍵字餵給 Google News RSS（免費、無金鑰），標題再交給 Gemini 挑重點
# 寫一段焦點（防護欄見 src/analysis/focus_today.py 的說明）。
# 改完 commit 就生效。關鍵字可以隨時加減——每個關鍵字一次 RSS 請求。
# ============================================================================

enabled: true

# FedWatch 機率第一層：WIRP 同款**逐會議**算法（期貨自算）。
# 目標會議的決策日填這裡；需要的合約（會議月＋往回到第一個無會議月）
# 由程式自動推（例：12/09 會議 → ZQZ26 ＋ ZQX26），不用手填合約代號。
# 會議結束後把這裡改成下一場要盯的會議。
# 第十八批起：首頁的累計升降息改成「今年底／明年中／明年底」三個節點，
# 由下面的 fomc_dates 自動滾動；這個欄位只剩後備算法在用。
# ⚠️ 每年夏天聯準會公布下一年日程後，記得把下一年的會議日補進 fomc_dates，
# 否則年底過後第三個節點會排不出來（log 會警告）。
fedwatch_meeting: 2026-12-09

# 該年度的 FOMC 決策日（兩天會議的第二天）。
# 2026-10-22 起由 src/schedule_auto.py 每次執行自動從聯準會官網行事曆抓（列到明年），
# 官網有列的年份以官網為準；這裡只是抓不到時的後備，不必再每年手動更新。
# 來源：https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
# 算法靠它分辨「哪個月沒有會議」（錨月）與日曆日加權的 N/M/D。
fomc_dates:
  - 2026-01-28
  - 2026-03-18
  - 2026-04-29
  - 2026-06-17
  - 2026-07-29
  - 2026-09-16
  - 2026-10-28
  - 2026-12-09
  # 2027 年（官網行事曆 2026-09-16 更新已公布）
  - 2027-01-27
  - 2027-03-17
  - 2027-04-28
  - 2027-06-09
  - 2027-07-28
  - 2027-09-15
  - 2027-10-27
  - 2027-12-08

# 首頁「接下來看什麼 → 官員談話」的票委標記（第十八批）。
# fomc_board：理事會成員（英文姓氏），永遠有投票權。
# fomc_voters：各年度有投票權的地區聯儲總裁（紐約聯儲總裁每年都投）。
# 2026-10-22 起由 src/schedule_auto.py 自動從聯準會 FOMC 頁抓：今年票委＝Committee Members、
# 明年票委＝Alternate Members（紐約聯儲的候補是第一副總裁，不算）。這裡只是抓不到時的後備。
# 來源：https://www.federalreserve.gov/monetarypolicy/fomc.htm
fomc_board: [Warsh, Jefferson, Bowman, Waller, Cook, Barr, Powell]
fomc_voters:
  2026: [Williams, Hammack, Paulson, Logan, Kashkari]
  # 2027 輪值：里奇蒙、芝加哥、亞特蘭大、舊金山（亞特蘭大目前是代理總裁 Venable，官網列為 2026 候補）
  2027: [Williams, Barkin, Goolsbee, Daly, Venable]

# 報價鏈健康檢查用的「當月合約」由程式按月份自動推，逐月自動滾；
# 要固定時才設 fedwatch_health_contract（例：ZQQ26.CBT）。

# FedWatch 機率第二層：亞特蘭大聯準銀行 Market Probability Tracker（官方）。
# 資料端點格式尚未實跑驗證：atlanta_json_path 沒填時每次執行只做偵察
# （把回應形狀印進 log）然後退下一層，不猜數字。對照 log 把取值路徑
# 填進來後才啟用（例：["probabilities", "hike25"]）。
# atlanta_mpt_url: https://www.atlantafed.org/cenfis/market-probability-tracker
# atlanta_json_path: []

# 焦點段的版式：N 則重點、每則 item_chars 個中文字以內（使用者指定
# 3 則、每則 100 字）。數字原樣寫進提示詞。
#
# 長度永遠不會讓焦點段退回列標題。每則的硬底線＝item_chars × 1.5
#（150 字）：底線內直接採用；超過就帶原因重寫一次，仍超過就把那一則
# 裁到底線之內（句子不切斷）後採用。
items: 3            # 舊版式（N 則等長）的設定，版式 A 啟用後只留給後備
item_chars: 100
# 版式 A（2026-10-05 定案）：主軸＋補充。
#   主軸 main_min–main_chars 字、可分 2–3 段：把今天最重要、彼此相關的三則報導
#   （優先彭博、路透）綜合論述講完整——發生什麼、為什麼、對利率或聯準會代表什麼。
#   補充 supp_items 則、每則 supp_chars 字內：主軸以外的事件，不能只列標題
#   （短於 supp_min 字就當作在列標題，帶原因重寫一次）。
# 超出區間（主軸 >275 或 <180、補充 >100 或 <36）才重寫一次；仍不合格就裁切
# 或照樣採用——長度永遠不會讓焦點段退回列標題。
main_chars: 250
main_min: 200
supp_items: 2
supp_chars: 80
supp_min: 40

# 空話清單：一次輸出命中兩個以上就帶原因重寫一次（第二次照樣採用——
# 這是文風問題，不是正確性問題）。看到新的套話直接往這裡加。
vague_markers:
  - 成為市場焦點
  - 備受關注
  - 引發市場關注
  - 引發關注
  - 多重挑戰
  - 值得關注
  - 市場密切關注
  - 持續升溫
  - 不容忽視
  - 牽動市場

# 今日主軸只選下列主題；程式會展開中英文同義詞，並區分本地與美國總經新聞。
# 其他國家的 CPI／GDP／利率不能僅因同字而入選；BOJ、日圓、AI、油價及指定戰爭可跨國。
keywords:
  # 主軸關鍵字分兩級（2026-10 第十七批）：主軸回到利率主線。
  # 主級：命中一次 +2 分；次級：+1 分（一樣收進來，只是排序低一點）。
  # 英文要完整單字才算命中（可帶複數 s），「AI」不會再命中 said、again。
  # 片語會拆成單字各自比對（例：「rate cut」＝rate、cut）。
  - Fed
  - FOMC
  # 主席是華許（2026-05 接任）；鮑爾已卸任主席、留任理事，降為次級詞
  - Warsh
  - 華許
  - 聯準會
  - 升息
  - 降息
  - inflation
  - CPI
  - PCE
  - PPI
  - 通膨
  - payrolls
  - unemployment
  - 非農
  - 失業率
  - GDP
  - Treasury
  - Treasuries
  - yields
  - bond
  - 美債
  # 中文詞避開台灣在地新聞也會用的字：「殖利率」（台股高殖利率股）、
  # 「財政部」「公債」（台灣財政部）、「利率」「就業」（房貸利率、台灣就業）
  - 美債殖利率
  - 公債殖利率
  - 美國公債
  - 公債標售
  - 債市
  - deficit
  - 美國財政部
  - 財政赤字
  - 發債
  - Bessent
  - 貝森特
  - tariff
  - 關稅
keywords_secondary:
  - Powell
  - 鮑爾
  - Trump
  - 川普
  - dollar
  - 美元
  - BOJ
  - 日本央行
  - yen
  - 日圓
  - AI
  - Nvidia
  - 輝達
  - semiconductor
  - 半導體
  - AI資本支出
  - oil
  - crude
  - 油價
  - 原油
