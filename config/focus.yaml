# ============================================================================
# 首頁「今日市場焦點」窄條的設定
#
# 關鍵字餵給 Google News RSS（免費、無金鑰），標題再交給 Gemini 挑重點
# 寫一段焦點（防護欄見 src/analysis/focus_today.py 的說明）。
# 改完 commit 就生效。關鍵字可以隨時加減——每個關鍵字一次 RSS 請求。
# ============================================================================

enabled: true

# FedWatch 機率第一層（期貨自算）用的合約。
# ZQF27＝2027 年 1 月的 30 天期聯邦基金期貨：1 月沒有 FOMC 會議，
# 整月平均利率 ≈ 2026 年 12 月會議之後的利率。
# 年度往前滾時改這裡（例如要看 2027 年底就改 ZQF28.CBT）。
fedwatch_contract: ZQF27.CBT

# 焦點段的中文字數上限（AI 的輸出超過會被擋下、退回列標題）。
# 120 只夠把標題換句話說；要塞得下「內文才有的細節」（金額、時間點、
# 引述），至少要 160 上下。
max_chars: 160

keywords:
  - 川普 聯準會
  - Fed 利率
  - Kevin Warsh
  - 美國財政部
  - 貝森特
  - 美債 殖利率
  - 債券市場
  - 美伊

# 排除關鍵字：標題命中任一個就整條剔除。
# 擋的是正向關鍵字擋不掉的內容——**真的含關鍵字、但不是總經新聞**。
# 實例：「專家談美債布局：長天期沒賺，不如押0050或高股息」含「美債」，
# 但那是台股 ETF 理財文。看到新的雜訊詞直接往這裡加，不用改程式。
exclude_keywords:
  - "0050"
  - 高股息
  - ETF
  - 存股
  - 定期定額
  - 台股
  - 金控

# Yahoo 自家的 RSS（直達文章頁，AI 讀「內文」摘關鍵字相關重點）。
# 逐一嘗試、失敗跳過；全部失敗才退回下方的 Google News 標題模式。
# Yahoo 改版換網址時改這裡就好，不用動程式。
feeds:
  - https://tw.news.yahoo.com/rss/finance
  - https://tw.stock.yahoo.com/rss?category=news
  - https://finance.yahoo.com/news/rssindex

# 來源白名單：**只在退回 Google News 標題模式時**生效（Yahoo feed 本身
# 就只有 Yahoo）。「yahoo」涵蓋 Yahoo Finance、Yahoo奇摩財經／股市／新聞。
# 全部沒命中時退回不過濾，寧可來源雜一點也不讓整段消失。
sources:
  - yahoo
