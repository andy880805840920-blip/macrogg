# 偷懶頁「這個指標怎麼看」教學內容（2026-10 審稿版）
# 同一份內容也供各頁「這在看什麼？」使用；改這裡，全站一起改。
# 欄位：one 一句話／origin 怎麼來的／read 怎麼看／chain 跟利率的關係（傳導鏈）
#       myth 常見誤讀／practice 練習模板（{欄位} 由當天資料填入）／quiz 小測驗／source 出處
#       site_rule: true 表示內容含本站自訂規則
fed_funds:
  title: 聯邦基金利率與目標區間
  section: 聯準會與政策
  one: 銀行之間隔夜互借準備金的利率，是美國所有利率的起點。
  origin: FOMC 設定一個 0.25 個百分點寬的目標區間；紐約聯準會每天公布實際成交的有效聯邦基金利率（EFFR）。聯準會不直接規定成交價，而是把準備金利率（IORB）設在區間內偏上——銀行把錢放在聯準會就能拿到 IORB，不會用更低的利率借出；再把隔夜逆回購（ON RRP）利率設在區間下緣當地板，讓成交價留在區間內。
  read: 看「區間」而不是單一數字；升降息就是整個區間上下移動。EFFR 落在區間哪個位置，反映銀行體系的資金鬆緊。
  chain:
  - 政策利率
  - 短天期公債與貨幣市場利率
  - 房貸、企業貸款、信用卡利率
  - 借貸與消費
  - 就業與物價。
  myth: 「降息＝長天期利率一定下降」。長天期利率還受通膨預期與期限溢酬影響，降息期間 10 年期殖利率上升的情況並不罕見。
  practice: 目前目標區間 {lower}%–{upper}%，上次動作是 {last_move}，距今 {days_since} 天。
  source: Federal Reserve Board〈Policy Tools〉；New York Fed EFFR。
  quiz:
    q: 聯準會怎麼讓實際成交利率留在目標區間內？
    opts:
    - 直接規定銀行只能用區間內的價格交易
    - 用 IORB 與 ON RRP 利率把市場利率夾住
    - 每天買賣股票調整資金
    ans: 1
    why: 這叫「充足準備金」架構，靠兩個管理利率引導，而不是靠管制。
fomc_vote:
  title: FOMC 決議與投票
  section: 聯準會與政策
  one: 決定利率的委員會，以及誰投了什麼票。
  origin: FOMC 一年開 8 次例會。有投票權的 12 人：7 位理事、紐約聯準會總裁（常任），以及其他 11 位地區聯準會總裁中輪替的 4 位。不投票的總裁仍參與討論。
  read: 除了結果，看「反對票」—— 有人主張更大幅度或反方向，代表內部分歧，下次會議的不確定性較高。
  chain:
  - 決議
  - 政策利率
  - 市場重新定價未來路徑（期貨、2 年期殖利率反應最直接）。
  myth: 「會後利率不動就是沒有消息」。聲明措辭、點陣圖、記者會口氣的改變，常比利率本身更影響市場。
  practice: 下次 FOMC 在 {next_meeting}（台灣時間 {tpe_time}）。上次決議 {last_decision}，票數 {votes}，反對者 {dissent}。
  source: Federal Reserve Board〈About the FOMC〉。
  quiz:
    q: 以下誰每年都有 FOMC 投票權？
    opts:
    - 舊金山聯準會總裁
    - 紐約聯準會總裁
    - 財政部長
    ans: 1
    why: 紐約聯準會負責執行公開市場操作，因此是常任票委；財政部長不在 FOMC。
fedwatch:
  title: 升降息機率（聯邦基金期貨）
  section: 聯準會與政策
  one: 從期貨價格反推市場認為下次會議升息、降息或不動的機率。
  origin: CME 30 天期聯邦基金期貨的價格 = 100 − 該月平均 EFFR 預期。比較會議前後月份的隱含利率，就能算出市場押注的變動幅度與機率（CME FedWatch 的做法）。本站用同一套方法自行計算。
  read: 機率是「市場的定價」，不是預測；看它的變化方向比看單一數字有用。
  chain:
  - 機率上升
  - 短天期殖利率先動
  - 美元與股市跟著調整。
  myth: 「降息機率 70% 代表 70% 的經濟學家認為會降息」。它是資金押注的結果，含風險溢酬，也可能一夜大變。
  practice: '{fw_label}：{fw_value}，{fw_delta}。往後看：{fw_h1}。'
  source: CME Group〈FedWatch Methodology〉。
  quiz:
    q: 期貨價格 95.80 代表市場預期該月平均利率約為多少？
    opts:
    - 4.20%
    - 95.80%
    - 0.42%
    ans: 0
    why: 100 − 95.80 = 4.20。
dots:
  title: 點陣圖與經濟預測摘要（SEP）
  section: 聯準會與政策
  one: 每位 FOMC 成員對未來利率、成長、失業、通膨的個人預測。
  origin: 每季（3、6、9、12 月會議）公布。點陣圖每一點是一位成員對各年底合適利率的看法，不標姓名；共 19 位參與者（含無投票權者）。
  read: 看「中位數」與上一次相比的移動，以及點的分散程度。分散愈大，前景愈不確定。
  chain:
  - 中位數上移
  - 市場預期路徑上修
  - 2 年期殖利率上升。
  myth: 「點陣圖是聯準會的承諾」。它只是當下的個人判斷，數據一變就會改；與期貨隱含路徑不同是常態。
  practice: 最新點陣圖 {year} 年底中位數 {dot_median}%；目前政策區間中點 {rate_mid}%，差 {dot_gap} bp。
  source: Federal Reserve Board〈Summary of Economic Projections〉。
  quiz:
    q: 點陣圖一年公布幾次？
    opts:
    - 8 次
    - 4 次
    - 12 次
    ans: 1
    why: 只有附帶 SEP 的季度會議才有。
statement:
  title: 聲明、記者會與會議紀要
  section: 聯準會與政策
  one: 聯準會解釋決策的三種文字。
  origin: 聲明在決議當天下午 2:00（美東）發布；主席 2:30 召開記者會；會議紀要（Minutes）在會後三週公布。
  read: 聲明逐字比較上一次的改動；紀要看「多數」「一些」「少數」這類描述，判斷意見分布。
  chain:
  - 措辭轉鷹（擔心通膨）
  - 預期升息或延後降息
  - 短端殖利率上升。
  myth: 「紀要是新決定」。紀要描述三週前的討論，可能已被之後的數據改寫。
  practice: 上次聲明相較前一次改了 {n_changes} 處，本站歸類為「{shift_label}」。
  source: Federal Reserve Board〈FOMC Calendars〉。
  quiz:
    q: 會議紀要大約在會後多久公布？
    opts:
    - 當天
    - 三週
    - 三個月
    ans: 1
    why: ''
blackout:
  title: 靜默期與官員談話（票委）
  section: 聯準會與政策
  one: 會議前約十天官員不公開談政策；其他時間的發言是市場判斷方向的線索。
  origin: 靜默期從會議前第二個星期六開始，到會後隔天結束。本站把官員分成「今年票委」與「非票委」，並標示主席、副主席。
  read: 主席與票委權重最高；一位官員「改口」比他一貫的立場更有訊息量。
  chain:
  - 關鍵官員偏鷹
  - 期貨降息機率下降
  - 短端殖利率上升。
  myth: 「任何一位總裁說要降息就會降息」。決策靠多數，個人發言只是一票的看法。
  practice: 目前 {in_blackout}（靜默期至 {blackout_end}）。本週有 {n_speakers} 位官員談話，其中票委 {n_voters} 位。
  source: Federal Reserve〈FOMC Policy on External Communications〉。
  quiz:
    q: 靜默期內官員可以做什麼？
    opts:
    - 公開談論利率展望
    - 不公開談貨幣政策
    - 只能接受媒體專訪
    ans: 1
    why: ''
mandate:
  title: 雙重使命與政策重心
  section: 聯準會與政策
  one: 聯準會的法定目標是「最大就業」與「物價穩定」。
  origin: 國會在 1977 年修法明訂；聯準會把物價穩定量化為 PCE 通膨長期 2%。最大就業沒有固定數字。
  read: 兩個目標拉扯時，看哪一邊離目標更遠、偏離更持久，聯準會就偏重哪一邊。本站以就業與通膨兩個象限判斷「政策重心」（本站規則）。
  chain:
  - 通膨偏高、就業穩
  - 偏緊；就業轉弱、通膨回落
  - 偏鬆。
  myth: 「聯準會的目標是 CPI 2%」。官方目標是 PCE，不是 CPI。
  practice: 核心 PCE {core_pce}%（距 2% {pce_gap} 個百分點），失業率 {ur}%。本站判斷目前重心偏向 {focus}。
  source: Federal Reserve〈Statement on Longer-Run Goals and Monetary Policy Strategy〉。
  quiz:
    q: 聯準會的 2% 通膨目標用哪個指標？
    opts:
    - CPI
    - PCE
    - PPI
    ans: 1
    why: ''
  site_rule: true
terminal:
  title: 終端利率
  section: 聯準會與政策
  one: 這一輪升息或降息最後會停在哪裡。
  origin: 不是官方數字。市場用期貨曲線的最高點（升息循環）或最低點（降息循環）推算，聯準會則以點陣圖的長期與各年中位數表達。
  read: 比較市場隱含終點與點陣圖；兩者差距大，代表市場與聯準會看法不同，之後總有一方要修正。
  chain:
  - 終端利率預期
  - 2–5 年期殖利率的主要錨點。
  myth: 「終端利率＝中性利率」。中性利率是不刺激也不壓抑經濟的理論水準，終端利率只是這一輪的終點，兩者可以不同。
  practice: 期貨曲線最低點 {terminal}%，出現在 {terminal_month}；點陣圖長期中位數 {longrun}%。
  source: CME 聯邦基金期貨；Federal Reserve SEP。
  quiz:
    q: 降息循環中，市場隱含的終端利率通常看期貨曲線的哪裡？
    opts:
    - 最高點
    - 最低點
    - 第一個月
    ans: 1
    why: ''
grid9:
  title: 九宮格框架
  section: 九宮格與情境
  one: 把「就業」與「通膨」各分三種狀態，交叉成九格，用來描述目前的總經情境。
  origin: 本站規則。就業分 轉強／持平／轉弱，通膨分 升溫／持平／降溫，各自由就業頁與通膨頁的判讀結果決定，每次數據公布後重算。
  read: 先看自己落在哪一格，再看離隔壁格還差什麼條件。格子本身不是預測，是「現在的位置」。
  chain:
  - 就業轉弱＋通膨降溫
  - 降息空間最大；就業轉強＋通膨升溫
  - 升息壓力最大；兩者方向相反
  - 聯準會兩難，看哪一邊偏離目標更遠。
  myth: 「落在降息格就一定會降息」。聯準會還看金融情勢、前瞻預測與風險平衡；九宮格是本站的簡化框架。
  practice: 目前位於「就業 {labor_state}、通膨 {infl_state}」格，已持續 {months} 個月。上一格是 {prev_cell}。
  source: 本站規則。
  quiz:
    q: 就業轉弱、通膨升溫，聯準會面對的是什麼情況？
    opts:
    - 明確該降息
    - 明確該升息
    - 兩個目標互相拉扯
    ans: 2
    why: 這接近「停滯性通膨」型態，降息會助長通膨、升息會傷就業。
  site_rule: true
triggers:
  title: 情境轉換門檻
  section: 九宮格與情境
  one: 要從目前這一格移到隔壁格，數據得出現什麼變化。
  origin: 本站規則。網站模擬就業與通膨的判讀邏輯，找出最接近的兩條「相鄰路徑」與一條較遠的路徑，用白話寫出條件（例如「核心 PCE 年增率回到某區間」「Supercore 3 個月年化連兩個月低於某水準」）。
  read: 門檻離現值愈近，下次數據就可能換格；需要「連續兩個月」的條件，單月數據不會觸發。
  chain:
  - 市場常提前交易換格
  - 換格前期貨機率就會先動。
  myth: 「一個月數據跨過門檻就換格」。多數門檻設計成需要確認，以免雜訊造成來回切換。
  practice: 最接近的轉換：{path1}（還差 {gap1}）；其次：{path2}（還差 {gap2}）。
  source: 本站規則。
  quiz:
    q: 為什麼許多門檻要求連續兩個月？
    opts:
    - 數據兩個月才公布一次
    - 避免單月雜訊造成誤判
    - 聯準會規定
    ans: 1
    why: ''
  site_rule: true
duration:
  title: 固定收益對照與存續期間
  section: 九宮格與情境
  one: 每一格情境下，哪一段天期的債券歷史上相對表現較好，以及利率變動對債券價格的影響有多大。
  origin: 存續期間（duration）衡量債券價格對利率的敏感度：存續期間 7 年，利率上升 1 個百分點，價格約下跌 7%。本站把情境對應到短、中、長天期的偏好（本站規則）。
  read: 降息情境偏好拉長存續期間（利率下降時長債漲最多）；升息或通膨升溫情境偏好短天期。
  chain:
  - 利率 ↑
  - 債券價格 ↓，天期愈長跌愈多；利率 ↓
  - 長債漲幅最大。
  myth: 「債券是無風險的」。公債沒有違約風險，但有利率風險；長天期公債一年跌兩成以上在歷史上發生過。
  practice: 目前情境對照 {duration_pref}。10 年期公債存續期間約 {dur10} 年，若殖利率上升 0.5 個百分點，價格約變動 {price_chg}%。
  source: 存續期間為債券數學標準定義；情境對照為本站規則。
  quiz:
    q: 存續期間 15 年的債券，殖利率下降 0.2 個百分點，價格約變動多少？
    opts:
    - +3%
    - −3%
    - +0.2%
    ans: 0
    why: 15 × 0.2% ≈ 3%，利率下降價格上升。
  site_rule: true
nfp:
  title: 非農就業人數（NFP）
  section: 就業
  one: 美國企業與政府（不含農業）一個月內新增多少個工作。
  origin: 勞工統計局（BLS）《就業情況報告》，通常每月第一個星期五美東 8:30 公布。數字來自「機構調查」（抓企業與政府單位的薪資名冊）。
  read: 看 3 個月平均而不是單月；再拿來跟「損益兩平就業增量」（讓失業率持平所需的增量，隨人口與移民變化）比。
  chain:
  - 就業增量高於預期
  - 降息預期減少
  - 2 年期殖利率上升、美元走強。
  myth: 「非農大增但失業率也上升，數據一定錯了」。兩者來自不同調查，短期方向不一致很常見。
  practice: '{month} 非農 {nfp} 萬人；3 個月平均 {nfp3} 萬，6 個月平均 {nfp6} 萬。'
  source: BLS〈Current Employment Statistics〉。
  quiz:
    q: 非農就業人數來自哪個調查？
    opts:
    - 家庭調查
    - 機構調查
    - 失業金申請
    ans: 1
    why: 失業率才是來自家庭調查。
unrate:
  title: 失業率
  section: 就業
  one: 勞動力中「想工作、最近有找工作但沒有工作」的人佔比。
  origin: BLS 家庭調查（CPS），每月訪問約 6 萬戶。失業率 = 失業人數 ÷ 勞動力（就業＋失業）。
  read: 單月 0.1 個百分點在抽樣誤差內，看趨勢。常見參考是「薩姆規則」：3 個月平均失業率比過去 12 個月低點高出 0.5 個百分點，歷史上常伴隨衰退開始。
  chain:
  - 失業率上升
  - 經濟閲置增加、薪資壓力下降
  - 聯準會降息空間加大。
  myth: 「失業率上升＝裁員變多」。也可能是更多人回到勞動市場找工作，要看下一題的分解。
  practice: 失業率 {ur}%，較上月 {ur_chg}；薩姆指標 {sahm}（觸發線 0.5）。
  source: BLS〈Current Population Survey〉；Sahm (2019)。
  quiz:
    q: 以下哪位不算失業者？
    opts:
    - 被裁員、本月有投履歷的人
    - 全職學生、沒有找工作
    - 剛畢業、正在找工作的人
    ans: 1
    why: 沒有找工作的人不在勞動力內。
ur_decomp:
  title: 失業率變動分解（失業人口結構）
  section: 就業
  one: 把失業者依「為什麼失業」分類，分辨失業率上升是裁員造成還是人回來找工作。
  origin: BLS 家庭調查把失業者分成四類：失去工作者（含暫時解雇）、自願離職者、重新進入者、首次進入者。本站計算各類對失業率變動的貢獻。
  read: 由「失去工作者」驅動的上升是壞上升；由「重新進入、首次進入」驅動的上升，常伴隨勞參率回升，意義較溫和。
  chain:
  - 裁員驅動的失業上升
  - 收入與消費下滑風險高
  - 降息理由較充分。
  myth: 只看失業率數字就判斷勞動市場轉弱，忽略了供給面（人回來找工作）的可能。
  practice: '{month} 失業率變動 {ur_d} 個百分點：就業變動貢獻 {emp_c}、勞動力變動貢獻 {lf_c}；失去工作者佔失業者 {loser_share}%。'
  source: BLS CPS Table A-11（Unemployed persons by reason）。
  quiz:
    q: 失業率上升主要來自「重新進入者」，比較可能代表什麼？
    opts:
    - 大規模裁員
    - 更多人回到勞動市場找工作
    - 政府縮編
    ans: 1
    why: ''
lfpr:
  title: 勞動參與率
  section: 就業
  one: 16 歲以上人口中，有工作或正在找工作的比例。
  origin: BLS 家庭調查。另有「壯年勞參率」（25–54 歲），可排除退休潮等人口老化影響。
  read: 整體勞參率受老化拖累長期下滑，用壯年勞參率判斷就業意願更準。勞參率上升代表勞動供給增加。
  chain:
  - 勞動供給增加
  - 薪資壓力減輕
  - 通膨下行，聯準會不必靠壓抑需求來降溫。
  myth: 「勞參率下降代表經濟變差」。也可能只是嬰兒潮世代退休。
  practice: 勞參率 {lfpr}%，壯年勞參率 {prime}%；較一年前分別 {lfpr_y} 與 {prime_y}。
  source: BLS CPS。
  quiz:
    q: 為什麼經濟學家常看 25–54 歲勞參率？
    opts:
    - 這個年齡層薪水最高
    - 排除就學與退休的干擾
    - 只有這個年齡層有調查
    ans: 1
    why: ''
ahe:
  title: 平均時薪
  section: 就業
  one: 民間企業員工每小時的平均薪資。
  origin: 與非農同一份報告、同一個機構調查。常看月增率與年增率。
  read: 薪資成長扣掉生產力成長，大致就是企業的單位人力成本；若持續高於「2% 通膨＋生產力成長」，會對服務通膨形成壓力。
  chain:
  - 時薪加速
  - 服務業成本上升
  - 核心服務通膨偶高
  - 聯準會維持偏緊。
  myth: 「衰退時平均時薪暴增代表薪資上漲」。低薪者先被裁會拉高平均數（組成效果），可參考就業成本指數（ECI）確認。
  practice: 時薪月增 {ahe_m}%、年增 {ahe_y}%；扣除 CPI 後實質時薪年增 {real_ahe}%。
  source: BLS CES；BLS ECI。
  quiz:
    q: 哪個指標較不受「員工組成改變」影響？
    opts:
    - 平均時薪
    - 就業成本指數（ECI）
    - 非農人數
    ans: 1
    why: ECI 固定職務組合。
job_losers:
  title: 失去工作者比重
  section: 就業
  one: 失業者中「不是自願、是被解雇或合約結束」的比例。
  origin: BLS 家庭調查。本站以這個比重對過去平均的偏離程度（z 分數）輔助判讀（本站規則）。
  read: 比重升高代表失業的「品質」變差；與失業金申請同步上升時訊號更強。
  chain:
  - 被動失業增加
  - 消費信心與支出轉弱
  - 支持降息。
  myth: 把自願離職增加也當成壞消息。自願離職多常代表勞工有信心找到更好的工作。
  practice: 失去工作者占失業者 {loser_share}%，對過去平均的 z 分數 {z}。
  source: BLS CPS Table A-11。
  quiz:
    q: 哪種情況代表勞動市場較健康？
    opts:
    - 失去工作者比重升高
    - 自願離職比重升高
    - 兩者都下降
    ans: 1
    why: ''
  site_rule: true
claims:
  title: 失業金申請
  section: 就業
  one: 每週有多少人首次申請失業保險（初領），以及有多少人持續在領（續領）。
  origin: 勞工部（DOL）每週四美東 8:30 公布前一週的初領；續領再落後一週。
  read: 初領看 4 週平均，捕捉裁員的速度；續領上升代表「找不到工作」的人變多。是最即時的勞動數據。
  chain:
  - 初領持續上升
  - 裁員增加
  - 市場增加降息押注。
  myth: 單週跳升就宣告勞動市場崩壞。節日、颶風、汽車廠停工都會造成單週大幅波動。
  practice: 最新初領 {icsa} 萬人，4 週平均 {icsa4} 萬；續領 {ccsa} 萬人。
  source: U.S. Department of Labor〈Unemployment Insurance Weekly Claims〉。
  quiz:
    q: 續領人數上升、初領持平，最可能代表？
    opts:
    - 裁員加速
    - 裁員不多，但失業者更難找到工作
    - 就業市場過熱
    ans: 1
    why: ''
jolts:
  title: JOLTS 職缺與勞動流動
  section: 就業
  one: 企業有多少職缺、聘了多少人、多少人自己辭職、多少人被裁。
  origin: BLS 職缺與勞動流動調查（JOLTS），比非農報告多落後一個月。
  read: 「職缺／失業人數」比值衡量勞動市場緊度；「離職率」是薪資壓力的領先指標—— 敢辭職的人多，企業就得加薪留人。
  chain:
  - 職缺與離職率下降
  - 勞動市場降溫
  - 薪資通膨緩和
  - 支持降息。
  myth: 「職缺數就是空缺」。職缺是企業「正在招人」的數量，線上職缺的普及可能讓數字長期偏高。
  practice: '{month} 職缺 {openings} 萬，職缺／失業比 {vu}；離職率 {quits}%，裁員率 {layoffs}%。'
  source: BLS〈Job Openings and Labor Turnover Survey〉。
  quiz:
    q: 哪個 JOLTS 指標最常被用來預判薪資成長？
    opts:
    - 離職率
    - 聘僱數
    - 裁員率
    ans: 0
    why: ''
industry:
  title: 行業別貢獻
  section: 就業
  one: 本月新增的工作主要來自哪些行業。
  origin: BLS 機構調查的行業細項（醫療、政府、休閒餐飲、製造、營建等）。
  read: 看「廣度」—— 就業增加是分布在多個行業，還是集中在醫療、政府這種較不受景氣影響的部門。對景氣敏感的行業（製造、營建、暫時派遣）轉弱常是領先訊號。
  chain:
  - 景氣敏感行業減員
  - 需求面轉弱
  - 降息理由增加。
  myth: 「總數好就是好」。只靠少數非循環性行業撞起的增長，底層動能可能較弱。
  practice: 本月貢獻最大的三個行業：{top3}；景氣敏感行業合計 {cyc} 萬人。
  source: BLS CES Table B-1。
  quiz:
    q: 哪個行業的就業通常最早反映景氣轉弱？
    opts:
    - 醫療
    - 暫時派遣
    - 政府
    ans: 1
    why: 企業減人先從派遣開始。
revisions:
  title: 數據修正
  section: 就業
  one: 已公布的就業數字後來被改掉的部分。
  origin: 非農每月會修正前兩個月（回收更多問卷）；每年另有「基準修正」，用失業保險稅籍資料校正整年水準，初估在秋天公布、正式修正隨隔年二月發布的報告實施。
  read: 連續幾個月都往下修，常是景氣轉折的訊號；把修正後的數字一起看，才是真正的趨勢。
  chain:
  - 大幅下修
  - 過去的就業其實沒那麼強
  - 市場重新評估降息空間。
  myth: 只看頭條新數字，忽略前兩個月合計修正。這個月 +15 萬但前兩個月下修 10 萬，淨效果只有 +5 萬。
  practice: 本次前兩個月合計修正 {rev2} 萬；過去 6 次中有 {n_down} 次下修。
  source: BLS〈CES Revisions〉、〈Benchmark Article〉。
  quiz:
    q: 非農頭條 +15 萬，前兩個月合計下修 12 萬，對就業水準的淨增加是多少？
    opts:
    - +15 萬
    - +3 萬
    - +27 萬
    ans: 1
    why: ''
cpi:
  title: 消費者物價指數（CPI）
  section: 通膨
  one: 一籃子消費品與服務的價格，跟去年同期或上個月相比漲了多少。
  origin: BLS 每月中旬美東 8:30 公布，通常在月中前後。調查城市家庭會買的商品與服務價格，以消費支出結構加權；住房相關約占整體三分之一。
  read: 年增率看水準，月增率看最新動能。月增 0.2% 年化約 2.4%，0.17% 才約等於 2%。
  chain:
  - CPI 高於預期
  - 降息預期減少
  - 短端殖利率上升、美元走強、股市承壓。
  myth: 「CPI 年增率下降＝物價在跌」。年增率下降只是漲得比較慢，物價水準仍在上升；物價下跌叫通縮。
  practice: '{month} CPI 年增 {cpi_y}%、月增 {cpi_m}%；核心 CPI 年增 {core_y}%。'
  source: BLS〈Consumer Price Index〉。
  quiz:
    q: CPI 年增率從 3% 降到 2.5%，代表？
    opts:
    - 物價下跌了 0.5%
    - 物價仍上漲，只是漲幅變小
    - 通縮開始
    ans: 1
    why: ''
core_cpi:
  title: 核心 CPI 與月步速
  section: 通膨
  one: 扣掉食物與能源的 CPI，看物價的基本趨勢。
  origin: 與 CPI 同一份報告。食物與能源受天氣、戰爭、OPEC 影響大，波動常與景氣無關，所以排除。
  read: 本站常用「月步速」：最近 3 個月或 6 個月的平均月增率年化，比年增率更快反映轉折。
  chain:
  - 核心月步速連續高於 0.3%
  - 通膨黏著
  - 聯準會延後降息或考慮升息。
  myth: 「核心 CPI 不含食物能源，所以跟生活無關」。核心反映的是需求與薪資推動的持續性壓力，正是貨幣政策能影響的部分。
  practice: 核心 CPI 月增 {core_m}%，3 個月年化 {core_3m}%，6 個月年化 {core_6m}%，年增 {core_y}%。
  source: BLS CPI。
  quiz:
    q: 核心月增連續三個月都是 0.3%，年化大約多少？
    opts:
    - 0.9%
    - 約 3.7%
    - 0.3%
    ans: 1
    why: 1.003 的 12 次方約 1.037。
cpi_vs_pce:
  title: CPI 與 PCE 的差異
  section: 通膨
  one: 兩個都量物價，但聯準會的目標用 PCE，而且 PCE 通常比 CPI 低一些。
  origin: PCE 物價指數由經濟分析局（BEA）在每月下旬公布，比 CPI 晚約兩週。差異來自三處：範圍（PCE 含雇主或政府替家庭支付的醫療費用）、權重（PCE 的住房權重較低）、公式（PCE 採連鎖加權，允許消費者在漲價時改買替代品）。
  read: CPI 與 PPI 公布後，分析師就能大致推算當月核心 PCE，所以 PCE 公布當天的驚奇通常較小。
  chain:
  - PCE 才是聯準會 2% 目標的依據
  - 兩者分歧時，以 PCE 為準。
  myth: 「CPI 降到 2% 就達標了」。CPI 通常比 PCE 高，兩者的落差會隨住房、醫療價格變化。
  practice: CPI 年增 {cpi_y}%，PCE 年增 {pce_y}%，差 {gap} 個百分點；核心兩者差 {core_gap}。
  source: BEA〈Personal Income and Outlays〉；BLS〈Differences between the CPI and PCE〉。
  quiz:
    q: PCE 通常比 CPI 低的主要原因之一是？
    opts:
    - PCE 不含服務
    - PCE 住房權重較低
    - PCE 只算城市
    ans: 1
    why: ''
core_pce:
  title: 核心 PCE
  section: 通膨
  one: 扣掉食物與能源的 PCE 物價，是聯準會最看重的單一通膨數字。
  origin: BEA 個人所得與支出報告。聯準會的經濟預測（SEP）也直接預測核心 PCE。
  read: 本站以核心 PCE 年增率相對 2% 的區間判斷通膨狀態，並用 3 個月年化確認方向（本站規則）。
  chain:
  - 核心 PCE 持續高於 2%
  - 實質政策利率需維持正值
  - 降息空間受限。
  myth: 「到 2% 就會馬上降息」。聯準會看的是能否「持續」留在 2%，也會同時看就業。
  practice: 核心 PCE 年增 {core_pce}%，3 個月年化 {core_pce_3m}%，SEP 年底預測 {sep_core}%。
  source: BEA；Federal Reserve SEP。
  quiz:
    q: 聯準會 SEP 預測的通膨指標包括？
    opts:
    - 只有 CPI
    - PCE 與核心 PCE
    - PPI
    ans: 1
    why: ''
  site_rule: true
supercore:
  title: Supercore（核心服務扣除住房）
  section: 通膨
  one: 服務業價格扣掉房租，最貼近薪資推動的通膨。
  origin: 由 CPI 或 PCE 分項自行計算，不是官方頭條數字。本站用 PCE 版本，看 3 個月年化（本站規則）。
  read: 醫療、保險、交通、休閒等服務，人力成本占比高；Supercore 降溫通常代表薪資壓力也在降。
  chain:
  - Supercore 連續數月放緩
  - 通膨降溫具持續性
  - 降息理由更充分。
  myth: 「Supercore 一個月跳升就代表通膨回來」。保險、機票等分項單月波動大，要看連續數月。
  practice: PCE Supercore 3 個月年化 {sc_3m}%、12 個月 {sc_y}%；本站降溫門檻 {low}%、升溫門檻 {high}%（本站規則）。
  source: 本站計算，資料來自 BEA。
  quiz:
    q: 為什麼要從核心服務中扣掉住房？
    opts:
    - 住房不重要
    - 住房價格反映市場租約的時間落後，會掩蓋其他服務的變化
    - 住房不屬於服務
    ans: 1
    why: ''
  site_rule: true
shelter:
  title: 住房通膨
  section: 通膨
  one: 房租與「自有住宅等值租金」的漲幅，是核心通膨最大的單一分項。
  origin: BLS 調查既有租約的租金；自有住宅等值租金（OER）是「如果把自己的房子租出去能收多少」的估算。因為大部分租約一年才更新一次，官方數字落後市場新租約大約一年。
  read: 用新簽租約的市場租金指數（例如民間租金指數、BLS 新租約研究指數）預判官方住房通膨的方向。
  chain:
  - 市場租金先降
  - 一年後官方住房通膨下降
  - 核心通膨下行
  - 降息空間增加。
  myth: 「房價上漲會直接推高 CPI」。CPI 不算房價，只算居住的服務成本（租金）。
  practice: 住房 CPI 年增 {shelter_y}%，月增 {shelter_m}%；對核心 CPI 的貢獻 {shelter_c} 個百分點。
  source: BLS〈How the CPI measures shelter〉。
  quiz:
    q: CPI 的住房分項主要衡量什麼？
    opts:
    - 房屋售價
    - 居住的租金成本
    - 房貸利率
    ans: 1
    why: ''
ppi:
  title: 生產者物價指數（PPI）
  section: 通膨
  one: 企業賣出商品與服務收到的價格。
  origin: BLS 每月在 CPI 前後公布，頭條為「最終需求」PPI。
  read: 除了看上游成本，PPI 的幾個分項（投資組合管理費、機票、醫療服務）會直接進入 PCE，所以是預估核心 PCE 的關鍵拼圖。
  chain:
  - PPI 的 PCE 相關分項偏高
  - 核心 PCE 預估上修
  - 降息預期降低。
  myth: 「PPI 上升一定會轉嫁到 CPI」。轉嫁程度取決於企業定價能力與需求，有時是由利潤吸收。
  practice: 最終需求 PPI 月增 {ppi_m}%，核心 PPI 月增 {core_ppi_m}%；本站據此推估核心 PCE 年增約 {pce_nowcast}%。
  source: BLS〈Producer Price Index〉。
  quiz:
    q: 為什麼市場看完 CPI 還要看 PPI 才能預估核心 PCE？
    opts:
    - PPI 部分分項直接用在 PCE
    - PCE 就是 PPI 的平均
    - 兩者無關
    ans: 0
    why: ''
contrib:
  title: 分項貢獻
  section: 通膨
  one: 整體通膨的漲幅，各分項各「出了多少力」。
  origin: 貢獻 ≈ 分項權重 × 分項漲幅。本站把核心通膨拆成核心商品、住房、Supercore 三塊。
  read: 同樣是 3% 的通膨，若主要來自住房（有落後、會自然回落），與主要來自 Supercore（薪資推動、較黏），對政策的意義不同。
  chain:
  - 通膨主要來自黏著性分項
  - 降溫較慢
  - 政策維持偏緊較久。
  myth: 「漲最多的分項就是主因」。權重小的分項漲很多，貢獻可能很小。
  practice: 這個月核心通膨漲幅貢獻最大的三項：{top_parts}，合計 {contrib_total} 個百分點。
  source: 本站計算，資料來自 BLS／BEA。
  quiz:
    q: 某分項權重 5%、漲 10%，對整體貢獻約？
    opts:
    - 10 個百分點
    - 0.5 個百分點
    - 5 個百分點
    ans: 1
    why: ''
breadth:
  title: 通膨廣度
  section: 通膨
  one: 漲價是集中在少數品項，還是普遍擴散。
  origin: 常見做法：截尾平均（剔除漲最多和漲最少的品項，如達拉斯聯準銀行截尾平均 PCE）、中位數 CPI（克里夫蘭聯準銀行），或計算漲幅高於某水準的分項比例。
  read: 頭條通膨與截尾或中位數差距大，代表被少數極端品項扭曲；廣度擴大代表通膨正在擴散。
  chain:
  - 漲價擴散
  - 通膨預期更容易鬆動
  - 聯準會更傾向維持偏緊。
  myth: 「頭條通膨下來就沒事」。若是靠少數品項大跌拉低，其他多數品項仍在漲。
  practice: 截尾平均 CPI {trim}%、中位數 CPI {median}%，核心 CPI 年增 {core_y}%。
  source: Dallas Fed Trimmed Mean PCE；Cleveland Fed Median CPI。
  quiz:
    q: 截尾平均的目的是？
    opts:
    - 只看能源
    - 降低少數極端品項的扭曲
    - 加權住房
    ans: 1
    why: ''
wage_services:
  title: 薪資到服務通膨
  section: 通膨
  one: 薪資成長如何轉成服務業價格上漲。
  origin: 服務業的成本以人力為主；薪資成長若高於「2% 通膨＋生產力成長」，企業較可能調高服務價格。
  read: 把平均時薪、ECI 年增與 Supercore 放在一起看；薪資先降、Supercore 隨後降，是典型的降溫順序。
  chain:
  - 勞動市場降溫
  - 薪資成長放緩
  - 服務通膨回落
  - 聯準會可降息。
  myth: 「加薪一定造成通膨」。若生產力同步成長，單位人力成本不變，就不會推高物價。
  practice: 時薪年增 {ahe_y}%、ECI 年增 {eci_y}%、Supercore 年增 {sc_y}%。
  source: 經濟學標準概念；資料來自 BLS。
  quiz:
    q: 生產力年增 1.5%，薪資年增多少大致與 2% 通膨相容？
    opts:
    - 約 3.5%
    - 約 2%
    - 約 0.5%
    ans: 0
    why: ''
real_consumption:
  title: 實質消費
  section: 通膨
  one: 扣掉物價上漲後，家庭實際多買了多少東西。
  origin: BEA 個人所得與支出報告；消費約占美國 GDP 七成。
  read: 名目消費成長可能只是漲價；實質消費才代表需求。也看個人儲蓄率——消費靠動用儲蓄撐起時，持續性較差。
  chain:
  - 實質消費強
  - 需求旺
  - 通膨壓力大、降息不急；實質消費轉弱
  - 需求降溫。
  myth: 「零售銷售成長＝消費強」。零售銷售是名目值，且大多是商品，不含多數服務。
  practice: 實質消費月增 {real_m}%、年增 {real_y}%；儲蓄率 {saving}%。
  source: BEA〈Personal Income and Outlays〉。
  quiz:
    q: 名目消費成長 4%、物價上漲 3%，實質消費約成長？
    opts:
    - 7%
    - 1%
    - 4%
    ans: 1
    why: ''
energy:
  title: 能源傳導
  section: 通膨
  one: 油價變化如何進入通膨。
  origin: 汽油直接在 CPI 內，油價一動，頭條 CPI 當月就反映；燃料成本再透過機票、運輸、物流慢慢傳到核心通膨。
  read: 油價大漲時先看頭條，再觀察幾個月後核心是否跟著上升（第二輪效應）。
  chain:
  - 油價上漲
  - 頭條通膨與短期通膨預期上升
  - 若擴散到核心，聯準會才會回應。
  myth: 「油價大漲聯準會一定升息」。能源衝擊同時拖累消費，聯準會通常先觀察是否擴散。
  practice: WTI 原油 {wti} 美元，月變動 {wti_m}%；能源 CPI 年增 {energy_y}%，對頭條貢獻 {energy_c} 個百分點。
  source: BLS CPI；EIA。
  quiz:
    q: 油價上漲最快出現在哪個數字？
    opts:
    - 核心 CPI
    - 頭條 CPI
    - 住房 CPI
    ans: 1
    why: ''
infl_expect:
  title: 通膨預期
  section: 通膨
  one: 家庭、專家與市場認為未來通膨會是多少。
  origin: 調查類：密西根大學消費者調查（1 年與 5–10 年）、紐約聯準銀行消費者預期調查。市場類：由公債與 TIPS 算出的損益兩平通膨率（見長端單元）。
  read: 短期預期跟著油價、食物價格動；聯準會更在意長期預期是否「錨定」在 2% 附近。
  chain:
  - 長期預期上升
  - 人們預先要求加薪、企業預先漲價
  - 聯準會必須更緊。
  myth: 「調查預期就是預測」。家庭調查容易受油價與政治立場影響，常和市場指標分歧。
  practice: 密西根 1 年 {mich1}%；5 年期損益兩平 {be5}%，5 年後 5 年遠期 {be5y5y}%。
  source: University of Michigan Surveys of Consumers；New York Fed SCE。
  quiz:
    q: 聯準會最在意哪一種通膨預期？
    opts:
    - 下個月的油價預期
    - 長期通膨預期是否維持穩定
    - 股市預期
    ans: 1
    why: ''
yields:
  title: 公債殖利率
  section: 長端與債務
  one: 買進美國公債並持有到期，每年可得的報酬率。
  origin: 財政部每日公布各天期的「平價殖利率曲線」（1 個月到 30 年）；市場即時報價則來自交易商。殖利率與價格反向：價格跌，殖利率升。
  read: 2 年期反映對未來兩年政策利率的預期；10 年期是房貸、企業債的定價基準；30 年期最受通膨與財政疑慮影響。
  chain:
  - 政策利率預期
  - 短端；成長、通膨、期限溢酬
  - 長端
  - 房貸利率、股市估值。
  myth: 「殖利率上升是好事，買債收更多」。對已持有的人，殖利率上升代表債券價格下跌。
  practice: 2 年 {y2}%、10 年 {y10}%、30 年 {y30}%；10 年期今日變動 {d10} bp，年初至今 {ytd10} bp。
  source: U.S. Treasury Daily Par Yield Curve；FRED DGS 系列。
  quiz:
    q: 10 年期殖利率從 4.0% 升到 4.3%，持有中的 10 年期公債價格會？
    opts:
    - 上漲
    - 下跌
    - 不變
    ans: 1
    why: ''
curve_spread:
  title: 殖利率曲線與利差
  section: 長端與債務
  one: 長短天期殖利率的差距，例如 10 年減 2 年、10 年減 3 個月。
  origin: 直接相減，單位為 bp（0.01 個百分點）。
  read: 正常情況長端高於短端（借越久要求越高報酬）；長端低於短端稱為「倒掛」，代表市場預期未來會降息。
  chain:
  - 預期降息
  - 短端下滑
  - 曲線變陡；預期升息
  - 短端上升
  - 曲線變平或倒掛。
  myth: 「倒掛當下就是衰退」。歷史上倒掛領先衰退的時間不一，而且衰退常發生在倒掛「解除」、曲線重新變陡之後；倒掛也曾出現而沒有隨後衰退。
  practice: 10 年減 2 年 {s2s10} bp、10 年減 3 個月 {s3m10} bp；一個月前分別為 {s2s10_m} 與 {s3m10_m}。
  source: FRED T10Y2Y、T10Y3M。
  quiz:
    q: 10 年期 4.2%、2 年期 4.5%，曲線是？
    opts:
    - 正斜率
    - 倒掛
    - 水平
    ans: 1
    why: ''
curve_shape:
  title: 曲線型態（牛陡、熊陡、牛平、熊平）
  section: 長端與債務
  one: 用「殖利率往哪走」與「曲線變陡或變平」兩個方向，描述利率曲線的移動。
  origin: 牛＝殖利率下降（債價上漲），熊＝殖利率上升。陡＝長短差擴大，平＝縮小。
  read: 牛陡常見於市場押注降息（短端降得多）；熊陡常見於通膨或財政疑慮推高長端；熊平常見於升息預期升溫；牛平常見於避險資金湧入長債。
  chain:
  - 哪一端主導，就代表驅動力來自政策預期（短端）還是期限溢酬、通膨、供給（長端）。
  myth: 「變陡就是好消息」。熊陡代表長端利率上升，對房貸與估值不利。
  practice: 過去 {window} 2 年期變動 {d2} bp、10 年期變動 {d10} bp，型態為 {regime}。
  source: 市場通用術語；分類為本站規則。
  quiz:
    q: 2 年期 −20 bp、10 年期 −5 bp，是哪一種？
    opts:
    - 牛陡
    - 熊平
    - 熊陡
    ans: 0
    why: 兩者都下降（牛），短端降更多，利差擴大（陡）。
  site_rule: true
longend_parts:
  title: 長端殖利率的組成
  section: 長端與債務
  one: 把 10 年期殖利率拆成「預期的平均政策利率」加上「期限溢酬」，或拆成「實質殖利率」加上「通膨補償」。
  origin: 第一種拆法需要模型估計（見期限溢酬）；第二種用 TIPS 直接觀察：名目殖利率 ≈ 實質殖利率 ＋ 損益兩平通膨率。
  read: 長端上升時，先問是哪一塊在升：政策預期上修？通膨補償上升？還是期限溢酬（對風險、供給、財政的要求）上升？
  chain:
  - 政策預期驅動
  - 聯準會能影響；期限溢酬驅動
  - 降息也壓不下長端。
  myth: 「長端上升＝市場預期升息」。也可能只是投資人要求更多風險補償。
  practice: 10 年期 {y10}% ＝ 實質 {real10}% ＋ 損益兩平 {be10}%；期限溢酬估計 {tp10}%。
  source: U.S. Treasury；FRED DFII10、T10YIE。
  quiz:
    q: 10 年期名目 4.3%、TIPS 實質 1.9%，損益兩平約？
    opts:
    - 6.2%
    - 2.4%
    - 1.9%
    ans: 1
    why: ''
term_premium:
  title: 期限溢酬
  section: 長端與債務
  one: 投資人為了「長期鎖住資金、承擔利率不確定」而要求的額外報酬。
  origin: 無法直接觀察，需用模型估計，常用紐約聯準會的 ACM 模型。
  read: 期限溢酬上升常與財政赤字擴大、公債供給增加、通膨不確定性升高、或海外買盤減弱有關。本站同時看水準與上升速度：真正讓殖利率失控的是「急升」（過去財政或供給事件時，單月升 45～97bp），水準偏高但穩定不算警訊。
  chain:
  - 期限溢酬 ↑
  - 長端殖利率 ↑
  - 房貸與企業融資成本 ↑，等於金融情勢自動收緊。
  myth: 「期限溢酬是一個確定的數字」。不同模型估計差異很大，看方向比看數值可靠。
  practice: ACM 10 年期期限溢酬 {tp10}%，一年前 {tp10_y}%。
  source: New York Fed〈Treasury Term Premia〉（Adrian, Crump, Moench）。
  quiz:
    q: 期限溢酬上升，最可能的原因是？
    opts:
    - 投資人對長期持有要求更多補償
    - 聯準會升息
    - 失業率下降
    ans: 0
    why: ''
tips:
  title: TIPS 與實質殖利率
  section: 長端與債務
  one: 本金隨 CPI 調整的抗通膨公債，其殖利率就是扣除通膨後的實質報酬。
  origin: 財政部發行，本金依 CPI-U 調整，票息按調整後本金計算。
  read: 實質殖利率代表「真正的借錢成本」；它升高時，對成長股、黃金等不付利息資產的估值壓力最大。
  chain:
  - 聯準會升息或期限溢酬上升
  - 實質殖利率 ↑
  - 金融情勢收緊。
  myth: 「TIPS 不會虧錢」。通膨保障的是本金購買力，但 TIPS 價格仍會隨實質利率上升而下跌。
  practice: 10 年期 TIPS 實質殖利率 {real10}%，年初至今變動 {real10_ytd} bp。
  source: TreasuryDirect〈TIPS〉；FRED DFII10。
  quiz:
    q: 實質殖利率上升，通常對哪類資產壓力最大？
    opts:
    - 現金
    - 黃金與成長股
    - 短期國庫券
    ans: 1
    why: ''
breakeven:
  title: 損益兩平通膨率
  section: 長端與債務
  one: 名目公債與 TIPS 殖利率的差，代表市場對未來平均通膨的定價。
  origin: 同天期名目殖利率 − TIPS 實質殖利率。
  read: 5 年期看中期，10 年期看長期；穩定在 2%～2.5% 附近通常被視為通膨預期「錨定」。
  chain:
  - 損益兩平上升
  - 市場擔心通膨
  - 聯準會較難降息。
  myth: 「損益兩平就是純粹的通膨預期」。它也包含通膨風險溢酬與 TIPS 流動性溢酬，市場動盪時 TIPS 流動性變差會讓它被低估。
  practice: 5 年期 {be5}%、10 年期 {be10}%；一個月變動 {be10_m} bp。
  source: FRED T5YIE、T10YIE。
  quiz:
    q: 名目 10 年 4.2%、TIPS 10 年 1.9%，損益兩平為？
    opts:
    - 2.3%
    - 6.1%
    - 1.9%
    ans: 0
    why: ''
forwards:
  title: 遠期利率（如 5 年後 5 年期）
  section: 長端與債務
  one: 由今天的殖利率曲線推算「未來某段期間」的隱含利率。
  origin: 例如 5y5y：用 5 年期與 10 年期殖利率推算 5 年後開始的 5 年期利率。損益兩平也可做相同計算，得到 5y5y 通膨預期。
  read: 遠期利率排除短期政策雜訊，反映長期均衡利率與長期通膨的看法；聯準會官員也會參考 5y5y 通膨預期。
  chain:
  - 5y5y 上升
  - 市場上修長期中性利率或長期通膨
  - 長端易漲難跌。
  myth: 「遠期利率是對未來的準確預測」。它含有期限溢酬，歷史上作為預測的準確度有限。
  practice: 名目 5y5y {fwd5y5y}%、通膨 5y5y {be5y5y}%。
  source: FRED T5YIFR（通膨 5y5y）。
  quiz:
    q: 5y5y 指的是？
    opts:
    - 5 年期利率乘以 5
    - 5 年後起算的 5 年期隱含利率
    - 過去 5 年平均
    ans: 1
    why: ''
auctions:
  title: 公債標售
  section: 長端與債務
  one: 財政部以拍賣方式發行新公債，結果好壞反映市場的承接意願。
  origin: 財政部事先公告日期與金額，拍賣以單一價格決標。重要指標：投標倍數（申購金額 ÷ 發行金額）、尾差（得標殖利率高於拍賣前市場水準，代表需求偏弱）、間接投標比重（多為海外與資產管理機構）、交易商承接比重（交易商是最後買家，比重高代表需求弱）。
  read: 長天期（10 年、20 年、30 年）標售最受關注；連續幾場尾差偏大，常推高期限溢酬。
  chain:
  - 標售疲弱
  - 長端殖利率上升
  - 曲線變陡。
  myth: 「投標倍數大於 1 就是成功」。幾乎每場都大於 2，要跟近期平均比較。
  practice: 最近一場 {tenor} 標售：投標倍數 {btc}（近 6 場平均 {btc_avg}），尾差 {tail} bp，交易商承接 {dealer}%。
  source: TreasuryDirect〈Auction Results〉。
  quiz:
    q: 交易商承接比重明顯上升，代表？
    opts:
    - 需求強勁
    - 終端投資人需求偏弱
    - 聯準會買進
    ans: 1
    why: ''
refunding:
  title: 財政部發行與季度再融資
  section: 長端與債務
  one: 財政部每季公布接下來要發多少債、發哪些天期。
  origin: 季度再融資（Quarterly Refunding）於 2、5、8、11 月公布：週一先公布借款需求估計，週三公布各天期發行規模與指引。
  read: 重點是長天期附息債規模是否增加、國庫券（短期）占比多少。多發長債會增加市場需吸收的存續期間。
  chain:
  - 長債供給增加
  - 期限溢酬 ↑
  - 長端殖利率 ↑；多發短券
  - 長端壓力較小，但會吸收貨幣市場資金。
  myth: 「赤字增加一定立刻推高殖利率」。關鍵在發行結構與市場承接，不只是總量。
  practice: 最近一次再融資公告 {last_refunding}；下次 {next_refunding}。
  source: U.S. Treasury〈Quarterly Refunding〉。
  quiz:
    q: 在同樣的借款總額下，哪種做法對長端殖利率壓力較小？
    opts:
    - 多發 30 年期
    - 多發國庫券
    - 停止發債
    ans: 1
    why: ''
buyback:
  title: 公債回購（Buyback）
  section: 長端與債務
  one: 財政部買回市場上已發行、交易較不活絡的舊公債。
  origin: 財政部定期公告回購時程與天期範圍，目的分為「流動性支持」（改善舊券流動性）與「現金管理」（平滑稅收季節的現金餘額）。
  read: 回購規模相對市場很小，主要影響是改善特定天期的交易流動性，並非量化寬鬆。
  chain:
  - 流動性改善
  - 長端流動性溢酬小幅下降；回購規模擴大若被解讀為支持長端，可能短暫壓低殖利率。
  myth: 「回購＝財政部在做 QE」。回購資金來自再發新債，整體淨供給不因此大幅減少。
  practice: 下次回購 {next_buyback}，天期 {range}，上限 {size} 億美元。
  source: U.S. Treasury〈Treasury Buybacks〉。
  quiz:
    q: 財政部公債回購的主要目的之一是？
    opts:
    - 降低政策利率
    - 改善舊券流動性
    - 增加貨幣供給
    ans: 1
    why: ''
fed_bs:
  title: 聯準會資產負債表與平均到期期限（WAM）
  section: 長端與債務
  one: 聯準會持有多少公債與房貸擔保證券，以及市場上流通公債平均多久到期。
  origin: 聯準會每週四公布 H.4.1 報表；資產縮減稱為量化緊縮（QT），擴張稱為量化寬鬆（QE）。WAM 為財政部可交易公債的加權平均到期期限，由財政部資料計算。
  read: 聯準會持債減少 → 私人部門要吸收更多存續期間。WAM 拉長代表市場承擔更多利率風險。
  chain:
  - QT 或 WAM 拉長
  - 期限溢酬上升壓力；QE 或縮短 WAM
  - 長端壓力減輕。
  myth: 「資產負債表縮小＝升息」。兩者是不同工具：利率管短端，資產負債表主要影響長端與準備金充裕度。
  practice: 聯準會持有公債 {treast} 兆美元，一年變動 {treast_y} 億美元。
  source: Federal Reserve H.4.1；U.S. Treasury Monthly Statement of the Public Debt。
  quiz:
    q: 聯準會資產負債表週報叫什麼？
    opts:
    - H.4.1
    - Beige Book
    - SEP
    ans: 0
    why: ''
credit_spread:
  title: 信用利差
  section: 長端與債務
  one: 企業債殖利率比同天期公債多出來的部分，代表投資人對違約風險的要求。
  origin: 常用 ICE 美銀投資等級（IG）與高收益（HY）指數的選擇權調整利差（OAS）。
  read: 利差擴大代表風險偏好下降、融資變難；利差很窄代表市場樂觀，但也代表緩衝很小。
  chain:
  - 利差擴大
  - 企業融資成本上升
  - 金融情勢收緊
  - 聯準會可能需更寬鬆。
  myth: 「公債殖利率下降，企業借錢就變便宜」。若同時利差大幅擴大，企業實際成本可能不降反升。
  practice: IG 利差 {ig} bp、HY 利差 {hy} bp；過去 5 年百分位 {ig_pct}%、{hy_pct}%。
  source: FRED BAMLC0A0CM、BAMLH0A0HYM2。
  quiz:
    q: 高收益債利差急遽擴大通常代表？
    opts:
    - 市場樂觀
    - 風險趨避升溫
    - 通膨下降
    ans: 1
    why: ''
fiscal:
  title: 政府財政（赤字與利息支出）
  section: 長端與債務
  one: 聯邦政府收支差額、為既有債務付出的利息，以及債務佔 GDP 怎麼變。
  origin: 財政部每月公布《每月財政報告》（MTS，現金赤字）；BEA 公布利息支出與名目 GDP；公眾持有債務（不含社安信託基金等政府內部持有）才是市場實際要吸收的部分。
  read: 債務率變化 ≈ 基本赤字率 ＋（r − g）× 債務率。r＝10 年期公債殖利率（新發債的成本）、g＝名目 GDP 年增。r 低於 g，成長能逐步消化既有債務；r 高於 g，就算收支平衡，債務比也會自我累積。要壓低債務率只有三條路：降低赤字、壓低利率、提高成長。
  chain:
  - 赤字擴大
  - 發債增加
  - 期限溢酬 ↑
  - 長端 ↑
  - 利息支出更高（自我強化）。
  myth: 「美國債務多就會違約」。美債以本國貨幣計價，主要風險是通膨與利率，而非傳統違約；但債務上限等政治事件會造成短期波動。
  practice: 公眾持有債務佔 GDP {pub_gdp}%、近 12 個月現金赤字佔 GDP {cash_def}%、利息支出佔稅收 {int_rev}%、r − g {rmg} 個百分點。
  source: U.S. Treasury Monthly Treasury Statement；BEA；FRED（FYGFGDQ188S、MTSDS133FMS）。
  quiz:
    q: r（利率）高於 g（名目成長）時，就算基本收支平衡，債務佔 GDP 會？
    opts:
    - 自我累積上升
    - 自動下降
    - 不變
    ans: 0
    why: 利息讓債務成長得比 GDP 快。
global_long:
  title: 全球長端殖利率
  section: 長端與債務
  one: 美國、德國、英國、日本、法國、加拿大、澳洲、中國等主要國家的 10 年期公債殖利率，與美債互相牽動。
  origin: 各國官方或市場的每日資料：美國財政部、德國央行（Bundesbank）、英國央行、日本財務省、加拿大央行、中國財政部（中債編製）；法國與澳洲用市場收盤報價。
  read: 看是「全球一起漲」還是「只有美國在漲」。全球同步多半是全球的財政與供給、通膨預期；只有美國漲，才是美國自己的問題。海外殖利率大幅上升，也會吸引原本買美債的資金（尤其日本投資人）回流本國，削弱美債需求。
  chain:
  - 海外長端 ↑
  - 跨國資金重新配置
  - 美國期限溢酬 ↑。
  myth: 「美債只看美國經濟」。全球債市高度連動，長端尤其明顯。
  practice: 各國 10 年期公債殖利率：{global_rows}。
  source: 美國財政部、Bundesbank、Bank of England、日本財務省、Bank of Canada、中國財政部；法國、澳洲為 CNBC 收盤報價。
  quiz:
    q: 日本長債殖利率大幅上升，對美債可能的影響是？
    opts:
    - 日本資金回流本國，美債需求下降
    - 美債殖利率必定下降
    - 沒有影響
    ans: 0
    why: ''
hyperscaler:
  title: 科技巨頭資本支出與發債
  section: 長端與債務
  one: 大型雲端業者（Hyperscaler）為 AI 資料中心投入的資本支出，以及為此發行的公司債。
  origin: 各公司季報公布資本支出與指引；發債資料來自公開發行紀錄。本站追蹤的是國際大型業者，不含個別台股。
  read: 資本支出持續上修代表 AI 投資熱度延續，帶動半導體與電力等供應鏈；大額發債會增加投資等級債供給。
  chain:
  - 大額發債
  - 投資等級債供給增加
  - 信用利差承壓；投資熱潮支撐成長
  - 對中性利率有上行壓力。
  myth: 「資本支出越大越好」。若營收跟不上，市場會開始質疑回報，反而打壓股價與信用。
  practice: '{hs_span} 主要業者資本支出合計 {capex_total} 十億美元、年增 {capex_yoy}%，同期發債 {hs_issued} 十億美元。'
  source: 各公司財報；本站整理。
  quiz:
    q: 科技巨頭大量發債，最直接影響哪個市場？
    opts:
    - 投資等級公司債
    - 台股融資
    - 原油期貨
    ans: 0
    why: ''
sofr:
  title: SOFR（擔保隔夜融資利率）
  section: 流動性
  one: 以公債為抵押品借一天錢的利率，是美元資金市場最主要的基準利率。
  origin: 紐約聯準會每個營業日美東上午公布前一日的數字，由每天數兆美元的公債附買回（repo）交易計算。LIBOR 停用後，大量貸款與衝生品以 SOFR 計價。
  read: 平時貼近政策區間；月底、季底、納稅日、公債交割日常短暫跳升，屬正常季節性。
  chain:
  - 政策利率
  - SOFR
  - 浮動利率貸款與利率交換。
  myth: 「SOFR 單日跳升就是資金危機」。要看是否持續、是否發生在非季節性日子。
  practice: SOFR {sofr}%，政策區間 {lower}%–{upper}%。
  source: New York Fed〈Secured Overnight Financing Rate〉。
  quiz:
    q: SOFR 的抵押品是什麼？
    opts:
    - 股票
    - 美國公債
    - 無抵押
    ans: 1
    why: ''
iorb_spread:
  title: IORB 與 SOFR−IORB 利差
  section: 流動性
  one: 聯準會付給銀行準備金的利率（IORB），以及市場附買回利率與它的差距。
  origin: IORB 由聯準會設定，通常在政策區間內。本站計算 SOFR 減 IORB。
  read: 準備金充足時，SOFR 低於 IORB；SOFR 持續高於 IORB，代表銀行體系現金變得不那麼寬裕，是聯準會調整資產負債表的重要參考。
  chain:
  - 利差轉正且擴大
  - 資金市場緊縮
  - 聯準會可能放慢或停止縮表、甚至買進短券補充準備金。
  myth: 「IORB 就是政策利率」。政策利率是聯邦基金利率目標區間，IORB 是引導它的工具。
  practice: SOFR {sofr}% − IORB {iorb}% = {spread} bp；近 20 日平均 {spread20} bp。
  source: Federal Reserve〈Interest on Reserve Balances〉；New York Fed。
  quiz:
    q: SOFR 連續數週高於 IORB，可能代表？
    opts:
    - 準備金非常充裕
    - 銀行體系現金轉緊
    - 聯準會即將升息
    ans: 1
    why: ''
onrrp:
  title: 隔夜逆回購（ON RRP）
  section: 流動性
  one: 貨幣市場基金等機構把錢「放在聯準會」過夜的工具，利率為政策區間下緣。
  origin: 紐約聯準會每天公布使用量。
  read: ON RRP 餘額是金融體系「多餘現金」的緩衝；當它接近零，之後的縮表或公債發行就會直接抽走銀行準備金。
  chain:
  - ON RRP 耗盡
  - 準備金開始下降
  - 資金市場利率容易跳升。
  myth: 「ON RRP 下降代表資金流入股市」。大多是轉去買國庫券或私人附買回。
  practice: ON RRP 餘額 {onrrp} 億美元，較一個月前 {onrrp_m}。
  source: New York Fed〈Reverse Repo Operations〉。
  quiz:
    q: ON RRP 利率在政策區間的哪裡？
    opts:
    - 上緣
    - 下緣
    - 正中間
    ans: 1
    why: ''
srf:
  title: 常設附買回機制（SRF）
  section: 流動性
  one: 合格機構可用公債等抵押品向聯準會借錢的常設窗口，利率為政策區間上緣。
  origin: 2021 年設立，紐約聯準會每天公布使用量。
  read: 平時幾乎不用；使用量增加，代表市場借不到比區間上緣更便宜的錢，是資金緊縮的訊號。
  chain:
  - SRF 用量上升
  - 資金壓力
  - 聯準會可能調整準備金供給。
  myth: 「用 SRF 的機構就是出問題」。設計本意就是讓使用不帶汙名，季底偶爾使用屬正常。
  practice: SRF 最新動用：{srf}。
  source: New York Fed〈Standing Repo Facility〉。
  quiz:
    q: SRF 的利率通常設在？
    opts:
    - 政策區間上緣
    - 下緣
    - 0%
    ans: 0
    why: ''
us_stocks:
  title: 美股指數
  section: 市場指標
  one: 標普 500、那斯達克綜合指數等，代表美國股市整體走勢。
  origin: 標普 500 以市值加權 500 家大型企業；那斯達克綜合指數科技股比重高。
  read: 本站可切換日變動、月初至今（MTD）、年初至今（YTD）；與利率一起看，分辨是「成長預期」還是「估值（利率）」在驅動。
  chain:
  - 實質利率 ↑
  - 未來現金流折現值 ↓
  - 高估值科技股受壓最大。
  myth: 「降息股市一定漲」。若降息是因為經濟轉弱，企業獲利下修可能抵消利率下降的好處。
  practice: 標普 500 {spx}，日變動 {spx_d}%，YTD {spx_ytd}%；那斯達克 {ixic}，YTD {ixic_ytd}%。
  source: S&P Dow Jones Indices；Nasdaq。
  quiz:
    q: 實質利率大漲時，哪類股票通常跌最多？
    opts:
    - 公用事業
    - 高估值成長股
    - 必需消費
    ans: 1
    why: ''
tw_stocks:
  title: 台股與台指期
  section: 市場指標
  one: 台灣加權股價指數，以及以它為標的的期貨（含夜盤）。
  origin: 加權指數由臺灣證券交易所編製；台指期在期貨交易所交易，夜盤可反映美股盤中的變化。
  read: 台股半導體權重高，與美國科技股、半導體指數連動強；夜盤走勢可預先看到隔天開盤方向。
  chain:
  - 美國實質利率與美元 ↑
  - 外資匯出、新台幣走弱
  - 台股承壓。
  myth: 「夜盤漲多少隔天就漲多少」。夜盤流動性較低，且開盤前仍可能有新消息。
  practice: 加權指數 {twii}，日變動 {twii_d}%；台指期 {txf}，{txf_chg}。
  source: 臺灣證券交易所；臺灣期貨交易所。
  quiz:
    q: 台股最大的產業權重通常是？
    opts:
    - 金融
    - 半導體
    - 航運
    ans: 1
    why: ''
vix:
  title: VIX 波動率指數
  section: 市場指標
  one: 由標普 500 選擇權價格推算的未來 30 天預期波動度，俗稱「恐慌指數」。
  origin: 芝加哥選擇權交易所（Cboe）即時計算。
  read: 數字代表年化波動率；VIX 20 大約意味市場預期未來一個月標普 500 的波幅約 ±5.8%（20 ÷ √12）。
  chain:
  - 避險升溫
  - VIX ↑
  - 資金流向公債
  - 殖利率下降（通常情況）。
  myth: 「VIX 高代表市場會跌」。VIX 量的是波動大小，不是方向；只是通常下跌時較容易飆升。
  practice: VIX {vix}，近一年百分位 {vix_pct}%。
  source: Cboe〈VIX Index〉。
  quiz:
    q: VIX 是由什麼計算的？
    opts:
    - 過去 30 天股價波動
    - 標普 500 選擇權價格
    - 交易量
    ans: 1
    why: ''
move:
  title: MOVE 指數
  section: 市場指標
  one: 公債市場的 VIX，衡量市場預期美債殖利率的波動幅度。
  origin: ICE 美銀 MOVE 指數，由各天期公債選擇權的隱含波動率計算，單位為 bp。
  read: MOVE 高，代表利率前景不確定（如聯準會方向不明、財政疑慮）；利率波動大會讓投資人要求更高期限溢酬。
  chain:
  - MOVE ↑
  - 持有公債風險 ↑
  - 期限溢酬 ↑；也常帶動股市波動。
  myth: 「公債很安全，波動不重要」。公債是全球資產定價的基礎，它的波動會傳到所有市場。
  practice: MOVE {move}，年初至今 {move_ytd}%；VIX {vix}。
  source: ICE BofA MOVE Index。
  quiz:
    q: MOVE 指數衡量什麼的預期波動？
    opts:
    - 美元
    - 美國公債殖利率
    - 原油
    ans: 1
    why: ''
oil:
  title: 原油
  section: 市場指標
  one: 西德州原油（WTI）與布蘭特原油的期貨價格。
  origin: WTI 在紐約商品交易所、布蘭特在 ICE 交易；以近月合約為報價。
  read: 供給面（OPEC+、地緣政治）與需求面（全球成長）都會影響；要分辨油價上漲是供給衝擊還是需求強勁。
  chain:
  - 油價 ↑
  - 頭條通膨與損益兩平 ↑
  - 長端殖利率上行壓力（詳見「能源傳導」）。
  myth: 「油價上漲代表經濟好」。供給中斷造成的漲價反而是經濟的負擔。
  practice: WTI {wti} 美元（YTD {wti_ytd}%），布蘭特 {brent} 美元。
  source: CME NYMEX；ICE；EIA。
  quiz:
    q: 由戰爭造成的油價上漲，對經濟的影響通常是？
    opts:
    - 推高通膨、拖累成長
    - 只有好處
    - 沒有影響
    ans: 0
    why: ''
gold:
  title: 黃金
  section: 市場指標
  one: 不付利息的傳統避險資產，常反映實質利率、美元與地緣風險。
  origin: 以紐約期貨或倫敦現貨報價（每盎司美元）。
  read: 傳統上與實質利率反向（持有黃金的機會成本就是實質利率）；但近年央行購金大增，使這個關係時常失效。
  chain:
  - 實質利率 ↓ 、美元 ↓
  - 黃金 ↑（傳統關係）。
  myth: 「黃金是抗通膨的，通膨高就一定漲」。短中期它更受實質利率與資金流向影響。
  practice: 黃金 {gold} 美元，YTD {gold_ytd}%；10 年實質殖利率 {real10}%。
  source: LBMA；CME COMEX；World Gold Council。
  quiz:
    q: 持有黃金的「機會成本」最接近哪個？
    opts:
    - 實質利率
    - 股市報酬
    - 油價
    ans: 0
    why: ''
dxy:
  title: 美元指數（DXY）
  section: 市場指標
  one: 美元相對六種主要貨幣的強弱。
  origin: ICE 編製，歐元權重最大（約五成以上），其餘為日圓、英鎊、加幣、瑞典克朗、瑞士法郎。
  read: 因為歐元權重大，DXY 幾乎是「歐元的反面」；未包含人民幣與新台幣，看亞洲要另外看匯率。
  chain:
  - 美國相對海外利差擴大
  - 資金流入美元
  - DXY ↑。
  myth: 「DXY 代表美元對所有貨幣」。它只含六種，而且權重很久沒改。
  practice: DXY {dxy}，日變動 {dxy_d}%，YTD {dxy_ytd}%。
  source: ICE U.S. Dollar Index。
  quiz:
    q: DXY 中權重最大的貨幣是？
    opts:
    - 日圓
    - 歐元
    - 人民幣
    ans: 1
    why: ''
fx:
  title: 匯率（歐元、日圓、離岸人民幣、新台幣）
  section: 市場指標
  one: 主要貨幣對美元的價格。
  origin: 即時市場報價。注意報價方向：EUR/USD 是一歐元換多少美元（數字上升＝歐元升值）；USD/JPY、USD/CNH、USD/TWD 是一美元換多少外幣（數字上升＝美元升值）。CNH 是在香港等地自由交易的離岸人民幣。
  read: 日圓對美日利差敏感；人民幣反映中國經濟與政策；新台幣受外資進出台股影響大。
  chain:
  - 美國利率 ↑
  - 美元對低利率貨幣（如日圓）升值；美國降息
  - 利差縮小
  - 美元轉弱。
  myth: 看到 USD/JPY 上升就以為日圓升值。其實是日圓貶值。
  practice: EUR/USD {eurusd}、USD/JPY {usdjpy}、USD/CNH {usdcnh}、USD/TWD {usdtwd}。
  source: 市場報價。
  quiz:
    q: USD/JPY 從 145 變成 150，代表？
    opts:
    - 日圓升值
    - 日圓貶值
    - 美元貶值
    ans: 1
    why: ''
election:
  title: 期中選舉預測市場
  section: 市場指標
  one: 用「下注合約」的價格推算各政黨拿下眾議院、參議院的機率。
  origin: 預測市場平台上，每口合約結果成立時值 1 美元，價格 0.62 大約代表 62% 機率。
  read: 看「國會控制權組合」（一黨全拿或分立），因為它影響財政、稅制與債務上限政策的可行性。
  chain:
  - 一黨全拿
  - 大規模財政法案較易通過
  - 赤字與發債預期 ↑
  - 期限溢酬 ↑；分立政府
  - 財政僵局可能性 ↑。
  myth: 「機率 70% 就是幾乎確定」。仍有三成會發生的可能，且預測市場受參與者結構影響。
  practice: 眾議院 {house_lead} 勝率 {house_p}%、參議院 {senate_lead} 勝率 {senate_p}%；距選舉 {days_to} 天。
  source: 預測市場平台公開報價。
  quiz:
    q: 預測市場合約價格 0.35 代表？
    opts:
    - 約 35% 機率
    - 35 張選票
    - 35 席
    ans: 0
    why: ''
calendar:
  title: 經濟數據行事曆與市場預估
  section: 數據日程
  one: 接下來哪天公布哪些數據、市場預期是多少。
  origin: 公布時間來自各統計機關的發布日曆；「市場預估」是多位經濟學家預測的共識值。本站一律換算成台灣時間：美東 8:30 在美國夏令時間是台灣 20:30，冬令時間是 21:30。
  read: 市場反應的是「實際值與預估的差」，不是數字本身。本站可篩選「數據」「發債」「官員談話」三類。
  chain:
  - 實際值優於預估（就業強、通膨高）
  - 降息預期 ↓
  - 短端殖利率 ↑。
  myth: 「數據很好，市場就應該漲」。若預估本來更好，「好數據」也可能是利空；這類相反反應就是「不如預期」。
  practice: 接下來最重要的發布：{event1}（台灣時間 {time1}）、{event2}（{time2}）。
  source: BLS、BEA、DOL 發布日曆；預估來自公開經濟日曆。
  quiz:
    q: 美國冬令時間時，美東 8:30 是台灣幾點？
    opts:
    - '20:30'
    - '21:30'
    - '22:30'
    ans: 1
    why: 美東冬令比台灣慢 13 小時。
auction_cal:
  title: 公債標售與回購日程
  section: 數據日程
  one: 接下來哪天有哪些公債標售與回購，以及各自的規模。
  origin: 財政部 TreasuryDirect 的近期標售公告；更遠的日期來自每季公布的「暫定標售時程表」與回購時程表。金額在正式公告前只是暫定。
  read: 同一週若集中 10 年、20 年、30 年期標售（例如再融資週），長端供給壓力較大；結果公布時間通常是美東 13:00。
  chain:
  - 大量長天期標售前
  - 市場常先賣出騰出空間（「標前賣壓」）
  - 殖利率短暫上升。
  myth: 「標售金額大就一定不好」。重點是金額變化與標售結果，而非單場規模。
  practice: 接下來排定 {n_auctions} 場公債標售；下一場長天期：{next_long}。
  source: TreasuryDirect〈Upcoming Auctions〉、〈Tentative Auction Schedule〉；U.S. Treasury Buyback Schedule。
  quiz:
    q: 暫定標售時程表上的金額？
    opts:
    - 已經確定
    - 正式公告前可能調整
    - 是去年的金額
    ans: 1
    why: ''
# ---------------------------------------------------------------------------
# 流動性（2026-10）：流動性頁的政策架構、工具、判讀邏輯。各頁的「完整教學」連到這裡。
# ---------------------------------------------------------------------------
liq_corridor:
  title: 利率走廊（Fed 怎麼控制利率）
  section: 流動性
  one: Fed 用幾個「行政利率」把市場隔夜利率框在目標區間裡：上方是 IORB 與 SRF 利率，下方是 ON RRP 利率。
  origin: 2008 年後準備金大增，Fed 不再每天調整準備金數量，改設定三個價格：付給銀行準備金的 IORB、收受閒置資金的 ON RRP 利率（地板）、借出資金的 SRF 利率（天花板）。市場利率（EFFR、SOFR）由供需決定，但被這些價格夾住。
  read: 看市場利率在走廊裡的位置。SOFR、EFFR 貼在 IORB 下方幾個 bp 是常態；SOFR 高過 IORB 代表準備金偏緊；碰到 SRF 利率代表市場借不到錢、要靠 Fed。
  chain:
  - 準備金變少
  - SOFR 往 IORB、SRF 利率靠近
  - 機構動用 SRF
  - Fed 補準備金（RMP）。
  myth: 「Fed 直接規定市場利率」。Fed 只設定自己願意借出、收受資金的價格，市場利率是交易出來的，只是被這些價格夾在區間內。
  practice: SOFR − IORB 近 20 日平均 {spread20}bp；SRF 最新動用 {srf}。
  source: Federal Reserve Board〈Policy Tools〉；New York Fed〈Monetary Policy Implementation〉。
  quiz:
    q: 哪一個是利率走廊的「地板」？
    opts:
    - IORB
    - ON RRP 利率
    - SRF 利率
    ans: 1
    why: 有閒錢的機構可以把錢放在 Fed 的 ON RRP 拿到這個利率，就不會用更低的價格借給別人。
ample_reserves:
  title: 準備金的三種狀態與充足準備金框架
  section: 流動性
  one: 依準備金多寡，需求曲線分成稀缺、充足、充裕三段；Fed 的政策是把準備金維持在「充足」。
  origin: 紐約聯儲用「準備金需求曲線」描述：稀缺時曲線很陡，準備金少一點利率就大跳；充足時曲線平緩，日常增減只讓利率小動；充裕時完全平坦。FOMC 2019 年 1 月宣布長期採行充足準備金框架。
  read: 看準備金占銀行資產的比例與 RDE：比例高、RDE 接近 0＝充裕；比例下滑、RDE 轉負＝往稀缺靠近。流通在外貨幣與 TGA 會長期成長、吃掉準備金，所以 Fed 停止縮表後要用 RMP 補回。
  chain:
  - 其他負債（現金、TGA）成長
  - 準備金被吃掉
  - 往稀缺滑動
  - Fed 以 RMP 買國庫券補回。
  myth: 「準備金越多越好」。太多代表 Fed 資產負債表過大（期限風險、對市場的扭曲）；Fed 要的是剛好充足，不是越多越好。
  practice: 準備金占銀行總資產 {reserve_ratio}%；RDE {rde}，紐約聯儲判讀「{rde_view}」。
  source: FOMC〈Statement Regarding Monetary Policy Implementation and Balance Sheet Normalization〉(2019-01-30)；New York Fed Staff Report 1019。
  quiz:
    q: 準備金在「充足」區時，日常的準備金增減對政策利率的影響？
    opts:
    - 很大，要每天調整
    - 很小，靠行政利率就能控制
    - 完全沒有影響
    ans: 1
    why: 完全沒影響的是「充裕」區；充足區曲線平緩但仍有一點斜度。
reserves:
  title: 銀行準備金與貨幣乘數
  section: 流動性
  one: 商業銀行存在 Fed 的存款，是銀行間付款清算的最終工具，也是整個信用體系的地基。
  origin: Fed 對準備金支付 IORB。2020 年 3 月起法定準備率降為 0，銀行持有多少準備金改由流動性需求與監管決定。數字在 Fed 每週四公布的 H.4.1。
  read: 看水位與占銀行資產的比例；水位下滑、占比跌向 10% 時，回購市場容易出現壓力（2019 年 9 月）。現金、TGA、ON RRP 增加都會等量擠壓準備金。
  chain:
  - 準備金減少
  - 銀行惜借、回購利率上升
  - 放款與信用收縮。
  myth: 「準備金多，銀行就一定多放款」。準備金充足時，放款更受資本、監管比率與貸款需求限制；貨幣乘數（例如準備率 10% 時 1 元撐 10 元存款）是理論上限，不是機械關係。
  practice: 最新準備金 {reserves} 兆美元，一個月變化 {reserves_m1} 億美元。
  source: Federal Reserve Board H.4.1。
  quiz:
    q: 法定準備率 10% 時，理論上 1 元準備金最多支撐幾元存款？
    opts:
    - 1 元
    - 10 元
    - 100 元
    ans: 1
    why: 1 ÷ 10%＝10 倍，這就是貨幣乘數的上限。
tga:
  title: 財政部一般帳戶（TGA）
  section: 流動性
  one: 財政部在 Fed 的支票帳戶；餘額增加會等量抽走市場上的準備金（或 ON RRP）。
  origin: 稅收、發債收入流入，政府支出流出。財政部每季再融資（QRA）公布季底目標餘額；數字在 Fed 每週 H.4.1 與財政部每日國庫報表（DTS）。
  read: TGA 上升＝錢從銀行體系流進 Fed，準備金或 ON RRP 減少；下降＝把錢還給市場。4、6、9、12 月繳稅日，以及債務上限解除後的回補期特別明顯。
  chain:
  - 稅收／發債
  - TGA 上升
  - 準備金（或 ON RRP）下降
  - 資金變緊。
  myth: 「財政部發債只影響長端」。發 T-Bills 回補 TGA，一樣會從短端抽走資金。
  practice: TGA 目前 {tga} 億美元，本季季底目標 {tga_target} 億美元。
  source: Federal Reserve Board H.4.1；U.S. Treasury Quarterly Refunding。
  quiz:
    q: 其他條件不變，TGA 增加 1,000 億美元，準備金＋ON RRP 會？
    opts:
    - 增加約 1,000 億
    - 減少約 1,000 億
    - 不變
    ans: 1
    why: Fed 資產端不變時，負債端加總不變，TGA 多一塊，其他負債就少一塊。
reserve_ratio:
  title: 準備金 ÷ 商業銀行總資產
  section: 流動性
  one: 銀行資產中最高流動性的準備金占比，衡量準備金夠不夠用。
  origin: 本站以 H.4.1 準備金除以 H.8 全體商業銀行總資產（季調、週資料）；紐約聯儲估算 RDE 用的也是這個分母。
  read: 13% 以上寬鬆（紐約聯儲發現此時 RDE 幾乎為 0）；10%–13% 留意；跌破 10% 是 2019 年 9 月回購危機時的水位（週資料最低約 7.9%）。
  chain:
  - 占比下降
  - 銀行為湊足清算所需的準備金互搶資金
  - 回購利率跳升。
  myth: 「看準備金金額就夠了」。銀行體系每年在長大，同樣金額的寬鬆程度不同，要看比例。
  practice: 最新占比 {reserve_ratio}%（{reserve_ratio_date}），半年前 {reserve_ratio_6m}%。
  source: Federal Reserve Board H.4.1、H.8；New York Fed〈Reserve Demand Elasticity〉FAQ。
  site_rule: true
  quiz:
    q: 2019 年 9 月回購危機時，這個比例大約是？
    opts:
    - 約 8%
    - 約 13%
    - 約 18%
    ans: 0
    why: 週資料最低約 7.9%（2019/9/18 當週）。
rde:
  title: 準備金需求彈性（RDE）
  section: 流動性
  one: 準備金增加相當於銀行總資產 1% 時，聯邦資金利率相對 IORB 會變動幾 bp；越負代表越接近稀缺。
  origin: 紐約聯儲每月第三個週四更新，檔內是約每 5 個營業日一筆的即時估計；方法來自 Afonso、Giannone、La Spada、Williams。
  read: 看中位數與 95% 信賴區間：區間含 0＝充裕；整段小於 0＝已在需求曲線的斜坡上；2019 年 9 月約 −1.4。
  chain:
  - RDE 轉負
  - 利率開始對準備金增減敏感
  - 準備金往稀缺靠近
  - Fed 需要補準備金。
  myth: 「RDE 是即時數字」。一個月更新一次，而且是統計估計，要看信賴區間，不能只看中位數。
  practice: 最新 RDE {rde}，95% 信賴區間 {rde_ci}。
  source: New York Fed〈Reserve Demand Elasticity〉；Staff Report 1019。
  quiz:
    q: RDE 接近 0 代表？
    opts:
    - 準備金充裕，利率不在乎準備金增減
    - 準備金稀缺
    - Fed 剛升息
    ans: 0
    why: ''
rmp:
  title: 準備金管理購買（RMP）與 MBS 再投入
  section: 流動性
  one: Fed 在次級市場買短天期國庫券，補上被其他負債吃掉的準備金、維持在充足區；不是 QE。
  origin: Fed 2025 年 12 月停止縮表後開始 RMP。紐約聯儲每月中公布下一期 RMP 與 MBS 到期再投入的計畫金額（Treasury Securities Operational Details），只跟一級交易商交易。
  read: RMP 金額提高＝Fed 認為準備金需要補；暫停＝暫時夠用。MBS 到期本金一律轉買國庫券；Fed 持有的公債到期不在此列。
  chain:
  - RMP 買國庫券
  - 準備金增加
  - 回購利率回落。
  myth: 「RMP 就是 QE」。QE 買長天期債券、壓低長端利率；RMP 只買短天期國庫券、管理準備金水位。
  practice: 最新一期（{rmp_period}）RMP {rmp} 億美元、MBS 再投入 {rmp_mbs} 億美元。
  source: New York Fed〈Treasury Securities Operational Details〉、〈Reserve Management Purchases FAQ〉。
  quiz:
    q: RMP 主要買什麼？
    opts:
    - 長天期公債
    - 短天期國庫券
    - 股票
    ans: 1
    why: ''
tgcr:
  title: TGCR（三方一般擔保利率）
  section: 流動性
  one: 三方回購（tri-party）裡、以公債為擔保的隔夜利率，主要反映貨幣基金把現金借給交易商的價格。
  origin: 紐約聯儲每天公布。它是 SOFR 的一部分——SOFR 還包含 FICC 集中清算的雙邊回購，樣本更大。
  read: TGCR 通常比 SOFR 低幾 bp；連 TGCR 都高過 IORB，代表現金提供端（貨幣基金）也變緊。
  chain:
  - 貨幣基金現金減少
  - TGCR 上升
  - 交易商融資變貴。
  myth: 「TGCR 和 SOFR 一樣」。TGCR 樣本較小、不含集中清算交易，兩者的差反映不同管道的鬆緊。
  practice: TGCR − IORB 近 5 日平均 {tgcr_iorb}bp。
  source: New York Fed〈Reference Rates〉。
  quiz:
    q: TGCR 和 SOFR 的關係？
    opts:
    - TGCR 是 SOFR 的一部分
    - 兩者無關
    - SOFR 是 TGCR 的一部分
    ans: 0
    why: ''
repo:
  title: 回購市場（RP／RRP）
  section: 流動性
  one: 以公債為抵押的短期借貸，是美元流動性最核心的管線：交易商、避險基金借錢，貨幣基金與銀行出借現金。
  origin: 每天成交量以兆美元計（SOFR 成交量遠大於 EFFR）。Fed 的 RP 是把錢借給市場（注入流動性），RRP 是向市場收回資金（抽走流動性）。
  read: 回購利率上升時，靠回購融資的槓桿部位成本上升；典型是「基差交易」——買現貨公債、放空期貨，用回購借錢支應。
  chain:
  - 回購利率上升
  - 槓桿部位融資變貴
  - 被迫賣出公債
  - 公債流動性惡化。
  myth: 「回購是長期借款」。大部分是隔夜，每天都要重新借，所以資金一緊就馬上反映在價格上。
  practice: 最新 SOFR 單日成交量 {sofr_vol}，約是 EFFR 的 {sofr_effr_ratio}。
  source: New York Fed〈Reference Rates〉、〈Repo and Reverse Repo Operations〉。
  quiz:
    q: Fed 做 RP（正回購）時，對市場是？
    opts:
    - 注入流動性
    - 抽走流動性
    - 沒有影響
    ans: 0
    why: Fed 收下公債、把資金借給市場。
bills_net:
  title: T-Bills 淨發行與私人市場吸收
  section: 流動性
  one: T-Bills 發行減掉到期贖回才是新增的供給；再扣掉 Fed 買走的部分，就是貨幣市場要自己拿出來的現金。
  origin: 淨發行看財政部 MSPD 月底存量變化（當月用每日國庫報表），Fed 購買看紐約聯儲成交紀錄；財政部每季再融資（QRA）公布借款估計。
  read: 私人市場淨吸收越大，越會把錢從回購與 ON RRP 抽走；4、9 月等稅收月常是淨贖回，私人市場拿回現金。每週數千億美元的毛發行大多只是借新還舊。
  chain:
  - T-Bills 淨發行增加
  - 貨幣基金把錢從回購／ON RRP 移去買 Bills
  - 回購的現金供給減少。
  myth: 「每週拍賣規模越大，資金越緊」。毛額大多是借新還舊，要看淨發行。
  practice: '{bill_net_month} T-Bills 淨發行 {bill_net} 億美元，私人市場淨吸收 {bill_priv} 億美元；本季再融資隱含淨發行約 {qra_bills} 億美元。'
  source: U.S. Treasury MSPD、DTS、Quarterly Refunding；New York Fed。
  site_rule: true
  quiz:
    q: 毛發行 4,000 億、同期到期 3,800 億、Fed 買 50 億，私人市場要淨吸收？
    opts:
    - 4,000 億
    - 200 億
    - 150 億
    ans: 2
    why: 4,000 − 3,800 − 50＝150 億。
mmf:
  title: 貨幣市場基金（MMF）
  section: 流動性
  one: 回購市場最大的現金借出方、T-Bills 最大的買家；它的錢往哪走，貨幣市場的流動性就在哪。
  origin: 分 Treasury、Government、Prime 三類，每月向 SEC 申報 Form N-MFP；SEC 與 OFR 彙整流量、收益率、持有部位與加權平均到期天數（WAM）。
  read: 看四件事——資金流向（流入代表更多現金找短期出路）、收益率對銀行存款的優勢、WAM（拉長＝押注降息，縮短＝防範升息、資金留在隔夜）、部位配置（ON RRP、回購、T-Bills 之間的移動）。
  chain:
  - MMF 縮短期限、留在隔夜
  - 隔夜回購的現金供給增加
  - 短端資金穩定。
  myth: 「MMF 資產創新高代表股市資金充沛」。MMF 的錢主要在貨幣市場打轉，反映的是短端利率吸引力與避險需求。
  practice: '{mmf_month} MMF 淨流量 {mmf_flow} 億美元；Government MMF 7 日淨收益率 {mmf_yield}%、平均到期 {mmf_wam} 天。'
  source: SEC〈Money Market Fund Statistics〉；OFR〈U.S. Money Market Fund Monitor〉。
  quiz:
    q: Government MMF 的 WAM 快速縮短，通常代表？
    opts:
    - 押注降息
    - 防範升息或不確定性升高
    - 股市要大漲
    ans: 1
    why: 預期降息時才會拉長期限鎖住收益。
liq_tools:
  title: 其他流動性管理工具（貼現窗口、FIMA、換匯額度）
  section: 流動性
  one: Fed 對不同對象的後援：銀行用貼現窗口，外國央行用 FIMA 回購與央行換匯額度。
  origin: 貼現窗口是最傳統的最後貸款人工具；FIMA 回購 2021 年常設化，讓外國央行拿持有的美國公債換美元；換匯額度讓外國央行不必持有美元資產也能借到美元。
  read: 平時幾乎不用；這些工具的用量突然上升，代表銀行或海外的美元缺口浮現，通常伴隨市場壓力。
  chain:
  - 美元融資壓力
  - 動用貼現窗口／FIMA／換匯額度
  - Fed 把美元送到需要的地方。
  myth: 「動用就代表有機構要倒」。工具設計就是要讓壓力時有地方借錢，避免被迫拋售資產。
  practice: ''
  source: Federal Reserve Board〈Policy Tools〉；New York Fed〈FIMA Repo Facility〉、〈Central Bank Liquidity Swaps〉。
  quiz:
    q: 外國央行想用手上的美國公債換美元，可以用？
    opts:
    - FIMA 回購
    - SRF
    - 貼現窗口
    ans: 0
    why: ''
liq_judge:
  title: 流動性怎麼判斷（本站的判讀邏輯）
  section: 流動性
  one: 看三個核心指標——價格（SOFR − IORB）、後援（SRF 動用量）、緩衝（ON RRP）——再用準備金、MMF、T-Bills 供給輔助判斷。
  origin: 價格最先反應；後援被動用代表已經不只是變貴；緩衝決定下一次抽水（T-Bills 淨發行、TGA 回補、季底）先吃閒置現金，還是直接扣到準備金。
  read: 判定四級：SOFR 衝出 SRF 利率＝嚴重轉緊；核心指標警戒或 SRF 連續動用＝轉緊；核心平靜但緩衝見底、準備金偏低＝穩定但緩衝偏薄；全部正常＝充裕穩定。
  chain:
  - 價格（SOFR − IORB）
  - 後援（SRF）
  - 緩衝（ON RRP）
  - 綜合判定。
  myth: 「只看 SOFR 一天的數字」。季底、繳稅日常有一兩天的跳動，要看近 5 日對近 30 日的趨勢。
  practice: 目前綜合判定：{liq_verdict}（{liq_reason}）。
  source: 本站整理（門檻依 2019 年 9 月回購危機與 2025 年第四季準備金轉緊校準）。
  site_rule: true
  quiz:
    q: 三個核心指標裡，哪一個代表「緩衝」？
    opts:
    - SOFR − IORB
    - SRF 動用量
    - ON RRP 交易量
    ans: 2
    why: ''
liq_transmission:
  title: 流動性緊缺的跨資產傳導
  section: 流動性
  one: 準備金不足時，回購利率飆升會迫使槓桿部位去化，從貨幣市場擴散到公債、信用、股市與美元。
  origin: 2019 年 9 月回購利率一天跳到 5% 以上；2020 年 3 月公債市場流動性崩壞，連最安全的資產都被拋售，Fed 被迫大量介入。
  read: 先看貨幣市場（SOFR、SRF），再看公債流動性與信用利差、美元融資（換匯基差、換匯額度用量）；Fed 出手前，資產價格往往已先修正一輪。現在 Fed 有更多常設工具，非黑天鵝情境下發生機率較低。
  chain:
  - 準備金與緩衝不足
  - 回購利率飆升
  - 槓桿部位被迫去化
  - 公債流動性惡化
  - 信用、股市、美元同步承壓。
  myth: 「流動性危機一定伴隨經濟衰退」。2019 年 9 月是純粹的管線問題，基本面並沒有惡化。
  practice: ''
  source: 本站整理；New York Fed、Federal Reserve Board 相關研究。
  quiz:
    q: 流動性緊縮時，公債殖利率一定下降嗎？
    opts:
    - 一定下降（避險買盤）
    - 不一定，被迫賣出時殖利率可能上升
    - 一定上升
    ans: 1
    why: 2020 年 3 月就是被迫賣出讓公債殖利率上升。
positioning:
  title: 公債期貨持倉與 DV01
  section: 長端與債務
  one: 看公債期貨上「誰在做多久期、誰在做空」：資產管理、槓桿基金、交易商各自的淨部位，換算成殖利率每變動 1bp 的損益（DV01）。
  origin: 美國商品期貨交易委員會（CFTC）每週五公布週二的「金融期貨交易者」報告，把每檔期貨的持倉分成交易商、資產管理、槓桿基金、其他。本站把六檔公債期貨（2 年到超長債）的淨口數乘上每口的近似 DV01 加總。
  read: 資產管理（退休金、債券基金）通常用期貨做多久期；對手過去主要是槓桿基金的基差交易（買現券、空期貨），近年有更多由交易商承接。看「交易商佔兩者淨空的比重」就知道對手是誰——交易商不像槓桿基金會在保證金升高時被迫平倉，比重高代表踩踏風險較低。
  chain:
  - 資產管理多單 ↑
  - 對手若是槓桿基金，波動放大時可能被迫平倉
  - 公債流動性惡化、殖利率急升；對手若是交易商，衝擊較小。
  myth: 「期貨部位只是投機」。資產管理用期貨調整存續期間，是正常的資產配置；重點是對手能不能撐住。
  practice: 交易商佔淨空 DV01 的比重 {dlr_share}（一年前 {dlr_share_y}）；最新淨 DV01：資產管理 {am_dv01}、槓桿基金 {lev_dv01}、交易商 {dlr_dv01}（百萬美元／bp）。
  source: CFTC〈Traders in Financial Futures〉；DV01 為本站近似換算。
  quiz:
    q: 公債期貨的淨空方由槓桿基金轉向交易商，通常代表？
    opts:
    - 基差交易被迫平倉的風險相對下降
    - 公債一定會漲
    - 聯準會在買期貨
    ans: 0
    why: 交易商不像槓桿基金那樣在保證金升高時被迫平倉。
eslr:
  title: 補充槓桿率（eSLR）
  section: 長端與債務
  one: 銀行的第一類資本除以總槓桿曝險、不看風險權重；美國大型銀行另有加碼要求（強化版，eSLR）。
  origin: 2014 年起適用於 8 家全球系統性重要銀行。2025 年 11 月聯準會、FDIC、OCC 定案改革，2026 年 4 月生效：控股公司的固定 2% 緩衝改為 GSIB 附加資本的 50%，旗下銀行緩衝上限 1%；公債與準備金仍計入曝險。
  read: eSLR 綁住時，交易商持有公債、做附買回與造市的空間就被壓縮。放寬後可多持有現券、在期貨上承接資產管理的多單；效果要看交易商庫存與期貨部位是否真的變化。
  chain:
  - eSLR 放寬
  - 交易商資產負債表空間增加
  - 可持有更多公債、承接更多新債
  - 市場深度改善，邊際上減輕期限溢酬壓力。
  myth: 「eSLR 放寬＝公債不再計入槓桿」。2025 年的改革調整的是門檻，公債與準備金仍計入曝險。
  practice: ''
  source: 聯邦公報 2025-21626；FDIC、OCC、聯準會新聞稿。
  quiz:
    q: 2025 年的 eSLR 改革主要改了什麼？
    opts:
    - 把公債排除在曝險之外
    - 調降大型銀行的槓桿緩衝門檻
    - 取消資本要求
    ans: 1
    why: 緩衝改為 GSIB 附加資本的 50%，公債仍計入。
dealer_inv:
  title: 初級交易商公債庫存
  section: 長端與債務
  one: 紐約聯儲的 24 家初級交易商自己資產負債表上持有的公債淨部位，代表造市與承接新債的能力。
  origin: 紐約聯儲每週公布（FR 2004），依剩餘年限分組：T-Bills、3 年以內、3–6 年、6–7 年、7–11 年、11–21 年、21 年以上。
  read: 庫存上升＋拍賣承接比例上升＝終端需求不足、交易商被迫接手（壓力）；庫存上升但承接比例沒升＝交易商主動持有（資產負債表有空間）；庫存下降＝在去化部位，承接新債的空間相對充裕。
  chain:
  - 發債增加、終端需求不足
  - 交易商被迫承接、庫存上升
  - 資產負債表塞滿
  - 造市能力下降、殖利率波動放大。
  myth: 「交易商庫存高＝看好公債」。很多時候是被迫承接拍賣剩下的量，不是主動做多。
  practice: coupon 淨持倉 {pd_coupons} 十億美元（近 3 年第 {pd_pct} 百分位），T-Bills {pd_bills} 十億美元。
  source: New York Fed〈Primary Dealer Statistics〉；Treasury 拍賣結果。
  quiz:
    q: 交易商庫存上升、同時拍賣承接比例也升高，代表？
    opts:
    - 終端需求偏弱，交易商被迫接手
    - 交易商看好公債
    - 聯準會在買公債
    ans: 0
    why: ''
fci:
  title: 金融條件對成長的衝擊（FCI-G）
  section: 情境
  one: 聯準會的指標：利率、信用、股市、房價、美元過去三年的變化，預計在未來一年拖累（正）或助長（負）實質 GDP 成長幾個百分點。
  origin: 聯準會 FEDS Notes 每月公布；用聯準會總體模型把七個金融變數的變化換算成對成長的影響，七個成份相加＝指數。
  read: 正值＝金融條件偏緊、成長逆風；負值＝偏鬆、成長順風。看是哪個成份主導：股市大漲帶來的寬鬆，跟利率下降帶來的寬鬆，對聯準會的意義不同。
  chain:
  - 股市上漲、利差收窄、美元走弱
  - 金融條件寬鬆
  - 未來一年成長獲得助力
  - 聯準會降息的急迫性下降。
  myth: 「升息一定讓金融條件變緊」。若股市與信用市場同時大漲，整體金融條件仍可能偏鬆。
  practice: 最新 FCI-G {fci_total} 個百分點；主要成份：{fci_main}。
  source: Federal Reserve〈Financial Conditions Impulse on Growth〉。
  quiz:
    q: FCI-G 為負值代表？
    opts:
    - 金融條件偏鬆，對未來成長是順風
    - 金融條件偏緊
    - 經濟已經衰退
    ans: 0
    why: ''
