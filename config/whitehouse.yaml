# 首頁「白宮與國會」（2026-11）：取代期中選舉那一格。
#
# 三塊內容：
#   ① 本週重點：AI 依下面兩塊整理 2–3 句，每天最多重寫一次
#   ② 川普說了什麼：近 7 天跟市場有關的發言與行政命令（新聞報導＋白宮公告，AI 寫一句中文）
#   ③ 政策進度：下面 policies 這份清單——**人工維護**（A）；AI 只在新聞裡看到可能的
#      進度變化時寫進執行紀錄提醒（B），不直接改畫面。超過 stale_days 天沒確認也會提醒。
# 另有政策不確定性指數（FRED USEPUINDXD，序列放在 liquidity.yaml）。
#
# 維護方式：進度變了就改 stage／next，並把 changed 改成進度變的那天（近 3 天會亮橘點）；
#           每次確認過（不管有沒有變）就把 updated 改成確認當天。
#   stage：目前在第幾段（1 起算；之前的段落算完成）
#   next.date：有明確日期才填（會倒數、也會進首頁「接下來看什麼」月曆的「政策」）
enabled: true
# 期中選舉那一格：隱藏、不刪除（以後有選舉再打開）
election_tile: false
window_days: 7
new_days: 3
stale_days: 14
# 選後一行：併在本週重點下方，until 當天（含）之後自動消失
after_election:
  text: 民主黨拿下參眾兩院・新國會 1/3 就任
  until: '2027-01-02'
topics: [財政, 聯準會, AI 與晶片, 能源, 關稅]

