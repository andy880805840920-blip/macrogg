# 首頁「接下來看什麼・休市」的手動修正（2026-10）。
#
# 平常不用動：休市日由 Python holidays 套件的交易所與各國假日表自動算出。
# 只有套件沒涵蓋或與實際公告不同時才在這裡補，例如：
#   - SIFMA 某年把耶穌受難日改成「提早收盤」而不是全休（遇到就業報告時常這樣）
#   - 中國國務院剛公布明年假日、套件還沒更新
#   - 交易所臨時宣布的休市（已事先公告的）
#
# 欄位：
#   date     日期（當地日期）
#   market   US／GB／TW／CN／HK／JP／KR
#   closed   休市的市場：eq（股市）、bd（債市）、fx（匯市）；寫 [] 代表不休
#   early    提早收盤的當地時間，例如 {bd: "12:00"}；寫 {} 代表不提早
#   name     名稱（不寫就用套件的）
#   note     對本站的影響（不寫就用預設說明）
#   remove   true＝整筆拿掉
#
# 例：
#   - date: 2027-03-26
#     market: US
#     closed: [eq]
#     early: {bd: "12:00"}
#     note: SIFMA 建議債市中午提早收盤（當天有就業報告）
overrides: []
