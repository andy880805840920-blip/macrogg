# ============================================================================
# 流動性序列群組
#
# 目前供首頁「今日市場焦點」的自選 chip 目錄使用；未來的流動性頁
# 直接沿用這一組，不必搬家。全部日頻、全部 FRED。
#
# 即時報價（油價、VIX、MOVE）不在這裡——它們走 Yahoo，設定在程式裡
# （src/analysis/focus_today.py 的 QUOTE_SPECS）。這裡的油價與 VIX
# 是 Yahoo 掛掉時的 FRED 後備（EIA 轉載會落後數天，畫面會標資料日）。
# ============================================================================

meta:
  release_name: "Liquidity"

series:
  - id: SOFR
    label: SOFR（擔保隔夜融資利率）
    enabled: true
  - id: IORB
    label: 準備金利率（IORB）
    enabled: true
  # 聯邦資金有效利率——利率走廊頁跟 SOFR／IORB 並列，三者才拼出
  # 「擔保 vs 無擔保」的全貌。
  - id: EFFR
    label: 聯邦資金有效利率（EFFR）
    enabled: true
  # ON RRP：貨幣基金停泊在聯準會的隔夜逆回購量——體系多餘現金的緩衝池。
  - id: RRPONTSYD
    label: ON RRP 餘額
    enabled: true
  # ON RRP 得標利率——名目利率走廊的下緣，跟 IORB（上緣）配對畫圖才有意義。
  - id: RRPONTSYAWARD
    label: ON RRP 利率（走廊下緣）
    enabled: true
  # SRF 動用量的 FRED 後備（主要來源是紐約聯儲逐日操作結果，見
  # src/treasury_source.srf_operations；這條只在那個來源失敗時頂上）。
  - id: RPONTSYD
    label: 隔夜回購動用（SRF，FRED 後備）
    enabled: true
  # 三方一般擔保利率（TGCR）——擔保隔夜融資市場最窄的一段，常被視為
  # SOFR 未來可能的替代／對照指標。
  - id: TGCRRATE
    label: TGCR（三方一般擔保利率）
    enabled: true
  # FDIC 全國儲蓄存款利率（月）：MMF 頁「MMF 收益率 vs 銀行存款」的對照組。
  # 2021-04 以前的舊算法序列（SAVNRNJ）已停發，固定存在 config/fdic_savings_legacy.json。
  - id: SNDR
    label: FDIC 全國儲蓄存款利率
    enabled: true
  # ---- Yahoo 即時報價的 FRED 後備（EIA／CBOE 轉載，落後數天）----
  - id: DCOILWTICO
    label: WTI 原油（FRED 後備）
    enabled: true
  - id: DCOILBRENTEU
    label: Brent 原油（FRED 後備）
    enabled: true
  - id: VIXCLS
    label: VIX（FRED 後備）
    enabled: true

  # 台幣即時匯率失敗時使用 FRED 備援，顯示實際資料日與来源。
  - id: DEXTAUS
    label: 台幣兌美元（FRED 備援）
    enabled: true

# ---------------------------------------------------------------------------
# 財政部每季再融資（QRA）的借款估計——每季手動更新一次（跟 rates.yaml 的
# refunding 同一個時點）。borrowing、cash_end 是財政部原文數字（十億美元）；
# net_coupon 是本站推算的本季私人持有 coupon 淨發行：
#   暫定拍賣排程（本季交割）× 各天期現行規模（含 FRN、TIPS）≈ 1,109
#   − 本季到期的 coupon 扣掉 Fed SOMA 持有（MSPD 表三逐券 − SOMA 逐券）≈ 749
# 兩者相減約 360。T-Bills 隱含淨發行＝borrowing − net_coupon（未計買回）。
# ---------------------------------------------------------------------------
qra:
  quarter: "2026 Q4（10–12 月）"
  date: "2026-08-03"
  borrowing: 628
  cash_end: 850
  cash_end_date: "2026-12-31"
  net_coupon: 360
  gross_coupon: 1109
  coupon_maturing: 749
  url: "https://home.treasury.gov/news/press-releases/sb0584"
  next: "2026-11-04"
