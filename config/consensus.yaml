# ============================================================================
# 市場預期（consensus）
#
# 系統會依下列順序尋找預期值：
#   1. 這個檔案裡的手動輸入        ← 最準確，發布前填入
#   2. 爬取的公開來源（尚未啟用）
#   3. 時間序列模型推估            ← 一律可用的後備，但**不是市場預期**
#
# 畫面上一律標示預期值的來源，不會把模型推估當成市場預期呈現。
#
# 填法：在對應的資料月份下填入市場預期。單位與 FRED 原始序列一致。
#
# 勞動（就業報告）
#   PAYEMS        非農月變動，千人（市場預期 +8.5 萬 → 填 85）
#   UNRATE        失業率，百分比（例如 4.2）
#
# 通膨（CPI）
#   CPIAUCSL_YOY  總體 CPI 年增率，百分比（例如 3.2）
#   CPILFESL_YOY  核心 CPI 年增率，百分比（例如 3.1）
#
# 沒填的項目**不會**顯示，也不會退回模型推估——
# 通膨的月度預期各家定義不一（月增 vs 年增、四捨五入到小數第幾位），
# 拿模型外推去湊一個「意外值」只會製造出看起來精確的假訊號。
# 勞動頁沒填時仍會退回模型推估並標示來源，那是既有行為，維持不變。
# ============================================================================

expectations:
  # 範例（已註解）。實際使用時把對應月份的預期填進來：
  # "2026-07":
  #   PAYEMS: 85
  #   UNRATE: 4.2
  #   CPIAUCSL_YOY: 3.2
  #   CPILFESL_YOY: 3.1
  {}

# 爬蟲設定（尚未啟用；啟用前請確認來源的使用條款）
scrape:
  enabled: false
  note: >
    公開來源（如 Trading Economics、Investing.com）的預期值定義未必一致，
    且版面改版就會失效。建議以手動輸入為主，爬蟲僅作輔助。
