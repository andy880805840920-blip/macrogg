# ============================================================================
# 市場預期（consensus）
#
# 系統會依下列順序尋找預期值：
#   1. 這個檔案裡的手動輸入        ← 最準確，發布前填入
#   2. 爬取的公開來源（尚未啟用）
#   3. 時間序列模型推估            ← 一律可用的後備，但**不是市場預期**
#
# 畫面上一律標示預期值的來源，不會把模型推估當成市場預期呈現。
#
# 填法：在對應的資料月份下填入市場預期。單位與 FRED 原始序列一致
#   PAYEMS  月變動，千人（例如市場預期 +8.5 萬 → 填 85）
#   UNRATE  百分比（例如 4.2）
#   CPILFESL / CPIAUCSL  月增率百分比（例如 0.3）
# ============================================================================

expectations:
  # 範例（已註解）。實際使用時把對應月份的預期填進來：
  # "2026-07":
  #   PAYEMS: 85
  #   UNRATE: 4.2
  #   CPILFESL_MOM: 0.3
  {}

# 爬蟲設定（尚未啟用；啟用前請確認來源的使用條款）
scrape:
  enabled: false
  note: >
    公開來源（如 Trading Economics、Investing.com）的預期值定義未必一致，
    且版面改版就會失效。建議以手動輸入為主，爬蟲僅作輔助。
