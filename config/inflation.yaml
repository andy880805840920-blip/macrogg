# ============================================================================
# 通膨模組設定（P2）
#
# 結構與 indicators.yaml 相同，新增指標只要在這裡加一段。
#
# ⚠️ weight 是 CPI 相對重要性（relative importance，單位：%）。
#    BLS 每年一月更新一次，來源：
#    https://www.bls.gov/cpi/tables/relative-importance/
#    這些權重直接決定「分項貢獻」的計算結果，務必每年校準一次。
#    下方數值為近似值，第一次正式執行前請對照 BLS 表格更新。
# ============================================================================

meta:
  release_name: "Consumer Price Index"
  weights_vintage: "2026 年 1 月（近似值，待對照 BLS 表格校準）"

# ---------------------------------------------------------------------------
# 一、主軸指標
# ---------------------------------------------------------------------------
headline:
  - id: CPIAUCSL
    label: CPI 總體
    short: CPI
    enabled: true
  - id: CPILFESL
    label: 核心 CPI
    short: 核心CPI
    enabled: true
    note: 剔除食物與能源，Fed 觀察趨勢的主要依據
  - id: PCEPI
    label: PCE 物價指數
    enabled: true
  - id: PCEPILFE
    label: 核心 PCE
    enabled: true
    note: Fed 的政策目標就是這一項，2% 指的是它
  - id: PPIFIS
    label: PPI 最終需求
    enabled: true
  - id: PPIFES
    label: 核心 PPI
    enabled: true

# ---------------------------------------------------------------------------
# 二、CPI 分項 — 貢獻度分解的原料
#     weight 為佔 CPI 的相對重要性（%）
#     切法必須互斥且合計接近 100，否則貢獻加總會對不上
# ---------------------------------------------------------------------------
cpi_components:
  - id: CPIUFDSL
    label: 食物
    weight: 13.6
    group: food_energy
  - id: CPIENGSL
    label: 能源
    weight: 6.2
    group: food_energy
  - id: CUSR0000SACL1E
    label: 核心商品
    weight: 18.4
    group: core_goods
    note: 剔除食物與能源的商品。二手車、家具、服飾等
  - id: CUSR0000SAH1
    label: 住房
    weight: 35.4
    group: core_services
    laggy: true
    note: 含房租與自有住宅設算租金。落後市場租金約 12 個月
  - id: CUSR0000SASLE
    label: 其他核心服務
    weight: 26.4
    group: core_services
    supercore: true
    note: 核心服務除住房，即 supercore。Fed 溝通的重心

# ---------------------------------------------------------------------------
# 三、住房細項（用來判斷住房項的落後程度）
# ---------------------------------------------------------------------------
shelter_detail:
  - id: CUSR0000SEHA
    label: 主要住所租金
    enabled: true
  - id: CUSR0000SEHC
    label: 自有住宅設算租金 (OER)
    enabled: true

# ---------------------------------------------------------------------------
# 四、剔除極端值的替代指標
#     用來判斷「這次的高低是趨勢，還是被少數項目帶動」
# ---------------------------------------------------------------------------
trend_measures:
  - id: MEDCPIM158SFRBCLE
    label: 中位數 CPI
    unit: annualized_pct
    enabled: true
    note: Cleveland Fed。取權重中位數的項目，完全不受極端值影響
  - id: TRMMEANCPIM158SFRBCLE
    label: 截尾平均 CPI
    unit: annualized_pct
    enabled: true
    note: Cleveland Fed。剔除漲跌最極端的項目後取平均
  - id: CORESTICKM159SFRBATL
    label: 黏性核心 CPI
    unit: annualized_pct
    enabled: true
    note: Atlanta Fed。只看價格調整頻率低的項目，代表通膨的慣性

# ---------------------------------------------------------------------------
# 五、能源傳導（油價領先 CPI 能源項約 2–4 週）
# ---------------------------------------------------------------------------
energy:
  - id: DCOILWTICO
    label: WTI 原油
    frequency: daily
    enabled: true
  - id: DCOILBRENTEU
    label: 布蘭特原油
    frequency: daily
    enabled: true
  - id: GASREGW
    label: 零售汽油價格
    frequency: weekly
    enabled: true

# ---------------------------------------------------------------------------
# 六、通膨預期
#     預期若脫錨，Fed 會遠比看到單月數字更緊張
# ---------------------------------------------------------------------------
expectations:
  - id: MICH
    label: 密大 1 年通膨預期
    enabled: true
  - id: EXPINF1YR
    label: Cleveland Fed 1 年預期
    enabled: true
  - id: T5YIE
    label: 5 年損益兩平通膨率
    frequency: daily
    enabled: true
  - id: T5YIFR
    label: 5年後5年期預期 (5y5y)
    frequency: daily
    enabled: true
    note: 市場對「長期」通膨的定價，最能反映預期是否錨定

# ---------------------------------------------------------------------------
# 七、紅綠燈門檻
#     以「三個月年化」為主，因為它比年增率更早反映轉折
# ---------------------------------------------------------------------------
regime_lights:
  - key: core_cpi_3m
    label: 核心 CPI 三月年化
    desc: 近三個月的漲勢換算成年率。比年增率更早看出轉折
    direction: higher_is_worse
    green_below: 2.5
    red_above: 3.2
  - key: supercore_3m
    label: 核心服務除住房
    desc: Fed 最在意的一塊。多為人力成本，跟薪資直接連動
    direction: higher_is_worse
    green_below: 3.0
    red_above: 4.0
  - key: core_pce_yoy
    label: 核心 PCE 年增
    desc: Fed 的政策目標，2% 指的就是這個數字
    direction: higher_is_worse
    green_below: 2.3
    red_above: 2.8
  - key: median_cpi
    label: 中位數 CPI
    desc: 剔除極端項目後的通膨趨勢
    direction: higher_is_worse
    green_below: 2.8
    red_above: 3.5
  - key: core_ex_shelter
    label: 核心除住房
    desc: 住房項落後市場租金約一年，剔除後更接近當下的實際通膨
    direction: higher_is_worse
    green_below: 2.2
    red_above: 3.0
  - key: expect_5y5y
    label: 長期通膨預期
    desc: 市場對五年後起算五年的通膨定價。脫錨是 Fed 最怕的事
    direction: higher_is_worse
    green_below: 2.35
    red_above: 2.60
  - key: gas_price
    label: 汽油價格
    desc: 油價會在兩到四週後反映到 CPI 能源項
    direction: higher_is_worse
    green_below: 3.30
    red_above: 3.90
  - key: core_goods_yoy
    label: 核心商品年增
    desc: 商品通膨。受關稅與供應鏈影響最直接
    direction: higher_is_worse
    green_below: 0.5
    red_above: 1.5
