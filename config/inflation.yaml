# ============================================================================
# 通膨模組設定（P2）
#
# 結構與 indicators.yaml 相同，新增指標只要在這裡加一段。
#
# ⚠️ weight 是 CPI 相對重要性（relative importance，單位：%）。
#    BLS 每年一月更新一次，來源：
#    https://www.bls.gov/cpi/tables/relative-importance/
#    這些權重直接決定「分項貢獻」的計算結果，務必每年校準一次。
#    下方數值為近似值，第一次正式執行前請對照 BLS 表格更新。
# ============================================================================

meta:
  release_name: "Consumer Price Index"
  # BLS relative importance 表（2024 權重）。四大類合計 100.001，是精確的切法。
  #   https://www.bls.gov/cpi/tables/relative-importance/2025.htm
  weights_vintage: "2025 年 12 月（BLS relative importance，2024 權重）"

# ---------------------------------------------------------------------------
# 一、主軸指標
# ---------------------------------------------------------------------------
headline:
  - id: CPIAUCSL
    label: CPI 總體
    short: CPI
    enabled: true
  - id: CPILFESL
    label: 核心 CPI
    short: 核心CPI
    enabled: true
    note: 剔除食物與能源，Fed 觀察趨勢的主要依據
  # ---- 未季調（NSA）：**年增率專用** ----
  #
  # BLS 新聞稿上的「年增 3.4%」是用**未季調**指數算的，而上面兩條是季調。
  # 兩者算出來的年增率不一樣——實測 2026-07 差 0.1（總體）到 0.3
  #（核心）個百分點，而且六月同樣偏高。畫面上印一個跟所有媒體都對不上的
  # 數字，讀者只會認為網站壞了。
  #
  # 分工很明確：
  #   年增率        用未季調（跟 BLS 公布口徑一致，而且未季調不會被回溯修正）
  #   月增率、年化   用季調（月與月之間本來就要剔除季節性才可比）
  #
  # 季調指數在原始發布後最長五年內都可能因為季節因子重估而被改，
  # 未季調則不會動——這也是 BLS 建議「調整用途一律用未季調」的理由。
  # 剔除住房後的整體 CPI。**官方指數，不是自己反推的。**
  #
  # 先前是用「(總漲幅 − 住房貢獻) ÷ (1 − 住房權重)」反推。那個做法不對：
  # ex-shelter 是把住房整個拿掉之後**重新聚合**出來的指數，不是原指數減掉
  # 一塊。用相減去反推等於假設 CPI 是各分項的簡單加權和，而 BLS 的聚合是
  # 分層鏈式的，兩者不等價。
  - id: CUSR0000SA0L2
    label: CPI 除住房
    enabled: true
    note: All Items Less Shelter（季調）。剔除住房後的整體 CPI，官方指數
  - id: CPIAUCNS
    label: CPI 總體（未季調）
    enabled: true
    note: 只用於年增率，與 BLS 新聞稿口徑一致
  - id: CPILFENS
    label: 核心 CPI（未季調）
    enabled: true
    note: 同上
  - id: PCEPI
    label: 總體 PCE
    enabled: true
    note: Fed 的 2% 長期目標以總體 PCE 年增衡量；短期波動較大
  - id: PCEPILFE
    label: 核心 PCE
    enabled: true
    note: 剔除食物與能源；用來辨識基礎通膨趨勢，也是九宮格通膨水準軸
  # PPI 是企業端上游壓力，只參與「通膨動能」，不直接改變九宮格格位。
  - id: PPIFIS
    label: 總體 PPI（最終需求）
    enabled: true
    note: BLS 最終需求總指數；觀察企業端成本與售價壓力
  - id: PPIFES
    label: 核心 PPI（最終需求剔除食物與能源）
    enabled: true
    note: 不含食物與能源，但仍含貿易服務；不可寫成剔除食物、能源與貿易服務

# ---------------------------------------------------------------------------
# 二、CPI 分項 — 貢獻度分解的原料
#     weight 為佔 CPI 的相對重要性（%）
#     切法必須互斥且合計接近 100，否則貢獻加總會對不上
# ---------------------------------------------------------------------------
cpi_components:
  - id: CPIUFDSL
    label: 食物
    weight: 13.698
    group: food_energy
  - id: CPIENGSL
    label: 能源
    weight: 6.383
    group: food_energy
  - id: CUSR0000SACL1E
    label: 核心商品
    weight: 19.176
    group: core_goods
    note: 剔除食物與能源的商品。二手車、家具、服飾等
  - id: CUSR0000SAH1
    label: 住房
    weight: 35.625
    group: core_services
    laggy: true
    note: 含房租與自有住宅設算租金。落後市場租金約 12 個月
  # ⚠️ 這一格用的是**推導序列**，不是 FRED 上現成的某一條。
  #
  # 先前這裡填 CUSR0000SASLE，但那條在 FRED 上的正式名稱是
  # 「Services Less Energy Services」——**全部核心服務，含住房**，
  # 權重約 61.8%，不是除掉住房之後的 26.4%。填在這裡等於拿「含住房的
  # 核心服務漲幅」去乘「除住房的權重」，兩邊口徑對不上。
  #
  # BLS 沒有發布「核心服務除住房」的指數（SASL2RS 是「服務除房租」，
  # 含能源服務，會跟上面的能源那一格重複計算），所以由下面的
  # supercore_derive 加權相減推出來，id 用 CPISUPERCORE。
  - id: CPISUPERCORE
    label: 其他核心服務
    weight: 25.119
    group: core_services
    supercore: true
    derived: true                  # 不要去 FRED 抓，這條是算出來的
    note: 核心服務除住房，即 supercore。由核心服務減住房推導

# 推導「核心服務除住房」用的原料與權重。
#     r_除住房 =（w_核心服務 × r_核心服務 − w_住房 × r_住房）/（w_核心服務 − w_住房）
# 兩個權重相減必須等於上面 CPISUPERCORE 的 weight（61.8 − 35.4 = 26.4），
# 否則分項貢獻加總會對不上總漲幅。
supercore_derive:
  core_services: CUSR0000SASLE     # Services less energy services（含住房）
  core_services_weight: 60.744
  shelter: CUSR0000SAH1
  shelter_weight: 35.625

# ---------------------------------------------------------------------------
# 二之一、PPI 成分（上游價格 ＋ 核心 PCE 成分法推估的原料）
#
# 為什麼 PCE 可以在月底公布前就被推出來：它的原料月中就到齊了——
# 大部分項目取自 CPI，一部分（醫療、金融服務）取自 PPI。
# PCE 的醫療量的是**全部給付**（含保險與 Medicare），CPI 只量自付額，
# 所以那一塊要用 PPI 而不是 CPI——這是兩者口徑差異的最大來源。
#
# 航空票價 PPI（PCU481111481111）刻意不用：FRED 上落後約三個月，
# 趕不上推估，而它在核心 PCE 的權重不到 1%。
# ---------------------------------------------------------------------------
ppi_components:
  - id: PCU622110622110
    label: 醫院服務（PPI）
    note: General Medical and Surgical Hospitals，未季調
  - id: PCU621111621111
    label: 診所服務（PPI）
    note: Offices of Physicians，未季調。發布常落後一個月
  - id: PCU5239205239201
    label: 基金管理費（PPI）
    note: Mutual Fund and ETF Management，未季調。隨股市波動大

# 核心 PCE 成分法推估的權重（佔核心 PCE 的近似份額，%）。
#
# 這組權重是**近似值**，出處是 BEA 的 PCE 結構（年度量級）：
# 核心商品約四分之一、住房約 17%、醫療服務約 17%、金融服務約 8%、
# 其餘核心服務約三分之一。每年對照 BEA 更新一次即可——推估內建
# 「偏誤校正」（減去近 12 個月的平均高估／低估），權重小幅偏差
# 會被校正吸收，不會直接變成推估誤差。
#
# ⚠️ 五項權重合計必須為 100。
pce_nowcast:
  backtest_months: 18            # 回測窗口：兩種方法各算平均誤差，用小的那個
  components:
    - label: 核心商品
      ids: [CUSR0000SACL1E]
      weight: 24.5
    - label: 住房
      ids: [CUSR0000SAH1]
      weight: 17.5
    - label: 醫療服務
      ids: [PCU622110622110, PCU621111621111]
      blend: [0.6, 0.4]          # 醫院 6 成、診所 4 成（給付規模的近似比）
      weight: 17.0
    - label: 金融服務
      ids: [PCU5239205239201]
      weight: 8.0
    - label: 其他核心服務
      ids: [CPISUPERCORE]        # 推導序列（核心服務除住房）
      weight: 33.0

# ---------------------------------------------------------------------------
# 三、住房細項（用來判斷住房項的落後程度）
# ---------------------------------------------------------------------------
shelter_detail:
  # 這兩條目前有抓、但住房落後那一段是用 CPI 住房總項算的，沒有讀它們。
  # 待辦：把「新約租金 → 主要住所租金 → OER」三段的落後分別畫出來，
  # OER 的落後比市場租金長得多，混在一起看會低估落後期數。
  - id: CUSR0000SEHA
    label: 主要住所租金
    enabled: false
    note: 尚未接上分析（待辦：租金與 OER 分別看落後期數）
  - id: CUSR0000SEHC
    label: 自有住宅設算租金 (OER)
    enabled: false
    note: 尚未接上分析（同上）

# ---------------------------------------------------------------------------
# 四、剔除極端值的替代指標
#     用來判斷「這次的高低是趨勢，還是被少數項目帶動」
# ---------------------------------------------------------------------------
trend_measures:
  - id: MEDCPIM159SFRBCLE
    label: 中位數 CPI
    unit: yoy_pct        # 12 個月變化率。要跟核心 CPI 年增比較，兩者口徑必須相同
    enabled: true
    note: Cleveland Fed。取權重中位數的項目，完全不受極端值影響
  - id: TRMMEANCPIM159SFRBCLE
    label: 截尾平均 CPI
    unit: yoy_pct
    enabled: true
    note: Cleveland Fed。剔除漲跌最極端的項目後取平均
  - id: CORESTICKM159SFRBATL
    label: 黏性核心 CPI
    unit: yoy_pct
    enabled: true
    note: Atlanta Fed。只看價格調整頻率低的項目，代表通膨的慣性
  # 黏性的對照組。彈性項先反應、黏性項最後才動，兩者收斂才代表這一輪
  # 通膨真的走完了——只看黏性那一條看不出收斂到哪裡。
  # 兩條的口徑相同（年增率、季調），可以直接相減。
  - id: COREFLEXCPIM159SFRBATL
    label: 彈性核心 CPI
    unit: yoy_pct
    enabled: true
    note: Atlanta Fed。價格調整頻率高的項目，對當期景氣反應最快

# ---------------------------------------------------------------------------
# 四之二、核心服務的黏性
#
# 這是降息時間表卡最久的一塊，所以主線不是「現在多高」而是「降不降得下來」。
# CPI 與 PCE 兩邊並列：聯準會的目標是核心 PCE，兩者的權重差很多
#（醫療在 PCE 裡權重大得多，因為含雇主付的部分），背離時要以 PCE 為準。
# ---------------------------------------------------------------------------
stickiness:
  - id: IA001260M
    label: PCE 核心服務除住房
    unit: index
    enabled: true
    note: BEA。服務業剔除能源與住房的鏈式價格指數，即 PCE 版的 supercore

# ---------------------------------------------------------------------------
# 五、能源傳導（油價領先 CPI 能源項約 2–4 週）
# ---------------------------------------------------------------------------
energy:
  - id: DCOILWTICO
    label: WTI 原油
    frequency: daily
    enabled: true
  - id: DCOILBRENTEU
    label: 布蘭特原油
    frequency: daily
    enabled: false      # 能源傳導那一段用的是 WTI；兩者對美國 CPI 的訊息幾乎相同
  - id: GASREGW
    label: 零售汽油價格
    frequency: weekly
    enabled: true

# ---------------------------------------------------------------------------
# 六、通膨預期
#     預期若脫錨，Fed 會遠比看到單月數字更緊張
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 聯準會自己的預測（FOMC 經濟預測摘要 SEP）
#
# 用途：九宮格通膨軸的門檻。先前那兩條門檻（2.3／2.9）是寫死的，
# 程式碼與文件裡都沒有任何依據——而它們決定整張固定收益部位對照表。
#
# 改成錨在聯準會自己給的兩個數字：
#   低 = 長期目標 + 0.25          「已經回到目標」
#   高 = FOMC 對明年的核心 PCE 預測中位數  「還高於聯準會自己認為一年後會到的水準」
#
# 為什麼是「明年」而不是「今年」：聯準會預測的是**它預期會發生什麼**，
# 不是**它能接受什麼**。2026 年 6 月的 SEP 把 2026 年核心 PCE 預測在
# 3.2–3.5%，而實際也在 3.3%——用「高於今年預測」當門檻會判成「不高」，
# 但同一份聲明裡有三票主張升息，通膨顯然還是約束。
# 「明年的預測」才是收斂軌道：高於它＝還沒走上回到目標的路。
#
# 兩條都是年頻、Q4 對 Q4，每次 SEP（一年四次）更新。
# 抓不到時退回寫死的 2.30／2.90，畫面上會標示。
sep:
  - id: PCECTPIMDLR
    label: FOMC 長期通膨目標（中位數）
    enabled: true
  - id: JCXFEMD
    label: FOMC 核心 PCE 預測（中位數）
    enabled: true
  - id: JCXFECTH
    label: FOMC 核心 PCE 預測（中央趨勢上緣）
    enabled: true
  - id: JCXFECTL
    label: FOMC 核心 PCE 預測（中央趨勢下緣）
    enabled: true

expectations:
  - id: MICH
    label: 密大 1 年通膨預期
    enabled: true
  - id: EXPINF1YR
    label: Cleveland Fed 1 年預期
    enabled: false
    note: 尚未接上分析（待辦：與密大 1 年預期並列，家戶調查 vs 模型）
  - id: T5YIE
    label: 5 年損益兩平通膨率
    frequency: daily
    enabled: false      # 脫錨判斷用的是 5Y5Y 遠期（T5YIFR，下一條）——
                        # 那條剔除了未來五年的已知衝擊，才是「長期預期」
  - id: T5YIFR
    label: 5年後5年期預期 (5y5y)
    frequency: daily
    enabled: true
    note: 市場對「長期」通膨的定價，最能反映預期是否錨定

# ---------------------------------------------------------------------------
# 七、紅綠燈門檻
#     以「三個月年化」為主，因為它比年增率更早反映轉折
# ---------------------------------------------------------------------------
regime_lights:
  - key: core_cpi_3m
    label: 核心 CPI 三月年化
    desc: 近三個月的漲勢換算成年率。比年增率更早看出轉折
    direction: higher_is_worse
    green_below: 2.5
    red_above: 3.2
  # 標籤要帶上「三月年化」。同一頁的傳導區顯示的是同一條序列的年增率，
  # 兩個不同的數字擺在一起卻只有一個標了口徑，看起來像互相矛盾。
  - key: supercore_3m
    label: 核心服務除住房（三月年化）
    desc: Fed 最在意的一塊，降息時間表看它降不降得下來。
      這裡是近三個月換算成年率，與下方傳導區的年增率是同一條序列的兩種口徑
    direction: higher_is_worse
    green_below: 3.0
    red_above: 4.0
  - key: core_pce_yoy
    label: 核心 PCE 年增
    desc: Fed 的政策目標，2% 指的就是這個數字
    direction: higher_is_worse
    green_below: 2.3
    red_above: 2.8
  - key: median_cpi
    label: 中位數 CPI
    desc: 剔除極端項目後的通膨趨勢
    direction: higher_is_worse
    green_below: 2.8
    red_above: 3.5
  - key: core_ex_shelter
    label: 核心除住房
    desc: 住房項落後市場租金約一年，剔除後更接近當下的實際通膨
    direction: higher_is_worse
    green_below: 2.2
    red_above: 3.0
  - key: expect_5y5y
    label: 長期通膨預期
    desc: 市場對五年後起算五年的通膨定價。脫錨是 Fed 最怕的事
    direction: higher_is_worse
    green_below: 2.35
    red_above: 2.60
  - key: gas_price
    label: 汽油價格
    desc: 油價會在兩到四週後反映到 CPI 能源項
    direction: higher_is_worse
    green_below: 3.30
    red_above: 3.90
  - key: core_goods_yoy
    label: 核心商品年增
    desc: 商品通膨。受關稅與供應鏈影響最直接
    direction: higher_is_worse
    green_below: 0.5
    red_above: 1.5
