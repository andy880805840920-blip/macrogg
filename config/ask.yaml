# 偷懶頁（/ask/）：問句判讀規則與答案卡清單。不經 AI，純關鍵字與句型。
#
# 判讀流程與計分見 src/pages/ask_match.js 開頭註解。這裡只放「詞」與「卡」。
#
# 卡片欄位
#   id   卡片代號（網址 /ask/c/<id>.html）
#   c    分類：總覽／指標報價／聯準會／就業／通膨／長端與債務／情境（名詞卡由 terms 自動產生）
#   q    標題（也是清單上看到的問題）
#   k    強詞：問句出現就 +3
#   w    弱詞：+1
#   m    修飾詞：出現 +2；卡片有 m 但問句沒有 −2（讓「CPI」不會跑到「CPI 月增」）
#   n    這張卡回答的意圖
#   x    範例問句（字面相似 +2）
#   l    對應 config/learn.yaml 的教學主題
#   h    跳轉連結
#   r    相關問題（卡片 id）
#   src  資料：{s: FRED 序列, tf: lv 水準／yoy 年增／mom 月增／d 差分／a3 三月年化, u: 單位, dg: 小數,
#              sc: 倍數, lab: 名稱} 或 {chip: 首頁報價板代號} 或 {fn: src/analysis/ask.py 的函式}
#   say  答案後面補一句；{ctx:路徑} 取 context 文字

rules: {strong: 3, weak: 1, mod: 2, modMiss: -2, intent: 2, implicit: 1, ex: 2, exSim: 0.6,
        direct: 4, lead: 2, guessN: 5, fuzzy: 0.25, termMiss: -2}

