# ============================================================================
# 首頁「整體情勢」的模型潤稿設定
#
# 這一區是整個專案唯一讓模型碰畫面文字的地方。所有數字、方向、結論都由
# 規則引擎決定好了，模型**只改寫措辭**——它不做任何判斷，做了也會被
# 防護欄擋下來（數字鎖定、長度、截斷檢查）。
#
# 這個檔案是給你調「口氣」用的。改完 commit 就生效，不必動程式。
# 提示詞或語氣一改，快取會自動失效重新生成一次。
# ============================================================================

polish:
  # 關掉的話一律用規則組裝版（跟沒設金鑰的效果一樣）。
  # 想比較「潤稿前 vs 潤稿後」時可以暫時關掉跑一次。
  enabled: true

  # 取樣溫度 0–1。**這是「潤了跟沒潤一樣」最常見的原因。**
  #
  #   0.0   幾乎逐字照抄組裝版——最安全，但也最像沒潤過
  #   0.3   會重新斷句、換連接詞，讀起來順但不會走樣
  #   0.5   會重組句子結構，語氣差異明顯
  #   0.8+  開始有自己的口氣，被防護欄擋下的機率也跟著上升
  #
  # 擋下來不會壞（會帶著原因重試一次，兩次都不行就用組裝版），
  # 所以往上調的代價只是偶爾少一次潤稿，不是錯誤的數字。
  temperature: 0.45

  # 語氣。這一段會原樣放進提示詞，想改成什麼口吻都可以。
  # 幾個可以直接換上去的例子：
  #   「像資深財經記者寫給一般讀者，避免術語，必要時用一句話解釋名詞」
  #   「像交易員的晨會口頭摘要，直接、短句、先講結論」
  #   「像研究報告的摘要段，完整但不冗長，語氣中性」
  style: >
    語氣像法人晨會的口頭摘要——專業但不堆術語，
    句與句之間要有自然的承接。

  # 額外指令。留空就沒有。想加什麼要求都寫在這裡，例如：
  #   「每一段事實之間要有因果或轉折的連接，不要並列。」
  #   「避免使用『值得注意的是』『整體而言』這類套話。」
  #   「第一句就要講出目前最關鍵的那一件事。」
  extra: >
    不要逐句對應原文：可以合併句子、調換順序、改變斷句方式，
    讓整段讀起來像一氣呵成寫出來的，而不是把幾段話接在一起。
    避免「值得注意的是」「整體而言」「綜上所述」這類套話。
