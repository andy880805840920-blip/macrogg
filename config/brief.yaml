# ============================================================================
# 首頁「整體情勢」的 AI 生成設定
#
# 現行做法：規則引擎先做完所有**判定**（情境、方向、各模組的狀態與旗標），
# 打包成「判定包」交給模型，由模型**生成**三則 bullet（勞動市場／通膨／
# 聯準會）。首尾兩句（本次更新、重點句）不經過模型，永遠是規則版。
# 三道鎖擋住越權：結構鎖（三行格式）、方向鎖（文末方向標記必須跟規則
# 判定一致）、數字鎖（只能用判定包裡出現過的數字）。任何一鎖沒過就帶
# 原因重試一次，再不過就整段退回規則組裝版——畫面永遠有東西。
#
# 段名沿用 polish 是歷史原因（先前是「先組裝再潤稿」），改名會讓舊
# commit 的設定失效，所以留著。
# ============================================================================

polish:
  # 關掉的話一律用規則組裝版（跟沒設金鑰的效果一樣）。
  # 想比較「AI 生成 vs 規則組裝」時可以暫時關掉跑一次。
  enabled: true

  # 取樣溫度 0–1。生成模式下的取捨：
  #
  #   0.0   最保守，幾乎逐字複述判定包
  #   0.3   會重新斷句、換連接詞，讀起來順但不會走樣
  #   0.5   會重組句子結構，語氣差異明顯
  #   0.8+  開始有自己的口氣，被三道鎖擋下的機率也跟著上升
  #
  # 擋下來不會壞（帶著原因重試一次，兩次都不行就用組裝版），
  # 所以往上調的代價只是偶爾退回組裝，不是錯誤的數字。
  temperature: 0.45

  # ── 以下三項只作用在舊的「潤稿」路徑（polish.maybe_polish）。─────────
  # 現行的生成模式用的是 brief.py 內建的提示詞，不讀這三項；
  # 留著是因為 polish 模組（含它的測試）還在，未來想切回潤稿也不必重寫。

  # 語氣。這一段會原樣放進（潤稿的）提示詞，想改成什麼口吻都可以。
  style: >
    語氣像法人晨會的口頭摘要——專業但不堆術語，
    句與句之間要有自然的承接。

  # 字數上限（中文字）。留空用內建預設 500。
  #
  # 這個數字現在只是**防呆**，不是編輯上的限制——它的用途是攔住
  # 「某個分支寫出幾千字」這種失控，不是逼稿子變短。實際長度由組裝版
  # 的內容決定（資料多就長、少就短），提示詞會照著那個長度給範圍。
  # 想要更短的話不要調這裡，改 style／extra 直接要求「精簡一點」比較準。
  max_chars: 500

  # 額外指令。留空就沒有。想加什麼要求都寫在這裡，例如：
  #   「每一段事實之間要有因果或轉折的連接，不要並列。」
  #   「避免使用『值得注意的是』『整體而言』這類套話。」
  #   「第一句就要講出目前最關鍵的那一件事。」
  extra: >
    不要逐句對應原文：可以合併句子、調換順序、改變斷句方式，
    讓整段讀起來像一氣呵成寫出來的，而不是把幾段話接在一起。
    避免「值得注意的是」「整體而言」「綜上所述」這類套話。
