# 官方發布行事曆（手動維護，一年校準一次）
#
# 用途：首頁「接下來看什麼」與各分頁的「下一次更新」倒數。
# 就業報告與 CPI 在線上模式會優先用 FRED 的官方行事曆（run.py 的
# fetch_release_dates）；這個檔案是 PPI／PCE 的唯一來源，也是
# FRED 問不到時的後備。日期過期不會壞——程式只挑「今天以後最近的一筆」，
# 全部過期時該項自動消失並退回慣例推估（能推的才推）。
#
# 來源（每年一月更新下一年）：
#   BLS：https://www.bls.gov/schedule/news_release/   （CPI、PPI、就業報告）
#   BEA：https://www.bea.gov/news/schedule            （Personal Income and Outlays＝PCE）
#   FRED：https://fred.stlouisfed.org/releases/calendar?rid=…  （以上各項彙整）
#   財政部暫定標售表：https://home.treasury.gov/system/files/221/Tentative-Auction-Schedule.pdf
# 2026-10-22 起：發布日改由 src/schedule_auto.py 自動維護（FRED＋BEA 官方行事曆，抓到就存 state/release_dates.json），
# 這份變成後備與期別對照——自動行事曆已排到的項目不再提醒。
