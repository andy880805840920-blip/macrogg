# ============================================================================
# 指標設定檔 — P1 勞動市場模組
#
# 新增指標只要在這裡加一段，不必改程式。
# enabled: false 可以先關掉某個指標而不刪除設定（日後要用再打開）。
#
# group  : 決定它出現在畫面的哪一區
# invert : true 表示「數值上升 = 勞動市場轉弱」（例如失業率、裁員率）
#          用於綜合評分時的符號對齊
# ============================================================================

meta:
  release_name: "Employment Situation"
  source_note: "資料來源：BLS / DOL，經 FRED 取得（含修正後最新值）"

# ---------------------------------------------------------------------------
# 一、總量與家庭調查
# ---------------------------------------------------------------------------
headline:
  - id: PAYEMS
    label: 非農就業總數
    short: NFP
    unit: thousands
    transform: diff          # 取月變動
    track_revisions: true    # 需要 vintage 追蹤
    enabled: true
  - id: USPRIV
    label: 民間部門就業
    short: 私部門
    unit: thousands
    transform: diff
    track_revisions: true
    enabled: true
    note: 不進畫面，只用來抓 ALFRED 歷史版本（修正追蹤的第二條序列）
  - id: USGOVT
    label: 政府部門就業
    short: 政府
    unit: thousands
    transform: diff
    enabled: false
    note: 尚未接上分析；行業分解用的是 industries 那一組的 CES9091/9092/9093
  - id: UNRATE
    label: 失業率 U-3
    short: U-3
    unit: percent
    transform: level
    invert: true
    enabled: true
  - id: U6RATE
    label: 廣義失業率 U-6
    short: U-6
    unit: percent
    transform: level
    invert: true
    enabled: false      # 2026-10 移除「低度就業」（使用者指定），不再抓
  - id: CIVPART
    label: 勞動參與率
    short: LFPR
    unit: percent
    transform: level
    enabled: true
  - id: EMRATIO
    label: 就業人口比
    short: EPOP
    unit: percent
    transform: level
    enabled: false      # 全年齡就業人口比會被人口老化拖著走；黃金年齡那條才可比
  - id: LNS11300060
    label: 黃金年齡參與率 (25-54)
    short: Prime LFPR
    unit: percent
    transform: level
    enabled: true
  - id: LNS12300060
    label: 黃金年齡就業人口比 (25-54)
    short: Prime EPOP
    unit: percent
    transform: level
    enabled: true
  - id: UNEMPLOY
    label: 失業人數
    unit: thousands
    transform: level
    invert: true
    enabled: true
  - id: CLF16OV
    label: 勞動力人數
    unit: thousands
    transform: level
    enabled: true
  - id: CE16OV
    label: 家庭調查就業人數
    short: CPS 就業
    unit: thousands
    transform: diff
    enabled: true

# ---------------------------------------------------------------------------
# 二、失業結構（判斷失業率變化是「好的」還是「壞的」）
# ---------------------------------------------------------------------------
unemployment_structure:
  # 失去工作者佔失業人口比重：就業轉折的主訊號（取代 Sahm 法則），
  # 規則與回測見 src/analysis/job_losers.py。要 1967 年起的完整歷史
  #（run.py 的 LONG_HISTORY），z 值窗口 60 個月＋歷次衰退對照都靠它。
  - id: LNS13023622
    label: 失去工作者佔失業人口比重
    unit: percent
    invert: true
    enabled: true
  # 另外三類的比重（失業結構卡的比例與時間軸，2025 起）
  - id: LNS13023706
    label: 自願離職者佔失業人口比重
    unit: percent
    enabled: true
  - id: LNS13023558
    label: 重新進入者佔失業人口比重
    unit: percent
    enabled: true
  - id: LNS13023570
    label: 新進入者佔失業人口比重
    unit: percent
    enabled: true
  - id: LNS13023621
    label: 失去工作或臨時工作結束
    unit: thousands
    invert: true
    enabled: true
  - id: LNS13023705
    label: 自願離職者
    unit: thousands
    enabled: true
  - id: LNS13023557
    label: 重新進入勞動力
    unit: thousands
    enabled: true
  - id: LNS13023569
    label: 新進入者
    unit: thousands
    enabled: true
  - id: UEMP27OV
    label: 長期失業 (27週以上)
    unit: thousands
    invert: true
    enabled: true
  - id: UEMPMED
    label: 失業週數中位數
    unit: weeks
    invert: true
    enabled: true
  - id: LNS12032194
    label: 因經濟因素兼職
    unit: thousands
    invert: true
    enabled: false
    note: 尚未接上分析（待辦：這是 U-6 與 U-3 差距的主要來源，隱性閒置）
  - id: LNS12026619
    label: 多重工作者
    unit: thousands
    enabled: false
    note: 尚未接上分析（待辦：多重工作者上升常伴隨實質所得壓力）

# ---------------------------------------------------------------------------
# 三、薪資與工時
# ---------------------------------------------------------------------------
wages:
  - id: CES0500000003
    label: 平均時薪（全體民間）
    short: AHE
    unit: dollars
    enabled: true
  - id: AHETPI
    label: 平均時薪（非管理職）
    short: AHE 非管理職
    unit: dollars
    enabled: true
    note: 與總體 AHE 的差距＝組成偏誤的直接證據
  - id: AWHAETP
    label: 平均每週工時
    unit: hours
    enabled: false      # 沒有任何地方讀它。要用就得先寫一段「工時先於人數下降」的分析
  - id: ECIALLCIV
    label: 就業成本指數 ECI
    unit: index
    frequency: quarterly
    enabled: true

# ---------------------------------------------------------------------------
# 四、JOLTS（落後約 2 個月）
# ---------------------------------------------------------------------------
jolts:
  - id: JTSJOL
    label: 職缺數
    unit: thousands
    enabled: true
  - id: JTSHIR
    label: 招聘率
    unit: percent
    enabled: true
  - id: JTSQUR
    label: 離職率 (quits)
    unit: percent
    enabled: true
  - id: JTSLDR
    label: 裁員率
    unit: percent
    invert: true
    enabled: true
  - id: JTSTSR
    label: 總離職率
    unit: percent
    enabled: false      # ＝離職率＋裁員率，兩者都已單獨列出，這條是重複資訊

# ---------------------------------------------------------------------------
# 五、每週失業金申請
# ---------------------------------------------------------------------------
claims:
  - id: ICSA
    label: 初次申請失業金
    unit: persons
    invert: true
    enabled: true
  - id: IC4WSA
    label: 初領 4 週移動平均
    unit: persons
    invert: true
    enabled: true
  - id: CCSA
    label: 續領失業金
    unit: persons
    invert: true
    enabled: true

# ---------------------------------------------------------------------------
# 六、參照指標（缺口與市場）
# ---------------------------------------------------------------------------
reference:
  - id: NROU
    label: 自然失業率 u* (CBO)
    unit: percent
    frequency: quarterly
    enabled: false      # 2026-10 起失業率基準統一用 FOMC 的 SEP，CBO 的不再用
  # 實質薪資用：平均時薪年增率以 CPI-U 平減（跟 BLS 的 Real Earnings 同口徑）。
  # 通膨模組也抓這一條，這裡多抓一次換取模組獨立（就業頁不必等通膨模組）。
  - id: CPIAUCSL
    label: CPI-U（實質薪資平減用）
    unit: index
    enabled: true

  # ---- FOMC 對長期失業率的判斷（＝聯準會自己認定的充分就業）----
  #
  # 九宮格就業軸的門檻來源。先前是綜合分數 ±0.45 加旗標淨值 ±3，
  # 兩個都是這個專案自己選的、沒有任何外部依據——而它們跟通膨軸一起
  # 決定整張固定收益部位對照表。
  #
  # 為什麼用 FOMC 的而不是 CBO 的 NROU：九宮格問的是「聯準會會怎麼做」，
  # 而聯準會是照**它自己的**估計行動。而且這樣兩條軸都錨在同一份 SEP 的
  # 長期判斷上，完全對稱。
  #
  # 帶寬也不用自己選——直接用中央趨勢的寬度（2026-06 SEP 是 4.0–4.3%），
  # 那是 FOMC 成員彼此意見的分歧程度，不是誰拍板的。
  - id: UNRATEMDLR
    label: FOMC 長期失業率（中位數）
    unit: percent
    enabled: true
  - id: UNRATECTLLR
    label: FOMC 長期失業率（中央趨勢下緣）
    unit: percent
    enabled: true
  - id: UNRATECTHLR
    label: FOMC 長期失業率（中央趨勢上緣）
    unit: percent
    enabled: true
  - id: DGS2
    label: 2 年期公債殖利率
    unit: percent
    frequency: daily
    enabled: false      # 長端模組已經抓同一條，重複抓一次只是多一次 API 呼叫
  - id: DGS10
    label: 10 年期公債殖利率
    unit: percent
    frequency: daily
    enabled: false      # 同上，由長端模組負責
  - id: DFF
    label: 有效聯邦資金利率
    unit: percent
    frequency: daily
    enabled: false      # 沒有任何地方讀它。政策利率由 config/fomc.yaml 的 policy_rate 提供

# ---------------------------------------------------------------------------
# 七、產業細項 — 貢獻度瀑布圖的原料
#     order 決定瀑布圖由左至右的排列
# ---------------------------------------------------------------------------
industries:
  - id: USMINE
    label: 礦業與伐木
    order: 1
  - id: USCONS
    label: 營建
    order: 2
  - id: MANEMP
    label: 製造業
    order: 3
  - id: USWTRADE
    label: 批發
    order: 4
  - id: USTRADE
    label: 零售
    order: 5
  - id: CES4300000001
    label: 運輸倉儲
    order: 6
  - id: CES4422000001
    label: 公用事業
    order: 7
  - id: USINFO
    label: 資訊
    order: 8
  - id: USFIRE
    label: 金融活動
    order: 9
  - id: USPBS
    label: 專業與商業服務
    order: 10
  - id: CES6562000001
    label: 醫療與社福
    order: 11
    noncyclical: true          # 標記為非週期性，用於「剔除後」的聚合
  - id: CES6561000001
    label: 民間教育
    order: 12
  - id: USLAH
    label: 休閒與住宿餐飲
    order: 13
  - id: USSERV
    label: 其他服務
    order: 14
  - id: CES9091000001
    label: 聯邦政府
    order: 15
    noncyclical: true
  - id: CES9092000001
    label: 州政府
    order: 16
    noncyclical: true
  - id: CES9093000001
    label: 地方政府
    order: 17
    noncyclical: true

# 地方政府教育 — 單獨追蹤（7 月的季節性爭議就在這裡）
special_series:
  - id: CES9093161101
    label: 地方政府教育
    enabled: true
  # 兩條領先型「金絲雀」：企業縮編先砍派遣、先砍工時，之後才裁正職。
  # 只給規則引擎的訊號用，不進 KPI 卡。
  - id: TEMPHELPS
    label: 臨時支援服務就業
    enabled: true
  - id: AWHMAN
    label: 製造業平均週工時
    enabled: true

# ---------------------------------------------------------------------------
# 八、Regime 紅綠燈門檻
#     每個指標給「綠 / 黃 / 紅」的判定門檻。
#     direction: lower_is_worse 表示數值越低越糟（例如 quits rate）
# ---------------------------------------------------------------------------
regime_lights:
  # 失去工作者比重：兩條規則合判，狀態由 src/analysis/job_losers.py 直接給
  # （留意＝3 個月變化 z≥1.5；警戒＝較一年低點上升 ≥3pp 連 2 個月）
  - key: job_losers
    label: 失去工作者比重
    desc: 失業的人當中被裁員、約滿沒續的比重，比過去一年的低點高多少。歷次衰退都上升 12 個百分點以上
    direction: custom
  - key: vu_ratio
    label: 職缺 vs 失業人數
    desc: 每一個失業的人平均對應到幾個職缺。低於 1 代表工作機會不夠分
    direction: lower_is_worse
    green_above: 1.00
    red_below: 0.80
  - key: quits_rate
    label: 主動離職率
    desc: 自己辭職的人佔比。敢辭職代表對找到新工作有信心，是勞工信心的溫度計
    direction: lower_is_worse
    green_above: 2.20
    red_below: 1.90
  - key: layoff_rate
    label: 裁員率
    desc: 每月被裁員的人佔總就業的比例。愈高代表企業愈想縮編
    direction: higher_is_worse
    green_below: 1.20
    red_above: 1.40
  - key: continuing_claims
    label: 還在領失業補助
    desc: 持續領失業給付的人數。愈多代表失業後愈難找到下一份工作
    direction: higher_is_worse
    green_below: 1900000
    red_above: 2100000
  - key: prime_epop
    label: 壯年就業比例
    desc: 25 到 54 歲有工作的比例。排除退休與就學的干擾，最能反映真實就業狀況
    direction: lower_is_worse
    green_above: 80.5
    red_below: 79.5

# ---------------------------------------------------------------------------
# 年度基準修正（CES benchmark revision）—— FRED 沒有，手動維護
# ---------------------------------------------------------------------------
# 每年用失業保險稅籍資料（QCEW）把 3 月的非農就業水準校正一次：
# 8–9 月公布初估，隔年 2 月隨 1 月就業報告正式併入，修正幅度依 BLS 慣例
# 攤進前一年 4 月到當年 3 月。公布後 75 天內列為「本期關鍵訊號」，
# 之後只留在「歷史數據修正」卡，直到正式併入。
# 來源：https://www.bls.gov/news.release/archives/prebmk_08282026.htm
# 每年 8–9 月 BLS 公布新初估時更新這一段；2027 年 2 月正式併入後改填正式值。
benchmark_revision:
  published: 2026-08-28
  reference: 2026 年 3 月
  period: 2025/4–2026/3
  total: -79          # 千人（非農）
  private: -178       # 千人（民間）
  pct: -0.1           # 佔非農就業的百分比
  status: 初估
  final: 2027 年 2 月（隨 2027 年 1 月就業報告）
