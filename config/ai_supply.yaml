# 每 GW 每年需要賺多少（億美元）
cost:
  build: 550             # 每 GW 全部投資
  server_share: 0.7      # 其中伺服器（晶片、網路）佔比
  server_life: 5.6       # 年；四大雲 10-K：微軟 6、Google 6、Meta 5.5、Amazon 5 的平均
  shell_life: 20         # 機房建物
  power_cents: 9.64      # 美分／度；EIA 工業電價（2026/8）
  hours: 8760
  rate: 0.055            # 投資等級公司債殖利率
  debt_share: 0.6        # 用借錢的比例

# AI 實驗室年化營收（ARR），每家放最近兩個點（算每月新增）
