# AI 大事「AI 供需」（2026-11）——人工維護，財報季更新。
#
# 計算邏輯參考 Threads 上的 AI 供需分析文章（只用它的算法，不用它的數字與假設）：
#   供給：晶片廠的 AI 營收 ÷ 每 GW 的晶片金額 → 出貨了多少 GW 算力
#   每 GW 每年需要賺多少：伺服器折舊＋機房折舊＋電費＋資金成本（下方 cost）
#   隱含利用率＝AI 實驗室年化營收（ARR）÷（已出貨且滿 9 個月、近 6 年內的算力 × 每 GW 每年需賺）
#   每月新增 ARR 要追上的量＝近 4 季出貨 GW × 每 GW 每年需賺 ÷ 12
#
# 單位：億美元。est: true＝依年增率／季增率或年度數字推算，畫面上標「估」。
# 每家 rev：period_end 是該期結束日；kind: y 是整個會計年度（只算進累計算力），其餘是單季。
asof: '2026-10-31'
lag_months: 9            # 出貨後約 9 個月才上線（建機房、上架、驗收）
life_years: 6            # 只算近 6 年出貨的算力

vendors:
