.fx-dec td,.fx-dec th{text-align:left}
.fx-dots circle{fill:var(--series-1);opacity:.85}

.fx-dots .yl{text-anchor:end}.fx-dots .xl{text-anchor:middle;font-size:12px}

.fx-sep td,.fx-sep th{text-align:right;white-space:nowrap}

.fx-sep td small.up{color:var(--critical)}.fx-sep td small.dn{color:var(--good)}
/* Meeting minutes: same source content on desktop and phone. */
.mn-overview{font-size:15px;line-height:1.85;margin:8px 0;color:var(--text-primary)}

@media(max-width:640px){

  .mn-table tr{display:block;padding:16px 0}

.el-card .home-zone-head{flex-direction:row;align-items:flex-start}

.home-status.dovish{color:var(--series-1);background:var(--tint-dov)}

.home-module-stats span{display:block;font-size:10.5px;color:var(--muted)}
.home-module-stats b{display:block;margin-top:2px;font-size:14px;

.home-change-list{display:grid;gap:0;border-top:1px solid var(--grid)}
.home-change{display:grid;grid-template-columns:8px minmax(0,1fr);gap:0 10px;
  padding:13px 2px;border-bottom:1px solid var(--grid)}
.home-change-dot{width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--muted-bar)}
.home-change-dot.hawkish{background:var(--series-2)}
.home-change-dot.dovish{background:var(--series-1)}
.home-change>div{display:flex;flex-direction:column;min-width:0}
.home-change b{font-size:13.5px}
.home-change span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.home-change p{grid-column:2;font-size:12.5px;line-height:1.5;color:var(--text-secondary);margin:5px 0 0}

/* 接下來看什麼：發布日倒數 ＋「它會動什麼」。

.home-next-list{border-top:1px solid var(--grid)}
.hn-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 14px;

/* 本週／下週分組標題；影響小標（高＝實心、中＝外框），顏色不單獨承載意義 */
.hn-group{font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--muted);padding:14px 2px 4px;border-bottom:1px solid var(--grid)}
.hn-imp{display:inline-block;font-style:normal;font-size:10.5px;

.hn-imp.mid{border:1px solid var(--border);color:var(--text-secondary)}
@media(min-width:760px){

@media(min-width:760px){

/* ---------- 內容頁 v3：主卡精簡、主題單層收合 ---------- */
.focus-card{padding:18px 17px;border-radius:15px;border-top-width:4px}
.focus-title{font-size:25px;line-height:1.25}
.focus-sub{max-width:52em;line-height:1.65;margin-top:7px}
.focus-grid{grid-template-columns:1fr;gap:0;margin-top:17px;
  border-top:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.focus-metric{display:grid;grid-template-columns:minmax(94px,.7fr) minmax(0,1fr);
  gap:2px 12px;align-items:start;padding:11px 4px;border:0;border-radius:0;
  border-bottom:1px solid var(--grid);background:transparent}
.focus-metric:last-child{border-bottom:0}
.focus-metric>span{grid-column:1;grid-row:1/3;padding-top:2px}
.focus-metric>b{grid-column:2;font-size:17px;overflow-wrap:anywhere}
.focus-metric>small{grid-column:2;line-height:1.45}
.focus-metric.hawkish,.focus-metric.dovish,.focus-metric.watch{border-left:0}
.focus-metric.hawkish{box-shadow:inset 3px 0 0 var(--critical)}
.focus-metric.dovish{box-shadow:inset 3px 0 0 var(--good)}
.focus-metric.watch{box-shadow:inset 3px 0 0 var(--warning)}

.focus-evidence{margin:14px 0 0;padding:0;border-top:1px solid var(--grid)}
.focus-evidence>summary{display:flex;align-items:center;min-height:44px;padding:9px 0;
  font-size:12.5px;color:var(--series-1)}
/* 卡內收合統一「開頭 ▸/▾」家族 */
.focus-evidence>summary::before{content:"▸";margin-right:6px;font-size:10px}
.focus-evidence[open]>summary::before{content:"▾"}
.focus-evidence>summary::after{content:""}
.focus-evidence-body{padding:0 0 5px}
.focus-evidence .logic-strip{margin-top:0;gap:0}
.focus-evidence .logic-step{padding:10px 2px;border:0;border-radius:0;
  border-bottom:1px solid var(--grid);background:transparent}
.focus-evidence .logic-step:last-child{border-bottom:0}
.focus-evidence .grid-flow{margin-top:0}
.focus-evidence .flow-box{background:var(--surface-2);box-shadow:none}

.focus-card .data-line{margin-top:10px;padding-top:9px;border-top:1px solid var(--grid);
  gap:3px 12px}
.focus-card .data-tag{padding:2px 0;border:0;border-radius:0;background:transparent;
  color:var(--muted)}
.focus-card .data-tag[href]{min-height:40px}

/* 下方每個主題就是唯一可操作的收合層；內部舊細節只做靜態分隔。 */
/* 教學層：「這在看什麼？」。全站固定樣式與位置——讀者看熟了就知道
   每一區都有地方可以學。刻意用不同底色跟證據層（f-more）區分：
   一個是教你怎麼讀，一個是給你驗算。 */
/* 收合時只是一行提示——跟「依據」（.f-more）同字級、同高度、同位置感，
   卡片的比例才不會被一個大盒子撐歪；全站每張卡都長一樣。
   展開後內容才進到虛線盒（教學內容跟證據層還是要分得出來）。
   summary 上下 padding 12px：17px 行高 + 24px ＝ 41px，滿足 40px 觸控高。 */
.teach{margin:0 0 4px;border:0;border-radius:0;background:transparent}
.teach>summary{cursor:pointer;list-style:none;padding:12px 0;font-size:12.5px;
  font-weight:500;color:var(--muted)}
.teach>summary:hover{color:var(--series-1)}
.teach>summary::-webkit-details-marker{display:none}
.teach>summary::before{content:"？";display:inline-block;width:17px;height:17px;
  line-height:17px;text-align:center;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--grid);margin-right:7px;font-size:11px}
.teach-body{margin:2px 0 12px;padding:8px 12px;border:1px dashed var(--grid);
  border-radius:9px;background:var(--surface-2);
  font-size:12.5px;line-height:1.8;color:var(--text-primary)}
.teach-body p{margin:6px 0}
/* 關鍵指標檢核：格子等高。高度不一的原因是各格的說明文長度不同，
   說明移進收合層之後，剩下的固定四行（名稱／數值／狀態／歷史條）自然等高。 */
/* 獨立成最後一行：inline-block 的上下 padding 會把它所在那一行撐高，
   說明文中間突然出現一段大行距。padding 保留，觸控高度仍 ≥ 40px。 */
/* 流動性頁「關鍵指標檢核」：表格在窄螢幕改成一列一張卡（data-label 當欄名），
   兩欄比較框、事件清單、傳導流程、跨資產卡片都隨寬度自動換排。 */
/* RP／RRP 圖解：手機改單欄，流向中間那段文字可換行（原本兩欄＋不換行，390px 溢出 120px） */
.rp-row{grid-template-columns:1fr!important}
@media(min-width:640px){.rp-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.rp-row .stat{min-width:0}
.rp-flow-mid{flex:1;min-width:0;text-align:center;font-size:12px;line-height:1.35}
.lq-tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;table-layout:auto}
.lq-tbl th,.lq-tbl td{padding:9px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top;line-height:1.55}
.lq-tbl th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.lq-tbl td.k{min-width:9em}
.lq-tbl td.k b{display:block;white-space:nowrap}
.lq-tbl td.k small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.lq-tbl td.k em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.st{font-weight:600;white-space:normal}
.st.good{color:var(--good)}.st.warning{color:var(--warning)}.st.critical{color:var(--critical)}
.lq-rules td:not(.k){width:22%}
@media(max-width:640px){
  .lq-tbl thead{display:none}
  .lq-tbl,.lq-tbl tbody,.lq-tbl tr{display:block;width:100%}
  .lq-tbl tr{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .lq-tbl td{display:grid;grid-template-columns:4.5em 1fr;gap:10px;border:0;padding:4px 0;width:auto!important}
  .lq-tbl td::before{content:attr(data-label);font-size:12px;color:var(--muted)}
  .lq-tbl td.k{display:block;border-bottom:1px solid var(--grid);padding-bottom:6px;margin-bottom:4px}

.lq-check{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.lq-concl{margin:10px 0 2px;line-height:1.75}
.lq-2col{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.lq-2col{grid-template-columns:1fr 1fr}}
.lq-box{border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.lq-box.press{border-top:3px solid var(--warning)}.lq-box.hold{border-top:3px solid var(--good)}
.lq-box-h{font-weight:700;font-size:13.5px;margin-bottom:4px}
.lq-box ul{margin:0;padding-left:18px}.lq-box li{margin:6px 0;line-height:1.65;font-size:13.5px}
.lq-watch{list-style:none;padding:0;margin:6px 0;display:grid;gap:10px}

.lq-when{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lq-imp{font-size:11.5px;font-weight:700;text-align:center;border-radius:6px;padding:1px 0}
.lq-imp.i3{background:var(--critical);color:var(--on-status)}.lq-imp.i2{background:var(--warning);color:var(--on-status)}

@media(max-width:520px){.lq-watch li{grid-template-columns:auto auto;justify-content:start}

/* 燈卡的收合改用全站統一的「開頭 ▸/▾」——先前是結尾 ▾，

/* ===================================================================
   2026-10 圖表改版：近 5 期（kh）、精簡走勢（cl）、瀑布（wf）、
   數線（nl）、傳導鏈（chain）、零軸細柱（gc）
   =================================================================== */
.kh{margin-top:10px;font-variant-numeric:tabular-nums}
.kh-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
  color:var(--muted);margin-bottom:4px}
.kh-vals,.kh-dates{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));
  text-align:center}
.kh-vals span{font-size:12.5px;color:var(--text-secondary);font-weight:500}
.kh-vals span.last{color:var(--series-1);font-weight:700}
.kh-dates span{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.kh-plot{position:relative;height:76px;display:grid;
  grid-template-columns:repeat(var(--n),minmax(0,1fr));
  border-bottom:1px solid var(--grid)}
.kh-col{position:relative;cursor:default}
.kh-col:hover{background:var(--surface-2)}
.kh-bar{position:absolute;left:50%;transform:translateX(-50%);width:min(22px,46%);
  background:var(--muted-bar);border-radius:3px}
.kh-bar.last{background:var(--series-1)}
.kh-dot{position:absolute;left:50%;width:9px;height:9px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--muted-bar);
  box-shadow:0 0 0 2px var(--surface-1)}
.kh-dot.last{background:var(--series-1);width:11px;height:11px}
.kh-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kh-ref{position:absolute;left:0;right:0;border-top:1.5px dashed var(--text-secondary);
  pointer-events:none;z-index:1}
.kh-zero{position:absolute;left:0;right:0;border-top:1px solid var(--baseline);
  pointer-events:none}
.kh-band{position:absolute;left:0;right:0;background:rgba(42,120,214,.12);
  pointer-events:none}
.kh-leg,.cl-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;
  color:var(--text-secondary);margin-top:8px}
.kh-leg span,.cl-leg span{display:inline-flex;align-items:center;gap:5px}
.cl-leg i{display:inline-block;width:14px;height:3px;border-radius:2px}
.cl-leg b{color:var(--text-primary)}
.cl-leg em{font-style:normal;color:var(--muted);font-size:11px}
i.lg-ref{display:inline-block;width:16px;height:0!important;
  border-top:1.5px dashed var(--text-secondary);background:none!important}
i.lg-band{display:inline-block;width:14px;height:10px;background:rgba(42,120,214,.18);
  border-radius:2px}
i.lg-fill{display:inline-block;width:14px!important;height:10px!important;
  background:rgba(235,104,52,.22)!important}

.cl{margin-top:8px}
.cl-plot{position:relative;margin-left:38px;border-bottom:1px solid var(--baseline)}
.cl-plot svg{display:block;width:100%;height:100%}
.cl-tick{position:absolute;right:calc(100% + 6px);transform:translateY(-50%);
  font-size:11px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.cl-reflab{position:absolute;left:4px;transform:translateY(-120%);font-size:11px;
  color:var(--text-secondary);background:var(--surface-1);padding:0 3px;
  border-radius:3px;pointer-events:none}
.cl-hit{position:absolute;top:0;bottom:0;z-index:2}
.cl-hit:hover::after{content:"";position:absolute;left:50%;top:0;bottom:0;
  border-left:1px solid var(--text-secondary);opacity:.5}
.cl-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
  margin:5px 0 0 38px;font-variant-numeric:tabular-nums}
.cl-note{font-size:12px;color:var(--muted);margin-top:4px}
.cl-pair{display:grid;gap:18px}
@media(min-width:760px){.cl-pair{grid-template-columns:1fr 1fr}}
.cl-pair h4,.viz-h{font-size:13.5px;margin:0 0 2px;font-weight:700;color:var(--text-primary)}
.viz-sub{font-size:12px;color:var(--muted);margin:0 0 4px}

.wf{margin-top:14px}
.wf-row{display:grid;grid-template-columns:minmax(84px,30%) 1fr 72px;gap:10px;
  align-items:center;padding:7px 4px;border-radius:6px}
.wf-row:hover{background:var(--surface-2)}
.wf-name{font-size:13px;line-height:1.35}
.wf-note{display:block;font-size:11px;color:var(--muted)}
.wf-track{position:relative;height:18px}
.wf-zero{position:absolute;top:-8px;bottom:-8px;border-left:1px solid var(--text-secondary)}
.wf-seg{position:absolute;top:0;bottom:0;border-radius:3px}
.wf-seg.up{background:var(--neg)}
.wf-seg.dn{background:var(--pos)}
.wf-val{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.wf-val small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.wf-val.up{color:var(--critical)}
.wf-val.dn{color:var(--series-1)}
.wf-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-secondary);
  margin-top:8px}
.wf-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;
  vertical-align:-2px;margin-right:5px}
.wf-leg i.up{background:var(--neg)}
.wf-leg i.dn{background:var(--pos)}
.wf-hint{color:var(--muted)}

.nl{margin:18px 4px 4px}
.nl-axis{position:relative;height:22px;border-bottom:2px solid var(--baseline)}
.nl-dot{position:absolute;bottom:-8px;width:14px;height:14px;border-radius:50%;
  transform:translateX(-50%);box-shadow:0 0 0 2px var(--surface-1);z-index:2}
.nl-tgt{position:absolute;bottom:-10px;height:30px;border-left:2px dashed var(--text-secondary)}
.nl-tgtlab{position:absolute;top:-16px;transform:translateX(-50%);font-size:11.5px;
  color:var(--text-secondary);white-space:nowrap;font-weight:600}
.nl-ticks{position:relative;height:18px;margin-top:4px}
.nl-ticks span{position:absolute;transform:translateX(-50%);font-size:11px;
  color:var(--muted);top:4px}
.nl-labs{margin-top:6px}
.nl-lab{position:relative;height:24px}
.nl-txt{position:absolute;left:clamp(0px,calc(var(--x) - 80px),calc(100% - 190px));
  font-size:12.5px;white-space:nowrap;top:3px}
.nl-txt i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.nl-txt b{font-variant-numeric:tabular-nums}

.chain{display:grid;grid-template-columns:1fr;gap:0;margin:14px 0 4px}
@media(min-width:760px){.chain{grid-template-columns:1fr 76px 1fr 76px 1fr;align-items:stretch}}
.ch-step{border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  background:var(--surface-1)}
.ch-step.hl{border-color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--text-primary)}
.ch-lab{font-size:12.5px;color:var(--text-secondary);font-weight:600}
.ch-val{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.ch-step.up .ch-val{color:var(--critical)}
.ch-step.down .ch-val{color:var(--series-1)}
.ch-note{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.ch-arrow{display:flex;align-items:center;justify-content:center;position:relative;
  height:30px;font-size:11px;color:var(--muted);text-align:center;line-height:1.35}
.ch-arrow::before{content:"↓";font-size:16px;color:var(--text-secondary);margin-right:6px}
@media(min-width:760px){
  .ch-arrow{height:auto;flex-direction:column}
  .ch-arrow::before{content:"→";font-size:20px;margin:0}
}

.gc{margin-top:8px}
.gc-plot{position:relative;height:96px;display:flex;gap:2px;margin-left:38px}
.gc-plot.lbl{margin-bottom:18px}
.gc-zero{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--text-secondary)}
.gc-mx,.gc-mn{position:absolute;right:calc(100% + 6px);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.gc-mx{top:-6px}.gc-mn{bottom:-6px}
.gc-col{position:relative;flex:1 1 0;min-width:0}
.gc-col:hover{background:var(--surface-2)}
.gc-bar{position:absolute;left:12%;right:12%;border-radius:2px;opacity:.45}
.gc-bar.up{background:var(--neg)}.gc-bar.dn{background:var(--pos)}
.gc-bar.on{opacity:1}
.gc-lab{position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10.5px;
  color:var(--muted);margin-top:3px}
.cl-leg i.gc-up{width:10px;height:10px;background:var(--neg)}
.cl-leg i.gc-dn{width:10px;height:10px;background:var(--pos)}
.viz-block{margin-top:18px}

/* ---------- 長端頁（2026-10）---------- */
.le-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 22px;margin:4px 0 6px}
.le-k{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.le-big b{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.le-small b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.le-small span:last-child{display:block;font-size:12.5px;color:var(--muted)}
.le-chg{display:inline-block;margin-left:10px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:6px}
.le-chg.up{background:#fbe9e9;color:var(--critical)}.le-chg.dn{background:#e6eef9;color:var(--series-1)}
.le-asof{font-size:12px;color:var(--muted);margin-left:auto}
.sg{margin-top:14px}
.sg-h{font-size:12.5px;color:var(--text-secondary);font-weight:600;margin-bottom:6px}
.sg-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.sg-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;min-width:0}
.sg-seg b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.sg .cl-leg i{width:10px!important;height:10px!important}
.sg-neg{font-size:12px;color:var(--muted);margin-top:4px}
.le-tiles{display:grid;gap:8px;margin-top:14px}
@media(min-width:760px){.le-tiles{grid-template-columns:repeat(3,1fr)}}
.le-tile{position:relative;border:1px solid var(--border);border-left:5px solid var(--c);border-radius:10px;
  padding:10px 12px;background:var(--surface-1)}
.le-tile.main{box-shadow:0 0 0 2px var(--c) inset}
.le-badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--brand-orange-fill);border-radius:999px;
  padding:1px 8px;margin-left:8px;vertical-align:2px}
.le-tile .le-badge{position:absolute;right:10px;top:10px;margin:0}
.le-tk{font-size:12px;font-weight:700;color:var(--text-secondary);letter-spacing:.04em}
.le-tn{font-size:14px;font-weight:700;margin-top:1px}
.le-tv{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.le-tv span{font-size:13px;margin-left:8px;font-weight:700}
.le-tv .up{color:var(--critical)}.le-tv .dn{color:var(--series-1)}
.le-tx{font-size:12.5px;color:var(--text-secondary);margin-top:4px;line-height:1.55}
.evs{margin-top:14px;border-top:1px solid var(--grid);padding-top:10px}
.evs-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:4px}
.ev{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:3px 0}
.ev-d{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;color:var(--brand-ink)}
.ev-k{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-secondary);white-space:nowrap}
.tabs{margin-top:12px}
.tabs>input{position:absolute;opacity:0;pointer-events:none}
.tabs>label{display:inline-block;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid var(--border);
  border-radius:999px;margin:0 6px 8px 0;cursor:pointer;color:var(--text-secondary)}
.tabs>input:checked+label{background:var(--brand-navy);color:#fff;border-color:var(--brand-ink)}
.tabs>input:focus-visible+label{outline:2px solid var(--series-1)}
.tabp{display:none}
#le-br1:checked~.tabp.p1,#le-br3:checked~.tabp.p3,#le-br12:checked~.tabp.p12{display:block}
/* 情境頁「金融條件」（FCI-G 分解圖，2026-10）：調色盤＝dataviz 參考調色盤前七格（已驗證：堆疊相鄰色、深淺模式都過） */
:root{--fci-1:#2a78d6;--fci-2:#eb6834;--fci-3:#1baf7a;--fci-4:#eda100;--fci-5:#e87ba4;--fci-6:#008300;--fci-7:#6250d6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fci-1:#3987e5;--fci-2:#d95926;--fci-3:#199e70;--fci-4:#c98500;--fci-5:#d55181;--fci-6:#008300;--fci-7:#9085e9}}
:root[data-theme="dark"]{--fci-1:#3987e5;--fci-2:#d95926;--fci-3:#199e70;--fci-4:#c98500;--fci-5:#d55181;--fci-6:#008300;--fci-7:#9085e9}
#fci-r10:checked~.tabp.p10,#fci-r5:checked~.tabp.p5,#fci-r1:checked~.tabp.p1{display:block}
/* 長端頁「市場籌碼」（2026-10）：期貨 DV01 矩陣（手機一個參與者一張卡）、交易商庫存 */
#flw-t1:checked~.tabp.p1,#flw-t2:checked~.tabp.p2{display:block}
.viz-root:not(#_) .flw-head{margin:2px 0 8px;font-size:var(--fs-body);line-height:1.6;color:var(--text-primary)}
.flw-sum{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:4px 0 14px;background:var(--surface-2)}
.flw-verdict{margin:0 0 12px;font-size:22px;font-weight:700;line-height:1.35;color:var(--text-primary)}
@media(max-width:600px){.flw-verdict{font-size:19px}}
.flw-sum-k{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.flw-bar{position:relative;height:14px;border-radius:7px;background:var(--fci-2);overflow:hidden}
.flw-bar i{position:absolute;top:0;bottom:0;display:block}
.flw-bar i.now{left:0;background:var(--fci-3)}
.flw-bar i.ago{width:0;border-left:2px dashed var(--surface-1)}
.flw-bar-lab{display:flex;justify-content:space-between;gap:8px;margin:6px 0 14px;font-size:13px;color:var(--text-secondary)}
.flw-bar-lab b{font-size:16px;color:var(--text-primary);font-variant-numeric:tabular-nums;margin:0 2px}
.flw-bar-lab em{font-style:normal;color:var(--muted);font-size:12px}
.flw-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flw-chip{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.flw-chip span{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary)}
.flw-chip em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.3}
.flw-chip b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.flw-wrap{margin:8px 0 6px}
.flw-mx{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
.flw-mx th,.flw-mx td{padding:7px 6px;border-bottom:1px solid var(--grid);text-align:right;vertical-align:top;line-height:1.35}
.flw-mx thead th{font-size:12px;color:var(--muted);font-weight:600}
.flw-mx thead th:first-child,.flw-mx tbody th{text-align:left}
.flw-mx thead th:first-child{width:22%}
.flw-mx tbody th{font-size:13px;font-weight:600;color:var(--text-primary)}
.flw-mx td b{display:block;font-size:15px;color:var(--text-primary)}
.flw-mx td b.pos{color:var(--series-1)}.flw-mx td b.neg{color:var(--series-2)}
.flw-mx td small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.flw-mx td.tot{background:var(--surface-2)}
@media(max-width:899px){
  .flw-mx,.flw-mx tbody,.flw-mx tr,.flw-mx th,.flw-mx td{display:block;width:auto}
  .flw-mx thead{display:none}
  .flw-mx tr{border:1px solid var(--border);border-radius:10px;margin:0 0 10px;padding:4px 10px}
  .flw-mx tbody th{padding:8px 0 4px;border-bottom:1px solid var(--grid)}
  .flw-mx td{display:grid;grid-template-columns:5.5em auto 1fr;gap:4px 10px;align-items:baseline;text-align:left;padding:6px 0}
  .flw-mx td::before{content:attr(data-label);font-size:12.5px;color:var(--text-secondary);font-weight:600}
  .flw-mx td b{display:inline;font-size:15px}
  .flw-mx td small{display:inline;text-align:right}
  .flw-mx td.tot{background:none;font-weight:600}
  .flw-mx tr td:last-child{border-bottom:0}}
.viz-root:not(#_) .flw-h3{margin:22px 0 6px;font-size:var(--fs-body);color:var(--text-primary)}
.viz-root:not(#_) .flw-read{margin:0 0 10px;font-size:var(--fs-small);line-height:1.65;color:var(--text-primary)}
.flw-stats{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0 12px}
@media(min-width:620px){.flw-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flw-stats>div{border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.flw-stats span{display:block;font-size:12px;font-weight:600;color:var(--text-secondary)}
.flw-stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-primary);margin:2px 0}
.flw-stats b small{font-size:12px;font-weight:400;color:var(--muted)}
.flw-stats em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.5}
.flw-eslr h4{margin:12px 0 4px;font-size:var(--fs-small);color:var(--text-primary)}
.flw-eslr ul{margin:4px 0 8px;padding-left:18px}.flw-eslr li{margin:3px 0;line-height:1.65}
.ic{margin-top:10px}
.ic-plot{position:relative;margin:6px 0 22px 40px}
.ic-grid{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.ic-grid.z{border-top:1px solid var(--text-secondary)}
.ic-tick{position:absolute;right:calc(100% + 6px);transform:translateY(-50%);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ic-cols{position:absolute;inset:0;display:flex}
.ic-col{position:relative;flex:1 1 0;min-width:0;cursor:crosshair}
.ic-col:hover,.ic-col[data-chart-selected]{background:color-mix(in srgb,var(--text-primary) 7%,transparent)}
.ic-col>i{position:absolute;left:12%;right:12%;display:block}
.ic-x{position:absolute;top:calc(100% + 4px);left:0;font-size:10.5px;color:var(--muted);white-space:nowrap}
/* 手機上十年的年份標籤太擠：只標偶數年（讀數框仍可查每個月） */
@media(max-width:600px){.ic-plot .ic-x.odd{display:none}}
.ic-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ic-leg-line{display:inline-block;width:14px;height:0!important;border-top:2px solid var(--text-primary);vertical-align:middle;background:none!important}
.viz-root:not(#_) .fci-head{margin:2px 0 8px;font-size:var(--fs-body);line-height:1.6;color:var(--text-primary)}
.fci-tot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:10px 0 4px}
.fci-tot b{font-size:26px;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.fci-tot span{font-size:var(--fs-small);color:var(--text-secondary)}
.fci-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
@media(min-width:620px){.fci-cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1000px){.fci-cards{grid-template-columns:repeat(7,minmax(0,1fr))}}
.fci-c{border:1px solid var(--border);border-radius:10px;padding:8px 10px;box-shadow:inset 0 3px 0 var(--c)}
.fci-c.main{border-color:var(--text-secondary)}
.fci-c>span{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);line-height:1.35;min-height:2.7em}
.fci-c>b{display:block;font-size:19px;font-variant-numeric:tabular-nums;color:var(--text-primary);margin:2px 0}
.fci-c>small{display:block;font-size:11.5px;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.br{margin-top:4px}
.br-row{display:grid;grid-template-columns:minmax(96px,32%) 1fr 70px;gap:10px;align-items:center;padding:6px 4px;border-radius:6px}
.br-row:hover{background:var(--surface-2)}
.br-row.main .br-name{font-weight:700}
.br-name{font-size:13px;line-height:1.35}
.br-note{display:block;font-size:11px;color:var(--muted)}
.br-track{position:relative;height:18px}
.br-guide{position:absolute;top:-10px;bottom:-10px;border-left:1px dashed var(--baseline)}

   align-items:start：只展開一張時，同列其他卡不被撐高出一大塊空白。 */
.le-lgs{display:grid;gap:14px;grid-template-columns:1fr}

/* 平板以上：組與組拼進同一張格線（dense），單張卡的組補進大組旁邊的空格，不會一組獨佔一整列。
   桌機三欄：4 張＝2×2 區塊（跨兩欄兩列）、3 張＝整列、2 張＝兩欄、1 張＝一欄。總數 9 張剛好排滿三列。
   平板兩欄：2 張以上的組佔整列（內部兩欄），1 張的兩組並排。卡片最窄約 320px。 */

/* ===================================================================
   字級系統（2026-10，使用者：「字體一下大一下小」）
   全站內容區只用 8 級，放在 CSS 最後統一收斂，個別元件不再自訂字級：
     --fs-display 40  頁首主數字（長端 10Y）
     --fs-title   26  結論卡標題（手機 22）
     --fs-num     22  卡片裡的數字（手機 20）
     --fs-h2      17  區塊標題
     --fs-h3      15  區塊內小標
     --fs-body    14  內文、結論句、表格、展開列
     --fs-small   12.5 標籤、註解、圖例、資料來源
     --fs-micro   11  座標軸刻度、徽章、日期格
   字重只用 400（內文）／600（標籤）／700（標題與數字）。
   =================================================================== */

/* 長端：首卡事件格、發行規模表（2026-10 第二輪） */
.ev-grid{display:grid;gap:4px 18px}

.sz-row{border-bottom:1px solid var(--grid)}

/* ===================================================================
   情境合成頁（2026-10 改版，手機優先）
   =================================================================== */
.sx-h3{font-size:var(--fs-h3);font-weight:700;margin:22px 0 10px}
.sx-note{font-size:var(--fs-small);color:var(--muted);line-height:1.6;margin-top:8px}
/* 首卡：本站判讀 vs 期貨定價 */
.sx-dv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-top:12px}
.sx-dv-c{padding:11px 13px;border-radius:10px;background:var(--surface-2);min-width:0;display:flex;flex-direction:column;gap:2px}
.sx-dv-c span{font-size:var(--fs-small);color:var(--muted)}

.sx-dv-c small{font-size:var(--fs-small);color:var(--text-secondary);line-height:1.4}
.sx-dv-vs{align-self:center;font-size:var(--fs-small);font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.sx-dv.agree .sx-dv-vs{background:var(--surface-2);color:var(--good);border:1px solid var(--good)}
.sx-dv.split .sx-dv-vs{background:var(--tint-haw);color:var(--critical);border:1px solid var(--critical)}
.sx-dv.na .sx-dv-vs{color:var(--muted)}
/* 九宮格上方：兩軸準則＋重心 */
.sx-axes{display:grid;gap:8px;margin:4px 0 12px}
@media(min-width:760px){.sx-axes{grid-template-columns:1fr 1fr}}
.sx-ax{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;
  padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.sx-ax-k{font-size:var(--fs-small);color:var(--muted);font-weight:600}
.sx-ax-v{font-size:var(--fs-h2);font-weight:700}
.sx-ax-t{font-size:var(--fs-small);color:var(--text-secondary);line-height:1.55}
.sx-ax-t b{color:var(--text-primary)}
@media(max-width:759px){.sx-ax{grid-template-columns:auto 1fr}.sx-ax-t{grid-column:1/-1}}
.sx-rg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 12px}
.sx-rg-k{font-size:var(--fs-small);color:var(--muted)}
.sx-rg b{font-size:var(--fs-body);font-weight:700}
.sx-ev{font-size:var(--fs-small);color:var(--text-secondary);background:var(--surface-2);
  border:1px solid var(--border);border-radius:999px;padding:2px 9px}
/* 相鄰格：實線框；手機上非相鄰格降成淡色 */

@media(min-width:760px){.scell.conflict{padding-right:14px}}
@media(max-width:759px){.scell{padding:10px 6px}}
.scell.conflict::after{top:3px;right:4px}

  .scell.far .sname{font-weight:600}

/* 格位軌跡：每月一張 3×3 小格 */

.sx-tg i{width:9px;height:9px;border-radius:2px;background:var(--grid)}
.sx-tg i.f{background:var(--text-secondary)}
.sx-tg i.f.hawkish{background:var(--serious)}.sx-tg i.f.dovish{background:var(--series-1)}

/* KPI 卡四格對齊（2026-10，使用者：「近 5 期與比較基準四個要對齊」）
   桌機：同一列的卡共用四條列軌（subgrid），每一格取該列最高者。
   展開某張卡的「近 5 期」只會撐高第四軌，其他卡的收合列仍貼在軌頂、位置不動。 */
@media(min-width:760px){
  .grid.inner:has(>.kpi){grid-auto-rows:auto;align-items:stretch}
  .grid.inner>.kpi{display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:0;align-content:start}
  .grid.inner>.kpi>div{align-self:start;min-width:0}
  .grid.inner>.kpi .k-label,.grid.inner>.kpi .k-chips,.grid.inner>.kpi .k-plain{min-height:0}
  .grid.inner>.kpi>.k-s1{align-self:stretch;display:flex;flex-direction:column}
  .grid.inner>.kpi .k-s1 .k-value{margin-top:auto;padding-top:5px}
}

  window.addEventListener('beforeprint', function(){
    document.querySelectorAll('details').forEach(function(d){
      if(!d.open){ d.dataset.wasClosed = '1'; d.open = true; }
    });
  });
  window.addEventListener('afterprint', function(){
    document.querySelectorAll('details[data-was-closed]').forEach(function(d){
      d.open = false; delete d.dataset.wasClosed;
    });
  });

  // 預載後備：不支援 Speculation Rules 的瀏覽器（Firefox／舊 Safari）
  // 改用「滑過（或手指按下）站內連結就 prefetch」——點下去時 HTML
  // 已經在快取裡。同一頁只抓一次。
  if(!HTMLScriptElement.supports || !HTMLScriptElement.supports('speculationrules')){
    var _pf = {};
    function prefetch(href){
      if(!href || _pf[href]) return;
      _pf[href] = 1;
      var l = document.createElement('link');
      l.rel = 'prefetch'; l.href = href;
      document.head.appendChild(l);
    }
    document.querySelectorAll('a[href^="/"]').forEach(function(a){
      var h = a.getAttribute('href').split('#')[0];
      if(!h || h === location.pathname) return;
      a.addEventListener('mouseenter', function(){ prefetch(h); }, {once:true});
      a.addEventListener('touchstart', function(){ prefetch(h); },
                         {once:true, passive:true});
    });
  }

  // 並排卡同步：同一列 g2 裡的兩張卡，一張開合、另一張跟著——
  // **只在桌機**。手機上 g2 是上下堆疊、不存在高度落差，同步反而變成
  // 「點左卡卻把並排的右卡也拉開」的怪行為（使用者實際回報過）。
  // 用「狀態不同才改」當終止條件，避免 toggle 事件互相觸發成迴圈。
  document.querySelectorAll('.grid.g2').forEach(function(g){
    var ds = g.querySelectorAll(':scope > details.sect');
    if(ds.length < 2) return;
    ds.forEach(function(d){
      d.addEventListener('toggle', function(){
        if(window.innerWidth < 760) return;
        ds.forEach(function(o){
          if(o !== d && o.open !== d.open) o.open = d.open;
        });
      });
    });
  });
  // 橫捲列兩側的漸層。外框掛 .fl/.fr，內層負責捲動。
  // 沒有這個提示的話橫捲列就是硬切一刀，讀者會以為「只有這幾項」——
  // 主選單在 360px 下有 32% 在視窗外，那 32% 裡包含「總覽」。
  function edgeFades(wrap, box){
    function upd(){
      var max=box.scrollWidth-box.clientWidth;
      wrap.classList.toggle('fl', box.scrollLeft>4);
      wrap.classList.toggle('fr', box.scrollLeft<max-4);
    }
    box.addEventListener('scroll',upd,{passive:true});
    window.addEventListener('resize',upd);
    return upd;
  }

  // ---- 主選單（置頂細條）----
  // ① 太陽放到目前分頁正下方；換頁時從上一頁的分頁滑過來
  //   （上一頁記在 sessionStorage，沒有就直接出現在定點）。
  // ② 窄螢幕橫捲：目前分頁若在可視範圍外，**最小移動**捲進來——不置中，
  //   置中會把「總覽」推出左邊，讀者以為回不了首頁。
  // ③ 頁首捲走後加 .stuck：陰影＋左側淡入 GG 標記。
  (function(){
    var bar=document.querySelector('.bnav'); if(!bar)return;
    var tabs=bar.querySelector('.bnav-tabs'), track=bar.querySelector('.bnav-track');
    var sun=bar.querySelector('.bnav-sun'), glow=bar.querySelector('.bnav-glow');
    var on=track.querySelector('a.on');
    function place(a){ if(!a)return; var x=a.offsetLeft+a.offsetWidth/2;
      sun.style.left=x+'px'; glow.style.left=x+'px'; }
    var prev=null; try{prev=sessionStorage.getItem('gg-sun');}catch(e){}
    var old=prev&&track.querySelector('a[href="'+prev+'"]');
    if(on&&old&&old!==on&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      sun.style.transition=glow.style.transition='none'; place(old);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        sun.style.transition=glow.style.transition=''; place(on); }); });
    } else place(on);
    try{ if(on)sessionStorage.setItem('gg-sun',on.getAttribute('href')); }catch(e){}
    if(on&&tabs.scrollWidth>tabs.clientWidth){
      var right=on.offsetLeft+on.offsetWidth+8-tabs.clientWidth;
      if(right>0)tabs.scrollLeft=right;
    }
    var upd=edgeFades(bar,tabs); upd();
    // 字型（Montserrat）晚一步載入時分頁寬度會變，太陽要跟著重放
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){place(on);upd();});
    window.addEventListener('resize',function(){place(on);});
    var head=document.querySelector('.brandwrap');
    if(head&&'IntersectionObserver' in window){
      new IntersectionObserver(function(es){
        bar.classList.toggle('stuck',!es[0].isIntersecting);
        setTimeout(upd,240);
      },{threshold:0}).observe(head);
    }
  })();

  // 橫捲表格（.tscroll／熱力圖）掛上同一套邊緣漸層。
  // 表格大多藏在收合層裡，收著的時候量不到寬度——所以任何 details
  // 開合時全部重算一次（toggle 不冒泡，用捕獲階段在 document 上接）。
  var tupds=[];
  document.querySelectorAll('.tscroll, .heatwrap').forEach(function(box){
    var wrap=document.createElement('div');
    wrap.className='twrap';
    box.parentNode.insertBefore(wrap,box);
    wrap.appendChild(box);
    tupds.push(edgeFades(wrap,box));
  });
  tupds.forEach(function(u){u();});
  if(tupds.length){
    document.addEventListener('toggle', function(){
      tupds.forEach(function(u){u();});
    }, true);
  }

  // ---- 頁內錨點導覽 ----
  // 三件事：什麼時候出現、兩側的漸層、現在在哪一段。
  (function(){
    var wrap=document.querySelector('.anav'); if(!wrap)return;
    var nav=wrap.querySelector('nav.anchors'); if(!nav)return;
    var shown=false;

    var _upd=edgeFades(wrap,nav);
    function fades(){ if(shown)_upd(); }

    // 出現的門檻＝展開三個卡區。那是「頁面開始變長」的分界：
    // 收合狀態整頁只有兩三千 px，用捲的就到了；按下「展開全部」之後
    // 會漲到一萬多 px，那時候才需要導覽。
    // 出現之後不再收回——導覽列忽隱忽現比一直在還煩。
    function check(){
      if(shown)return;
      if(document.querySelectorAll('details.sect[open]').length<3)return;
      // 導覽列排在內文上方，出現時整頁會往下推一個列高。
      // 讀者剛剛點開的那張卡會跟著跳走——要把捲動位置補回來。
      // Chrome／Firefox 的 scroll anchoring 會自己補，重複補就變成跳兩倍；
      // Safari 不支援，完全不補。所以先看瀏覽器動了沒，沒動才自己補。
      //
      // y0 一定要在改 class **之前**讀：讀 scrollY 會強制 reflow，
      // 而 reflow 正是瀏覽器補償的時機。改完才讀的話讀到的已經是補過的值，
      // 判斷會變成「瀏覽器沒動」，於是又補一次 → 剛好跳兩倍。
      var y0=window.scrollY;
      shown=true; wrap.classList.add('on');
      var h=wrap.getBoundingClientRect().height;
      requestAnimationFrame(function(){
        if(y0>0&&h&&Math.abs(window.scrollY-y0)<1)window.scrollBy(0,h);
        fades(); if(cur)center(cur);
      });
    }
    // toggle 事件不冒泡，要用捕獲階段接
    document.addEventListener('toggle',function(e){
      if(e.target.classList&&e.target.classList.contains('sect'))check();
    },true);
    document.querySelectorAll('.sect-tools button').forEach(function(b){
      b.addEventListener('click',function(){setTimeout(check,0);});
    });
    // 從別頁帶錨點跳進來時 openTarget() 會展開目標，這時也要重算
    window.addEventListener('hashchange',function(){setTimeout(check,0);});
    check();

    // ---- 現在在哪一段 ----
    var heads=[],cur=null;
    [].forEach.call(nav.querySelectorAll('a'),function(a){
      var el=document.getElementById(a.getAttribute('href').slice(1));
      if(el)heads.push({el:el,a:a});
    });
    function center(a){
      // 手機上這一列是橫捲的：高亮若落在可視範圍外就等於沒有高亮
      if(nav.scrollWidth<=nav.clientWidth)return;
      var want=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2;
      nav.scrollTo({left:Math.max(0,want),behavior:'smooth'});
    }
    function mark(a){
      if(!a||a===cur)return;
      if(cur)cur.classList.remove('on');
      cur=a; a.classList.add('on');
      if(shown)center(a);
    }
    // 判定方式是「越過導覽列那條線的最後一個標題」，不是「哪個標題在畫面上」。
    // 差別在於讀者多數時間是停在某一段的**中間**，畫面上一個標題都沒有——
    // 只看可見標題的話那段時間會沒有高亮，或是亂跳。
    var tick=false;
    function spy(){
      tick=false;
      if(!heads.length)return;
      var line=(shown?wrap.getBoundingClientRect().bottom:0)+10;
      var best=heads[0];
      for(var i=0;i<heads.length;i++){
        if(heads[i].el.getBoundingClientRect().top<=line)best=heads[i];
      }
      mark(best.a);
    }
    function queue(){
      if(tick)return; tick=true; requestAnimationFrame(spy);
    }
    window.addEventListener('scroll',queue,{passive:true});
    window.addEventListener('resize',queue);
    // 展開／收合會整個改變版面高度，位置要重算
    document.addEventListener('toggle',function(e){
      if(e.target.classList&&e.target.classList.contains('sect'))queue();
    },true);
    queue();

    // 點了就立刻標記，不必等捲動結束
    nav.addEventListener('click',function(e){
      var a=e.target.closest('a'); if(a)mark(a);
    });
  })();
  // 近 N 期數值列在窄卡片裡會超出可視範圍。捲到最右邊，
  // 讓「最新一期」那一格（.mcell.last）一定看得到——
  // 停在最左邊等於把整列裡最重要的那個數字藏起來。
  document.querySelectorAll('.mseries').forEach(function(m){
    if(m.scrollWidth>m.clientWidth)m.scrollLeft=m.scrollWidth;
  });
  var t=document.getElementById('tip');

  /* 聯準會官員樹：點人物 → 下方面板換人 */
  document.querySelectorAll('[data-ot]').forEach(function(ot){
    ot.addEventListener('click',function(e){
      var b=e.target.closest('.ot-n'); if(!b)return;
      var id=b.getAttribute('data-p');
      ot.querySelectorAll('.ot-n').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
      ot.querySelectorAll('.od').forEach(function(d){d.hidden=d.getAttribute('data-p')!==id;});
      var pn=ot.querySelector('.ot-panel');
      if(pn){var r=pn.getBoundingClientRect();
        if(r.top>window.innerHeight-120||r.bottom<0){pn.scrollIntoView({behavior:'smooth',block:'start'});}}
    });
  });


  // Full chart data are shared by mouse, touch, pen and keyboard.
  var CHARTS='.cl,.lwrap,.kh,.gc,.wf,.br,.sg,.nl,.dbars,.sstrip,.heatwrap,.hs3';
  function readout(host){
    var r=host.querySelector(':scope > .chart-readout');
    if(!r){r=document.createElement('div');r.className='chart-readout';r.setAttribute('role','status');r.setAttribute('aria-live','polite');host.appendChild(r);}
    return r;
  }
  function points(el){if(!el._chartPoints)el._chartPoints=JSON.parse(el.dataset.points);return el._chartPoints;}
  function choose(el,index){
    var data=points(el);if(!data.length)return;
    index=Math.max(0,Math.min(data.length-1,index));el._index=index;
    var p=data[index],plot=el.parentElement,host=el.closest(CHARTS)||plot.parentElement;
    el.setAttribute('aria-valuenow',index);el.setAttribute('aria-valuetext',p.date+' '+p.values.map(function(v){return v.label+' '+v.text;}).join('，'));
    var line=plot.querySelector('.chart-cursor');if(!line){line=document.createElement('span');line.className='chart-cursor';plot.appendChild(line);}line.style.left=p.x+'%';
    plot.querySelectorAll('.chart-selected-dot').forEach(function(d){d.remove();});
    var r=readout(host);r.replaceChildren();var date=document.createElement('strong');date.textContent=p.date;r.appendChild(date);
    var vals=document.createElement('div');vals.className='chart-readout-values';r.appendChild(vals);
    p.values.forEach(function(v){
      var row=document.createElement('span'),label=document.createElement('span'),dot=document.createElement('i'),value=document.createElement('b');
      dot.style.background=v.color;label.appendChild(dot);label.appendChild(document.createTextNode(v.label));value.textContent=v.text;row.appendChild(label);row.appendChild(value);vals.appendChild(row);
      if(v.y!==undefined&&v.y!==null){var d=document.createElement('span');d.className='chart-selected-dot';d.style.cssText='left:'+p.x+'%;top:'+v.y+'%;background:'+v.color;plot.appendChild(d);}
    });
    if(t)t.style.opacity=0;
  }
  function atX(el,x){var box=el.getBoundingClientRect(),xp=(x-box.left)/box.width*100,data=points(el),best=0,dist=Infinity;data.forEach(function(p,i){var d=Math.abs(p.x-xp);if(d<dist){best=i;dist=d;}});choose(el,best);}
  document.querySelectorAll('.chart-inspector').forEach(function(el){
    var host=el.closest(CHARTS)||el.parentElement.parentElement;
    readout(host).textContent='點選圖表查看數值；可左右拖動或使用方向鍵。';
  });
  var drag=null;
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest('.chart-inspector');
    if(el){atX(el,e.clientX);drag={el:el,id:e.pointerId,x:e.clientX,y:e.clientY};if(e.pointerType==='touch')el.setPointerCapture(e.pointerId);return;}
    var tip=e.target.closest('[data-tip]');if(!tip){if(t)t.style.opacity=0;return;}
    var host=tip.closest(CHARTS);
    if(host){host.querySelectorAll('[data-chart-selected]').forEach(function(x){x.removeAttribute('data-chart-selected');});tip.setAttribute('data-chart-selected','');var r=readout(host);r.replaceChildren();tip.dataset.tip.split('｜').forEach(function(part,i){var p=document.createElement(i===0?'strong':'div');p.textContent=part;r.appendChild(p);});if(t)t.style.opacity=0;}
    else{showTip(tip,e);}
  });
  document.addEventListener('pointermove',function(e){
    var el=e.target.closest('.chart-inspector');
    if(drag&&drag.id===e.pointerId&&e.pointerType==='touch'){
      if(Math.abs(e.clientY-drag.y)>Math.abs(e.clientX-drag.x)+8){drag=null;return;}
      if(Math.abs(e.clientX-drag.x)>8)atX(drag.el,e.clientX);return;
    }
    if(el&&e.pointerType!=='touch'){atX(el,e.clientX);return;}
    if(e.pointerType==='touch')return;var tip=e.target.closest('[data-tip]');if(tip)showTip(tip,e);else if(t)t.style.opacity=0;
  });
  document.addEventListener('pointerup',function(){drag=null;});
  document.addEventListener('pointercancel',function(){drag=null;});
  document.addEventListener('keydown',function(e){
    var el=e.target.closest('.chart-inspector');if(!el)return;var i=el._index===undefined?0:el._index;
    if(e.key==='ArrowLeft')i--;else if(e.key==='ArrowRight')i++;else if(e.key==='Home')i=0;else if(e.key==='End')i=points(el).length-1;else return;
    e.preventDefault();choose(el,i);
  });
  function showTip(el,e){
    if(!t)return;t.textContent=el.dataset.tip;t.style.opacity=1;
    var x=Math.min(Math.max(8,e.clientX+14),Math.max(8,window.innerWidth-t.offsetWidth-8));
    var y=e.clientY-34;if(y<8)y=e.clientY+22;y=Math.min(Math.max(8,y),Math.max(8,window.innerHeight-t.offsetHeight-8));
    t.style.left=x+'px';t.style.top=y+'px';
  }
  document.addEventListener('pointerout',function(e){if(e.pointerType!=='touch'&&t&&e.target.closest('[data-tip]'))t.style.opacity=0;});
  window.addEventListener('scroll',function(){if(t)t.style.opacity=0;},{passive:true});

})();
</script>
</body>
</html>
