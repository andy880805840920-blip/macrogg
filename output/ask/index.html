<style>
*{box-sizing:border-box}
/* 單一淺色主題。圖表繪製表面固定為 --surface-1（卡片），配色依此驗證。
   變數也掛在 :root：品牌頁首與置頂主選單在 .viz-root 外面，不掛的話
   --muted／--border 在那裡全是空值（EN 鈕的框線就是這樣消失的）。 */
:root,.viz-root{
  color-scheme:light;
  --page:#eeede9; --surface-1:#fcfcfb; --surface-2:#f3f3f0;
  --text-primary:#0b0b0b; --text-secondary:#45443f; --muted:#5f5e59;
  --grid:#e3e2db; --baseline:#c3c2b7; --border:rgba(11,11,11,0.13);
  /* 文字用的藍與橘要壓深一點：#2a78d6 在卡片底色上只有 3.97:1，
     而「展開…」這種連結、燈號狀態字全都用它。圖表線條另外留一組亮色，
     線條屬於圖形元素，門檻是 3:1，不必跟著壓深。 */
  --series-1:#1f5fae; --series-2:#a94420;
  --line-1:#2a78d6; --line-2:#eb6834; --line-3:#7b3fb5;
  --pos:#2a78d6; --neg:#e34948; --muted-bar:#b8b7af;
  /* --warning 從 #936400 再壓深一級：它在白底上是 5.17，剛好過關，
     但疊在有色底（例如 .k-surp 的紅色淡底）上只剩 4.39，掉到 AA 以下。
     文字色要能在**任何**卡片底色上都成立，不能只看白底。 */
  --good:#077c07; --warning:#7a5100; --serious:#93401f; --critical:#b82828;
  --tint-dov:rgba(42,120,214,.11); --tint-haw:rgba(180,85,43,.12);
  --shadow:0 1px 2px rgba(11,11,11,.05),0 1px 8px rgba(11,11,11,.04);
  --bg:#fff; --faint:#6e6d68; --brand-ink:#12233B;
  --y2:#9aa6b8; --y10:#4f6383; --y30:#12233B;
}

html{-webkit-text-size-adjust:100%}
/* 中文字型（如 Noto Sans CJK）只有 400/500/700 等實體字重。
   若指定 650 這類非標準值，瀏覽器會改用「合成粗體」——筆畫被撐寬但
   前進距離不變，中文就會疊在一起。因此全站只用標準字重，
   並額外加一點字距作為保險。 */
h1,h2,h3,.v-main,.f-head,.m-name,.l-top,.k-label,.gloss dt,
.verdict .v-main,strong,b{letter-spacing:.035em}
body{margin:0;background:var(--bg);
  /* CJK 家族一定要點名，而且要用含 "CJK" 的完整家族名。
     只寫 system-ui / sans-serif 時，瀏覽器逐字回退找到的是 Regular 字面，
     粗體只好用「合成粗體」——筆畫塗寬但前進距離不變，中文就疊在一起。
     點名 "Noto Sans CJK TC" 之後會取到真正的 Bold 字面。
     順序：iOS/macOS 走 PingFang，Windows 走微軟正黑，Android/Linux 走 Noto。 */
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI Variable","Segoe UI",
    "PingFang TC","PingFang SC","Hiragino Sans CNS","Microsoft JhengHei",
    "Noto Sans CJK TC","Noto Sans CJK SC","Noto Sans TC",sans-serif;
  color:var(--text-primary);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.6}
/* 手機首屏很貴：到第一個結論有 43% 是導覽與免責。這裡省下來的每一 px
   都直接換成內容。桌機不受影響（下面的 760px 斷點會蓋掉）。 */
.viz-root{max-width:1120px;margin:0 auto;padding:12px 14px 60px}
@media(min-width:760px){.viz-root{padding:22px 20px 70px}}

/* ---------- 頁首 ---------- */
h1{font-size:21px;margin:0;font-weight:700;line-height:1.35}
@media(min-width:760px){h1{font-size:23px}}
/* ---------- 右上角的 EN 鈕（原生 details 小浮層）----------
   桌機手機都收在頁首右上；手機把觸控目標拉到 44px（稽核下限）。 */
.top{position:relative;padding-right:52px}
.lang-btn{position:absolute;top:0;right:0;display:inline-flex;
  align-items:center;justify-content:center;padding:3px 10px;
  font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--border);border-radius:4px;
  text-decoration:none}
.lang-btn:hover{color:var(--text-primary);border-color:var(--text-primary)}
@media(max-width:759px){
  .lang-btn{min-height:44px;box-sizing:border-box}}
/* 標題兼「回首頁」。不加底線也不變色——它首先是標題，其次才是連結；
   染成連結色會讓每一頁的第一個視覺焦點變成一條藍字。 */
/* 觸控高度：h1 本身只有 28px。上下各給 6px 的 padding 撐到 40px，
   再用負 margin 抵掉視覺上的位移——這裡可以用負 margin，是因為它上下
   都沒有相鄰的可點元素（上面是頁面邊緣，下面是 .sub 純文字）。
   .f-more 就不行，它上下都貼著別的 summary。 */
.h1-home{color:inherit;text-decoration:none;display:inline-block;
  padding:6px 0;margin:-6px 0}
.h1-home:hover{color:var(--series-1)}
/* 首頁站名下的一句標語。比 .sub 醒目一階（它是品牌的一部分，不是
   中繼資料），但遠小於 h1——「MACRO GG」是大標、這句是小副標。 */
.tagline{color:var(--text-secondary);font-size:14px;font-weight:600;
  margin-top:3px;line-height:1.55}
.sub{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.55}


/* ---------- 導覽列：手機上單行可左右滑 ---------- */
/* ---------- 品牌頁首與主選單（2026-10 改版）----------
   · 頁首：白底全寬，LOGO（向量檔）＋三地最後更新時間＋EN。照常捲走。
   · 主選單：接在頁首下方的全寬白條，**永遠置頂**。底邊是「地平線」，
     目前分頁的正下方升起一顆日出橘的半圓太陽，換頁時從上一頁滑過來。
     頁首捲走後細條左側淡入 GG 標記（回首頁）。
   · 日出橘只用在品牌元素（LOGO、太陽），不用在數據——紅綠藍已經有意思。 */
@font-face{font-family:"Montserrat";font-style:normal;font-weight:400 800;font-display:swap;
  src:url(/brand/montserrat-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--brand-navy:#12233B;--brand-orange:#E67143;--brand-orange-ink:#ad4f27;--brand-orange-fill:#ad4f27;--on-status:#fff;--navh:52px}
.brandwrap{background:var(--bg);border-bottom:1px solid rgba(18,35,59,.07)}
.brandbar{max-width:1120px;margin:0 auto;padding:16px 20px 18px;display:flex;
  align-items:center;gap:18px;box-sizing:border-box}
.brand{display:block;line-height:0;flex:none}
.brand img{display:block;max-width:none}
.brand .logo-full{height:62px;width:auto}
.brand .logo-compact{display:none;height:30px;width:auto}
.upd{margin-left:auto;display:grid;grid-template-columns:auto repeat(3,auto);
  align-items:end;column-gap:22px}
.upd-k{font-size:11.5px;color:var(--muted);letter-spacing:.04em;padding-bottom:3px}
.upd-d{display:none}
.upd-c{display:grid;line-height:1.15}
.upd-c span{font-size:11.5px;color:var(--muted)}
.upd-c b{font-weight:700;font-size:19px;color:var(--brand-ink);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.upd-c i{font-style:normal;font-size:11px;color:#8a8983;font-variant-numeric:tabular-nums}
.brandbar .lang-btn{position:static;align-self:flex-start;margin-left:6px;
  border-color:rgba(18,35,59,.25);color:var(--brand-ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.bnav{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid rgba(18,35,59,.16);transition:box-shadow .2s ease}
.bnav.stuck{box-shadow:0 8px 14px -12px rgba(18,35,59,.35)}
.bnav-in{position:relative;max-width:1120px;margin:0 auto;padding:0 20px;display:flex;
  align-items:stretch;height:var(--navh);box-sizing:border-box}
.bnav-mark{display:flex;align-items:center;flex:none;width:0;opacity:0;overflow:hidden;
  transition:width .22s ease,opacity .22s ease,margin .22s ease}
.bnav-mark img{height:24px;width:auto;display:block;max-width:none}
.bnav.stuck .bnav-mark{width:56px;opacity:1;margin-right:10px}
.bnav-tabs{position:relative;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.bnav-tabs::-webkit-scrollbar{display:none}
.bnav-track{position:relative;display:flex;height:100%;width:max-content}
.bnav-track a{display:flex;align-items:center;padding:0 16px;font-size:14.5px;
  letter-spacing:.02em;color:var(--muted);text-decoration:none;white-space:nowrap}
.bnav-track a:first-child{padding-left:2px}
.bnav-track a:hover{color:var(--brand-ink)}
.bnav-track a.on{color:var(--brand-ink);font-weight:700}
.bnav-track a.soon{color:var(--baseline)}
.bnav-sun{position:absolute;bottom:0;left:-40px;width:20px;height:10px;margin-left:-10px;
  border-radius:20px 20px 0 0;background:var(--brand-orange);pointer-events:none;
  transition:left .32s cubic-bezier(.3,.7,.2,1)}
.bnav-glow{position:absolute;bottom:-1px;left:-200px;height:2px;width:240px;margin-left:-120px;
  pointer-events:none;background:linear-gradient(90deg,transparent,rgba(230,113,67,.75),transparent);
  transition:left .32s cubic-bezier(.3,.7,.2,1)}
@media(prefers-reduced-motion:reduce){.bnav-sun,.bnav-glow,.bnav-mark{transition:none}}
.bnav-fade{position:absolute;top:0;bottom:1px;width:30px;pointer-events:none;opacity:0;
  transition:opacity .15s}
.bnav-fade.l{left:0;background:linear-gradient(90deg,#fff 30%,transparent)}
.bnav-fade.r{right:0;background:linear-gradient(270deg,#fff 30%,transparent)}
.bnav.fl .bnav-fade.l,.bnav.fr .bnav-fade.r{opacity:1}
.pagehead{margin:4px 0 2px}
.pagehead h1{color:var(--brand-ink)}
@media(max-width:759px){
  :root{--navh:46px}
  .brandbar{padding:12px 14px;flex-wrap:wrap;row-gap:10px;column-gap:8px}
  .brand .logo-full{display:none}
  .brand .logo-compact{display:block}
  /* 觸控區撐到 40px（logo 只有 30px 高），負邊距抵銷、版面高度不變 */
  .brand{padding:5px 0;margin:-5px 0}
  .brandbar .theme-btn{margin-left:auto;width:44px;height:44px;align-self:center}
  .brandbar .lang-btn{margin-left:0;min-width:44px;align-self:center}
  .upd{order:3;width:100%;margin-left:0;grid-template-columns:auto 1fr 1fr 1fr;
    column-gap:8px;align-items:baseline;border-top:1px dashed rgba(18,35,59,.15);padding-top:7px}
  .upd-k{padding:0;font-size:11px}
  .upd-d{display:inline;font-size:11px;color:#8a8983;margin-left:4px}
  .upd-c{display:block;white-space:nowrap}
  .upd-c span{font-size:11px;margin-right:4px}
  .upd-c b{font-size:14.5px}
  .upd-c i{display:none}
  .bnav-in{padding:0 0 0 14px}
  .bnav-track a{padding:0 12px;font-size:14px}
  .bnav-track a:last-child{padding-right:18px}
  .bnav.stuck .bnav-mark{width:44px;margin-right:4px}
  .bnav-mark img{height:20px}
}

/* 兩種 banner 共用外觀，但行為不同：
   · div.banner   資料停止更新的警告——**要處理**的事，一律展開
   · details.banner 離線示範的免責——每頁一字不差，收成一行
   免責在 390px 下展開是 134px，佔 16% 的首屏，而且讀者第二頁就不會再讀它，
   卻照樣把第一張卡推到摺線以下（rates 頁只露出 7px）。 */
.banner{background:var(--surface-1);border:1px solid var(--warning);
  border-left-width:3px;border-radius:10px;padding:11px 14px;margin:12px 0 0;
  font-size:13px;color:var(--text-secondary);line-height:1.7}
.banner b{color:var(--warning)}
details.banner{padding:0}
details.banner>summary{padding:11px 34px 11px 14px;font-size:13px;
  color:var(--text-secondary);line-height:1.6;position:relative;
  list-style:none;font-weight:400}
details.banner>summary::-webkit-details-marker{display:none}
/* 卡片級收合統一用右側 ▾/▴（跟 .sect 同一家族），不再自畫旋轉箭頭 */
details.banner>summary::after{content:"▾";position:absolute;right:15px;
  top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
details.banner[open]>summary::after{content:"▴"}
.banner-body{padding:0 14px 12px;font-size:13px;line-height:1.7;
  color:var(--text-secondary)}

/* ---------- 版面網格 ---------- */
.grid{display:grid;gap:13px;margin-top:13px;grid-template-columns:1fr}
/* 網格項目預設 min-width:auto，裡面只要有一個不能再窄的東西（寬表格、
   長串數字），整欄就會被撐開，連帶把整頁推得比視窗寬。歸零之後，
   撐不下的內容由它自己的捲動容器處理，版面不受影響。 */
.grid>*{min-width:0}
@media(min-width:760px){
  .grid{gap:14px;margin-top:14px}
  /* 並排卡各自貼頂：兩張卡內容量不同時，不再互相拉成等高、
     讓短的那張底部拖一段空白（跟 KPI 內層卡同一個道理）。 */
  .g2{grid-template-columns:repeat(2,1fr);align-items:start}
  .g4{grid-template-columns:repeat(2,1fr)}
  /* 模組卡有五張。四欄會排成 4+1，最後一張孤零零的；三欄的 3+2 比較穩。 */
  .g5{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1040px){
  .g4{grid-template-columns:repeat(4,1fr)}
  .g5{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1320px){.g5{grid-template-columns:repeat(5,1fr)}}

.card{background:var(--surface-1);border:1px solid var(--border);
  border-radius:13px;padding:17px 16px;box-shadow:var(--shadow);min-width:0}
@media(min-width:760px){.card{padding:18px 20px}}
.card h2{font-size:17px;margin:0 0 5px;font-weight:700;line-height:1.5}
.card h3{font-size:15px;margin:22px 0 4px;font-weight:700}
.card .hint{font-size:13px;color:var(--muted);margin:0 0 15px;line-height:1.65}
.card .src{font-size:12px;color:var(--muted);margin-top:15px;padding-top:11px;
  border-top:1px solid var(--border);line-height:1.6}

/* ---------- 可收合的卡區 ----------
   每一頁只有最上方的結論卡與緊接著的第一張內容卡是常開的，其餘預設收合。
   理由是每個人要看的那一塊不一樣：看勞動的人不需要每次都捲過行業分解，
   看行業分解的人也不需要每次先讀完修正追蹤。收合之後整頁變成一張
   可以一眼掃完的清單。

   關鍵在 .sect-sum：收合的標題列一定要帶一句結論，否則讀者得逐一點開
   才知道哪張有事——那比不收合還糟。 */
.sect{padding:0}                       /* 內距移到 summary 與 sect-body */
.sect>summary{list-style:none;cursor:pointer;padding:15px 16px;
  display:grid;grid-template-columns:1fr auto;align-items:baseline;
  gap:2px 12px;border-radius:13px}
@media(min-width:760px){.sect>summary{padding:16px 20px}}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::after{content:"▾";grid-column:2;grid-row:1;
  font-size:12px;color:var(--muted)}
.sect[open]>summary::after{content:"▴"}
.sect>summary:hover{background:var(--surface-2)}
.sect>summary:focus-visible{outline:2px solid var(--series-1);outline-offset:-2px}
/* 標題要壓回一般文字色。通用的 summary{color:var(--series-1)} 會被繼承下來，
   於是收合清單上每一列變成「**藍色 17px 粗體的標籤**（每期都一樣的字）
   ＋ 灰色 12.5px 的數值（本期新的東西）」——層級剛好反過來，
   視線先被七八個藍色標題抓住，真正的本期數字反而要停下來對焦。
   而且藍色＝連結是既有的心理模型，讀者會不確定點下去是展開還是換頁。 */
.sect>summary h2{margin:0;grid-column:1;grid-row:1;color:var(--text-primary)}
/* 摘要句：收合時是「要不要點開」的唯一依據；展開後內容自己會講，藏起來。
   顏色提到 --text-secondary：它是這一列上唯一會變的東西，
   壓成 --muted 的話比旁邊的固定標籤還不顯眼。 */
/* font-weight 一定要寫死：summary 是 600，不覆寫的話摘要會繼承成粗體，
   一整列變成「粗體標題 ＋ 粗體摘要」，兩者又打平了。 */
.sect-sum{grid-column:1;grid-row:2;font-size:12.5px;font-weight:400;
  color:var(--text-secondary);
  line-height:1.6;padding-right:4px;
  /* 中文預設可以在**任意兩個字之間**斷行，於是收合清單上出現
     「利升⏎息」「長端承壓最⏎重」這種第二行只有一個字的斷法——
     而這一列的用途就是掃視，掃視靠的是在一行內抓完整詞組。
     keep-all 只允許在空白與標點處斷；真的塞不下時再由
     overflow-wrap 放行，避免撐破卡片。 */
  word-break:keep-all;overflow-wrap:break-word}
.sect[open] .sect-sum{display:none}
.sect-body{padding:0 16px 17px}
@media(min-width:760px){.sect-body{padding:0 20px 18px}}
.sect-body>:first-child{margin-top:2px}

/* 「關鍵數字」那一區是四張 KPI 卡包在一張卡裡。卡中卡會有兩層底色與
   兩層陰影，看起來像出錯——內層改成只用分隔線區隔。 */
.grid.inner{margin-top:2px;gap:0}
.grid.inner>.card{background:transparent;border:none;box-shadow:none;
  border-radius:0;padding:15px 0;border-bottom:1px solid var(--grid)}
.grid.inner>.card:last-child{border-bottom:none;padding-bottom:2px}
.grid.inner>.card:first-child{padding-top:4px}
@media(min-width:760px){
  .grid.inner{gap:0 22px}
  /* 桌機並排時：
     ① padding 統一——first/last-child 的手機特例（4px／2px）在四欄
        並排下會讓第一張標題高 15px、第四張的收合列低 21px（實測）。
     ② 卡片各自貼頂（align-items:start）＝展開「近 5 期」時只有那張卡
        往下長，其他三張不動；先前整列被拉成等高，沒開的卡的置底
        收合列會掉到被撐高的列底，跟內容之間空一大段。
     ③ 底線拿掉——欄與欄之間有間距就夠，橫線在四欄下反而像表格框。 */
  .grid.inner{align-items:start}
  .grid.inner>.card{padding:6px 0 10px;border-bottom:none}
  .grid.inner>.card:first-child{padding-top:6px}
  .grid.inner>.card:last-child{padding-bottom:10px}
}

/* 展開全部／收合全部。收合狀態下瀏覽器的 Ctrl+F 找不到內文
   （hidden-until-found 支援度還不齊），所以這一列不是方便，是補償。 */
.sect-tools{display:flex;gap:8px;margin:12px 0 0}
.sect-tools button{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  color:var(--text-secondary);background:var(--surface-1);
  border:1px solid var(--border);border-radius:8px;padding:13px 13px}
.sect-tools button:hover{border-color:var(--text-secondary);
  color:var(--text-primary)}
.sect-tools button:focus-visible{outline:2px solid var(--series-1);
  outline-offset:2px}

/* 置頂的主選單（＋章節列）會蓋住跳轉目標的上緣，讓出空間 */
[id],.sect{scroll-margin-top:calc(var(--navh) + 58px)}
/* 錨點跳過來的那一區給一個外框，否則展開之後看不出跳到哪一張 */
.sect:target>summary{box-shadow:0 0 0 2px var(--series-1) inset}

/* 列印／存成 PDF 時全部展開。JS 另有 beforeprint 保險——
   新版 Chrome 用 content-visibility 實作收合，純 CSS 不一定壓得過。 */
@media print{
  .sect-tools,.bnav,.anav,.lang-btn{display:none}
  .sect>summary::after,.sect-sum{display:none}
  details>*:not(summary){display:block!important}
}

/* ---------- 結論卡 ---------- */
.verdict{background:var(--surface-1);border:1px solid var(--border);
  border-radius:13px;padding:19px 17px;box-shadow:var(--shadow);margin-top:13px;
  border-left:4px solid var(--muted)}
@media(min-width:760px){.verdict{padding:24px 24px}}
.verdict.dovish{border-left-color:var(--series-1)}
.verdict.hawkish{border-left-color:var(--serious)}
.verdict.balanced{border-left-color:var(--muted)}
/* 情境頁的傾向可能是 neutral（反應函數把方向改寫成中性時），
   沒有這條規則那張卡就只剩預設灰邊，看起來像漏了樣式 */
.verdict.neutral{border-left-color:var(--muted)}
.v-eyebrow{font-size:12.5px;color:var(--muted)}
/* 結論卡的字必須大於任何單一 KPI 數字。手機上原本是結論 26px、
   KPI 32px，等於在版面上宣告「單一數字比整體結論重要」——
   讀者的視線會先落在某個指標上，再回頭找結論。 */
.v-main{font-size:29px;font-weight:700;margin-top:9px;line-height:1.4}
@media(min-width:760px){.v-main{font-size:34px}}
/* 360px 上「停滯性通膨：通膨優先」這種長情境名，最後一個字會單獨掉到
   第二行。中文沒有連字號可斷，只能把字級縮一級——孤字比小一點的字礙眼。 */
@media(max-width:400px){.v-main{font-size:26px;letter-spacing:.02em}}
.v-why{font-size:14.5px;color:var(--text-secondary);margin-top:12px;line-height:1.85}
.v-count{font-size:12.5px;color:var(--muted);margin-top:15px;padding-top:13px;
  border-top:1px solid var(--border);line-height:1.75}
/* 結論卡底部通往情境頁的出口。做成一整塊可點的區域而不是一行文字連結：
   它是首頁唯一通往「該怎麼擺部位」的路，而讀者剛看完同一段結論，
   一條灰色小字連結不足以說服他「後面還有沒看過的東西」。
   副標明講後面有什麼是首頁沒有的。 */

/* ---------- KPI ---------- */
.kpi .k-label{font-size:13px;color:var(--text-secondary);font-weight:600}
.kpi .k-value{font-size:26px;font-weight:700;line-height:1.2;margin-top:5px}
@media(min-width:760px){.kpi .k-value{font-size:30px}}
/* ≤400px 時 .v-main 會降到 26px。KPI 數字、分數軸、結論值列若也留在
   26px，一頁上就有四種同字級同字重的東西完全平手——沒有主從等於沒有層級，
   讀者不知道該先看哪個。手機上把這三個降一級，讓結論那一句穩穩壓過去。 */
@media(max-width:400px){.kpi .k-value{font-size:24px}}
/* 英文為主、中文降成副標：對照 BLS 新聞稿與英文報導時，中文譯名對不起來。 */
.kpi .k-label-zh{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.kpi .k-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
/* chips 列：水準／變化標籤與徽章（動能、修正、成因）合成**同一種樣式**。
   先前 k-lean、k-flag、意外行各一種視覺，每張卡都要重新學一次
   「哪行是重點」；統一之後掃一列就知道方向。水準與變化仍各一顆——
   同一張卡可以「仍高於目標」又「本期在降」，兩件事都成立，
   擠成一個標籤只會互相矛盾。 */
.kpi .k-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.kpi .k-chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;
  background:var(--surface-2);color:var(--text-secondary)}
.kpi .k-chip.hawkish,.kpi .k-chip.neg{color:var(--critical)}
.kpi .k-chip.dovish,.kpi .k-chip.pos{color:var(--good)}
.kpi .k-chip.watch{color:var(--warning)}
.kpi .k-plain{font-size:13.5px;color:var(--text-primary);margin-top:11px;
  line-height:1.75;background:var(--surface-2);border-radius:9px;padding:10px 12px}
/* 收合層：近 5 期走勢、比較行、（非發布日的）預期比較。
   跟「依據」同視覺，要驗算才點。summary 上下 12px 把觸控高撐過 40px。 */
.kpi .k-more{margin:2px 0 0;border:0;background:transparent}
.kpi .k-more>summary{cursor:pointer;list-style:none;font-size:12.5px;
  font-weight:500;color:var(--muted);padding:12px 0}
.kpi .k-more>summary:hover{color:var(--series-1)}
.kpi .k-more>summary::-webkit-details-marker{display:none}
.kpi .k-more>summary{padding-left:15px;text-indent:-15px}
.kpi .k-more>summary::before{content:"▸";display:inline-block;width:15px;
  text-indent:0}
.kpi .k-more[open]>summary::before{content:"▾"}
.kpi .k-more-body{padding-bottom:8px}
.kpi .k-more-body .k-sub{margin-top:2px}
/* 卡片直向 flex。手機（堆疊）收合列跟著內容走即可；
   桌機的對齊改用「各層固定最小高度」（見下方 @media 區塊），
   不再用「拉成同高＋收合列釘底」——那一套在展開任何一張的
   「近 5 期」時，會把沒開的卡的收合列釘到被撐高的列底，
   跟內容之間空出一大段（使用者實測回報的「展開方式怪異」）。 */
.kpi{display:flex;flex-direction:column}
@media(min-width:760px){
  /* 各層保留固定空間：標題（含期別章，至多兩行）、chips（至多兩列）、
     白話句（至多三行）。四張卡的每一層落在同一條水平線，
     「近 5 期」列收合時自然對齊，不必靠等高硬拉。 */
  .kpi .k-label{min-height:46px}
  .kpi .k-chips{min-height:56px;align-content:flex-start}
  .kpi .k-plain{min-height:92px}   /* 三行白話句的高度；兩行的卡框內留白 */
}
.spark{margin-top:11px;display:block;width:100%;height:64px}

/* ---------- 數字組（改用網格，手機兩欄對齊） ---------- */
.stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px;
  margin-bottom:4px}
.stat-row>.stat{min-width:0}
@media(min-width:760px){
  .stat-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}
}
.stat .s-label{font-size:12.5px;color:var(--muted);line-height:1.45}
/* 數值＋單位不能從中間斷開。「-0.10 個百分點」折成兩行時，
   讀者要多花一拍才確定那個單位屬於上面那個數字。 */
.stat .s-value{font-size:20px;font-weight:700;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
@media(max-width:420px){.stat .s-value{font-size:18px}}
/* 標籤長度不一時，數值會各自對到不同的基線。給標籤兩行的高度，
   同一列的數字才會落在同一條水平線上。
   只在 ≥760px 生效：那裡欄位是 auto-fit、每欄可能窄到讓長標籤折行，
   所以需要預留。手機固定兩欄、每欄約 160px，多數標籤本來就是一行，
   硬撐兩行等於每個 .stat 白白多出 18px——全站數十個 stat 累積起來
   接近一個螢幕高度的空白，而它換來的對齊在手機上根本用不到。 */
@media(min-width:760px){.stat .s-label{min-height:2.9em}}
.stat .s-note{font-size:12.5px;color:var(--text-secondary);margin-top:4px;
  line-height:1.55}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;
  font-variant-numeric:tabular-nums}
/* 上下 11px：表格裡的儲存格常常放連結（原文申報、EDGAR 頁面），
   相鄰兩列的連結之間必須留得下手指。9px 時量到只剩 5.3px 的間距，
   低於 tools/audit_layout.py 的 8px 門檻。 */
th,td{text-align:right;padding:11px 5px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
/* 最後一列多留一點下緣：那一列的儲存格常常是連結，而表格後面緊接著的
   往往是另一個可點的 summary。少了這幾 px，兩個觸控目標會靠到 8px 以內
   （tools/audit_layout.py 的門檻）。 */
tbody tr:last-child td{border-bottom:none;padding-bottom:15px}
td.pos{color:var(--good)} td.neg{color:var(--critical)}
td.muted-cell{color:var(--muted)}
.revtab td:first-child{font-variant-numeric:normal}
/* 儲存格裡的外部連結（EDGAR 申報書、聲明原文）只有 14–15px 高，
   在手機上幾乎按不到。用 inline-block 加上下內距把觸控區撐到 40px，
   再用等量的負 margin 抵銷，視覺上仍然只是一段文字。 */
td a[target="_blank"],.src a[target="_blank"]{
  display:inline-block;padding:12px 8px;margin:-12px -8px}
/* 欄位多的表格（例如科技巨頭那張六欄表）在 390px 上會把儲存格擠成
   一個字一行。包一層可橫向捲動的容器，寧可讓它滑，也不要把數字折斷。 */
/* 下緣留白：表格最後一列的儲存格常常放連結，而後面緊接著的往往是
   另一個可點的 summary。不留的話兩個觸控目標會靠到 7px 以內。 */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  margin-bottom:6px}
/* 橫捲表格的邊緣漸層：跟主選單同一套「還有更多」提示。
   .tscroll／.heatwrap 由 JS 包一層 .twrap，漸層畫在不捲動的外框上——
   熱力圖與寬表格在手機上被裁切時，先前沒有任何「還可以左右滑」的跡象，
   看起來像表格只有那幾欄。 */
.twrap{position:relative}
.twrap::before,.twrap::after{content:"";position:absolute;top:0;bottom:0;
  width:26px;pointer-events:none;opacity:0;transition:opacity .15s ease;z-index:1}
.twrap::before{left:0;background:linear-gradient(90deg,var(--surface-1),transparent)}
.twrap::after{right:0;background:linear-gradient(270deg,var(--surface-1),transparent)}
.twrap.fl::before{opacity:1}
.twrap.fr::after{opacity:1}
@media(prefers-reduced-motion:reduce){.twrap::before,.twrap::after{transition:none}}
/* 寫死 min-width 會讓明明放得下的表格也被迫捲動。改成「內容多寬就多寬，
   至少填滿容器」：塞得下就不捲，塞不下才捲。 */
.tscroll>table{width:max-content;min-width:100%}
/* 會捲的表格把左右內距收窄一點，多爭取的空間常常剛好夠讓它不用捲 */
@media(max-width:520px){.tscroll th,.tscroll td{padding:11px 4px;font-size:13px}}

/* ---------- 發散長條（行業增減）---------- */
.dbars{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.drow{display:grid;grid-template-columns:96px 1fr 76px;align-items:center;
  gap:8px;padding:4px 0;border-radius:6px}
@media(min-width:760px){.drow{grid-template-columns:150px 1fr 92px;gap:12px}}
/* 窄螢幕：名稱＋數值同一行（左右對齊）、長條整寬第二行。
   先前名稱獨立一行、下一行「長條＋數值」——長條從中央零軸浮在半空、
   數值在另一個角落，名稱／色條／數字三層錯位。 */
@media(max-width:520px){
  .drow{grid-template-columns:minmax(0,1fr) auto;row-gap:5px;padding:8px 0}
  .dlabel{grid-column:1;grid-row:1}
  .dval{grid-column:2;grid-row:1}
  .dtrack{grid-column:1 / -1;grid-row:2}
}
.drow:hover{background:var(--surface-2)}
.dlabel{font-size:12.5px;color:var(--text-secondary);line-height:1.35}
@media(min-width:760px){.dlabel{font-size:13.5px}}
/* 異常標示：列上只放一個 ▲ 小標記（整句理由掛在長條旁會把圖擠亂），
   完整理由集中在圖下方的 .dfoot 註腳——手機沒有 hover 也讀得到。 */
.dtag{display:inline-block;font-size:10px;font-weight:700;color:var(--warning);
  margin-left:5px;vertical-align:1px}
.dfoot{margin-top:10px;padding-top:8px;border-top:1px dashed var(--grid)}
.dfoot-line{font-size:11.5px;line-height:1.7;color:var(--text-secondary);
  margin:3px 0}
.dfoot-line b{font-weight:600}
.dfoot-mark{color:var(--warning);font-size:10px;font-weight:700;margin-right:5px}
.dnote{display:block;font-size:11.5px;color:var(--muted)}
.dtrack{position:relative;height:15px}
.dzero{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;
  background:var(--baseline)}
.dfill{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.dfill.pos{background:var(--pos)} .dfill.neg{background:var(--neg)}
.dfill.muted{background:var(--muted-bar)}
.dval{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--text-secondary)}
@media(min-width:760px){.dval{font-size:13.5px}}
.dval.pos{color:var(--good)} .dval.neg{color:var(--critical)}
.dlegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--grid);font-size:12px;color:var(--muted)}
.dlegend span{display:flex;align-items:center;gap:5px}
.dlegend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- 紅綠燈 ---------- */
/* 手機兩欄時每張卡不再被拉高到同列最高——說明文字長度差很多，
   齊高會讓短的那張有三到四成是空白，八張燈累積起來是一整個螢幕。
   ≥1040px 四欄時仍然齊高：那裡卡片小、齊高才看得出是一組。 */
.lights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;
  align-items:start}
.light{min-width:0}
@media(max-width:430px){.light{min-height:148px}}
@media(min-width:1040px){.lights{grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:stretch}}
.light{background:var(--surface-2);border-radius:10px;padding:12px 12px;
  border:1px solid var(--border);display:flex;flex-direction:column}
.light .l-top{display:flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--text-secondary);font-weight:600;line-height:1.35}
.light .l-icon{font-size:10px;flex-shrink:0}
.light.good .l-icon,.light.good .l-state{color:var(--good)}
.light.warning .l-icon,.light.warning .l-state{color:var(--warning)}
.light.critical .l-icon,.light.critical .l-state{color:var(--critical)}
.light.unknown .l-icon,.light.unknown .l-state{color:var(--muted)}
/* 數值與單位不能斷開：「4.3 個百分點」折成兩行時，
   讀者要多花一拍才能確定那個單位屬於上面那個數字。
   手機兩欄只有約 160px 寬，22px 的字放不下較長的值，所以一併縮一級。 */
.light .l-value{font-size:22px;font-weight:700;margin-top:8px;
  font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
@media(max-width:420px){.light .l-value{font-size:19px}}
@media(max-width:360px){.light .l-value{white-space:normal;font-size:17px}}
.light .l-state{font-size:12px;margin-top:5px;font-weight:700}
.light .l-desc{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.55;
  margin-bottom:0}

/* 失業缺口 u − u*：水準的位置，跟上面那段「變化的成因」是兩件事，
   所以用一條分隔線隔開，而不是再開一張卡。 */
/* margin-bottom：這一塊底下緊接著「失業結構」的展開列，
   兩個觸控盒之間要留得出間距（版面稽核的下限是 8px）。 */
.ugap{margin-top:16px;margin-bottom:8px;padding-top:13px;
  border-top:1px solid var(--border)}
.ug-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ug-label{font-size:12.5px;color:var(--text-secondary);font-weight:600}
.ug-val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.ug-state{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--text-secondary)}
.ug-note{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:6px}

/* 失業結構：五個類別各一列。名稱、橫條、數值三欄，
   說明另起一行——手機上四欄並排會把每一欄擠成兩個字一行。 */
.ustruct{margin-top:12px}
.ustr-list{margin-top:12px;display:flex;flex-direction:column;gap:13px}
.ustr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;
  align-items:center}
.us-name{font-size:13px;font-weight:600}
.us-bar{grid-column:1/-1;height:7px;background:var(--surface-2);
  border-radius:4px;overflow:hidden;order:3}
.us-bar i{display:block;height:100%;border-radius:4px;background:var(--muted-bar)}
.ustr.bad .us-bar i{background:var(--neg)}
.ustr.good .us-bar i{background:var(--pos)}
.us-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.us-share{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:6px}
.us-yoy{grid-column:1/-1;order:4;font-size:12px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums}
.us-note{grid-column:1/-1;order:5;font-size:12px;color:var(--muted);
  line-height:1.6}

/* ---------- 訊號 ---------- */
.flag{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid var(--grid)}
.flag:first-of-type{padding-top:2px}
.flag:last-child{border-bottom:none;padding-bottom:2px}
.flag .f-icon{font-size:10px;margin-top:6px;flex-shrink:0}
/* 行業別貢獻：兩組各一張長條 */
.att-grp{margin-top:16px}
.att-ghead{font-size:12.5px;font-weight:700;color:var(--text-secondary);
  padding-bottom:6px;border-bottom:1px solid var(--grid);margin-bottom:6px}
/* 本期關鍵訊號：最上面的一句總結＋分層小標 */
.sig-sum{margin:12px 0 4px;padding:11px 13px;border-radius:9px;
  background:var(--surface-2);font-size:13.5px;line-height:1.7}
.sig-sum b{display:block;font-size:14.5px;margin-bottom:2px}
.sig-sum span{color:var(--text-secondary)}
.sig-rest{margin-top:16px}
.pce-method{margin-top:14px}
.sig-rest>summary{font-weight:700}
.sig-tier{margin:16px 0 2px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--muted)}
.sig-tier span{font-weight:500;letter-spacing:0}
.flag.alert .f-icon{color:var(--critical)}
.flag.watch .f-icon{color:var(--warning)}
.flag.info .f-icon{color:var(--muted)}
.flag .f-head{font-size:15.5px;font-weight:700;line-height:1.6}
.flag .f-detail{font-size:14px;color:var(--text-secondary);margin-top:7px;
  line-height:1.85}
.flag .f-tag{font-size:11.5px;color:var(--muted);border:1px solid var(--border);
  border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap;
  font-weight:500;vertical-align:2px}
.impact{display:inline-block;font-size:12.5px;font-weight:700;border-radius:7px;
  padding:5px 10px;margin-top:10px;line-height:1.5}
/* 帶底色的小標籤要另外壓深：在自己的淡底上，一般文字色只有 4.3–4.4:1 */
.impact.dovish{background:var(--tint-dov);color:#1d579e}
.impact.hawkish{background:var(--tint-haw);color:#8d3b1b}
.impact.neutral{background:var(--surface-2);color:var(--muted)}

/* 說明收合起來之後，「依據」這個開關要小、要低調——
   它是次要動作，不能跟訊號標題搶注意力。 */
/* margin-bottom 是觸控間距用的：這種展開列的下一個元素常常也是可點的
   （另一個展開列、表格裡的外部連結）。展開之後內容的最後一行離下一個
   觸控目標只有兩三 px 時，點錯的代價是收合掉一整張卡。 */
/* padding-top 而不是 margin-top：summary 是 .f-more 的第一個子元素，
   給它 margin 會跟父層的 margin **合併**（margin collapsing），實際只多出
   兩者的差額。要真的把觸控框推開必須用 padding——它不合併。
   前一個區塊常常是另一張表，最後一列的儲存格多半是連結。 */
.f-more{margin-top:4px;margin-bottom:8px;border-top:none;padding-top:6px}
/* 這一塊底下緊接著另一個展開列（失業結構），兩個觸控盒之間要留得出間距 */
/* 觸控目標至少 44px 高（WCAG 2.5.8 / Apple HIG）。字體維持 12.5px，
   靠上下 padding 把可點區域撐到 44px，並用負的 margin 抵銷多出來的
   視覺留白——看起來還是一個小開關，手指卻按得到。
   全站有十個這種開關，每一個都太小的話，收合設計本身就失效了。 */
/* 「依據」這種行內展開列。padding 撐高是為了觸控目標（13+13+16≈42px），
   但先前配 margin:-7px 0 去抵銷視覺高度——結果觸控盒比看起來的大 7px，
   兩個「看起來隔了 14px」的元素實際只差 0.9px。實測在勞動頁點最後一條訊號的
   「依據」，很容易變成收合掉整張卡（下一張卡的 summary 就在 0.9px 外），
   畫面瞬間跳掉一大段而讀者不知道發生什麼事。
   負 margin 只留上方（那一側沒有相鄰的可點元素），下方改用正常間距。 */
.f-more>summary{font-size:12.5px;font-weight:500;color:var(--muted);
  padding:13px 0 11px;margin:0;list-style:none}
.f-more>summary:hover{color:var(--series-1)}
/* 展開列的統一記號：前置 ▸（展開時 ▾）、主色。使用者的原話是
   「展開的視覺很不明確」——收合列先前只是一行灰字，跟普通註記
   長得一樣。記號放前面比尾巴的小箭頭醒目，且全站同一套。 */
.f-more>summary::-webkit-details-marker,
details[data-m-collapse]>summary::-webkit-details-marker{display:none}
.f-more>summary::after,details[data-m-collapse]>summary::after{content:""}
/* 懸掛縮排：▸ 佔固定 17px，折行後的第二行對齊記號之後的文字。
   沒有這個的話，寫在收合列上的長結論折行時第二行會頂到最左，
   看起來像一段內文而不是可點的列。 */
.f-more>summary,details[data-m-collapse]>summary{
  padding-left:17px;text-indent:-17px}
.f-more>summary::before,details[data-m-collapse]>summary::before{
  content:"▸";display:inline-block;width:17px;margin-right:0;text-indent:0;
  font-size:10px;color:var(--series-1)}
.f-more[open]>summary::before,details[data-m-collapse][open]>summary::before{
  content:"▾"}
details[data-m-collapse]>summary{list-style:none}
.f-more .f-detail{margin-top:2px}

/* ---------- 分數條 ---------- */
.score-bar{height:9px;background:var(--surface-2);border-radius:5px;
  position:relative;margin:15px 0 8px}
.score-bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.score-mid{position:absolute;top:-3px;bottom:-3px;width:1px;
  background:var(--baseline);left:50%}

/* 分數軸：結論卡裡放 compact 版，明細卡裡放完整版，同一套樣式 */
.sax{margin-top:16px;padding-top:15px;border-top:1px solid var(--border)}
.sax.compact{margin-top:14px;padding-top:13px}
.sax-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sax-label{font-size:12.5px;color:var(--muted)}
.sax-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.1}
@media(max-width:400px){.sax-val{font-size:24px}}
.sax.compact .sax-val{font-size:22px}
.sax-delta{font-size:12.5px;color:var(--text-secondary)}
.sax-scale{display:flex;justify-content:space-between;font-size:11.5px;
  color:var(--muted)}

/* KPI 卡裡的「vs 預期」一行 */
.k-surp{margin-top:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;
  line-height:1.7;background:var(--surface-2);color:var(--text-secondary)}
.k-surp.beat{background:rgba(7,124,7,.09)}
.k-surp.miss{background:rgba(194,47,47,.09)}
.k-surp .ks-sep{margin:0 6px;color:var(--muted)}
.k-surp .ks-diff{font-weight:700;color:var(--text-primary)}
.k-surp .ks-verdict{display:inline-block;margin-left:7px;font-weight:700}
.k-surp.beat .ks-verdict{color:#036b03}
.k-surp.miss .ks-verdict{color:#ad2929}
.k-surp .ks-z{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.k-surp .ks-star{color:var(--warning);font-weight:700}
.k-surp .su{font-size:11px;color:var(--muted);margin-left:1px}
.kpi-foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px;
  padding:0 2px}
.kpi-foot.warn{background:var(--surface-1);border:1px solid var(--border);
  border-left:3px solid var(--warning);border-radius:9px;padding:11px 13px}
.kpi-foot b{color:var(--text-primary)}

/* 失業率變動分解：結論在上、拆解在下，兩項相加等於總變動 */
.dsum{padding-bottom:14px;border-bottom:1px solid var(--grid)}
.dsum-main{font-size:22px;font-weight:700;line-height:1.35}
.dsum-sub{font-size:13px;color:var(--text-secondary);margin-top:5px}
/* 失業率變動分解（2026-10 改版）：上月→本月、一條零軸上的推高／壓低、合計 */
.ub-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;
  margin:4px 0 2px;font-variant-numeric:tabular-nums}
.ub-from{font-size:20px;font-weight:600;color:var(--muted)}
.ub-arrow{font-size:18px;color:var(--muted)}
.ub-head b{font-size:30px;font-weight:800;color:var(--text-primary)}
.ub-d{font-size:14px;font-weight:700;color:var(--text-secondary)}
.ub-tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--border);
  border-radius:5px;padding:2px 7px}
.ubridge{margin-top:16px}
.ub-axis{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);padding:0 0 6px;margin-left:calc(38% + 12px);margin-right:62px}
.ub-row{display:grid;grid-template-columns:38% 1fr 50px;gap:12px;align-items:center;
  padding:9px 0;border-top:1px solid var(--grid)}
.ub-row.total{border-top:1.5px solid var(--text-secondary)}
.ub-name{font-size:13.5px;font-weight:600;color:var(--text-primary);line-height:1.45}
.ub-name span{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.ub-bar{position:relative;height:18px}
.ub-zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--baseline)}
.ub-bar i{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.ub-bar i.up{background:var(--serious)}
.ub-bar i.dn{background:var(--series-1)}
.ub-bar i.tot{background:var(--text-secondary)}
.ub-val{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ub-row.total .ub-val{font-size:16px}
.ub-note{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:right}
@media(max-width:759px){
  .ub-axis{margin-left:0;margin-right:58px}
  .ub-row{grid-template-columns:1fr 50px;row-gap:6px}
  .ub-name{grid-column:1 / -1}
  .ub-bar{grid-column:1}
  .ub-val{grid-column:2}
}
.ub-bar i.rvdn{background:var(--neg)}
.ub-bar i.rvup{background:var(--pos)}
.ub-val.rv-none{font-size:12px;font-weight:500;color:var(--muted)}
.ubridge.rv .ub-row{padding:7px 0;grid-template-columns:38% 1fr 84px}
.ubridge.rv .ub-axis{margin-right:96px}
.ub-val{white-space:nowrap}
@media(max-width:759px){
  .ubridge.rv .ub-row{grid-template-columns:1fr 84px}
  .ubridge.rv .ub-axis{margin-right:92px}
}
.dcomp{margin-top:14px}
.dc-cap{font-size:12px;font-weight:600;color:var(--text-secondary);
  margin-top:2px}
/* 動能階梯：每個指數一列「12 → 6 → 3 個月年化」。
   取代先前的六格 stat——手機兩欄折行會把 CPI 與 PCE 混在同一列。 */
.ladder{margin-top:14px}
.ld-row{display:flex;align-items:baseline;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.ld-row:last-of-type{border-bottom:0}
.ld-k{min-width:34px;font-size:12.5px;color:var(--muted);font-weight:600}
.ld-v{font-size:16.5px;font-weight:700;color:var(--text-secondary)}
.ld-a{color:var(--muted);font-size:11px}
.ld-v.last{font-size:19px;color:var(--text-primary)}
.ld-v.last.accel{color:var(--serious)}
.ld-v.last.decel{color:var(--series-1)}
.ld-cap{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.6}
/* 320px 級的窄機：字級不縮的話最右的 3 個月年化會被裁到卡片外——
   偏偏那是字級最大、最重要的一個數字。 */
@media(max-width:374px){
  .ld-row{gap:5px}
  .ld-k{min-width:26px;font-size:11.5px}
  .ld-v{font-size:14px}
  .ld-v.last{font-size:16px}
  .ld-a{font-size:10px}
}

.dc-row{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 74px;
  align-items:center;gap:9px;margin-top:10px}
@media(min-width:760px){.dc-row{gap:12px}}
/* 手機：名稱＋數字同一行（左右對齊）、長條整寬第二行。
   先前三欄硬擠 390px：名稱把「55.5 萬人」折成兩行、長條從畫面中央
   浮在半空、數字靠最右——三個元素各在各的位置。 */
@media(max-width:759px){
  .dc-row{grid-template-columns:minmax(0,1fr) auto;row-gap:7px}
  .dc-name{grid-column:1;grid-row:1}
  .dc-val{grid-column:2;grid-row:1}
  .dc-bar{grid-column:1 / -1;grid-row:2}
}
.dc-name{font-size:12.5px;color:var(--text-secondary);line-height:1.5}
.dc-val span{display:block;font-size:10.5px;font-weight:500;
  color:var(--muted)}
.dc-bar{position:relative;height:15px}
.dc-zero{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;
  background:var(--baseline)}
/* 這兩條刻意用中性色。整張卡的重點就是「正負不等於好壞」——
   勞動力效果是負的（壓低失業率），但成因是有人放棄找工作，那不是好消息。
   上成紅綠會把讀者導向完全相反的結論，方向由左右與文字說明表示。 */
.dc-bar i{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px;
  background:var(--muted-bar)}
.dc-val{font-size:14.5px;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums}
.dc-note{font-size:11.5px;color:var(--muted);line-height:1.6;
  margin:3px 0 0 0;padding-left:2px}
@media(min-width:760px){.dc-note{padding-left:108px}}
.dc-total{margin-top:13px;padding-top:11px;border-top:1px solid var(--grid);
  font-size:13px;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums}
/* 近似誤差：只有大到看得出來時才印，所以要低調——它是說明，不是警告 */
.dc-resid{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
/* 統計顯著性的但書。只有在變動小到不可分辨於零時才出現——
   放在加總那一行的正下方，因為它修飾的是那個數字，不是整張卡。 */
.dc-signif{margin-top:7px;font-size:11.5px;line-height:1.6;text-align:right;
  color:var(--warning)}

/* 一行橫排的輔助數值列（聯準會頁 2026-10 起不再使用，樣式保留） */
.tone-row{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;
  gap:6px 10px;margin-top:12px;padding:12px 14px;border-radius:10px;
  background:var(--surface-2)}
.tone-label{font-size:12.5px;color:var(--text-secondary);font-weight:600}
.tone-val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tone-row.hawkish .tone-val{color:var(--serious)}
.tone-row.dovish .tone-val{color:var(--series-1)}
.tone-row.neutral .tone-val{color:var(--muted)}
.tone-delta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap}
/* 三欄（標籤｜分數｜較上次）在 360px 只剩約 32px 給第三欄，
   「較上次 −0.12」會折成三行、每行兩三個字。窄螢幕改成兩欄，
   把變化量放到自己的一整行。 */
@media(max-width:520px){
  .tone-row{grid-template-columns:auto 1fr}
  .tone-delta{grid-column:1 / -1;margin-top:1px}
}
.tone-note{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.7}
.tone-flag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;
  color:var(--warning);border:1px solid var(--warning);border-radius:4px;
  padding:0 4px;vertical-align:1px}
/* 不可靠時把數字本身也調成灰的——它還在，但不該吸引視線 */
.tone-row.stale .tone-val{color:var(--muted)}

/* 離目標軸：跟分數軸共用外框，但刻度上有一個固定的錨點（2% 目標），
   填色是從目標畫到目前值——長度就是差距，方向就是高於還是低於。 */
.tgt-bar{height:9px;background:var(--surface-2);border-radius:5px;
  position:relative;margin:15px 0 8px}
.tgt-bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.tgt-mark{position:absolute;top:-4px;bottom:-4px;width:2px;
  background:var(--text-primary);border-radius:1px;z-index:2}
.tgt-dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface-1);z-index:3}

/* 但書：掛在結論框裡面、縮排一階，明確是「對上面那句話的但書」，
   不是平行的第二個結論。兩個等重的警示框並排時讀者不知道該信哪個。 */
.caveat{margin-top:12px;padding:10px 12px;border-left:2px solid var(--warning);
  background:var(--surface-2);border-radius:0 8px 8px 0;
  font-size:13px;line-height:1.8;color:var(--text-secondary)}
.caveat b{color:var(--warning)}

/* 文字欄位靠右讀起來很彆扭。這個類別讓最後一欄（說明）改回靠左。 */
.lefty td:last-child,.lefty th:last-child{text-align:left}

/* 結論值列（原為損益兩平卡，該卡已移除；能源影響等處仍沿用此版式）：
   結論要比輸入值大 */
.bkgap{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--grid)}
.bk-label{font-size:12.5px;color:var(--muted)}
.bk-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.1}
@media(max-width:400px){.bk-val{font-size:24px}}
.bk-verdict{font-size:13.5px;font-weight:700}

/* ---------- 首頁 ---------- */
/* .hero / .h-verdict 一族已隨首頁改版移除，樣式一併刪除 */

/* 三個政策模組的方向一致度：首頁獨有的資訊——分頁只能講自己那一塊，
   只有總覽能回答「三個觀點彼此同意嗎」。長端另外一格、不進票數，
   因為它回答的是曲線形狀而不是政策方向（見 README「長端供給壓力不進九宮格」）。 */
.cons{margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}
.cons-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.cons-row{grid-template-columns:repeat(3,1fr)}}
.cons-i{background:var(--surface-2);border-radius:9px;padding:9px 10px}
.cons-i.aside{background:transparent;border:1px dashed var(--border)}
.cons-aside{margin-top:9px}
.cons-aside .cons-row{grid-template-columns:1fr}
@media(min-width:560px){.cons-aside .cons-row{grid-template-columns:1fr}}
.cons-k{display:block;font-size:11.5px;color:var(--muted)}
.cons-v{display:block;font-size:14px;font-weight:700;margin-top:3px}
.cons-v.hawkish{color:var(--serious)} .cons-v.dovish{color:var(--series-1)}
.cons-v.neutral{color:var(--text-secondary)}
.cons-note{font-size:13px;color:var(--text-secondary);line-height:1.8;
  margin-top:11px}

/* 倒數：三個並排，日期與可信度說明在下方 */
.cds{display:grid;gap:9px;margin-top:10px}
@media(min-width:560px){.cds{grid-template-columns:repeat(3,1fr)}}
.cd{background:var(--surface-2);border-radius:9px;padding:11px 12px}
.cd-k{font-size:12px;color:var(--muted)}
.cd-d{font-size:19px;font-weight:700;margin-top:3px;
  font-variant-numeric:tabular-nums}
.cd-n{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}

/* 接下來要盯什麼：門檻與距離 */
.wt{background:var(--surface-2);border-radius:9px;padding:11px 12px;
  margin-bottom:9px}
.wt-k{font-size:12.5px;color:var(--text-secondary);font-weight:600}
.wt-v{font-size:19px;font-weight:700;margin-top:3px;
  font-variant-numeric:tabular-nums}
.wt-n{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}

/* 模組卡的方向章 */
.m-dir{display:inline-block;margin-left:9px;font-size:11.5px;font-weight:700;
  padding:2px 7px;border-radius:6px;vertical-align:3px;background:var(--surface-2)}
.m-dir.hawkish{color:#8d3b1b;background:var(--tint-haw)}
.m-dir.dovish{color:#1d579e;background:var(--tint-dov)}
.m-dir.neutral{color:var(--muted)}

.modcard{display:block;text-decoration:none;color:inherit;
  background:var(--surface-1);border:1px solid var(--border);border-radius:13px;
  padding:16px;box-shadow:var(--shadow);transition:border-color .12s}
.modcard:hover{border-color:var(--text-secondary)}
.modcard.pending{opacity:.6}
.modcard .m-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.modcard .m-name{font-size:14.5px;font-weight:700}
.modcard .m-when{font-size:11.5px;color:var(--muted);white-space:nowrap}
.modcard .m-value{font-size:27px;font-weight:700;margin-top:9px;line-height:1.2}
/* 結論卡的字必須大於任何單一數字（見 .v-main 的說明）。.v-main 在 ≤400px
   會降到 26px，這裡沒有跟著降的話首頁最大的字會變成四張模組卡的數字——
   等於在版面上宣告「單一數字比整體結論重要」。剛好 400px 以下就是
   iPhone 的標準寬度，所以這個破口只在最常見的手機上出現。 */
@media(max-width:400px){.modcard .m-value{font-size:23px}}
/* 13px 時「期限溢酬 +0.78%」剛好多 5px 塞不下，數字會單獨掉到第二行，
   整張卡多一行、同列的另一張卡連結就對不齊了。 */
.modcard .m-note{font-size:12.5px;color:var(--text-secondary);margin-top:7px;
  line-height:1.7}
.modcard .m-more{font-size:12.5px;color:var(--muted);margin-top:12px}

.soonbox{background:var(--surface-1);border:1px solid var(--border);
  border-radius:13px;padding:34px 20px;text-align:center;box-shadow:var(--shadow);
  margin-top:13px}
.soonbox h3{font-size:16px;margin:0 0 10px}
.soonbox p{font-size:14px;color:var(--text-secondary);margin:0 auto;max-width:520px;
  line-height:1.85}

.archive-list{list-style:none;padding:0;margin:0}
.archive-list li{border-bottom:1px solid var(--grid)}
.archive-list li:last-child{border-bottom:none}
/* 兩列之間先前只隔 1.0px（就是那條 border）——點錯月份的機率很高。
   分隔線留著，但兩個觸控盒之間要有肉眼看得出來的間距。 */
.archive-list li{padding:5px 0}
.archive-list a{display:flex;justify-content:space-between;gap:12px;
  padding:13px 8px;border-radius:8px;
  text-decoration:none;color:var(--text-primary);font-size:14px}
.archive-list a:hover{background:var(--surface-2)}
.archive-list a:hover{color:var(--series-1)}
.archive-list .a-meta{color:var(--muted);font-size:12.5px}

/* ---------- 名詞解釋 ---------- */
.teach-more{font-size:13px;margin:8px 0 0}
/* 區塊最下方的「延伸學習」：連到偷懶頁的名詞卡，一行可多張 */
.learn-more{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;margin:16px 0 0;padding-top:10px;border-top:1px solid var(--grid);font-size:13px}
.learn-more span{color:var(--muted);font-weight:600;margin-right:2px}
.learn-more a{display:inline-flex;align-items:center;min-height:40px;color:var(--brand-orange-ink);font-weight:600;text-decoration:none}
.learn-more a::after{content:" →"}
.hm-hero>.learn-more{margin:0;padding:10px 20px 6px}
.le-src-link{display:inline-flex;align-items:center;min-height:44px;font-size:13px;font-weight:600;color:var(--series-1);text-decoration:none}
.teach-more a{color:var(--brand-orange-ink);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.gloss,.poslist{margin:6px 0 0}
.gloss dt,.poslist dt{font-weight:700;font-size:13.5px;margin-top:13px}
.gloss dt:first-child,.poslist dt:first-child{margin-top:0}
.gloss dd,.poslist dd{margin:3px 0 0;color:var(--text-secondary);font-size:13px;line-height:1.75}
@media(min-width:760px){
  .gloss{display:grid;grid-template-columns:130px 1fr;gap:11px 18px}
  .gloss dt{margin-top:0} .gloss dd{margin-top:0}
}

/* ---------- 折疊 ---------- */
details{margin-top:14px;border-top:1px solid var(--grid);padding-top:12px}
details[open]{padding-bottom:2px}
/* 展開列是全站最常點的東西，高度要撐到 44px 才好按 */
summary{font-size:13.5px;color:var(--series-1);cursor:pointer;font-weight:600;
  list-style:none;padding:12px 0}
summary::-webkit-details-marker{display:none}
/* 全域的「結尾 ▾/▴」規則已刪除：它跟各收合家族自己的記號疊在一起，
   開啟狀態時（details[open] 權重較高）還會蓋過抑制規則，造成
   「▾ 標題 ▴」頭尾雙箭頭。現在每一種收合都有自己的記號：
   卡片級 .sect＝右上 ▾/▴、卡內 .f-more／data-m-collapse／.k-more／
   .l-more＝開頭 ▸/▾、teach＝？圓章、首頁模組＝＋/－。
   （目前全站的收合元素都有自己的類別，所以不需要全域後備。） */
details.plain{border-top:none;padding-top:0}

/* ---------- 換頁動線 ---------- */
/* MPA 換頁改成交叉淡入（View Transitions）：支援的瀏覽器不再白屏閃一下。
   使用者關掉動態效果時停用。 */
@view-transition{navigation:auto}
@media(prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),
  ::view-transition-new(*){animation:none!important}}
/* 頁尾的上一頁／下一頁 */
.pagenav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pagenav a{display:flex;flex-direction:column;gap:3px;padding:13px 16px;
  min-width:130px;max-width:48%;border:1px solid var(--border);border-radius:11px;
  background:var(--surface-1);text-decoration:none;font-size:11.5px;
  color:var(--muted)}
.pagenav a b{font-size:14px;color:var(--text-primary)}
.pagenav a:hover{background:var(--surface-2)}
.pagenav .pn-next{margin-left:auto;text-align:right;align-items:flex-end}

.empty{font-size:13px;color:var(--muted);padding:22px 0;text-align:center}
/* 不斷行的小工具。日期預設會在連字號處斷成「2026-⏎07-29」，
   那看起來像兩個殘缺的數字。 */
.nb{white-space:nowrap}

#tip{position:fixed;pointer-events:none;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:13px;
  color:var(--text-primary);opacity:0;transition:opacity .1s;z-index:99;
  /* 這個 30% 黑的陰影是深色模式時代留下的，在淺色底上會糊成一團灰塊 */
  box-shadow:0 4px 14px rgba(15,23,42,.13);white-space:nowrap}
@media(hover:none){#tip{display:none}}

footer{margin-top:26px;font-size:12.5px;color:var(--muted);line-height:1.8}

/* ---------- 聲明配對比對 ---------- */
.drow2{border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  margin-bottom:9px;background:var(--surface-1)}
.drow2 .dlabel2{font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.05em;margin-bottom:7px}
.drow2 .dold,.drow2 .dnew{font-size:13.5px;line-height:1.85;padding:7px 10px;
  border-radius:7px}
.drow2 .dold{background:var(--surface-2);color:var(--muted);margin-bottom:6px}
.drow2 .dnew{background:var(--tint-dov)}
.drow2 .darrow{font-size:11px;color:var(--muted);margin:2px 0 4px}
.drow2.added{border-left:3px solid var(--series-1)}
.drow2.removed{border-left:3px solid var(--muted)}
.drow2.changed{border-left:3px solid var(--serious)}
mark.mo{background:rgba(180,85,43,.18);color:#8d4220;
  text-decoration:line-through;text-decoration-thickness:1px;
  border-radius:3px;padding:0 2px}
mark.mn{background:rgba(42,120,214,.22);color:var(--text-primary);
  font-weight:600;border-radius:3px;padding:0 2px}
.dsame{font-size:12.5px;color:var(--muted);line-height:1.8;padding:5px 12px}
/* 記者會依主題抽出的原句 */
.pline{font-size:13.5px;line-height:1.85;color:var(--text-secondary);
  background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:7px}

/* ---------- 雙分數並列 ---------- */
.dual{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:600px){.dual{grid-template-columns:1fr 1fr}}
.dbox{background:var(--surface-2);border-radius:10px;padding:14px 14px;
  border:1px solid var(--border)}
.dbox.primary{border-color:var(--text-primary);border-width:1.5px}
.dbox .dtitle{font-size:12.5px;color:var(--text-secondary);font-weight:600}
/* 大數字不超過 .v-main：結論文字永遠比數字醒目。 */
.dbox .dscore{font-size:25px;font-weight:700;margin-top:7px;line-height:1.15;
  font-variant-numeric:tabular-nums}
@media(max-width:400px){.dbox .dscore{font-size:23px}}
.dbox .dlab{font-size:12.5px;font-weight:700;margin-top:5px}
.dbox .dnote{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}
.dbox.hawkish .dlab{color:var(--serious)}
.dbox.dovish .dlab{color:var(--series-1)}
.dbox.neutral .dlab{color:var(--muted)}
/* 整塊套 opacity 會連內文一起壓暗——量到只剩 2.4:1，遠低於 4.5。
   改成只把數字與標籤調淡，說明文字維持原本的對比。 */
.dbox.stale{background:var(--surface-2);border-style:dashed}
/* 不用 opacity 壓字（會直接壓垮對比），改用虛線框＋底色表示「這一格別當真」 */
.dbox.stale .dscore{color:var(--text-secondary)}

.warnbox{background:var(--surface-1);border:1px solid var(--warning);
  border-left-width:3px;border-radius:10px;padding:13px 15px;margin-top:14px;
  font-size:13px;line-height:1.8;color:var(--text-secondary)}
.warnbox b{color:var(--warning)}

/* ---------- 投票 ---------- */
.votes{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.vchip{font-size:12px;border-radius:7px;padding:5px 10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-secondary)}
.vchip.hike{border-color:var(--serious);color:var(--serious);font-weight:600}
.vchip.cut{border-color:var(--series-1);color:var(--series-1);font-weight:600}

/* ---------- 措辭熱力圖 ---------- */
.heatwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
/* 全站 table{width:100%} 會把這張表撐到卡片寬，多出來的空間全被
   自動版面塞進第一欄——標籤因此跟自己那一列的格子隔了七百多 px，
   看起來像各自獨立的兩塊。改成內容寬即可，太寬時由 .heatwrap 捲動。 */
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;
  width:max-content;min-width:0;max-width:100%}
.heat th{font-weight:500;color:var(--muted);font-size:11.5px;padding:2px 4px;
  white-space:nowrap;text-align:center;border:none}
.heat th.rowhead{text-align:left;position:sticky;left:0;background:var(--surface-1);
  padding-right:9px;min-width:132px;z-index:1}
.heat td{width:30px;height:26px;text-align:center;border-radius:5px;border:none;
  font-variant-numeric:tabular-nums;padding:0}
.heat td.h0{background:var(--surface-2);color:var(--muted)}
.heat td.h1{background:rgba(42,120,214,.28);color:var(--text-primary)}
/* 55% 藍上放白字只有 2.16:1，遠低於 WCAG 的 4.5。中間色階改用深色字，
   最深的那一階把底色加深到 95% 才撐得起白字。 */
.heat td.h2{background:rgba(42,120,214,.5);color:var(--text-primary)}
.heat td.h3{background:rgba(28,86,158,.97);color:#fff}

/* ---------- 體制頁籤（純 CSS，不依賴 JS）----------
   三張九宮格各一個 radio。選中的那個把對應的 .rpanel 顯示出來。
   用 :checked 加 ~ 相鄰選擇器，沒有 JS 也能切；鍵盤操作由 radio 原生支援。 */
.rtabs{margin-top:4px}
.rtab-in{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
/* 頁籤是這一頁唯一的互動元件，觸控目標要有 44px（先前是 40.8px）。 */
.rtab{display:inline-block;font-size:13px;font-weight:600;cursor:pointer;
  padding:11px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-1);color:var(--text-secondary);
  margin:0 6px 10px 0;white-space:nowrap}
.rtab:hover{border-color:var(--text-secondary);color:var(--text-primary)}
.rtab-in:checked + .rtab{background:var(--text-primary);color:var(--surface-1);
  border-color:var(--text-primary)}
/* 鍵盤 focus 要看得見——radio 本身是隱藏的，所以把外框畫在 label 上 */
.rtab-in:focus-visible + .rtab{outline:2px solid var(--series-1);outline-offset:2px}
.rt-now{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;
  padding:0 5px;border-radius:4px;background:var(--surface-2);
  color:var(--text-secondary)}
.rtab-in:checked + .rtab .rt-now{background:rgba(255,255,255,.22);color:#fff}
.rpanels{position:relative}
.rpanel{display:none}
/* 第 n 個 radio 選中 → 顯示第 n 個 panel */
.rtabs > .rtab-in:nth-of-type(1):checked ~ .rpanels > .rpanel:nth-child(1),
.rtabs > .rtab-in:nth-of-type(2):checked ~ .rpanels > .rpanel:nth-child(2),
.rtabs > .rtab-in:nth-of-type(3):checked ~ .rpanels > .rpanel:nth-child(3){display:block}
.rt-hypo{font-size:12.5px;line-height:1.75;color:var(--text-secondary);
  background:var(--surface-2);border-left:2px solid var(--warning);
  border-radius:0 8px 8px 0;padding:9px 12px;margin:0 0 12px}

/* 目前這一格在三種體制下分別是什麼（在「重心怎麼判定」收合內） */
.rcmp{display:grid;grid-template-columns:76px 1fr auto;align-items:center;
  gap:10px;padding:8px 10px;border-radius:8px}
.rcmp.on{background:var(--surface-2)}
.rcmp-k{font-size:12.5px;color:var(--muted)}
.rcmp-v{font-size:14px;font-weight:700}
.rcmp-v.hawkish{color:var(--serious)} .rcmp-v.dovish{color:var(--series-1)}
.rcmp-v.neutral{color:var(--text-secondary)}
.rcmp-l{font-size:12px;color:var(--muted);white-space:nowrap}
.cflag{color:var(--warning);font-weight:700}

/* ---------- 情境九宮格 ---------- */
.sgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:5px;margin-top:4px;
  font-size:12px}
.sgrid .axis{color:var(--muted);font-size:12px;display:flex;align-items:center;
  justify-content:center;padding:4px 3px;text-align:center}
.sgrid .axis.row{writing-mode:horizontal-tb;min-width:40px}
/* 格子裡只有格名（＋徽章與 ◆）：說明全部收在卡尾「九格各代表什麼」。
   高度以內容為準——九格等高靠 grid 的隱性拉伸，不用 min-height 硬撐。 */
.scell{background:var(--surface-2);border:1px solid transparent;border-radius:9px;
  padding:10px 8px;min-height:0;display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start}
.scell .sname{font-size:12.5px;font-weight:700;line-height:1.4}
/* 複合情境名的限定語（「：通膨優先」）：小一級、獨立一行。
   主情境與「哪一邊優先」是兩層資訊，同一級字時會被讀成一個長字串。 */
.scell .sn-qual{display:block;font-size:11px;font-weight:600;
  color:var(--text-secondary);line-height:1.35;margin-top:1px}
.scell.on .sn-qual{color:inherit}
@media(min-width:760px){.scell{padding:14px 11px}
  .scell .sname{font-size:13.5px}}
/* 會隨體制改變的三格：右上角一個小記號。
   其餘六格不管誰優先都一樣，讀者不必為它們擔心重心翻轉。 */
.scell.conflict{position:relative}
.scell.conflict::after{content:"◆";position:absolute;top:5px;right:6px;
  font-size:9px;color:var(--warning)}
.scell.on{border-color:var(--text-primary);background:var(--surface-1);
  box-shadow:0 0 0 2px var(--text-primary) inset}
.scell.on .sname{color:var(--text-primary)}
.scell.hawkish .sname{color:var(--serious)}
.scell.dovish .sname{color:var(--series-1)}
.scell.neutral .sname{color:var(--text-secondary)}
.sbadge{display:inline-block;font-size:11px;font-weight:700;margin-top:6px;
  padding:1px 6px;border-radius:5px;background:var(--text-primary);color:var(--surface-1)}
/* 手機：「目前位置」四個字自己佔一整行，會把所在的那一列撐到其他列的
   兩倍半高——而那一列本來就因為情境名較長而偏高，兩件事疊起來整張
   格子看起來是歪的。窄螢幕改成不畫這行字：格子已經有反白底 ＋ 粗框
   ＋ 內陰影三重標示，徽章只是把同一件事再說一次。
   圖說那一行會告訴讀者「反白粗框那一格是目前位置」，語意不會遺失。 */
@media(max-width:759px){.scell .sbadge{display:none}}
/* 圖說裡的小圖例：把樣式做得跟格子一樣，讀者不必猜「反白粗框」長怎樣。
   inline-block ＋ nowrap 是必要的：純 inline 元素折到下一行時，
   內陰影會在斷點處各畫半個框，看起來像兩個壞掉的方塊。 */
.lg-on{display:inline-block;white-space:nowrap;
  background:var(--surface-1);color:var(--text-primary);font-weight:700;
  box-shadow:0 0 0 2px var(--text-primary) inset;border-radius:5px;
  padding:1px 5px}
/* .sbadge.alt 已刪除：那是舊的「結論已依重心修正」徽章，
   三張格子之後沒有任何頁面再產生它。 */

/* ---------- 觸發條件 ---------- */
.trig{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;
  padding:11px 0;border-bottom:1px solid var(--grid);align-items:baseline}
.trig:last-child{border-bottom:none}
.trig .tname{font-weight:600}
.trig .tnow{font-size:12px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.trig .tdist{font-variant-numeric:tabular-nums;color:var(--text-secondary);
  white-space:nowrap}
.trig.met .tdist{color:var(--critical);font-weight:700}
/* 資料時效條：把「財報已出未入表」「近期發債」這類狀態合併成短列。
   先前是三四個 warnbox 疊在一起，單卡常駐 845 字——每個框單獨都有理由，
   疊起來就是一堵牆。 */
.tlines{margin-top:14px;border:1px solid var(--border);border-radius:10px;
  padding:4px 12px 8px}
.tlines-k{font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.05em;margin:8px 0 2px}
.tline{margin:0;border:none;border-top:1px solid var(--grid);border-radius:0;
  padding:0}
.tline:first-of-type{border-top:none}
.tline>summary{padding:9px 0;margin:4px 0;font-size:13px;color:var(--text-primary)}
/* 稽核量的是元素盒之間的距離：相鄰的可點元素要留 8px 以上，
   padding 只放大目標、不拉開距離，所以間隔要用 margin 給。 */
/* 表格列裡的連結沿用全站的負 margin 觸控放大（td a 那條規則），
   這裡**不要**再動 td 內距——縮小內距會讓原本「觸控區彼此重疊、
   稽核視為同一組」的連結變成相距 0.2px 的兩個目標。
   要給的是表格與下一個 summary 之間的距離。 */
.tline .tscroll{margin-bottom:12px}
.tline .f-detail{padding-bottom:8px}
/* 四步計算卡：每步一行、行末是結果。取代散在四處的計算說明。 */
.steps{margin:14px 0 2px;border:1px solid var(--border);border-radius:10px;
  overflow:hidden}
.step{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:baseline;
  padding:10px 13px;border-top:1px solid var(--grid);font-size:13.5px}
.step:first-child{border-top:none}
.step-k{font-weight:700;color:var(--text-secondary);font-size:12.5px;white-space:nowrap}
.step-t{color:var(--text-primary);line-height:1.6}
.step-r{font-weight:700;white-space:nowrap}
@media(max-width:520px){.step{grid-template-columns:78px 1fr}
  .step-r{grid-column:2;justify-self:end}}
.trig .tadj{font-size:10.5px;font-weight:700;color:var(--series-1);
  border:1px solid var(--series-1);border-radius:5px;padding:1px 5px;
  margin-left:7px;vertical-align:1px}
/* 動能指向：當期數據正朝這條門檻走——「可能下一格」從這些條裡挑。 */
.trig .tdir{font-size:10.5px;font-weight:700;color:var(--good);
  border:1px solid var(--good);border-radius:5px;padding:1px 5px;
  margin-left:6px;vertical-align:1px;white-space:nowrap}
.trig .tbind{font-size:10.5px;font-weight:700;color:var(--warning);
  border:1px solid var(--warning);border-radius:4px;padding:0 5px;margin-left:6px;
  vertical-align:1px;white-space:nowrap}

/* ---------- 折線圖（刻度用 HTML，避免文字被等比縮小） ---------- */
/* 參考線只畫「資料實際的最高／最低值」，各附數值標籤——
   之前的背景中線落在留白後區間的 50%，不對應任何數值，已移除。 */
/* 右邊留 5px：最新值的圓點是 8px、以最後一點為圓心，
   在時間序列的右端會有一半（4px）超出繪圖區。留白比裁掉好，
   裁掉會讓最新的那一點看起來比實際低。 */
.lwrap{margin-top:6px;padding-right:5px}
.lplot{position:relative;border-left:1px solid var(--grid);
  border-bottom:1px solid var(--grid)}
/* 高度由每張圖自己用 style 指定（charts.line_chart 的 height 參數）。
   這裡寫死 150px 會讓要求 120px 的圖被拉高——SVG 是 preserveAspectRatio="none"，
   拉高不會留白，而是把整條線縱向拉長，形狀因此失真。 */
.lchart{display:block;width:100%}
/* 最高／最低值標籤：加不透明底色，讓它壓在線上時仍讀得出來。
   純文字陰影在深色線條上仍會糊成一團。 */
.glab{position:absolute;left:4px;font-size:11.5px;color:var(--muted);
  line-height:1;font-variant-numeric:tabular-nums;pointer-events:none;
  background:var(--surface-1);padding:1px 4px;border-radius:4px;
  box-shadow:0 0 0 1px var(--surface-1)}
/* 最新值的圓點：疊在 SVG 之上，才不會被 preserveAspectRatio="none" 壓扁，
   也不會在右邊界被裁掉一半 */
.ldot{position:absolute;width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface-1);
  pointer-events:none}
.lmark{position:absolute;top:3px;transform:translateX(-50%);font-size:11.5px;
  color:var(--muted);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 4px var(--surface-1),0 0 4px var(--surface-1)}
.lxaxis{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:12px;color:var(--muted);margin-top:7px;
  font-variant-numeric:tabular-nums}
.lxaxis b{color:var(--text-primary);font-size:12.5px}

/* ---------- 本期變化摘要 ---------- */
.chg{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;
  padding:17px 16px;box-shadow:var(--shadow);margin-top:13px}
@media(min-width:760px){.chg{padding:20px 22px}}
.chg .ctitle{font-size:12.5px;color:var(--muted)}
/* 零變化時的單行版本 */
.chg.quiet{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;
  padding:12px 16px;font-size:13.5px}
.chg.quiet .ctitle{font-size:12px}
.chg .chead{font-size:19px;font-weight:700;margin-top:2px;line-height:1.5}
@media(min-width:760px){.chg .chead{font-size:21px}}
.chg.moved .chead{color:var(--serious)}

/* 「N 天前發布」。內容會一直留到下一次發布，讀者可能是在發布後第 10 天
   看到這張卡——不標時間的話會誤以為是今天的新聞。 */
.cage{font-size:12px;color:var(--muted);margin-top:5px}

/* 一句淨結論。七條變化平鋪而沒有加總，讀者只能自己數——而且很容易數錯，
   因為「解除一條鷹派訊號」其實是鴿派的變化。 */
.cnet{font-size:14px;line-height:1.8;margin-top:10px;padding:10px 12px;
  border-radius:9px;background:var(--surface-2)}
.cnet.dovish{background:var(--tint-dov)} .cnet.hawkish{background:var(--tint-haw)}
.cnet b{color:var(--text-primary)}

/* 訊號變化按**方向**分兩欄，不按新觸發／已解除分。
   一條已解除的鷹派訊號是鴿派的變化，照增減分組會把它跟真正的鷹派變化
   排在一起，讀者看到的方向剛好相反。 */
.ccols{display:grid;grid-template-columns:1fr;gap:11px;margin-top:13px}
@media(min-width:700px){.ccols{grid-template-columns:1fr 1fr;gap:13px}}
.ccol{border-radius:10px;padding:11px 12px;background:var(--surface-2);
  border-left:3px solid var(--border)}
.ccol.dovish{border-left-color:var(--series-1)}
.ccol.hawkish{border-left-color:var(--serious)}
.ccol-h{font-size:12.5px;font-weight:700;color:var(--text-secondary);
  margin-bottom:4px}
.ccol.dovish .ccol-h{color:var(--series-1)}
.ccol.hawkish .ccol-h{color:var(--serious)}
.ccol-n{font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums}
/* ＋／− 只表示「新出現／不再成立」，刻意不上色：顏色留給方向，
   一個元件同時用顏色表達兩件事，讀者只會看到兩個互相打架的訊息。 */
.citem{display:flex;gap:7px;align-items:baseline;font-size:13.5px;
  line-height:1.65;padding:4px 0}
.citem .cmark{font-size:12px;font-weight:700;flex-shrink:0;color:var(--muted);
  font-variant-numeric:tabular-nums;width:1.1em}
.citem .ctext{flex:1;min-width:0}
.citem .cmod{font-size:11px;color:var(--muted);flex-shrink:0}
.clegend{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.6}
.cmoves{margin-top:10px}
.cmove{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;
  padding:8px 0;border-bottom:1px solid var(--grid);align-items:baseline}
.cmove:last-child{border-bottom:none}
.cmove .cm-val{font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.cmove .cm-delta{font-weight:700;font-variant-numeric:tabular-nums}
/* 「利升息／利降息」寫成字。顏色不該是唯一的載體——對色覺障礙的讀者
   紅綠等於沒有資訊，對其他人也要先讀完下方說明才知道紅色代表什麼。 */
.cmove .cm-tag{font-size:11.5px;font-weight:600;margin-right:6px;
  padding:2px 6px;border-radius:5px;background:var(--surface-2);
  white-space:nowrap;vertical-align:1px}
/* 顏色是「這個變動對利率的意思」，不是數字漲跌 */
.cmove .cm-delta.hawkish{color:var(--serious)}
.cmove .cm-delta.dovish{color:var(--series-1)}
.cmove .cm-delta.flat{color:var(--text-secondary)}

/* ---------- 近 N 期數值列 ---------- */
/* 六格等寬。欄寬用 max-content 當下限，格子才不會被壓到互相疊字；
   單位已經抽到 .munit 只寫一次，所以六格在 390px 上也塞得下。 */
.mwrap{margin-top:10px;border-top:1px solid var(--grid);padding-top:9px}
.munit{font-size:11px;color:var(--muted);text-align:right;margin-bottom:3px}
.mseries{display:grid;grid-auto-flow:column;
  grid-auto-columns:minmax(max-content,1fr);gap:2px;
  overflow-x:auto;scrollbar-width:thin}
.mcell{text-align:center;padding:2px 2px;border-radius:5px;min-width:0}
.mcell.last{background:var(--surface-2)}
/* KPI 卡在桌機四欄下內容寬只有 218px。字級再大一點，
   最寬的那張卡（參與率 61.9%、日期帶年份）就會有一格被切掉半個字，
   而被切掉的數字會讀成另一個數字，那比字小更糟。 */
.mval{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-secondary);
  line-height:1.3;white-space:nowrap}
.mcell.last .mval{color:var(--text-primary);font-weight:700}
.mdate{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}

/* ---------- 狀態軌跡條 ---------- */
.sstrip{display:flex;gap:2px;margin-top:9px}
.sq{flex:1;height:7px;border-radius:2px;background:var(--surface-2)}
.sq.good{background:var(--good)} .sq.warning{background:var(--warning)}
.sq.critical{background:var(--critical)} .sq.unknown{background:var(--muted-bar)}
.sstrip-note{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- 資料截止日籤 ---------- */
.asof{display:inline-block;font-size:11px;color:var(--muted);
  border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:6px;
  vertical-align:2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- 首頁的整體總述 ----------
   這是首頁上唯一要「讀」的東西（其餘都是掃的），所以字級比內文大、
   行距放寬，並限制行長：桌機的卡片寬 1080px，13px 字會排到每行 80 個中文字，
   是舒適上限的兩倍，眼睛換行時很容易回到同一行。 */
.brief{background:var(--surface-1)}
.brief-k{font-size:11.5px;font-weight:700;color:var(--muted);
  letter-spacing:.08em;margin-bottom:9px}
/* 三則 bullet 版式：模組名粗體＋豎線，行距鬆一點供掃讀 */
.brief-src{font-size:11.5px;font-weight:500;color:var(--muted);
  margin-left:10px;letter-spacing:0}
.brief-list{list-style:none;margin:10px 0 0;padding:0}
.brief-list li{font-size:14px;line-height:1.85;color:var(--text-primary);
  padding:7px 0;border-top:1px solid var(--grid)}
.brief-list li:first-child{border-top:none;padding-top:2px}
.brief-list li b{font-weight:700}
.brief-t{font-size:15px;line-height:2;margin:0;max-width:34em;
  color:var(--text-primary)}
@media(min-width:760px){.brief-t{font-size:15.5px}}
/* 重點句：整段的結論（下一步是升是降、解鎖條件），獨立一行加粗，
   掃視的人只讀這一行也帶得走東西。 */
/* 「本次更新」獨立一段：它回答的是「這一次新拿到什麼」，跟下一段的
   「整體現在是什麼狀況」不是同一個問題。多數日子這一段不存在。 */
.brief-new{margin:0 0 12px;padding:10px 12px;border-radius:9px;
  background:var(--surface-2);font-size:14.5px;line-height:1.8;
  color:var(--text-primary)}
.brief-key{font-size:15px;line-height:1.9;margin:10px 0 0;max-width:34em;
  font-weight:700;color:var(--text-primary)}
@media(min-width:760px){.brief-key{font-size:15.5px}}

/* ---------- 兩條軸的判定依據 ----------
   分兩層：**結論常駐、算式收合**。
   讀者的問題是「為什麼就業算弱」，那句話必須永遠看得到；
   只有要自己驗算的人才需要展開看權重、加總與門檻出處。

   先前整塊包在一個 .f-more 裡（12.5px 灰字），跟旁邊的圖例說明
   同字級同顏色同位置，掃過去只會被歸類成註腳——做了跟沒做一樣。 */
/* 兩條軸各自成一個框、之間留 8px：先前共用一個外框、中間只隔一條 1px 的
   分隔線，兩個展開列的觸控盒因此只差 1px（版面稽核抓到的）——
   想點「通膨」很容易點到「就業」。 */
.axg{margin-top:16px}
.ax{margin:8px 0 0;padding:0;border:1px solid var(--border);
  border-radius:10px;background:var(--surface-1)}
.ax:first-child{margin-top:0}
.ax>summary{list-style:none;cursor:pointer;padding:11px 34px 11px 13px;
  display:grid;grid-template-columns:auto auto 1fr;gap:3px 9px;
  align-items:baseline;position:relative;font-weight:400}
.ax>summary::-webkit-details-marker{display:none}
.ax>summary:hover{background:var(--surface-2)}
.ax>summary::after{content:"▾";position:absolute;right:14px;top:50%;
  transform:translateY(-50%);font-size:11px;color:var(--muted)}
.ax[open]>summary::after{content:"▴"}
.ax-k{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.ax-v{font-size:15px;font-weight:700;color:var(--text-primary);
  white-space:nowrap}
/* 理由句在窄螢幕上換到第二行、跨滿整列：跟軸名擠同一行會只剩十幾個字寬 */
.ax-lead{font-size:12.5px;color:var(--text-secondary);line-height:1.65;
  grid-column:1/-1;word-break:keep-all;overflow-wrap:break-word}
@media(min-width:760px){
  .ax>summary{align-items:center}
  .ax-lead{grid-column:3;line-height:1.5}
}
.ax-body{padding:0 13px 13px}

/* ---------- 算式（展開後） ----------
   刻意做成算式而不是散文：讀者要能自己驗算，尤其是門檻——
   那是整頁權重最大（跨過去整張部位表就換掉）、先前卻完全沒有交代的東西。 */
.wx-h{font-size:13.5px;font-weight:700;margin-bottom:9px}
.wx-r{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;
  align-items:baseline;font-size:12.5px;color:var(--text-secondary);padding:3px 0}
.wx-k{min-width:0}
.wx-w{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.wx-v{font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.wx-sum{border-top:1px solid var(--border);margin-top:5px;padding-top:7px}
.wx-thr{margin-top:9px;font-size:13.5px;font-weight:700;
  font-variant-numeric:tabular-nums}
.wx-src{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.7}
/* 「為什麼兩頁講的不一樣」——這一段是整塊的重點，要跟算式區分開 */
.wx-note{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--text-secondary);line-height:1.75}

/* ---------- 頁內錨點導覽 ----------
   預設**完全不出現**（height:0）。
   卡區本來就收合，那八九條標題列自己就是目錄，而且每條都帶一句結論——
   再放一列錨點是同一件事做兩次。更糟的是舊版跟主選單長得一模一樣
   （都是 chip ＋ 淺灰底條），一個是換頁一個是換段，讀者得停一下才分得出來。
   展開之後頁面會漲到一萬多 px，那時候才真的難捲，也才滑出來。
   由 JS 在展開三個卡區時加上 .on；一旦出現就不收回——
   導覽列忽隱忽現比一直在還煩。

   分成外框（.anav，負責背景與貼頂）與內層（nav.anchors，負責橫捲）兩層：
   兩側的漸層必須畫在**背景之上、文字之上**。用 mask 做的話會把背景一起
   挖掉，變成看得到底下的內文從縫裡穿過去。 */
.anav{position:sticky;top:var(--navh);z-index:19;background:var(--bg);
  box-shadow:0 0 0 100vmax #fff;clip-path:inset(0 -100vmax -14px -100vmax);
  height:0;padding:0;opacity:0;pointer-events:none;transform:translateY(-4px);
  /* 只淡入、**不做高度動畫**：高度一次到位，JS 才能用一次 scrollBy
     精準補掉版面被推下去的距離。高度慢慢長的話得逐格補，
     那會跟讀者自己的捲動打架。 */
  transition:opacity .18s ease,transform .18s ease}
.anav.on{height:47px;padding:5px 0 6px;opacity:1;transform:none;
  pointer-events:auto;border-bottom:1px solid rgba(18,35,59,.10)}
@media(prefers-reduced-motion:reduce){.anav{transition:none}}
/* 兩側還有內容時給一層漸層。舊版在手機上把 1021px 的內容塞進 362px 的視窗，
   右邊硬切、沒有任何提示——實際上讀者只看得到前三項，
   而且會以為就只有那三項。 */
.anav::before,.anav::after{content:"";position:absolute;top:0;bottom:0;width:28px;
  pointer-events:none;opacity:0;transition:opacity .15s ease}
.anav::before{left:0;background:linear-gradient(90deg,#fff,transparent)}
.anav::after{right:0;background:linear-gradient(270deg,#fff,transparent)}
.anav.fl::before{opacity:1}
.anav.fr::after{opacity:1}
nav.anchors{display:flex;height:100%;align-items:center;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
nav.anchors::-webkit-scrollbar{display:none}
/* 主選單是 chip、這一列是純文字：層級靠**外觀**表達，不是靠上下位置 */

  width:2px;height:2px;border-radius:50%;background:var(--baseline)}

/* 今日市場焦點：hero 之上的窄條。chips 一列掃完，焦點段一段就好。 */
/* 升格成強調卡：頂部主題色帶＋放大的標題（帶日期）＋與下方 hero 拉開。
   先前是一條 11px 灰標題的窄 strip，跟目前情境黏在一起、掃過去會漏看。 */
/* ⚠️ 這裡不能 overflow:hidden：「選擇」勾選面板是絕對定位浮層，
   會被整個剪掉——桌機點了看起來像沒反應（實際發生過）。
   頂部色條用 border-top 畫：3px 的 ::before 疊圓角會被垂直方向夾成
   一條兩端漸縮的怪線（也實際發生過），border-top 沿圓角自然轉彎。 */
.focus-strip{position:relative;padding:16px 18px 15px;margin-bottom:26px;
  border-top:3px solid var(--series-1)}
.fs-head{font-size:15px;font-weight:800;letter-spacing:.02em;
  color:var(--text-primary)}
.fs-date{margin-left:9px;font-size:11.5px;font-weight:500;color:var(--muted)}
/* 三地時間戳：手機縮一號字＋前綴改短版才塞得進一行（360px 實測）。
   320px 這種古董寬度仍會折行——為它再縮就小到讀不了，不遷就。 */
.ws-short{display:none}
@media(max-width:759px){
  .sub .ws{font-size:10.5px;letter-spacing:0}
  .ws-long{display:none}
  .ws-short{display:inline}}
/* ---------- 焦點條的自選 chip ----------
   目錄 14 顆全在 HTML 裡，預設組以外掛 .fs-off 隱藏；「自訂」是原生
   details 元素：桌機浮層、手機（759px 以下）改全寬面板往下推——浮層在
   手機上會超出視窗或被手指擋住。勾選列拉到 44px 以上符合觸控目標。 */
.fs-off{display:none}
.fs-when{display:block;font-size:10px;color:var(--muted);margin-top:1px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.fs-pick{position:relative;display:inline-block;margin-left:10px;
  font-weight:400;vertical-align:1px}
/* 熱區與外觀拆開：summary 本體是透明熱區（手機撐到 44px 過觸控稽核），
   看得見的小按鈕畫在內層 .fs-pick-btn——先前把 summary 整顆撐高，
   邊框方塊比標題還高一截，上下框線像懸浮的怪線（使用者回報過）。 */
.fs-pick>summary{cursor:pointer;list-style:none;display:inline-flex;
  align-items:center;user-select:none;padding:0;border:0;background:none}
.fs-pick>summary::-webkit-details-marker{display:none}
.fs-pick-btn{font-size:11.5px;color:var(--muted);
  border:1px solid var(--border);border-radius:4px;padding:2px 9px;
  display:inline-block;line-height:1.5}
.fs-pick[open] .fs-pick-btn{color:var(--text-primary);
  border-color:var(--text-primary)}
/* 面板改網格：桌機三欄的寬長方形、手機兩欄近正方形——14 個選項
   排成一條長列要滾很久（使用者嫌）。分隔線取消：網格下橫線會斷在
   半路，行距就是分隔。 */
/* 寬度跟著內容撐開（Windows 中文字型比較寬，固定 440px 時長標籤會撐出
   白框——使用者回報過），上限是視窗寬；真的放不下時標籤允許換行。 */
.fs-pick-panel{position:absolute;left:0;top:calc(100% + 6px);z-index:40;
  background:var(--surface-1);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px 10px;width:max-content;min-width:440px;
  max-width:calc(100vw - 48px);box-sizing:border-box;
  display:grid;grid-template-columns:repeat(3,auto);column-gap:18px;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.fs-pick-panel label{display:flex;align-items:center;gap:8px;
  min-height:44px;font-size:13px;color:var(--text-primary);
  cursor:pointer;white-space:normal;line-height:1.35}
.fs-pick-panel input{width:15px;height:15px;accent-color:var(--series-1)}
.fs-pick-panel label:has(input:disabled){opacity:.4;cursor:default}
.fs-pick-note{font-size:11px;color:var(--muted);margin-top:2px;
  border-top:1px solid var(--grid);padding-top:8px;white-space:nowrap;
  grid-column:1/-1}
/* 頁尾的收合說明區：預設收起只露一行，展開才見完整指標與來源說明 */
.foot-fold>summary{cursor:pointer;list-style:none;font-weight:700;
  color:var(--muted);font-size:12px;user-select:none;padding:4px 0}
.foot-fold>summary::before{content:"▸ ";font-weight:400}
.foot-fold[open]>summary::before{content:"▾ "}
.foot-fold>summary::-webkit-details-marker{display:none}
.foot-fold-body span{display:block;margin-top:6px;line-height:1.8}
@media(max-width:759px){
  .fs-pick{position:static}
  /* 手機的觸控目標：熱區（summary）拉到 44px，外觀（.fs-pick-btn）不變 */
  .fs-pick>summary{min-height:44px;box-sizing:border-box}
  .fs-pick-panel{position:static;margin-top:8px;width:100%;min-width:0;
    box-shadow:none;grid-template-columns:repeat(2,1fr);column-gap:10px}
  /* 窄欄容不下 nowrap 的長標籤（「12 月 FOMC 升降息機率」）——
     手機允許換行、字縮一號；備註行同理 */
  .fs-pick-panel label{white-space:normal;font-size:12px;line-height:1.4}
  .fs-pick-note{white-space:normal}
  .foot-fold>summary{display:flex;align-items:center;min-height:44px}}
/* chips 之間用細分隔線取代純留白：三顆數字各自成柱、視線好對位；
   最後一顆不畫線。手機換行時分隔線自動消失（border 在左側）。 */
/* 固定四格網格：桌機一行四格、手機 2×2。格位天天一樣，選什麼放什麼，
   不再隨勾選數量換行漂移。分隔線在網格版取消（隱藏的 chip 仍在 DOM，
   nth-child 對不準「可見的第一格」，畫了只會斷在怪地方）。 */
.fs-chips{display:grid;grid-template-columns:repeat(4,1fr);
  gap:10px 18px;margin-top:8px}
.fs-chip{padding:2px 0;min-width:0}
@media(max-width:759px){
  .fs-chips{grid-template-columns:repeat(2,1fr)}}
.fs-chip span{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.fs-chip b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.fs-chip i{font-style:normal;font-size:11.5px;margin-left:6px;color:var(--muted)}
.fs-chip i.up{color:var(--critical)}
.fs-chip i.dn{color:var(--good)}
.fs-src{font-size:10.5px;color:var(--muted);margin-left:7px;white-space:nowrap}
/* 焦點段給一個淺色底框：跟上方數字 chips 分成兩個視覺層，
   一眼分得出「數字」與「敘述」——先前兩者直接疊在一起。 */
/* 論述容器：底色框只包一次，段落在框內分段——每段各自一個框
   會把一篇報導切成三塊碎片 */
.fs-body{margin:12px 0 0;max-width:47em;background:var(--surface-2);
  border-radius:9px;padding:11px 13px}
/* 3 則重點：一則一行、左側小圓點，則與則之間留白——掃一眼就看得出
   今天有幾件事（先前是兩三段散文，被嫌太長又太籠統）。 */
.fs-list{list-style:none}
/* 版式 A：主軸一段＋補充清單（補充清單嵌在同一個底色框裡） */
.fs-main{margin:0;font-size:14px;line-height:1.85;color:var(--text-primary)}
.fs-body .fs-list{margin:10px 0 0;padding:10px 0 0;
  border-top:1px solid var(--grid)}
.fs-body .fs-text{font-size:13.5px;line-height:1.8;color:var(--text-primary);
  margin:0;position:relative;padding-left:14px}
/* 不用 justify：中英數混排的短行會把中文字距硬撐開（手機實測） */
.fs-list .fs-text::before{content:"";position:absolute;left:2px;top:.78em;
  width:5px;height:5px;border-radius:50%;background:var(--series-1)}
.fs-body .fs-text+.fs-text{margin-top:9px}
.fs-link{padding:4px 0}
.fs-link a{color:var(--series-1);text-decoration:none;font-size:12.5px;
  display:inline-block;padding:8px 0;line-height:1.5}
.fs-note{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.6}

/* ---------- 焦點條 2026-10 改版：截圖友善 ----------
   使用者每天把這一區截圖發社群，所以它要像一張獨立的圖卡：
   桌機兩欄（左：2×2 數據磚；右：新聞），手機上下堆疊；
   數字是有底色的磚（標籤→數值→變動→資料日四層），新聞框不再限寬，
   最底下一條品牌列（站名、標語、更新時間、新聞來源）。 */
.fs-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media(min-width:900px){
  .fs-grid{grid-template-columns:minmax(300px,36%) 1fr;align-items:stretch}}
.focus-strip .fs-chips{grid-template-columns:repeat(2,1fr);gap:8px;margin:0;
  grid-auto-rows:1fr;align-content:stretch}
/* 「選擇」是 details：全站 details 預設有上框線＋上邊距，套到這顆小按鈕上
   就是標題上方那條莫名的短線（截圖裡很明顯）——這裡全部歸零 */
.focus-strip .fs-pick,.focus-strip .fs-pick[open]{margin-top:0;border-top:0;
  padding-top:0;padding-bottom:0}
.focus-strip .fs-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px}

.focus-strip .fs-chip.fs-off{display:none}
.focus-strip .fs-chip span{font-size:11.5px;color:var(--text-secondary);
  margin-bottom:3px;line-height:1.35}
.focus-strip .fs-chip b{font-size:21px;font-weight:800;line-height:1.2;
  letter-spacing:-.01em}
.focus-strip .fs-chip i{margin-left:0;margin-top:2px;font-size:12px;
  font-weight:600;line-height:1.35}
.focus-strip .fs-chip .fs-when{margin-top:4px}
/* 桌機：磚被拉到跟新聞框同高，內容垂直置中、數字放大一號 */
@media(min-width:900px){
  .focus-strip .fs-chip{justify-content:center;padding:12px 14px}
  .focus-strip .fs-chip b{font-size:25px}
  .focus-strip .fs-chip i{font-size:12.5px}}
.fs-news{min-width:0;display:flex;flex-direction:column}
.fs-news .fs-body{margin:0;max-width:none;flex:1;padding:13px 15px}
.fs-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;
  color:var(--series-1);margin-bottom:4px}
/* 主軸存檔（2026-10）：今天＋過去 4 天 */
.fs-days{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin:2px 0 10px;padding-bottom:2px}

.fs-main+.fs-main{margin-top:8px}
/* 主軸標題（2026-10）：一句粗體點出今天的核心事件，只看標題也知道重點 */

  color:var(--brand-ink,var(--text-primary));letter-spacing:.01em}

/* 補充依讀者選的前兩個指標換主題（2026-10）：行首的主題標籤 */
.fs-tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:5px;

  line-height:1.7;vertical-align:1px;white-space:nowrap}
/* ---------- 期中選舉預測卡（Polymarket） ---------- */

.el-legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.el-sw{flex:none;width:10px;height:10px;border-radius:3px}
.el-races{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.el-state{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.el-race b{display:block;margin-top:2px;font-size:17px;line-height:1.3;
  font-variant-numeric:tabular-nums}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-race small.el-nm{color:var(--text-secondary)}

.el-mini{height:6px;border-radius:3px}
.el-note{margin:12px 0 0;font-size:11.5px;line-height:1.7;color:var(--muted)}
/* 全站的 details 有上框線與內距（收合區塊用）——這裡是行內的小說明，歸零 */
.el-how{margin:0;padding:0;border-top:0;font-size:11.5px;color:var(--muted)}

.el-how>summary::-webkit-details-marker{display:none}
.el-how>summary::after{content:" ▾"}.el-how[open]>summary::after{content:" ▴"}
.el-how p{margin:0 0 4px;line-height:1.75}

/* ---------- 聯準會頁（2026-10）：事實清單、時間軸、委員、點陣圖、紀要 ---------- */
.ai-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;

.fx-dir.dovish,.fx-act.dovish{color:var(--good)}
.fx-bo{display:inline-block;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;

  padding:7px 0 7px 14px;font-size:13.5px;line-height:1.55}

.fx-tl .tl-b{color:var(--text-secondary)}
.fx-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:6px}
.fx-p,.fx-sp{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-1)}
.fx-pn{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}

.fx-pn span{font-size:12px;color:var(--muted)}
.fx-tag{display:inline-block;margin-top:6px;font-size:11.5px;padding:2px 7px;border-radius:6px;
  border:1px solid var(--border);color:var(--muted)}
.fx-tag.hawkish{border-color:var(--critical);color:var(--critical)}
.fx-tag.dovish{border-color:var(--good);color:var(--good)}
.fx-pnote{font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.55}

.fx-dotwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fx-dots{width:100%;max-width:900px;height:auto;display:block;margin:4px 0}
