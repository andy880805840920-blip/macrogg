name: 更新儀表板

# 排程對準「台灣讀者看盤的三個時間點」，不對準個別發布日。
#
#   台灣 05:03（每天）：     美股收盤後——前一晚美國的發布、收盤價、
#                            FedWatch 都已定案。週六這次收週五的盤；週日這次
#                            數字與週六相同，主要更新日期與「今明兩天」（預告週一）。
#                            （2026-10 由 07:03 提前：GitHub 早上的排程常延遲
#                            一個多小時，提前才能讓讀者 7 點前看到新版）
#   台灣 15:03（週一～週五）：台股、台指期日盤收盤後——亞洲時段的新聞與收盤。
#                            （2026-10 由 16:05 提前；冬令時倫敦 16:00 才開盤，
#                            歐洲開盤後的報價由晚上那次補上）
#   台灣 20:33（週一～週五）：晚間版——當天亞洲、歐洲時段的新聞與報價。
#                            （2026-10 由 22:45 提前。注意：美東 08:30 的數據在台北
#                            夏令 20:30、冬令 21:30 才公布，這次通常還抓不到，
#                            發布日的新數字會由隔天 05:03 那次補上）
#   週日只跑早上那次（2026-10 起）。
#
# GitHub Actions 的 cron 一律是 UTC、沒有時區支援；台灣沒有夏令時間，
# 所以這三個時間點全年固定，不必隨美國換季調整。
# 分鐘刻意不排在 :00——整點是全 GitHub 排程最擠的時刻，延遲常達數十分鐘。
#
# 執行是冪等的：非發布日跑起來只是重新產生同一份頁面（資料沒變就跳過
# commit）。一個月約 95 次執行，public repo 的 Actions 不計分鐘數。
on:
  # 2026-10-22 起關閉 GitHub 內建排程（實際常延遲 3～8 小時），
  # 改由外部在台北 07:00（每天）、15:30 與 21:00（週一～週五）手動觸發。
  # 原排程：'3 21 * * *'、'3 7 * * 1-5'、'33 12 * * 1-5'
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發
  # 改了程式或設定就重新產生一次。沒有這一段的話，push 完網站不會有任何
  # 反應——要等到下一次排程才會套用新的版面。
  #
  # paths-ignore 是必要的：這個 workflow 自己會 commit output/ 與 state/，
  # 不排除的話它會觸發自己，變成無窮迴圈。
  push:
    branches: [main, master]
    paths-ignore:
      - 'output/**'
      - 'state/**'
      - '**.md'

# 需要寫入權限才能把產出 commit 回 repo
permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝依賴
        run: pip install -r requirements.txt

      # 2026-10 新增：上線前的兩道關卡。任何一道沒過，這次就不產生頁面、
      # 不 commit——網站維持上一版，不會出現壞掉的頁面。
      #
      # ① 語法檢查：用跟正式執行同一版的 Python（3.11）把每個 .py 編譯一次。
      #    實際發生過：一行只有新版 Python 看得懂的 f-string 寫法，在 3.11
      #    直接 SyntaxError，整次更新失敗、錯誤訊息又埋在很長的 log 裡。
      - name: 語法檢查（Python 3.11）
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          bad = []
          for p in sorted(pathlib.Path(".").glob("**/*.py")):
              if any(x in p.parts for x in ("output", ".git", "node_modules")):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except py_compile.PyCompileError as e:
                  bad.append(str(p)); print(e.msg)
          if bad:
              print("::error::語法錯誤：" + "、".join(bad))
              sys.exit(1)
          print("語法檢查通過")
          PY

      # ② 核心規則測試：新聞選文規則、殖利率曲線（Python 與瀏覽器端
      #    計算必須一致）。這幾個測試只用內建的假資料、不連網，結果固定。
      #    其他測試有些會隨日期或外部資料變動，不放在這道關卡裡。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 核心規則測試
        run: |
          set -e
          for t in test_news_rules test_curve_window test_curve_weekly test_future_outlook test_topics_election test_batch18 test_grid_bands test_brief test_signal_order test_hyperscaler_data test_hyperscaler_forward test_treasury_yields test_inflation_verdict test_ask test_signal_impact test_liquidity_narrative test_longend test_fci test_flows test_forecasts test_ppi test_rate_live test_stories test_market_holidays test_ui_batch_1021; do
            if [ ! -f "tests/$t.py" ]; then echo "::warning::找不到 tests/$t.py，略過"; continue; fi
            echo "::group::$t"
            python tests/$t.py
            echo "::endgroup::"
          done

      # SQLite 內含每次抓取的快照（修正追蹤的後備來源，也是
      # 「FRED 這一次抓不到就沿用上次的值」的後備資料）。
      # 只放進 Actions 快取、不 commit 進 repo，避免二進位檔把 repo 撐大。
      #
      # ⚠️ 要快取**整個 data/**，不是只有 labor.db——先前只快取 labor.db，
      # 於是 inflation.db、rates.db 每次執行都從零開始，快照後備在
      # 通膨與長端模組上等於不存在：CUSR0000SASLE 一抓失敗，
      # 核心服務除住房推導不出來，supercore KPI 與黏性訊號整串缺值。
      # restore-keys 保留舊的 labor-db- 前綴，改版後第一次執行
      # 仍接得回既有的勞動資料庫。
      - name: 還原資料庫快取
        uses: actions/cache@v5
        with:
          path: data
          key: dashboard-db-${{ github.run_id }}
          restore-keys: |
            dashboard-db-
            labor-db-

      - name: 產生頁面
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # SEC 要求帶可聯絡的 User-Agent，格式是「名稱 你的信箱」。
          #
          # ⚠️ 這個變數沒設定時，Actions 送進來的是**空字串**（不是「沒有這
          # 個變數」）。程式端已經用 `or` 接住並退回預設值——但預設值裡的
          # 信箱是假的，SEC 有可能限流甚至擋掉。強烈建議到
          # Settings → Secrets and variables → Actions → Variables
          # 新增 SEC_USER_AGENT，值填「你的名字 你的信箱」。
          #
          # 為什麼要特別講：SEC 擋掉請求時，科技巨頭那一區會退回 config 的
          # 手動後備值，畫面上仍然有數字、看起來完全正常，只是那是上一次
          # 人工填的舊數字。現在退回時會印一行 error，畫面上也會明講。
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          # 選配：BLS 快速通道的金鑰。**不設也能用**——沒金鑰走 v1
          # （每天 25 次查詢、一次 25 條序列），這一層只要近兩年，夠用。
          # 註冊一把免費金鑰（v2）可放寬到每天 500 次、一次 50 條：
          #   https://data.bls.gov/registrationEngine/
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # 選配：首頁「整體情勢」的模型潤稿。設一把就好，兩把都設時
          # 優先用 Gemini（有免費額度）。沒設就用規則組裝版，一樣能跑。
          # 事實沒變不會重新呼叫（快取在 state/brief.json）。
          # 模型退場時（打過去回 404）會自己問一次可用清單、換一個重試，
          # 並把清單印進這一步的 log。想固定用某一個就設 BRIEF_MODEL。
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 完整 log 另存 run.log：下一步把新聞與殖利率的關鍵幾行整理到
        # 這次執行的摘要頁（Actions → 點進這次執行 → Summary），不用在
        # 幾千行 log 裡找。pipefail 讓 run.py 失敗時這一步照樣標紅。
        run: |
          set -o pipefail
          python run.py --json 2>&1 | tee run.log

      # 2026-10 新增：執行摘要。把「市場焦點」「主題補充」「官方殖利率」等
      # 關鍵行貼到 Summary 頁，要回報問題時直接複製這一頁就好。
      - name: 執行摘要
        if: always()
        run: |
          {
            echo "## 更新摘要（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北）"
            echo
            echo "### 新聞（市場焦點／主題補充）"
            echo '```'
            grep -E "市場焦點|主題補充" run.log | sed -E 's/^[A-Z]+ //' | head -60 || true
            echo '```'
            echo "### 殖利率與資料來源"
            echo '```'
            grep -E "官方殖利率|殖利率曲線|週報|財政部|FRED.*失敗" run.log | head -30 || true
            echo '```'
            echo "### 警告與錯誤"
            echo '```'
            grep -E "^(WARNING|ERROR)|Traceback|Error" run.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # 完整 log 保留 14 天，需要時可在這次執行的頁面下載（Artifacts）
      - name: 保存完整 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: run.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit 產出
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # state/ 在第一次成功執行前不存在，直接 git add 會讓整步失敗
          mkdir -p state
          # 把產出的時間戳印進 log，方便跟網站上的「更新於」對照：
          # 兩者不一致就代表這次的產出沒有上線。
          grep -o '更新於 [0-9: -]*' output/labor/index.html | head -1 || true
          # 2026-10-12 修正：先前是 commit 後 `git pull --rebase`。執行期間若
          # 遠端也有一次產出（例如連續上傳觸發了兩次執行），output/ 與 state/
          # 兩邊都改過就會衝突，整次失敗。產出檔本來就該以「這次剛算好的」為準，
          # 所以改成：接到遠端最新的那一版之上（程式與設定用遠端的，
          # 不會蓋掉期間新上傳的檔案），只把這次的 output/、state/ 放上去。
          # push 被拒（又有人搶先）就重來，最多三次。
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git fetch -q origin "$BRANCH"
            git reset -q "origin/$BRANCH"
            git add output state
            if git diff --staged --quiet; then
              echo "資料沒有變化，跳過 commit"
              break
            fi
            # commit 訊息也用台北時間。runner 的時鐘是 UTC，不指定 TZ 的話
            # git log 是 UTC、網站上是台北時間，同一次執行兩個數字差 8 小時。
            git commit -q -m "更新儀表板 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M) 台北"
            if git push -q origin "HEAD:$BRANCH"; then
              echo "已推送（第 $i 次嘗試）"
              break
            fi
            if [ "$i" = 3 ]; then echo "::error::連續三次推送失敗"; exit 1; fi
            echo "推送被拒（遠端有新的 commit），重新接上後再試"
            sleep 5
          done
