name: 更新儀表板

# 排程不對準個別發布日，改用「平日的美國上午多跑幾次」。
#
# 為什麼不排「每月第一個週五」這種精準排程：
#   1. 執行是冪等的——非發布日跑起來只是重新產生同一份頁面，沒有副作用
#      （資料沒變就跳過 commit）
#   2. 一組排程就涵蓋就業報告、失業金、JOLTS、CPI、PCE、FOMC，
#      不必維護發布日對照表，新增資料源也不必改這裡
#   3. GitHub Actions 沒有時區支援，排程一律是 UTC。多排幾個時段
#      就不必為了美國換日光節約時間手動調整
on:
  schedule:
    # 平日的美國上午多跑幾次，週末一次就夠。
    #
    # 為什麼：CPI 與就業報告都是美東 08:30 發布，而 BLS 快速通道要能
    # 「發布後就上線」，執行時間就得落在發布之後。13:45 UTC 是美東 09:45
    #（夏令）／08:45（冬令）——冬令那半年比 08:30 只晚 15 分鐘，遇到
    # BLS 或 FRED 稍慢就抓不到。多排兩次把整個上午蓋住。
    #
    # 成本：平日 3 次、週末 1 次，一個月約 70 次執行、200 分鐘出頭，
    # 仍遠低於每月 2,000 分鐘的免費額度。執行是冪等的，多跑沒有副作用
    #（資料沒變就跳過 commit）。
    - cron: '45 13,15,17 * * 1-5'
    - cron: '45 13 * * 0,6'
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發
  # 改了程式或設定就重新產生一次。沒有這一段的話，push 完網站不會有任何
  # 反應——要等到隔天 13:45 UTC 的排程才會套用新的版面。
  #
  # paths-ignore 是必要的：這個 workflow 自己會 commit output/ 與 state/，
  # 不排除的話它會觸發自己，變成無窮迴圈。
  push:
    branches: [main, master]
    paths-ignore:
      - 'output/**'
      - 'state/**'
      - '**.md'

# 需要寫入權限才能把產出 commit 回 repo
permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝依賴
        run: pip install -r requirements.txt

      # SQLite 內含每次抓取的快照（修正追蹤的後備來源）。
      # 只放進 Actions 快取、不 commit 進 repo，避免二進位檔把 repo 撐大。
      - name: 還原資料庫快取
        uses: actions/cache@v5
        with:
          path: data/labor.db
          key: labor-db-${{ github.run_id }}
          restore-keys: labor-db-

      - name: 產生頁面
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # SEC 要求帶可聯絡的 User-Agent，格式是「名稱 你的信箱」。
          #
          # ⚠️ 這個變數沒設定時，Actions 送進來的是**空字串**（不是「沒有這
          # 個變數」）。程式端已經用 `or` 接住並退回預設值——但預設值裡的
          # 信箱是假的，SEC 有可能限流甚至擋掉。強烈建議到
          # Settings → Secrets and variables → Actions → Variables
          # 新增 SEC_USER_AGENT，值填「你的名字 你的信箱」。
          #
          # 為什麼要特別講：SEC 擋掉請求時，科技巨頭那一區會退回 config 的
          # 手動後備值，畫面上仍然有數字、看起來完全正常，只是那是上一次
          # 人工填的舊數字。現在退回時會印一行 error，畫面上也會明講。
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          # 選配：BLS 快速通道的金鑰。**不設也能用**——沒金鑰走 v1
          # （每天 25 次查詢、一次 25 條序列），這一層只要近兩年，夠用。
          # 註冊一把免費金鑰（v2）可放寬到每天 500 次、一次 50 條：
          #   https://data.bls.gov/registrationEngine/
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # 選配：首頁「整體情勢」的模型潤稿。設一把就好，兩把都設時
          # 優先用 Gemini（有免費額度）。沒設就用規則組裝版，一樣能跑。
          # 事實沒變不會重新呼叫（快取在 state/brief.json）。
          # 模型退場時（打過去回 404）會自己問一次可用清單、換一個重試，
          # 並把清單印進這一步的 log。想固定用某一個就設 BRIEF_MODEL。
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py --json

      - name: Commit 產出
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # state/ 在第一次成功執行前不存在，直接 git add 會讓整步失敗
          mkdir -p state
          git add output state
          if git diff --staged --quiet; then
            echo "資料沒有變化，跳過 commit"
          else
            # 把產出的時間戳印進 log，方便跟網站上的「更新於」對照：
            # 兩者不一致就代表這次的產出沒有上線。
            grep -o '更新於 [0-9: -]*' output/labor/index.html | head -1 || true
            # commit 訊息也用台北時間。runner 的時鐘是 UTC，不指定 TZ 的話
            # git log 是 UTC、網站上是台北時間，同一次執行兩個數字差 8 小時。
            git commit -m "更新儀表板 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M) 台北"
            # 期間若有手動 commit（例如改了 config），先接上去再推，
            # 否則這次的產出會因為落後遠端而整個失敗。
            git pull --rebase --autostash
            git push
          fi
